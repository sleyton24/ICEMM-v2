# ── Monolito Control Presupuestario (gestión) ─────────────────────────────────
# Sirve fase1_proyectos.html ESTÁTICO + proxya /api al backend PROPIO gestion-api (PM2, :3002).
# 100% independiente de ICEMM: NO usa el icemm-api (:3001) ni su base.
# Mismo origen para la app y /api → sin CORS. Patrón nip.io como el resto del VPS.
#
# Instalar:
#   1) cp deploy/nginx-gestion.conf /etc/nginx/sites-available/gestion
#      ln -s /etc/nginx/sites-available/gestion /etc/nginx/sites-enabled/gestion
#   2) htpasswd -c /etc/nginx/.htpasswd-gestion <usuario>     # acceso restringido
#   3) nginx -t && systemctl reload nginx
#   4) certbot --nginx -d gestion.187.127.29.98.nip.io        # agrega TLS (443) + redirect 80→443
# ───────────────────────────────────────────────────────────────────────────────
server {
    listen 80;
    server_name gestion.187.127.29.98.nip.io;

    root /var/www/icemm-gestion;          # acá va fase1_proyectos.html (+ assets locales)
    index fase1_proyectos.html;

    client_max_body_size 50m;             # cargas/imports grandes

    # App (HTML estático) — gateada por usuario/clave.
    location / {
        auth_basic "ICEMM Gestion - acceso restringido";
        auth_basic_user_file /etc/nginx/.htpasswd-gestion;
        try_files $uri /fase1_proyectos.html;
    }

    # API en el MISMO origen → la protege el JWT del backend (no auth_basic, para no
    # chocar el header Authorization Bearer con el de basic auth).
    location /api/ {
        auth_basic off;
        proxy_pass http://127.0.0.1:3002;   # gestion-api (independiente; NO el icemm-api de :3001)
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

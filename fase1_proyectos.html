                              <button onClick={() => saveProjCompletion([p.id, 'curvaShift', 'ingresos'], Math.max(-20, Math.round((cur - 0.5) * 10) / 10))}
                                className="w-4 h-4 flex items-center justify-center rounded bg-gray-100 text-gray-500 hover:bg-gray-200 text-xs font-bold leading-none">−</button>
                              <input type="range" min="-20" max="20" step="0.5" value={cur}
                                onChange={e => saveProjCompletion([p.id, 'curvaShift', 'ingresos'], +e.target.value)}
                                className="w-24 h-1 accent-indigo-500 cursor-pointer" />
                              <button onClick={() => saveProjCompletion([p.id, 'curvaShift', 'ingresos'], Math.min(20, Math.round((cur + 0.5) * 10) / 10))}
                                className="w-4 h-4 flex items-center justify-center rounded bg-gray-100 text-gray-500 hover:bg-gray-200 text-xs font-bold leading-none">+</button>
                            </>
                          )}
                          <span className={`text-[9px] font-mono w-10 text-center font-bold
                            ${cur > 0 ? 'text-emerald-600' : cur < 0 ? 'text-orange-500' : 'text-gray-300'}`}>
                            {cur > 0 ? '+' : ''}{cur}%
                          </span>
                          {!fijada && cur !== 0 && (
                            <button onClick={() => saveProjCompletion([p.id, 'curvaShift', 'ingresos'], 0)}
                              className="text-[8px] text-gray-300 hover:text-gray-500 leading-none">✕</button>
                          )}
                          {fijada ? (
                            <button onClick={tryUnlock}
                              className="text-[8px] bg-amber-100 border border-amber-300 rounded px-1.5 py-0.5 text-amber-600 hover:bg-amber-200 ml-0.5 whitespace-nowrap">
                              🔒 Fijada
                            </button>
                          ) : (
                            <button onClick={() => saveProjCompletion([p.id, 'curvaShift', 'fijadaIngresos'], true)}
                              className="text-[8px] border border-gray-300 rounded px-1.5 py-0.5 text-gray-400 hover:text-gray-600 hover:border-gray-400 ml-0.5 whitespace-nowrap">
                              Fijar curva
                            </button>
                          )}
                        </div>
                      );
                    })()}
                  </td>
                  {yearCols.map(({ fy, months }) => {
                    const expanded = !!expandedYears[fy];
                    const yrTotal = months.reduce((s, m) => s + (byYear[fy]?.[m]?.v || 0), 0);
                    const pct = v => projTotal > 0 && v > 0
                      ? <div className="text-[8px] text-red-400/70 leading-none mt-0.5 tabular-nums">{(v/projTotal*100).toFixed(1)}%</div>
                      : null;
                    return (
                      <React.Fragment key={fy}>
                        {expanded && months.map(m => {
                          const cell = byYear[fy]?.[m] || { v: 0, s: 'outside' };
                          if (fy === year && cell.s !== 'real' && cell.s !== 'outside') {
                            return renderCell(cell, `ing:${p.id}:${fy}:${m}`, ['ingresos', p.id, m]);
                          }
                          return (
                            <td key={m} className={cellStyle(cell.s)} style={{minWidth:70}}>
                              {cell.v !== 0 ? <>{fNum(cell.v)}{pct(cell.v)}</> : <span className="text-gray-300">—</span>}
                            </td>
                          );
                        })}
                        <td className={`px-2 py-1.5 text-right text-xs font-semibold border-l border-r
                            ${fy < year ? 'border-gray-200 bg-gray-50/60 text-gray-600'
                            : fy === year ? 'border-amber-200 bg-amber-50/60 text-amber-800'
                            : 'border-indigo-100 bg-indigo-50/40 text-indigo-700'}`}
                          style={{minWidth: expanded ? 84 : 110}}>
                          {yrTotal !== 0 ? <>{fNum(yrTotal)}{pct(yrTotal)}</> : '—'}

                      </React.Fragment>

                  })}
                  <td className="px-2 py-1.5 text-right text-xs font-bold border-l border-gray-200 bg-emerald-50 text-emerald-700" style={{minWidth:110}}>
                    {projTotal !== 0 ? <>{fNum(projTotal)}<span className="uf-label text-current">UF</span></> : '—'}
                  </td>
                </tr>
              );
            })}
            {/* Otros Ingresos (Asesorías) — UN01 del Mayor excluyendo intereses */}
            {(() => {
              const otrosOv = overrides?.otrosIngresos || {};
              // Para un mes del año activo: override manual > real Mayor > 0
              const getOtrosCell = m => {
                if (otrosOv[m] != null) return { v: +otrosOv[m], s: 'override' };
                if (m <= controlMonth) {
                  const mayorVal = getMayorAsesoriasUF(m);
                  return { v: mayorVal !== null ? mayorVal : 0, s: 'real' };
                }
                return { v: 0, s: 'projected' };
              };
              const yrOtrosTot = yearCols.find(({fy}) => fy === year)?.months
                .reduce((s, m) => s + getOtrosCell(m).v, 0) || 0;
              const totalOtros = (yearCols.find(({fy}) => fy === year)?.months || [])
                .reduce((s, m) => s + getOtrosCell(m).v, 0);
              return (
                <tr className="border-b border-gray-100 hover:bg-green-50/10">
                  <td className="px-3 py-1.5 sticky left-0 bg-white border-r border-gray-100 z-10 text-xs">
                    <span className="text-gray-500 italic">Otros Ingresos (Asesorías)</span>
                    {!mayorData && <span className="ml-1 text-[9px] text-amber-400">sin Mayor</span>}
                  </td>
                  {yearCols.map(({ fy, months }) => {
                    const expanded = !!expandedYears[fy];
                    const yrTot = fy === year ? months.reduce((s, m) => s + getOtrosCell(m).v, 0) : 0;
                    return (
                      <React.Fragment key={fy}>
                        {expanded && months.map(m => {
                          if (fy !== year) {
                            return <td key={m} className={cellStyle('outside')} style={{minWidth:70}}><span className="text-gray-300">—</span></td>;
                          }
                          const cell = getOtrosCell(m);
                          // Meses futuros: editables (override manual)
                          if (m > controlMonth) {
                            return renderCell({ v: cell.v, s: otrosOv[m] != null ? 'override' : 'projected' }, `otros:${fy}:${m}`, ['otrosIngresos', m]);
                          }
                          // Meses pasados: real del Mayor (read-only) o override
                          return (
                            <td key={m} className={cellStyle(cell.s)} style={{minWidth:70}}>
                              {cell.v !== 0 ? fNum(cell.v) : <span className="text-gray-300">—</span>}
                            </td>
                          );
                        })}
                        <td className={`px-2 py-1.5 text-right text-xs font-semibold border-l border-r
                            ${fy < year ? 'border-gray-200 bg-gray-50/60 text-gray-600'
                            : fy === year ? 'border-amber-200 bg-amber-50/60 text-amber-800'
                            : 'border-indigo-100 bg-indigo-50/40 text-indigo-700'}`}
                          style={{minWidth: expanded ? 84 : 110}}>
                          {yrTot !== 0 ? fNum(yrTot) : '—'}
                        </td>
                      </React.Fragment>
                    );
                  })}
                  <td className="px-2 py-1.5 text-right text-xs font-bold border-l border-gray-200 bg-emerald-50 text-emerald-700" style={{minWidth:110}}>
                    {totalOtros !== 0 ? <>{fNum(totalOtros)}<span className="uf-label text-current">UF</span></> : '—'}
                  </td>
                </tr>
              );
            })()}

            {/* Intereses Ganados — cuenta 5-2-01-002 de UN01, solo del Mayor */}
            {(() => {
              const hasMayorInteres = !!mayorData?.byUN?.UN01?.byAccount?.[INTERES_CTA];
              if (!hasMayorInteres && controlMonth === 0) return null; // ocultar si no hay datos y no hay año activo
              const getInteresCell = m => {
                if (m > controlMonth) return { v: 0, s: 'outside' };
                const v = getMayorInteresUF(m);
                return { v: v !== null ? v : 0, s: 'real' };
              };
              const yrIntTot = yearCols.find(({fy}) => fy === year)?.months
                .reduce((s, m) => s + getInteresCell(m).v, 0) || 0;
              const totalInt = (yearCols.find(({fy}) => fy === year)?.months || [])
                .reduce((s, m) => s + getInteresCell(m).v, 0);
              if (!hasMayorInteres) return null;
              return (
                <tr className="border-b border-gray-100 bg-blue-50/20">
                  <td className="px-3 py-1.5 sticky left-0 bg-blue-50/30 border-r border-gray-100 z-10 text-xs">
                    <span className="text-blue-600 italic">Intereses Ganados</span>
                    <span className="ml-1 text-[9px] text-blue-400">cta. {INTERES_CTA}</span>
                  </td>
                  {yearCols.map(({ fy, months }) => {
                    const expanded = !!expandedYears[fy];
                    const yrTot = fy === year ? months.reduce((s, m) => s + getInteresCell(m).v, 0) : 0;
                    return (
                      <React.Fragment key={fy}>
                        {expanded && months.map(m => {
                          if (fy !== year) return <td key={m} className={cellStyle('outside')} style={{minWidth:70}}><span className="text-gray-300">—</span></td>;
                          const cell = getInteresCell(m);
                          return (
                            <td key={m} className={cellStyle(cell.s)} style={{minWidth:70}}>
                              {cell.v !== 0 ? fNum(cell.v) : <span className="text-gray-300">—</span>}
                            </td>
                          );
                        })}
                        <td className={`px-2 py-1.5 text-right text-xs font-semibold border-l border-r
                            ${fy < year ? 'border-gray-200 bg-gray-50/60 text-gray-600'
                            : fy === year ? 'border-blue-200 bg-blue-50/60 text-blue-700'
                            : 'border-indigo-100 bg-indigo-50/40 text-indigo-700'}`}
                          style={{minWidth: expanded ? 84 : 110}}>
                          {yrTot !== 0 ? fNum(yrTot) : '—'}
                        </td>
                      </React.Fragment>
                    );
                  })}
                  <td className="px-2 py-1.5 text-right text-xs font-bold border-l border-blue-200 bg-blue-50 text-blue-700" style={{minWidth:110}}>
                    {totalInt !== 0 ? <>{fNum(totalInt)}<span className="uf-label text-current">UF</span></> : '—'}
                  </td>
                </tr>
              );
            })()}

            {/* Total */}
            {(() => {
              const otrosOv = overrides?.otrosIngresos || {};
              // Valor real de "Otros Ingresos" para un mes: override > Mayor asesorías > 0
              const getOtrosV = m => {
                if (otrosOv[m] != null) return +otrosOv[m];
                if (m <= controlMonth) { const v = getMayorAsesoriasUF(m); return v !== null ? v : 0; }
                return 0;
              };
              // Valor real de "Intereses" para un mes
              const getInteresV = m => m <= controlMonth ? (getMayorInteresUF(m) || 0) : 0;
              // Gran total: proyectos + asesorías (año activo) + intereses (año activo)
              const currentYrMonths = yearCols.find(({fy}) => fy === year)?.months || [];
              const grandOtros = currentYrMonths.reduce((s, m) => s + getOtrosV(m), 0);
              const grandInt   = currentYrMonths.reduce((s, m) => s + getInteresV(m), 0);
              return (
                <tr style={{background:'#1f2937'}}>
                  <td className="px-3 py-2 font-bold text-white sticky left-0 z-10 text-xs uppercase tracking-wide border-r border-white/10" style={{background:'#1f2937'}}>TOTAL INGRESOS</td>
                  {yearCols.map(({ fy, months }) => {
                    const expanded = !!expandedYears[fy];
                    const otros = fy === year ? months.reduce((s, m) => s + getOtrosV(m), 0) : 0;
                    const int   = fy === year ? months.reduce((s, m) => s + getInteresV(m), 0) : 0;
                    const yrTot = allIng.reduce((s, { data }) => s + months.reduce((ss, m) => ss + (data.byYear[fy]?.[m]?.v || 0), 0), 0) + otros + int;
                    return (
                      <React.Fragment key={fy}>
                        {expanded && months.map(m => {
                          const otrosM = fy === year ? getOtrosV(m) : 0;
                          const intM   = fy === year ? getInteresV(m) : 0;
                          const tot = allIng.reduce((s, { data }) => s + (data.byYear[fy]?.[m]?.v || 0), 0) + otrosM + intM;
                          return (
                            <td key={m} className={`px-2 py-2 text-right text-xs font-bold border-r border-white/10
                                ${fy < year ? 'text-gray-500' : fy === year && m <= controlMonth ? 'text-gray-400' : fy > year ? 'text-indigo-300' : 'text-emerald-400'}`}>
                              {tot !== 0 ? fNum(tot) : '—'}
                            </td>
                          );
                        })}
                        <td className={`px-2 py-2 text-right text-xs font-bold border-l border-r border-white/20 bg-white/5
                            ${fy < year ? 'text-gray-400' : fy === year ? 'text-amber-300' : 'text-indigo-300'}`}
                          style={{minWidth: expanded ? 84 : 110}}>
                          {yrTot !== 0 ? fNum(yrTot) : '—'}
                        </td>
                      </React.Fragment>
                    );
                  })}
                  <td className="px-2 py-2 text-right text-xs font-bold text-emerald-300 border-l border-white/20 bg-white/5" style={{minWidth:110}}>
                    {fNum(allIng.reduce((s, { data }) => s + data.projTotal, 0) + grandOtros + grandInt)}
                    <span className="uf-label text-emerald-300/50">UF</span>
                  </td>
                </tr>
              );
            })()}
          </tbody>
        </table>
      </TopScroll>
      {/* Gráficos de curva de ingresos — uno por proyecto */}
      {allIng.map(({ project: p, data }) => {
        const pBudget = ingFlatM.map(({ fy, m }) => {
          const effP = getEffectiveProject(p);
          const idx  = projectMonthIdx(effP, fy, m - 1);
          if (idx < 0) return 0;
          if (p.contractType === 'suma_alzada')
            return (+p.contract.originalAmount || 0) * (p.revenueCurve?.[idx] || 0) / 100;
          return (+p.contract.totalBudgetedCost || 0) * (p.costCurve?.[idx] || 0) / 100
            + (+p.contract.monthlyFee || 0) + (+p.contract.monthlyGG || 0);
        });
        const pProj = ingFlatM.map(({ fy, m }) => data.byYear[fy]?.[m]?.v || 0);
        const pName = projCompletion?.[p.id]?.replacementName || p.name;
        return (
          <div key={p.id} style={{borderTop:'1px solid #e2e8f0', padding:'6px 12px 14px'}}>
            <div style={{fontSize:11, fontWeight:700, color:'#374151', padding:'6px 0 2px', paddingLeft:6,
              display:'flex', alignItems:'center', gap:8}}>
              <span style={{fontFamily:'monospace', fontSize:10, color:'#94a3b8'}}>{p.unCode}</span>
              {pName}
              {p.isOffBudget && <span style={{fontSize:9, color:'#f59e0b', fontWeight:600}}>Fuera de Ppto</span>}
            </div>
            <CurveChart
              title="Valores mensuales"
              series={[
                { label: 'Presupuesto', color: '#3b82f6', dashed: false, values: pBudget },
                { label: 'Proyectado',  color: '#f97316', dashed: true,  values: pProj  },
              ]}
              months={ingLabels} controlIdx={ingCtrlIdx} shift={0} unit=" UF"
            />
            <CurveChart
              title="Curva S — Acumulado"
              series={[
                { label: 'Presupuesto', color: '#2563eb', dashed: false, values: toCumulative(pBudget) },
                { label: 'Proyectado',  color: '#ea580c', dashed: true,  values: toCumulative(pProj)   },
              ]}
              months={ingLabels} controlIdx={ingCtrlIdx} shift={0} unit=" UF"
            />
          </div>
        );
      })}
      </div>
    );
  }

  // ── Informes Guardados — helpers ─────────────────────────────────────────────

  function saveProjSnapshot(label, cutoffDate) {
    const getPT  = (p,cat) => projCompletion?.[p.id]?.cats?.[cat] != null ? +projCompletion[p.id].cats[cat] : (+p.budgetByCategory?.[cat]||0);
    const getPD  = p => monthsBetween(p.startDate,p.endDate)||p.durationMonths||0;
    const getED  = p => { const s=projCompletion?.[p.id]; const es=s?.realStart||p.startDate; const ee=s?.projEnd||p.endDate; return monthsBetween(es,ee)||p.durationMonths||0; };
    const getCPP = p => {
      if (p.contractType==='suma_alzada') return +p.contract.originalAmount||0;
      const n=getPD(p); return (+p.contract.totalBudgetedCost||0)+(+p.contract.monthlyFee||0)*n+(+p.contract.monthlyGG||0)*n;
    };
    const getCPR = p => {
      const extra=+projCompletion?.[p.id]?.extraWorks||0;
      const ov=projCompletion?.[p.id]?.overrideContract?.totalContratoVentas;
      if (ov!=null) return +ov+extra;
      if (p.contractType==='suma_alzada') return (+p.contract.originalAmount||0)+extra;
      const n=getED(p); return (+p.contract.totalBudgetedCost||0)+(+p.contract.monthlyFee||0)*n+(+p.contract.monthlyGG||0)*n+extra;
    };
    const projResumen = {};
    activeProjects.forEach(p => {
      const costoPpto = PROJ_CATS.reduce((s,c) => s+(+p.budgetByCategory?.[c.id]||0),0);
      const costoProy = PROJ_CATS.reduce((s,c) => s+getPT(p,c.id),0);
      const contratoPpto = getCPP(p);
      const contratoProy = getCPR(p);
      projResumen[p.id] = { contratoPpto, contratoProy, costoPpto, costoProy, margenPpto: contratoPpto-costoPpto, margenProy: contratoProy-costoProy };
    });
    const id = `rpt-${Date.now()}`;
    const entry = { id, label, cutoffDate, controlMonth, savedAt: new Date().toISOString(), projResumen };
    const prev = storage.get(`budget-control:saved-reports:${year}`) || [];
    const updated = [entry, ...prev];
    storage.set(`budget-control:saved-reports:${year}`, updated);
    setSavedReportsPM(updated);
  }

  function deleteProjReport(id) {
    const prev = storage.get(`budget-control:saved-reports:${year}`) || [];
    const updated = prev.filter(r => r.id !== id);
    storage.set(`budget-control:saved-reports:${year}`, updated);
    setSavedReportsPM(updated);
    if (compareReportPM?.id === id) setCompareReportPM(null);
  }

  // ── Proyecciones a término ────────────────────────────────────────────────────

  function renderResumenTable() {
    const fN = n => (+n||0).toLocaleString('es-CL', { minimumFractionDigits:2, maximumFractionDigits:2 });
    const fMonthDiff = (base, eff) => {
      if (!eff || eff === base) return null;
      const d = monthsBetween(base < eff ? base : eff, base < eff ? eff : base) - 1;
      const sign = eff > base ? '+' : '-';
      return `${sign}${d}m`;
    };

    // Celda editable de número (proyección a término)
    const editableCell = (ck, ppto, proy, savePath) => {
      const diff = proy - ppto;
      const diffCls = Math.abs(diff) < 0.005 ? 'text-gray-300'
        : diff < 0 ? 'text-emerald-600 font-semibold' : 'text-red-500 font-semibold';
      return (
        <React.Fragment key={ck}>
          <td className="px-2 py-1.5 text-right text-xs font-mono text-blue-600 bg-blue-50/30 border-r border-gray-100 whitespace-nowrap" style={{minWidth:90}}>{fN(ppto)}</td>
          <td className="px-2 py-1.5 text-right text-xs font-mono border-r border-gray-100 whitespace-nowrap cursor-pointer hover:bg-amber-50/60 group" style={{minWidth:90}}
            onClick={() => { setPcEditKey(ck); setPcEditVal(proy !== 0 ? String(proy).replace('.',',') : ''); }}>
            {pcEditKey === ck
              ? <input autoFocus className="w-full text-xs text-right bg-amber-100 border border-amber-400 px-1 focus:outline-none"
                  value={pcEditVal} onChange={e => setPcEditVal(e.target.value)}
                  onBlur={() => { const v = parseFloat(String(pcEditVal).replace(/\./g,'').replace(',','.')); saveProjCompletion(savePath, isNaN(v) ? null : v); }}
                  onKeyDown={e => {
                    if (e.key==='Enter') { const v = parseFloat(String(pcEditVal).replace(/\./g,'').replace(',','.')); saveProjCompletion(savePath, isNaN(v) ? null : v); }
                    if (e.key==='Escape') setPcEditKey(null);
                  }} />
              : proy !== 0
                ? <span className="flex items-center justify-end gap-1">
                    {(projCompletion?.[savePath[0]]?.cats?.[savePath[2]] != null ||
                      projCompletion?.[savePath[0]]?.overrideContract?.[savePath[2]] != null) &&
                      <span className="text-[9px] text-amber-500 opacity-0 group-hover:opacity-100">↺</span>}
                    {fN(proy)}
                  </span>
                : <span className="text-gray-300">—</span>
            }
          </td>
          <td className={`px-2 py-1.5 text-right text-xs font-mono whitespace-nowrap ${diffCls}`} style={{minWidth:80, borderRight:'2px solid #94a3b8'}}>
            {Math.abs(diff) >= 0.005 ? fN(diff) : '—'}
          </td>
        </React.Fragment>
      );
    };

    // Celda fija (no editable)
    const fixedCell = (ppto, proy, isRevenue = false) => {
      const diff = proy - ppto;
      const diffCls = Math.abs(diff) < 0.005 ? 'text-gray-300'
        : (isRevenue ? diff > 0 : diff < 0) ? 'text-emerald-600 font-semibold' : 'text-red-500 font-semibold';
      return (
        <>
          <td className="px-2 py-1.5 text-right text-xs font-mono text-blue-600 bg-blue-50/30 border-r border-gray-100 whitespace-nowrap" style={{minWidth:90}}>{fN(ppto)}</td>
          <td className="px-2 py-1.5 text-right text-xs font-mono text-gray-700 border-r border-gray-100 whitespace-nowrap" style={{minWidth:90}}>{fN(proy)}</td>
          <td className={`px-2 py-1.5 text-right text-xs font-mono whitespace-nowrap ${diffCls}`} style={{minWidth:80, borderRight:'2px solid #94a3b8'}}>
            {Math.abs(diff) >= 0.005 ? fN(diff) : '—'}
          </td>
        </>
      );
    };

    // Fila de total (fondo oscuro), con soporte opcional de comparación
    const totalRow = (label, pptos, proys, isRevenue = false, bg = '#1C3460', savedProys = null) => (
      <tr style={{background: bg}}>
        <td className="px-3 py-2 sticky left-0 z-10 text-xs font-bold uppercase tracking-wide text-white" style={{background: bg}}>
          {label}
          {compareReportPM && savedProys && (
            <div className="text-[8px] text-indigo-300/60 font-normal normal-case tracking-normal mt-0.5">
              ⚖ Guard.: {compareReportPM.label}
            </div>
          )}
        </td>
        {activeProjects.map((p, i) => {
          const ppto = pptos[i]; const proy = proys[i];
          const diff = proy - ppto;
          const diffCls = Math.abs(diff) < 0.005 ? 'text-white/40'
            : (isRevenue ? diff > 0 : diff < 0) ? 'text-emerald-300 font-semibold' : 'text-red-300 font-semibold';
          const saved = (compareReportPM && savedProys) ? savedProys[i] : null;
          const delta = (saved != null && Math.abs(saved) >= 0) ? proy - saved : null;
          return (
            <React.Fragment key={p.id}>
              <td className="px-2 py-2 text-right text-xs font-mono font-bold text-blue-200 border-r border-white/10 whitespace-nowrap">{fN(ppto)}</td>
              <td className="px-2 py-2 text-right text-xs font-mono font-bold text-white border-r border-white/10 whitespace-nowrap">
                <div>{fN(proy)}</div>
                {delta !== null && (
                  <div className="text-[8px] font-normal leading-tight mt-0.5">
                    <span className="text-indigo-300/70">guard: {fN(saved)}</span>
                    {Math.abs(delta) >= 0.005 && (
                      <span className={`ml-1 font-semibold ${(isRevenue?delta>0:delta<0)?'text-emerald-300':'text-red-300'}`}>
                        {delta>0?'+':''}{fN(delta)}
                      </span>
                    )}
                  </div>
                )}
              </td>
              <td className={`px-2 py-2 text-right text-xs font-mono font-bold whitespace-nowrap ${diffCls}`}
                style={{borderRight:'2px solid rgba(255,255,255,0.30)'}}>
                {Math.abs(diff) >= 0.005 ? fN(diff) : '—'}
              </td>
            </React.Fragment>
          );
        })}
      </tr>
    );

    // Sección header
    const sectionHeader = (label, bg = '#1A3356') => (
      <tr style={{background: bg}}>
        <td colSpan={1 + activeProjects.length * 3}
          className="px-3 py-1.5 text-[10px] font-bold uppercase tracking-widest text-white sticky left-0" style={{background: bg}}>
          {label}
        </td>
      </tr>
    );

    // Cálculos por proyecto
    const getProjTotal = (p, cat) =>
      projCompletion?.[p.id]?.cats?.[cat] != null
        ? +projCompletion[p.id].cats[cat]
        : (+p.budgetByCategory?.[cat] || 0);

    const getCostDirectoPpto = p => PROJ_CATS.reduce((s, c) => s + (+p.budgetByCategory?.[c.id] || 0), 0);
    const getCostDirectoProy = p => PROJ_CATS.reduce((s, c) => s + getProjTotal(p, c.id), 0);

    const getContratoPpto = p => {
      if (p.contractType === 'suma_alzada') return +p.contract.originalAmount || 0;
      const n = getPptoDuration(p);
      return (+p.contract.totalBudgetedCost || 0) + (+p.contract.monthlyFee || 0) * n + (+p.contract.monthlyGG || 0) * n;
    };
    const getEffDuration = p => {
      const sched = projCompletion?.[p.id];
      const effStart = sched?.realStart || p.startDate;
      const effEnd   = sched?.projEnd   || p.endDate;
      return monthsBetween(effStart, effEnd) || p.durationMonths || 0;
    };
    const getContratoProy = p => {
      const extra = +projCompletion?.[p.id]?.extraWorks || 0;
      // Si hay override de contrato ventas (reemplazo o admin_delegada con proyección manual), usarlo
      const override = projCompletion?.[p.id]?.overrideContract?.totalContratoVentas;
      if (override != null) return +override + extra;
      if (p.contractType === 'suma_alzada') return (+p.contract.originalAmount || 0) + extra;
      const n = getEffDuration(p);
      return (+p.contract.totalBudgetedCost || 0) + (+p.contract.monthlyFee || 0) * n + (+p.contract.monthlyGG || 0) * n + extra;
    };

    // Duración presupuestada: prefiere calcular de fechas para no depender de p.durationMonths guardado
    const getPptoDuration = p => monthsBetween(p.startDate, p.endDate) || p.durationMonths || 0;

    // Devuelve valor presupuestado de campo de contrato (admin_delegada: auto-calc GG y Utilidad)
    const getContractKeyPpto = (p, key) => {
      if (p.contractType === 'admin_delegada') {
        if (key === 'gastoGeneralOC')    return (+p.contract.monthlyGG  || 0) * getPptoDuration(p);
        if (key === 'utilidadEstudiada') return (+p.contract.monthlyFee || 0) * getPptoDuration(p);
      }
      return +p.contract[key] || 0;
    };
    // Devuelve valor proyectado de campo de contrato (con override; admin_delegada usa getEffDuration)
    const getContractKeyProy = (p, key) => {
      const ov = projCompletion?.[p.id]?.overrideContract?.[key];
      if (ov != null) return +ov;
      if (p.contractType === 'admin_delegada') {
        if (key === 'gastoGeneralOC')    return (+p.contract.monthlyGG  || 0) * getEffDuration(p);
        if (key === 'utilidadEstudiada') return (+p.contract.monthlyFee || 0) * getEffDuration(p);
      }
      return +p.contract[key] || 0;
    };

    return (
      <TopScroll>
        <table className="text-xs border-collapse" style={{minWidth: 240 + activeProjects.length * 280}}>
          <thead>
            <tr style={{background:'#12141A'}}>
              <th className="px-3 py-2.5 text-left text-[10px] font-bold text-gray-400 uppercase sticky left-0 z-20 border-r border-white/10"
                style={{background:'#0f172a', minWidth:220}}>Concepto</th>
              {activeProjects.map(p => {
                const repName = projCompletion?.[p.id]?.replacementName || '';
                const ck = `repName:${p.id}`;
                const isEditing = pcEditKey === ck;
                return (
                  <th key={p.id} colSpan={3}
                    className="px-2 py-2 text-center text-[10px] font-bold text-white" style={{borderRight:'2px solid rgba(255,255,255,0.35)'}}>
                    <div className="flex flex-col items-center gap-0.5">
                      {isEditing ? (
                        <input autoFocus
                          className="w-full text-center text-xs bg-white/10 border border-white/30 rounded px-1 py-0.5 text-white placeholder-white/30 focus:outline-none"
                          value={pcEditVal}
                          placeholder="Nombre nuevo proyecto…"
                          onChange={e => setPcEditVal(e.target.value)}
                          onBlur={() => { saveProjCompletion([p.id, 'replacementName'], pcEditVal.trim()); setPcEditKey(null); }}
                          onKeyDown={e => {
                            if (e.key === 'Enter')  { saveProjCompletion([p.id, 'replacementName'], pcEditVal.trim()); setPcEditKey(null); }
                            if (e.key === 'Escape') setPcEditKey(null);
                          }}
                        />
                      ) : repName ? (
                        <>
                          <span className="text-white">{repName}</span>
                          <span className="text-[9px] text-blue-300/70 font-normal leading-tight">(reemplaza a {p.unCode} · {p.name})</span>
                        </>
                      ) : (
                        <span><span className="font-mono text-blue-300 mr-1">{p.unCode}</span>{p.name}</span>
                      )}
                      {p.isOffBudget && !isEditing && (
                        <span className="text-[9px] font-semibold text-amber-400 mt-0.5 leading-tight">
                          Nuevo — no incluido en Ppto Anual
                        </span>
                      )}
                      {!isEditing && (
                        <button onClick={() => { setPcEditKey(ck); setPcEditVal(repName); }}
                          className="text-[9px] text-white/25 hover:text-amber-300/70 transition-colors mt-0.5 font-normal">
                          {repName ? '✏ editar reemplazo' : '+ proyecto reemplazo'}
                        </button>
                      )}
                    </div>
                  </th>
                );
              })}
            </tr>
            <tr style={{background:'#1C1F2C'}}>
              <th className="px-3 py-1.5 sticky left-0 z-20 border-r border-white/10" style={{background:'#1C1F2C'}} />
              {activeProjects.map(p => (
                <React.Fragment key={p.id}>
                  <th className="px-2 py-1 text-center text-[9px] text-blue-400 border-r border-white/5" style={{minWidth:90}}>Ppto.</th>
                  <th className="px-2 py-1 text-center text-[9px] text-white border-r border-white/5" style={{minWidth:90}}>Proyectado</th>
                  <th className="px-2 py-1 text-center text-[9px] text-amber-400 whitespace-nowrap" style={{minWidth:80, borderRight:'2px solid rgba(255,255,255,0.35)'}}>Diferencia</th>
                </React.Fragment>
              ))}
            </tr>
          </thead>
          <tbody>

            {/* ── Fechas ── */}
            {sectionHeader('Fechas del Proyecto')}
            {[
              { label: 'Inicio del Proyecto', field: 'realStart', baseKey: 'startDate' },
              { label: 'Término del Proyecto', field: 'projEnd',   baseKey: 'endDate' },
            ].map(({ label, field, baseKey }) => (
              <tr key={field} className="border-b border-gray-100 hover:bg-blue-50/20">
                <td className="px-3 py-1.5 sticky left-0 z-10 bg-white border-r border-gray-100 text-gray-700 font-medium text-xs">{label}</td>
                {activeProjects.map(p => {
                  const base = p[baseKey] || '';
                  const eff  = projCompletion?.[p.id]?.[field] || '';
                  const diff = fMonthDiff(base, eff);
                  return (
                    <React.Fragment key={p.id}>
                      <td className="px-2 py-1 text-center text-xs font-mono text-blue-500 bg-blue-50/30 border-r border-gray-100">{base}</td>
                      <td className="px-2 py-1 text-center border-r border-gray-100">
                        <input type="month" value={eff} min="2020-01" max="2040-12"
                          onChange={e => saveProjCompletion([p.id, field], e.target.value)}
                          className="w-full text-[11px] text-center border border-gray-200 rounded px-1 py-0.5 focus:outline-none focus:border-blue-400" />
                      </td>
                      <td className={`px-2 py-1 text-center text-xs font-mono border-r border-gray-200 ${diff ? 'text-amber-600 font-semibold' : 'text-gray-300'}`}>
                        {diff || '—'}
                      </td>
                    </React.Fragment>
                  );
                })}
              </tr>
            ))}

            {/* ── Costos ── */}
            {sectionHeader('Costos (Egresos)')}
            {PROJ_CATS.map(cat => (
              <tr key={cat.id} className="border-b border-gray-100 hover:bg-blue-50/20">
                <td className="px-3 pl-7 py-1.5 sticky left-0 z-10 bg-white border-r border-gray-100 text-gray-500 text-xs">{cat.label}</td>
                {activeProjects.map(p => editableCell(
                  `${p.id}:${cat.id}`,
                  +p.budgetByCategory?.[cat.id] || 0,
                  getProjTotal(p, cat.id),
                  [p.id, 'cats', cat.id]
                ))}
              </tr>
            ))}
            {totalRow('Costo Directo Total',
              activeProjects.map(p => getCostDirectoPpto(p)),
              activeProjects.map(p => getCostDirectoProy(p)),
              false, '#1e293b',
              compareReportPM?.projResumen ? activeProjects.map(p => compareReportPM.projResumen[p.id]?.costoProy ?? null) : null
            )}

            {/* GG Of. Central, Utilidad, Provision — todos los proyectos, proyectado editable */}
            {[
              { key: 'gastoGeneralOC',     label: 'GG Oficina Central' },
              { key: 'utilidadEstudiada',   label: 'Utilidad Estudiada (Honorarios)' },
              { key: 'provisionPostVenta',  label: 'Provisión Post Venta' },
            ].map(({ key, label }) => (
              <tr key={key} className="border-b border-gray-100">
                <td className="px-3 pl-7 py-1 sticky left-0 z-10 bg-white border-r border-gray-100 text-gray-400 text-xs italic">{label}</td>
                {activeProjects.map(p => (
                  <React.Fragment key={p.id}>
                    {editableCell(
                      `${p.id}:contract:${key}`,
                      getContractKeyPpto(p, key),
                      getContractKeyProy(p, key),
                      [p.id, 'overrideContract', key]
                    )}
                  </React.Fragment>
                ))}
              </tr>
            ))}
            {totalRow('Total Costos Contrato Original',
              activeProjects.map(p => p.contractType === 'suma_alzada'
                ? (+p.contract.originalAmount || 0)
                : getCostDirectoPpto(p)
                  + getContractKeyPpto(p, 'gastoGeneralOC')
                  + getContractKeyPpto(p, 'utilidadEstudiada')
                  + getContractKeyPpto(p, 'provisionPostVenta')),
              activeProjects.map(p =>
                getCostDirectoProy(p)
                + getContractKeyProy(p, 'gastoGeneralOC')
                + getContractKeyProy(p, 'utilidadEstudiada')
                + getContractKeyProy(p, 'provisionPostVenta')),
              false, '#1C3460'
            )}

            {/* ── Ventas ── */}
            {sectionHeader('Ventas (Facturación)')}
            <tr className="border-b border-gray-100 hover:bg-blue-50/20">
              <td className="px-3 pl-7 py-1.5 sticky left-0 z-10 bg-white border-r border-gray-100 text-gray-500 text-xs">Total Contrato Original</td>
              {activeProjects.map(p => {
                const hasReplacement = !!(projCompletion?.[p.id]?.replacementName);
                const isContratoEditable = hasReplacement || p.contractType === 'admin_delegada';
                const ppto = getContratoPpto(p);
                // Solo editable si hay proyecto reemplazo asignado, o si es admin_delegada
                if (!isContratoEditable) {
                  return <React.Fragment key={p.id}>{fixedCell(ppto, ppto, true)}</React.Fragment>;
                }
                const override = projCompletion?.[p.id]?.overrideContract?.totalContratoVentas;
                const proy = override != null ? +override : ppto;
                const ck = `${p.id}:contract:totalContratoVentas`;
                const diff = proy - ppto;
                const diffCls = Math.abs(diff) < 0.005 ? 'text-gray-300'
                  : diff > 0 ? 'text-emerald-600 font-semibold' : 'text-red-500 font-semibold';
                return (
                  <React.Fragment key={p.id}>
                    {/* Ppto — fijo */}
                    <td className="px-2 py-1.5 text-right text-xs font-mono text-blue-600 bg-blue-50/30 border-r border-gray-100 whitespace-nowrap" style={{minWidth:90}}>{fN(ppto)}</td>
                    {/* Proy — editable solo cuando hay reemplazo */}
                    <td className="px-2 py-1.5 text-right text-xs font-mono border-r border-gray-100 whitespace-nowrap cursor-pointer hover:bg-amber-50/60"
                      style={{minWidth:90}}
                      onClick={() => { setPcEditKey(ck); setPcEditVal(proy !== 0 ? String(proy).replace('.', ',') : ''); }}>
                      {pcEditKey === ck
                        ? <input autoFocus
                            className="w-full text-xs text-right bg-amber-100 border border-amber-400 px-1 focus:outline-none"
                            value={pcEditVal}
                            onChange={e => setPcEditVal(e.target.value)}
                            onBlur={() => {
                              const parsed = parseFloat(String(pcEditVal).replace(/\./g,'').replace(',','.'));
                              saveProjCompletion([p.id, 'overrideContract', 'totalContratoVentas'], isNaN(parsed) ? null : parsed);
                              setPcEditKey(null);
                            }}
                            onKeyDown={e => {
                              if (e.key === 'Enter') {
                                const parsed = parseFloat(String(pcEditVal).replace(/\./g,'').replace(',','.'));
                                saveProjCompletion([p.id, 'overrideContract', 'totalContratoVentas'], isNaN(parsed) ? null : parsed);
                                setPcEditKey(null);
                              }
                              if (e.key === 'Escape') setPcEditKey(null);
                            }}
                          />
                        : <div className="flex flex-col items-end gap-0.5">
                            <span className={override != null ? 'text-amber-700 font-semibold' : 'text-gray-700'}>{fN(proy)}</span>
                            {override != null && (
                              <span className="text-[8px] text-amber-500 leading-tight">sustituye monto presupuesto</span>
                            )}
                          </div>
                      }
                    </td>
                    {/* Diff */}
                    <td className={`px-2 py-1.5 text-right text-xs font-mono whitespace-nowrap ${diffCls}`} style={{minWidth:80, borderRight:'2px solid #94a3b8'}}>
                      {Math.abs(diff) >= 0.005 ? fN(diff) : '—'}
                    </td>
                  </React.Fragment>
                );
              })}
            </tr>
            <tr className="border-b border-gray-100 hover:bg-blue-50/20">
              <td className="px-3 pl-7 py-1.5 sticky left-0 z-10 bg-white border-r border-gray-100 text-gray-500 text-xs">Obras Extraordinarias</td>
              {activeProjects.map(p => (
                <React.Fragment key={p.id}>
                  {editableCell(
                    `${p.id}:extraWorks`, 0,
                    +projCompletion?.[p.id]?.extraWorks || 0,
                    [p.id, 'extraWorks']
                  )}
                </React.Fragment>
              ))}
            </tr>
            {totalRow('Total Contrato Vigente',
              activeProjects.map(p => getContratoPpto(p)),
              activeProjects.map(p => getContratoProy(p)),
              true, '#1C3460',
              compareReportPM?.projResumen ? activeProjects.map(p => compareReportPM.projResumen[p.id]?.contratoProy ?? null) : null
            )}

            {/* ── Resultado ── */}
            {totalRow('▶ Resultado Operacional',
              activeProjects.map(p => getContratoPpto(p) - getCostDirectoPpto(p)),
              activeProjects.map(p => getContratoProy(p) - getCostDirectoProy(p)),
              true, '#C8102E',
              compareReportPM?.projResumen ? activeProjects.map(p => compareReportPM.projResumen[p.id]?.margenProy ?? null) : null
            )}

          </tbody>
        </table>
      </TopScroll>
    );
  }

  // ── Tab combinado por proyecto (Ingresos + Costos + Gráficos) ────────────────

  function renderProjectFullTab(project) {
    const pName = projCompletion?.[project.id]?.replacementName || project.name;

    // ─ datos ingresos ────────────────────────────────────────────────
    const ingData = buildMultiYearIngresosCells(project);
    const { firstYear: ingFirst, endYear: ingEnd, endMonth: ingEndM, projTotal: ingProjTotal } = ingData;

    // ─ datos costos ──────────────────────────────────────────────────
    const allMultiC = {};
    PROJ_CATS.forEach(c => { allMultiC[c.id] = buildMultiYearCells(project, c.id); });
    const { firstYear: costFirst, endYear: costEnd, endMonth: costEndM } = allMultiC[PROJ_CATS[0].id];
    const totalCostProjTotal = PROJ_CATS.reduce((s, c) => s + allMultiC[c.id].projTotal, 0);

    // ─ rango de años UNIFICADO — ingresos y costos comparten columnas ─
    const firstYear = Math.min(ingFirst, costFirst);
    const endYear   = Math.max(ingEnd, costEnd);
    const endMonth  = (() => {
      if (ingEnd === costEnd) return Math.max(ingEndM, costEndM);
      return ingEnd > costEnd ? ingEndM : costEndM;
    })();

    const yearCols = [];
    for (let fy = firstYear; fy <= endYear; fy++) {
      const em = fy === endYear ? endMonth : 12;
      yearCols.push({ fy, months: Array.from({ length: em }, (_, i) => i + 1) });
    }

    // ─ vectores para gráficos ─────────────────────────────────────────
    const effPrj = getEffectiveProject(project);
    const flatM  = [];
    yearCols.forEach(({ fy, months }) => months.forEach(m => flatM.push({ fy, m })));
    const chartLabels  = flatM.map(({ fy, m }) => `${MONTH_ABR[m-1]}-${String(fy).slice(2)}`);
    const chartCtrlIdx = flatM.findIndex(({ fy, m }) => fy === year && m === controlMonth);

    const ingBudget = flatM.map(({ fy, m }) => {
      const idx = projectMonthIdx(effPrj, fy, m - 1);
      if (idx < 0) return 0;
      if (project.contractType === 'suma_alzada')
        return (+project.contract.originalAmount || 0) * (project.revenueCurve?.[idx] || 0) / 100;
      return (+project.contract.totalBudgetedCost || 0) * (project.costCurve?.[idx] || 0) / 100
        + (+project.contract.monthlyFee || 0) + (+project.contract.monthlyGG || 0);
    });
    const ingProj    = flatM.map(({ fy, m }) => ingData.byYear[fy]?.[m]?.v || 0);
    const costBudget = flatM.map(({ fy, m }) =>
      PROJ_CATS.reduce((s, c) => {
        const idx = projectMonthIdx(effPrj, fy, m - 1);
        return s + (idx >= 0 ? (+project.budgetByCategory?.[c.id] || 0) * (project.costCurve?.[idx] || 0) / 100 : 0);
      }, 0)
    );
    const costProj = flatM.map(({ fy, m }) =>
      PROJ_CATS.reduce((s, c) => s + (allMultiC[c.id].byYear[fy]?.[m]?.v || 0), 0)
    );

    // ─ estilos de celda ───────────────────────────────────────────────
    const cellStyle = s => {
      if (s === 'outside') return 'px-2 py-1.5 text-right text-xs text-gray-200 border-r border-gray-50 bg-gray-50/40';
      if (s === 'real')    return 'px-2 py-1.5 text-right text-xs text-gray-500 border-r border-gray-50 bg-gray-100 select-none';
      if (s === 'override') return 'px-2 py-1.5 text-right text-xs border-r border-amber-200 bg-amber-50';
      if (s === 'future')  return 'px-2 py-1.5 text-right text-xs text-indigo-600 border-r border-indigo-50 bg-indigo-50/30';
      return 'px-2 py-1.5 text-right text-xs text-gray-700 border-r border-gray-50 bg-white';
    };

    // ─ shift values ───────────────────────────────────────────────────
    const ingShiftCur  = projCompletion?.[project.id]?.curvaShift?.ingresos  || 0;
    const ingFijada    = !!projCompletion?.[project.id]?.curvaShift?.fijadaIngresos;
    const costoShiftCur = projCompletion?.[project.id]?.curvaShift?.costos   || 0;
    const costoFijada  = !!projCompletion?.[project.id]?.curvaShift?.fijadaCostos;

    const tryUnlockIng = () => {
      if (window.confirm('¿Seguro de modificar la curva de ingresos?\n\nSe liberará el ajuste guardado.'))
        saveProjCompletion([project.id, 'curvaShift', 'fijadaIngresos'], false);
    };
    const tryUnlockCosto = () => {
      if (window.confirm('¿Seguro de modificar la curva de costos?\n\nSe liberará el ajuste guardado.'))
        saveProjCompletion([project.id, 'curvaShift', 'fijadaCostos'], false);
    };

    // ─ helper barra de ritmo inline (como fila de tabla) ─────────────
    const shiftRow = (label, shiftCur, fijada, tryUnlock, savePath, saveLockPath, borderTop) => (
      <React.Fragment>
        <tr style={{background:'#12141A', ...(borderTop ? {borderTop:'3px solid #334155'} : {})}}>
          <td colSpan={999} className="px-4 py-2.5 border-b border-white/5">
            <span className={`text-[11px] font-bold uppercase tracking-widest ${label.includes('Ingreso') ? 'text-emerald-300' : 'text-orange-300'}`}>{label}</span>
          </td>
        </tr>
        <tr style={{background:'#1C1F2C'}}>
        <td colSpan={999} className="p-0">
          <div className="flex items-center gap-1.5 px-4 py-1.5">
            <span className="text-[10px] text-gray-400 font-semibold uppercase tracking-wider whitespace-nowrap">Ritmo curva:</span>
              {fijada ? (
                <>
                  <button onClick={tryUnlock} className="w-5 h-5 flex items-center justify-center rounded text-amber-400 text-xs" style={{background:'rgba(180,100,0,0.25)'}}>🔒</button>
                  <input type="range" min="-20" max="20" step="0.5" value={shiftCur} readOnly onClick={tryUnlock} className="w-32 h-1 accent-indigo-400 cursor-pointer opacity-50" />
                  <button onClick={tryUnlock} className="w-5 h-5 flex items-center justify-center rounded text-amber-400 text-xs" style={{background:'rgba(180,100,0,0.25)'}}>🔒</button>
                </>
              ) : (
                <>
                  <button onClick={() => saveProjCompletion(savePath, Math.max(-20, Math.round((shiftCur-0.5)*10)/10))}
                    className="w-5 h-5 flex items-center justify-center rounded bg-white/10 text-gray-300 hover:bg-white/20 text-xs font-bold">−</button>
                  <input type="range" min="-20" max="20" step="0.5" value={shiftCur}
                    onChange={e => saveProjCompletion(savePath, +e.target.value)}
                    className="w-32 h-1 accent-indigo-400 cursor-pointer" />
                  <button onClick={() => saveProjCompletion(savePath, Math.min(20, Math.round((shiftCur+0.5)*10)/10))}
                    className="w-5 h-5 flex items-center justify-center rounded bg-white/10 text-gray-300 hover:bg-white/20 text-xs font-bold">+</button>
                </>
              )}
              <span className={`text-[11px] font-mono w-12 text-center font-bold ${shiftCur>0?'text-emerald-400':shiftCur<0?'text-orange-400':'text-gray-500'}`}>
                {shiftCur>0?'+':''}{shiftCur}%
              </span>
              {!fijada && shiftCur!==0 && <button onClick={() => saveProjCompletion(savePath, 0)} className="text-[9px] text-gray-500 hover:text-gray-300">✕</button>}
              {fijada
                ? <button onClick={tryUnlock} className="text-[9px] border rounded px-2 py-0.5 text-amber-400 hover:text-amber-300 ml-1 whitespace-nowrap" style={{borderColor:'rgba(180,100,0,0.5)',background:'rgba(180,100,0,0.20)'}}>🔒 Fijada</button>
                : <button onClick={() => saveProjCompletion(saveLockPath, true)} className="text-[9px] border border-white/20 rounded px-2 py-0.5 text-gray-400 hover:text-gray-200 ml-1 whitespace-nowrap">Fijar curva</button>
              }
              {!fijada && shiftCur!==0 && <span className="text-[9px] text-amber-400 ml-1">⚡ {shiftCur>0?'acelerada':'retrasada'} {Math.abs(shiftCur)}%</span>}
              {fijada && <span className="text-[9px] text-amber-400/70 ml-1">curva fijada{shiftCur!==0?` · ${shiftCur>0?'+':''}${shiftCur}%`:' · sin ajuste'}</span>}
            </div>
        </td>
        </tr>
      </React.Fragment>
    );

    return (
      <div>
        {/* ══ TABLA ÚNICA: ingresos + costos comparten columnas ══════════ */}
        <TopScroll style={{maxWidth:'100%'}}>
          <table className="text-xs border-collapse" style={{width:'auto'}}>
            <thead>
              {/* Fila 1: toggles de año */}
              <tr style={{background:'#12141A'}}>
                <th className="px-3 py-2 text-left text-[10px] font-bold text-gray-400 sticky left-0 z-20 border-r border-white/10"
                  style={{background:'#0f172a', minWidth:130}}>Concepto</th>
                {yearCols.map(({ fy, months }) => {
                  const expanded = !!expandedYears[fy];
                  const isPast = fy < year; const isActive = fy === year;
                  const yc = isPast ? 'text-gray-400 hover:text-gray-200' : isActive ? 'text-amber-300 hover:text-amber-200' : 'text-indigo-300 hover:text-indigo-200';
                  return (
                    <React.Fragment key={fy}>
                      {expanded && <th colSpan={months.length} className="px-2 py-2 border-r border-white/5" />}
                      <th className={`px-2 py-2 text-center text-[10px] font-bold border-r border-white/20 cursor-pointer select-none ${yc}`}
                        style={{minWidth: expanded ? 68 : 88}} onClick={() => toggleYear(fy)}>
                        {expanded ? `− ${fy}` : `+ ${fy}`}
                      </th>
                    </React.Fragment>
                  );
                })}
                <th className="px-2 py-2 text-center text-[10px] font-bold text-emerald-300 border-l border-white/20" style={{minWidth:84}}>∑ TOTAL</th>
              </tr>
              {/* Fila 2: meses */}
              <tr style={{background:'#1C1F2C'}}>
                <th className="px-3 py-1.5 sticky left-0 z-20 border-r border-white/10" style={{background:'#1C1F2C'}} />
                {yearCols.map(({ fy, months }) => {
                  const expanded = !!expandedYears[fy];
                  const isPast = fy < year; const isActive = fy === year;
                  return (
                    <React.Fragment key={fy}>
                      {expanded && months.map(m => (
                        <th key={m} className={`px-1 py-1.5 text-center text-[9px] font-semibold border-r border-white/5
                            ${isPast ? 'text-gray-500' : isActive && m <= controlMonth ? 'text-gray-500' : isActive ? 'text-gray-300' : 'text-indigo-400'}`}
                          style={{minWidth:58}}>{MONTH_ABR[m-1]}-{String(fy).slice(2)}</th>
                      ))}
                      <th className={`px-1 py-1.5 text-center text-[9px] border-r border-white/20
                          ${isPast ? 'text-gray-400' : isActive ? 'text-amber-400' : 'text-indigo-300'}`}
                        style={{minWidth: expanded ? 68 : 88}}>∑ {fy}</th>
                    </React.Fragment>
                  );
                })}
                <th className="px-1 py-1.5 text-center text-[9px] text-emerald-400" style={{minWidth:84}}>∑ Total</th>
              </tr>
            </thead>
            <tbody>
              {/* ── SECCIÓN INGRESOS ──────────────────────────────────── */}
              {shiftRow('💰 Proyección de Ingresos', ingShiftCur, ingFijada, tryUnlockIng,
                [project.id,'curvaShift','ingresos'], [project.id,'curvaShift','fijadaIngresos'], false)}
              <tr className="border-b border-gray-100">
                <td className="px-3 py-2 sticky left-0 bg-white border-r border-gray-100 z-10 text-xs" style={{minWidth:130}}>
                  <span className="font-medium text-gray-700">{pName}</span>
                  {projCompletion?.[project.id]?.replacementName &&
                    <span className="ml-1 text-[9px] text-amber-500">(reemplaza {project.name})</span>}
                  <span className="ml-1 text-[9px] text-gray-400">({project.contractType==='suma_alzada'?'SA':'AD'})</span>
                </td>
                {yearCols.map(({ fy, months }) => {
                  const expanded = !!expandedYears[fy];
                  const yrTotal = months.reduce((s, m) => s + (ingData.byYear[fy]?.[m]?.v || 0), 0);
                  const pct = v => ingProjTotal > 0 && v > 0
                    ? <div className="text-[8px] text-red-400/70 leading-none mt-0.5 tabular-nums">{(v/ingProjTotal*100).toFixed(1)}%</div>
                    : null;
                  return (
                    <React.Fragment key={fy}>
                      {expanded && months.map(m => {
                        const cell = ingData.byYear[fy]?.[m] || { v:0, s:'outside' };
                        if (fy === year && cell.s !== 'real' && cell.s !== 'outside')
                          return renderCell(cell, `ing:${project.id}:${fy}:${m}`, ['ingresos', project.id, m]);
                        return (
                          <td key={m} className={cellStyle(cell.s)} style={{minWidth:58}}>
                            {cell.v !== 0 ? <>{fNum(cell.v)}{pct(cell.v)}</> : <span className="text-gray-300">—</span>}
                          </td>
                        );
                      })}
                      <td className={`px-2 py-1.5 text-right text-xs font-semibold border-l border-r
                          ${fy < year ? 'border-gray-200 bg-gray-50/60 text-gray-600'
                          : fy === year ? 'border-amber-200 bg-amber-50/60 text-amber-800'
                          : 'border-indigo-100 bg-indigo-50/40 text-indigo-700'}`}
                        style={{minWidth: expanded ? 68 : 88}}>
                        {yrTotal !== 0 ? <>{fNum(yrTotal)}{pct(yrTotal)}</> : '—'}
                      </td>
                    </React.Fragment>
                  );
                })}
                <td className="px-2 py-2 text-right text-xs font-bold border-l border-gray-200 bg-emerald-50 text-emerald-700" style={{minWidth:84}}>
                  {ingProjTotal !== 0 ? <>{fNum(ingProjTotal)}<span className="uf-label text-current">UF</span></> : '—'}
                </td>
              </tr>

              {/* ── ANTICIPOS PROGRAMADOS ────────────────────────────── */}
              <tr style={{background:'#0d2218', borderTop:'2px solid rgba(16,185,129,0.25)'}}>
                <td colSpan={999} className="px-4 py-2 border-b border-emerald-900/20">
                  <span className="text-[10px] font-bold uppercase tracking-widest text-emerald-400">Anticipos Programados</span>
                  <span className="ml-2 text-[9px] text-emerald-700">Ingresos por anticipos — UF recibidas por mes (editable)</span>
                </td>
              </tr>
              <tr className="border-b border-gray-100">
                <td className="px-3 py-1.5 sticky left-0 bg-white border-r border-gray-100 z-10 text-xs font-medium text-emerald-700" style={{minWidth:130}}>
                  Anticipo
                </td>
                {yearCols.map(({ fy, months }) => {
                  const expanded = !!expandedYears[fy];
                  const ovA = overrides?.anticipos?.[project.id] || {};
                  const yrTotal = months.reduce((s, m) => s + +(ovA[m] ?? 0), 0);
                  return (
                    <React.Fragment key={fy}>
                      {expanded && months.map(m => {
                        const rawVal = ovA[m];
                        const numVal = +(rawVal ?? 0);
                        const s = rawVal != null ? 'override' : 'future';
                        if (fy === year) {
                          return renderCell({ v: numVal, s }, `ant:${project.id}:${fy}:${m}`, ['anticipos', project.id, m]);
                        }
                        return (
                          <td key={m} className="px-2 py-1.5 text-right text-xs text-gray-300 border-r border-gray-50 bg-gray-50/40" style={{minWidth:58}}>
                            {numVal !== 0 ? fNum(numVal) : <span className="text-gray-200">—</span>}
                          </td>
                        );
                      })}
                      <td className={`px-2 py-1.5 text-right text-xs font-semibold border-l border-r
                          ${fy < year ? 'border-gray-200 bg-gray-50/60 text-gray-600'
                          : fy === year ? 'border-amber-200 bg-amber-50/60 text-amber-800'
                          : 'border-indigo-100 bg-indigo-50/40 text-indigo-700'}`}
                        style={{minWidth: expanded ? 68 : 88}}>
                        {yrTotal !== 0 ? fNum(yrTotal) : '—'}
                      </td>
                    </React.Fragment>
                  );
                })}
                <td className="px-2 py-2 text-right text-xs font-bold border-l border-gray-200 bg-emerald-50 text-emerald-700" style={{minWidth:84}}>
                  {(() => {
                    const ovA = overrides?.anticipos?.[project.id] || {};
                    const total = yearCols.reduce((s, { months }) => s + months.reduce((ss, m) => ss + +(ovA[m] ?? 0), 0), 0);
                    return total !== 0 ? <>{fNum(total)}<span className="uf-label text-current">UF</span></> : '—';
                  })()}
                </td>
              </tr>

              {/* ── SECCIÓN COSTOS ────────────────────────────────────── */}
              {shiftRow('📦 Proyección de Costos', costoShiftCur, costoFijada, tryUnlockCosto,
                [project.id,'curvaShift','costos'], [project.id,'curvaShift','fijadaCostos'], true)}
              {PROJ_CATS.map(c => {
                const multi = allMultiC[c.id];
                return (
                  <tr key={c.id} className="border-b border-gray-100 hover:bg-orange-50/20">
                    <td className="px-3 py-1.5 text-gray-700 sticky left-0 bg-white border-r border-gray-100 z-10 text-xs" style={{minWidth:130}}>{c.label}</td>
                    {yearCols.map(({ fy, months }) => {
                      const expanded = !!expandedYears[fy];
                      const yrTotal = months.reduce((s, m) => s + (multi.byYear[fy]?.[m]?.v || 0), 0);
                      return (
                        <React.Fragment key={fy}>
                          {expanded && months.map(m => {
                            const cell = multi.byYear[fy]?.[m] || { v:0, s:'outside' };
                            if (fy === year && cell.s !== 'real' && cell.s !== 'outside')
                              return renderCell(cell, `${project.id}:${c.id}:${fy}:${m}`, [project.id, c.id, m]);
                            return (
                              <td key={m} className={cellStyle(cell.s)} style={{minWidth:58}}>
                                {cell.v !== 0 ? fNum(cell.v) : <span className="text-gray-300">—</span>}
                              </td>
                            );
                          })}
                          <td className={`px-2 py-1.5 text-right text-xs font-semibold border-l border-r
                              ${fy < year ? 'border-gray-200 bg-gray-50/60 text-gray-600'
                              : fy === year ? 'border-amber-200 bg-amber-50/60 text-amber-800'
                              : 'border-indigo-100 bg-indigo-50/40 text-indigo-700'}`}
                            style={{minWidth: expanded ? 68 : 88}}>
                            {yrTotal !== 0 ? fNum(yrTotal) : '—'}
                          </td>
                        </React.Fragment>
                      );
                    })}
                    <td className="px-2 py-1.5 text-right text-xs font-bold border-l border-gray-200 bg-orange-50/50 text-orange-700" style={{minWidth:84}}>
                      {multi.projTotal !== 0 ? <>{fNum(multi.projTotal)}<span className="uf-label text-current">UF</span></> : '—'}
                    </td>
                  </tr>
                );
              })}
              <tr style={{background:'#1f2937'}}>
                <td className="px-3 py-2 font-bold text-white sticky left-0 z-10 text-xs uppercase tracking-wide border-r border-white/10" style={{background:'#1f2937'}}>TOTAL COSTOS</td>
                {yearCols.map(({ fy, months }) => {
                  const expanded = !!expandedYears[fy];
                  const yrTot = PROJ_CATS.reduce((s, c) => s + months.reduce((ss, m) => ss + (allMultiC[c.id].byYear[fy]?.[m]?.v || 0), 0), 0);
                  return (
                    <React.Fragment key={fy}>
                      {expanded && months.map(m => {
                        const tot = PROJ_CATS.reduce((s, c) => s + (allMultiC[c.id].byYear[fy]?.[m]?.v || 0), 0);
                        return (
                          <td key={m} className={`px-2 py-2 text-right text-xs font-bold border-r border-white/10 ${fy < year ? 'text-gray-400' : fy === year && m <= controlMonth ? 'text-gray-400' : 'text-orange-300'}`}>
                            {tot !== 0 ? fNum(tot) : '—'}
                          </td>
                        );
                      })}
                      <td className={`px-2 py-2 text-right text-xs font-bold border-l border-r border-white/20 bg-white/5
                          ${fy < year ? 'text-gray-400' : fy === year ? 'text-amber-300' : 'text-indigo-300'}`}
                        style={{minWidth: expanded ? 68 : 88}}>
                        {yrTot !== 0 ? fNum(yrTot) : '—'}
                      </td>
                    </React.Fragment>
                  );
                })}
                <td className="px-2 py-2 text-right text-xs font-bold text-orange-300 border-l border-white/20 bg-white/5" style={{minWidth:84}}>
                  {fNum(totalCostProjTotal)}<span className="uf-label text-orange-300/50">UF</span>
                </td>
              </tr>

              {/* ── MARGEN OPERACIONAL ──────────────────────────────── */}
              {(() => {
                const mgnTotal = ingProjTotal - totalCostProjTotal;
                const pctTotal = ingProjTotal > 0.005 ? mgnTotal / ingProjTotal * 100 : null;
                const totalCls = mgnTotal >= 0 ? 'text-emerald-300' : 'text-red-400';
                return (
                  <tr style={{background:'#0d1f17', borderTop:'2px solid rgba(34,197,94,0.45)'}}>
                    <td className="px-3 py-2 sticky left-0 z-10 border-r border-white/10 text-[10px] font-bold uppercase tracking-widest text-emerald-400" style={{background:'#0d1f17', minWidth:130}}>
                      Margen Op.
                    </td>
                    {yearCols.map(({ fy, months }) => {
                      const expanded = !!expandedYears[fy];
                      const ingYr = months.reduce((s, m) => s + (ingData.byYear[fy]?.[m]?.v || 0), 0);
                      const cosYr = PROJ_CATS.reduce((s, c) => s + months.reduce((ss, m) => ss + (allMultiC[c.id].byYear[fy]?.[m]?.v || 0), 0), 0);
                      const mgnYr = ingYr - cosYr;
                      const pctYr = ingYr > 0.005 ? mgnYr / ingYr * 100 : null;
                      const hasYr = ingYr > 0.005 || cosYr > 0.005;
                      const yrCls = mgnYr >= 0 ? 'text-emerald-300' : 'text-red-400';
                      return (
                        <React.Fragment key={fy}>
                          {expanded && months.map(m => {
                            const ingM = ingData.byYear[fy]?.[m]?.v || 0;
                            const cosM = PROJ_CATS.reduce((s, c) => s + (allMultiC[c.id].byYear[fy]?.[m]?.v || 0), 0);
                            const mgn  = ingM - cosM;
                            const show = ingM > 0.005 || cosM > 0.005;
                            const isPastM = fy < year || (fy === year && m <= controlMonth);
                            const mCls = `${mgn >= 0 ? 'text-emerald-400' : 'text-red-400'}${isPastM ? ' opacity-75' : ''}`;
                            return (
                              <td key={m} className={`px-2 py-2 text-right text-xs font-bold border-r border-white/10 ${mCls}`}>
                                {show ? fNum(mgn) : <span className="text-white/15">—</span>}
                              </td>
                            );
                          })}
                          <td className={`px-2 py-2 text-right border-l border-r border-white/20 bg-white/5 font-bold ${yrCls}${fy < year ? ' opacity-70' : ''}`}
                            style={{minWidth: expanded ? 68 : 88}}>
                            {hasYr ? (
                              <>
                                <div className="text-xs font-mono">{fNum(mgnYr)}</div>
                                {pctYr !== null && <div className="text-[9px] font-semibold tabular-nums opacity-80">{pctYr.toFixed(1)}%</div>}
                              </>
                            ) : <span className="text-white/15">—</span>}
                          </td>
                        </React.Fragment>
                      );
                    })}
                    <td className={`px-2 py-2 text-right border-l border-white/20 bg-white/5 font-bold ${totalCls}`} style={{minWidth:84}}>
                      <div className="text-xs font-mono">{fNum(mgnTotal)}<span className="uf-label" style={{opacity:0.5}}>UF</span></div>
                      {pctTotal !== null && <div className="text-[9px] font-semibold tabular-nums opacity-80">{pctTotal.toFixed(1)}%</div>}
                    </td>
                  </tr>
                );
              })()}
            </tbody>
          </table>
        </TopScroll>

        {/* ══ GRÁFICOS COMPARATIVOS ════════════════════════════════════ */}
        <div style={{borderTop:'2px solid #e2e8f0', padding:'12px 12px 16px'}}>
          <div style={{fontSize:11, fontWeight:700, color:'#374151', paddingBottom:8,
            display:'flex', alignItems:'center', gap:8}}>
            <span>📈 Curvas Ingresos vs Costos</span>
            <span style={{fontFamily:'monospace', fontSize:10, color:'#94a3b8'}}>{project.unCode}</span>
            <span>{pName}</span>
            {project.isOffBudget && <span style={{fontSize:9, color:'#f59e0b', fontWeight:600}}>Fuera de Ppto</span>}
          </div>
          <CurveChart
            title="Valores mensuales"
            series={[
              { label: 'Ingreso Ppto',  color: '#60a5fa', dashed: false, values: ingBudget  },
              { label: 'Ingreso Proy',  color: '#22c55e', dashed: true,  values: ingProj    },
              { label: 'Costo Ppto',    color: '#f87171', dashed: false, values: costBudget },
              { label: 'Costo Proy',    color: '#f97316', dashed: true,  values: costProj   },
            ]}
            months={chartLabels} controlIdx={chartCtrlIdx} shift={0} unit=" UF"
          />
          <CurveChart
            title="Curva S — Acumulado"
            series={[
              { label: 'Ingreso Ppto',  color: '#3b82f6', dashed: false, values: toCumulative(ingBudget)  },
              { label: 'Ingreso Proy',  color: '#16a34a', dashed: true,  values: toCumulative(ingProj)    },
              { label: 'Costo Ppto',    color: '#ef4444', dashed: false, values: toCumulative(costBudget) },
              { label: 'Costo Proy',    color: '#ea580c', dashed: true,  values: toCumulative(costProj)   },
            ]}
            months={chartLabels} controlIdx={chartCtrlIdx} shift={0} unit=" UF"
          />
        </div>
      </div>
    );
  }

  // ── tabs ──────────────────────────────────────────────────────────────────────

  const tabs = [
    { id: 'resumen', label: '📊 Proyecciones a Término' },
    ...activeProjects.map(p => {
      const repName = projCompletion?.[p.id]?.replacementName;
      return { id: p.id, label: `${p.unCode} · ${repName || p.name}` };
    }),
    { id: 'oc', label: '🏢 Oficina Central (Costos)' },
  ];

  const selProject = activeProjects.find(p => p.id === selTab);

  // ── snapshot para Informe de Gestión ─────────────────────────────────────────
  // Guarda los valores proyectados a storage cada vez que cambian los datos del módulo.
  // El Informe de Gestión los lee al hacer click en "Actualizar".
  React.useEffect(() => {
    if (!activeProjects.length) return;
    try {
      const snapshotIngresos = {};
      activeProjects.forEach(p => {
        const { byYear } = buildMultiYearIngresosCells(p);
        snapshotIngresos[p.id] = {};
        for (let m = 1; m <= 12; m++) snapshotIngresos[p.id][m] = byYear[year]?.[m]?.v ?? 0;
      });

      const snapshotCostos = {};
      activeProjects.forEach(p => {
        snapshotCostos[p.id] = {};
        PROJ_CATS.forEach(c => {
          const { byYear } = buildMultiYearCells(p, c.id);
          snapshotCostos[p.id][c.id] = {};
          for (let m = 1; m <= 12; m++) snapshotCostos[p.id][c.id][m] = byYear[year]?.[m]?.v ?? 0;
        });
      });

      const snapshotOC = {};
      OC_PLAN.forEach(({ concepto, catId }) => {
        const cells = buildOCCells(concepto, catId);
        snapshotOC[catId] = {};
        for (let m = 1; m <= 12; m++) snapshotOC[catId][m] = cells[m]?.v ?? 0;
      });

      // Otros Ingresos: asesorías (UN01 sin intereses) + intereses ganados
      const snapshotOtros = {};
      const otrosOvSnap = overrides?.otrosIngresos || {};
      for (let m = 1; m <= 12; m++) {
        if (otrosOvSnap[m] != null) {
          snapshotOtros[m] = +otrosOvSnap[m];
        } else if (m <= controlMonth) {
          const asesorUF  = getMayorAsesoriasUF(m);
          const interesUF = getMayorInteresUF(m);
          snapshotOtros[m] = (asesorUF !== null ? asesorUF : 0) + (interesUF !== null ? interesUF : 0);
        } else {
          snapshotOtros[m] = 0;
        }
      }

      const snapshotAnticipos = {};
      activeProjects.forEach(p => {
        const ovA = overrides?.anticipos?.[p.id] || {};
        snapshotAnticipos[p.id] = {};
        for (let m = 1; m <= 12; m++) snapshotAnticipos[p.id][m] = +(ovA[m] ?? 0);
      });

      storage.set(`budget-control:proj-snapshot:${year}`, {
        year, controlMonth,
        ingresos:      snapshotIngresos,
        costos:        snapshotCostos,
        oc:            snapshotOC,
        otrosIngresos: snapshotOtros,
        anticipos:     snapshotAnticipos,
        ts:            Date.now(),
      });
    } catch(e) {}
  }, [year, controlMonth, projCompletion, overrides, mayorData, actualsForYear]);

  // ── render ────────────────────────────────────────────────────────────────────

  return (
    <div>
      {/* Header */}
      <div className="flex items-center justify-between mb-4">
        <div className="flex items-center gap-3">
          <div className="w-1 h-8 bg-[#C8102E] rounded-full" />
          <div>
            <h1 className="text-xl font-bold text-gray-900 leading-tight">Proyecciones</h1>
            <p className="text-xs text-gray-400 font-medium">
              Vista multi-año a término · Mes de control:{' '}
              {controlMonth > 0
                ? <strong className="text-gray-600">{MONTH_ABR[controlMonth - 1]} {year}</strong>
                : <span className="text-amber-600">Sin datos reales cargados</span>
              }
            </p>
          </div>
        </div>
        <div className="flex items-center gap-5">
          {/* Leyenda */}
          <div className="flex items-center gap-3 text-xs text-gray-500">
            <span className="flex items-center gap-1.5">
              <span className="inline-block w-5 h-4 rounded bg-gray-100 border border-gray-300" />
              Real
            </span>
            <span className="flex items-center gap-1.5">
              <span className="inline-block w-5 h-4 rounded bg-white border border-gray-300" />
              Proyectado
            </span>
            <span className="flex items-center gap-1.5">
              <span className="inline-block w-5 h-4 rounded bg-amber-50 border border-amber-300" />
              Manual ↺
            </span>
          </div>
          {/* Colapsar / Expandir años */}
          {(() => {
            const allExpanded = allProjectYears.length > 0 && allProjectYears.every(y => expandedYears[y]);
            const toggleAllYears = () => {
              if (allExpanded) {
                setExpandedYears({});
              } else {
                const next = {};
                allProjectYears.forEach(y => { next[y] = true; });
                setExpandedYears(next);
              }
            };
            return (
              <button onClick={toggleAllYears}
                className="text-xs border border-gray-200 rounded-lg px-3 py-1.5 text-gray-500 hover:text-gray-700 hover:bg-gray-50 transition-colors flex items-center gap-1.5">
                <span>{allExpanded ? '▲' : '▼'}</span>
                {allExpanded ? 'Colapsar años' : 'Expandir años'}
              </button>
            );
          })()}
          <button
            onClick={() => setRefreshKey(k => k + 1)}
            className="text-xs text-gray-400 hover:text-gray-600 border border-gray-200 rounded px-2 py-1 hover:bg-gray-50"
            title="Recargar datos reales desde storage"
          >↻ Actualizar</button>
        </div>
      </div>

      {/* ── Selector de período cerrado ── */}
      <PeriodSelectorBar year={year} periodoVisto={periodoVistoPM} onChange={setPeriodoVistoPM} />

      {/* ── Vista lectura: proyecciones de período cerrado ── */}
      {periodoVistoPM !== 'actual' && (() => {
        const snap = getCierreModulo(year, periodoVistoPM, 'projection');
        const fmtN = v => Math.abs(+v||0)<0.005?'—':(+v).toLocaleString('es-CL',{minimumFractionDigits:1,maximumFractionDigits:1});
        const nc = v => Math.abs(+v||0)<0.005?'text-gray-400':(+v)>0?'text-emerald-700':'text-red-600';
        return (
          <>
            <SnapshotReadonlyBanner year={year} mes={periodoVistoPM} />
            {!snap ? (
              <div className="bg-gray-50 rounded-xl border border-gray-200 p-8 text-center text-gray-400 text-sm">
                No hay datos de proyecciones guardados para {MONTH_ABR[periodoVistoPM-1]} {year}.
              </div>
            ) : (
              <div className="bg-white rounded-xl border border-gray-100 shadow-sm overflow-hidden">
                <div className="px-4 py-3 border-b border-gray-100 text-[10px] font-bold text-gray-500 uppercase tracking-wide">
                  Snapshot Proyecciones — {MONTH_ABR[periodoVistoPM-1]} {year}
                </div>
                <table className="text-xs w-full">
                  <thead><tr style={{background:'#1C3460'}}>
                    <th className="text-left px-4 py-2 text-gray-300 font-semibold w-48">Proyecto</th>
                    {Array.from({length:12},(_,i)=>i+1).map(m=>(
                      <th key={m} className="text-right px-2 py-2 text-gray-300 font-semibold">{MONTH_ABR[m-1]}</th>
                    ))}
                  </tr></thead>
                  <tbody>
                    {activeProjects.map(p => {
                      const ing = snap.ingresos?.[p.id] || {};
                      const totalIng = Object.values(ing).reduce((s,v)=>s+(+v||0),0);
                      return (
                        <tr key={p.id} className="border-b border-gray-100 hover:bg-gray-50">
                          <td className="px-4 py-1.5 font-medium text-gray-700 text-[11px]">
                            {projCompletion?.[p.id]?.replacementName || p.name}
                            <span className="ml-1 text-[9px] text-gray-400">{p.contractType==='suma_alzada'?'SA':'AD'}</span>
                          </td>
                          {Array.from({length:12},(_,i)=>i+1).map(m=>(
                            <td key={m} className={`px-2 py-1.5 text-right font-mono text-[11px] ${nc(ing[m]||0)}`}>
                              {fmtN(ing[m]||0)}
                            </td>
                          ))}
                        </tr>
                      );
                    })}
                  </tbody>
                </table>
              </div>
            )}
          </>
        );
      })()}

      {periodoVistoPM === 'actual' && (activeProjects.length === 0 ? (
        <div className="bg-white rounded-xl border border-gray-200 p-12 text-center text-gray-400 text-sm">
          No hay proyectos con fechas de inicio y término configuradas.
        </div>
      ) : (
        <>
          {/* Tabs */}
          <div className="flex gap-0 border-b border-gray-200 overflow-x-auto">
            {tabs.map(t => (
              <button key={t.id}
                onClick={() => { setSelTab(t.id); setEditKey(null); }}
                className={`px-4 py-2.5 text-xs font-medium whitespace-nowrap border-b-2 transition-colors flex-shrink-0
                  ${selTab === t.id
                    ? 'border-[#C8102E] text-[#C8102E] bg-red-50/30'
                    : 'border-transparent text-gray-500 hover:text-gray-700 hover:border-gray-300'}`}
              >{t.label}</button>
            ))}
          </div>

          {/* Table */}
          <div className="bg-white rounded-b-xl shadow-sm border border-t-0 border-gray-200 overflow-hidden">
            {selTab === 'resumen'  ? renderResumenTable() :
             selTab === 'oc'       ? renderOCTable() :
             selProject            ? renderProjectFullTab(selProject) : null}
          </div>
        </>
      ))}
    </div>
  );
}

// ─── INFORME DE GESTIÓN ──────────────────────────────────────────────────────

function ReportModule({ projects, activeYear }) {
  const year = activeYear;
  const fN = n => {

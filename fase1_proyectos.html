// ─── CARGA DE DATOS ───────────────────────────────────────────────────────────

const CLASS_LABELS = {
  materiales:          'Materiales',
  mano_de_obra:        'Mano de Obra',
  subcontratos:        'Subcontratos',
  gastos_generales:    'Gastos Generales',
  equipos_maquinarias: 'Equipos y Maq.',
  edificaciones_comerciales: 'Edificaciones Comerciales',
  post_venta:          'Post Venta',
  otros:               'Otros',
  oficina_central:     'Oficina Central',
  no_clasificado:      '⚠ No Clasificado',
};

function classifyManagerCode(code) {
  const n = +String(code ?? '').trim();
  if (isNaN(n) || n === 0) return 'no_clasificado';
  if (n >= 100 && n <= 149) return 'materiales';
  if (n >= 200 && n <= 249) return 'mano_de_obra';
  if (n >= 300 && n <= 399) return 'subcontratos';
  if (n >= 400 && n <= 499) return 'gastos_generales';
  if (n >= 500 && n <= 549) return 'equipos_maquinarias';
  if (n >= 600 && n <= 649) return 'edificaciones_comerciales';
  if (n >= 700 && n <= 749) return 'post_venta';
  if (n >= 800 && n <= 899) return 'otros';
  if (n >= 900)             return 'oficina_central';
  return 'no_clasificado';
}

// ─── MIGRACIÓN DE ESQUEMA ───────────────────────────────────────────────────────
// v2 (2026-06): modelo de 8 categorías de costo (agrega Edificaciones Comerciales y
// Post Venta). Reclasifica los actuals guardados re-ejecutando classifyManagerCode
// sobre el código (concepto) ya almacenado — p.ej. 600-649 pasa de 'otros' a
// 'edificaciones_comerciales', y 700-749 de 'no_clasificado' a 'post_venta' — y
// completa budgetByCategory de los proyectos con las 2 nuevas familias en 0.
// Idempotente: corre UNA vez (guarda budget-control:schema-version). No toca filas
// sin código (concepto vacío). Como respaldo, el menú usuario tiene "Respaldar datos".
const SCHEMA_VERSION = 2;
function migrateSchema() {
  try {
    const cur = +storage.get('budget-control:schema-version') || 1;
    if (cur >= SCHEMA_VERSION) return;
    // RESPALDO PRE-MIGRACIÓN (no migrar sin red): volcar todas las claves
    // budget-control:* a una clave de respaldo ANTES de tocar nada. Si el
    // respaldo no se puede escribir, ABORTAR la migración (mejor no migrar que
    // reescribir el storage sin copia de seguridad). Sufijo determinista
    // origen→destino (no Date.now()): idempotente y no depende del reloj.
    const backupSuffix = `pre-migracion:${cur}-${SCHEMA_VERSION}`;
    if (!writeBackupToStorage(backupSuffix)) {
      console.error('[ICEMM] Migración ABORTADA: no se pudo crear el respaldo previo (' + backupSuffix + ').');
      try {
        window.dispatchEvent(new CustomEvent('icemm-storage-error',
          { detail: { quota: true, critical: true,
            message: 'No se pudo respaldar antes de migrar el esquema; la migración se canceló para no arriesgar tus datos. Liberá espacio y recargá.' } }));
      } catch {}
      return;
    }
    console.info('[ICEMM] Respaldo pre-migración creado: ' + BACKUP_PREFIX + backupSuffix);
    let reclasRows = 0, reclasKeys = 0;
    for (let y = 2023; y <= 2032; y++) {
      for (let m = 1; m <= 12; m++) {
        const key = `budget-control:actuals:${y}:${String(m).padStart(2, '0')}`;
        const d = storage.get(key);
        if (!d || !Array.isArray(d.rows)) continue;
        let changed = false;
        d.rows.forEach(r => {
          if (r.concepto == null || r.concepto === '') return; // sin código: no tocar
          const nc = classifyManagerCode(r.concepto);
          if (r.clasificacion !== nc) { r.clasificacion = nc; changed = true; reclasRows++; }
        });
        if (changed) { storage.set(key, d); reclasKeys++; }
      }
    }
    const projects = storage.get('budget-control:projects');
    if (Array.isArray(projects)) {
      projects.forEach(p => {
        if (p && p.budgetByCategory) {
          if (p.budgetByCategory.edificaciones_comerciales == null) p.budgetByCategory.edificaciones_comerciales = 0;
          if (p.budgetByCategory.post_venta == null) p.budgetByCategory.post_venta = 0;
        }
      });
      storage.set('budget-control:projects', projects);
    }
    storage.set('budget-control:schema-version', SCHEMA_VERSION);
    console.info(`[ICEMM] Migración v${SCHEMA_VERSION} (8 categorías) OK. Filas reclasificadas: ${reclasRows} en ${reclasKeys} meses.`);
  } catch (e) {
    console.error('[ICEMM] Error en migración de esquema:', e);
  }
}

function DataLoader({ projects, activeYear }) {
  const [controlYear,  setControlYear]  = useState(() => {
    const cfg = storage.get('budget-control:config');
    return cfg?.controlYear || activeYear;
  });
  const [controlMonth, setControlMonth] = useState(() => {
    const cfg = storage.get('budget-control:config');
    return cfg?.controlMonth || (new Date().getMonth() + 1);
  });

  const [ufTable, setUfTable] = useState(() => storage.get('budget-control:uf-table') || {});
  const [history, setHistory] = useState(() => storage.get('budget-control:load-history') || []);

  const [selDataTab,     setSelDataTab]     = useState('manager');
  const [managerStage,   setManagerStage]   = useState(() => {
    try {
      const hist = storage.get('budget-control:load-history') || [];
      const entries = hist.filter(h => h.type === 'manager');
      if (!entries.length) return null;
      const byMonth = {};
      let totalRows = 0;
      let filename = '';
      entries.forEach(entry => {
        const key = `budget-control:actuals:${entry.year}:${String(entry.month).padStart(2,'0')}`;
        const stored = storage.get(key);
        if (stored?.rows) {
          const mk = `${entry.year}-${String(entry.month).padStart(2,'0')}`;
          byMonth[mk] = { year: entry.year, month: entry.month, rows: stored.rows, rowCount: stored.rows.length };
          totalRows += stored.rows.length;
          if (!filename && stored.filename) filename = stored.filename;
        }
      });
      if (!Object.keys(byMonth).length) return null;
      return { byMonth, filename, totalRows, warnings: [], detected: [], saved: true, skippedCV: 0 };
    } catch { return null; }
  });
  const [managerLoading, setManagerLoading] = useState(false);
  const [expandedUNs,          setExpandedUNs]          = useState(() => new Set());
  const [expandedGroups,       setExpandedGroups]       = useState(() => new Set()); // keys: "unCode:clasificacion"
  const [expandedYearsManager, setExpandedYearsManager] = useState(() => new Set());
  const [expandedYearsMayor,   setExpandedYearsMayor]   = useState(() => new Set());
  const toggleYearManager = fy => setExpandedYearsManager(prev => { const n = new Set(prev); n.has(fy) ? n.delete(fy) : n.add(fy); return n; });
  const toggleYearMayor   = fy => setExpandedYearsMayor  (prev => { const n = new Set(prev); n.has(fy) ? n.delete(fy) : n.add(fy); return n; });
  const [mayorStage,     setMayorStage]     = useState(() => {
    try {
      const stored = storage.get('budget-control:mayor:latest');
      if (!stored?.rows) return null;
      return {
        rows: stored.rows,
        filename: stored.filename,
        rowCount: (stored.rows?.length || 1) - 1,
        ingresos: (stored.ingresos && typeof stored.ingresos === 'object' && stored.ingresos.byUN && stored.ingresos.totalCLP != null) ? stored.ingresos : null,
        saved: true,
      };
    } catch { return null; }
  });
  const [mayorLoading,   setMayorLoading]   = useState(false);

  const [balanceStage,   setBalanceStage]   = useState(() => {
    try {
      const stored = storage.get('budget-control:balance:latest');
      if (!stored?.accounts) return null;
      return { ...stored, saved: true };
    } catch { return null; }
  });
  const [balanceLoading, setBalanceLoading] = useState(false);

  const managerRef = useRef(null);
  const mayorRef   = useRef(null);
  const balanceRef = useRef(null);
  const ufRef      = useRef(null);
  const [ufUploadMsg, setUfUploadMsg] = useState(null);
  const [ufViewYear,  setUfViewYear]  = useState(activeYear);
  const [balanceCurrency,  setBalanceCurrency]  = useState('clp');
  const [ingresosCurrency, setIngresosCurrency] = useState('clp');

  useEffect(() => { storage.set('budget-control:uf-table',    ufTable);  }, [ufTable]);
  useEffect(() => { storage.set('budget-control:load-history', history);  }, [history]);
  useEffect(() => {
    storage.set('budget-control:config', { controlYear, controlMonth });
  }, [controlYear, controlMonth]);

  const ctrlKey = `budget-control:actuals:${controlYear}:${String(controlMonth).padStart(2,'0')}`;
  const alreadyLoaded = !!storage.get(ctrlKey);

  // ── Procesar Reporte Manager ────────────────────────────────────────────────
  function readFile(file, onRows) {
    const isExcel = /\.xlsx?$/i.test(file.name);
    const reader  = new FileReader();
    reader.onload = ev => {
      try {
        let rows;
        if (isExcel) {
          const wb = XLSX.read(ev.target.result, { type: 'array' });
          rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header:1, raw:false, defval:'' });
        } else {
          rows = ev.target.result.split(/\r?\n/).filter(l => l.trim()).map(l => l.split(/[,;\t]/));
        }
        onRows(null, rows);
      } catch(err) { onRows(err.message, null); }
    };
    if (isExcel) reader.readAsArrayBuffer(file);
    else reader.readAsText(file, 'UTF-8');
  }

  // Parsea fecha en formatos DD/MM/YYYY, YYYY-MM-DD, DD-MM-YYYY → {year, month} o null
  function parseRowDate(v) {
    const s = String(v ?? '').trim();
    if (!s) return null;
    let m;
    m = s.match(/^(\d{4})[\-\/](\d{1,2})[\-\/](\d{1,2})/);
    if (m) return { year: +m[1], month: +m[2] };
    m = s.match(/^(\d{1,2})[\-\/](\d{1,2})[\-\/](\d{4})/);
    if (m) return { year: +m[3], month: +m[2] };
    m = s.match(/^(\d{1,2})[\-\/](\d{1,2})[\-\/](\d{2})$/);
    if (m) return { year: 2000 + +m[3], month: +m[2] };
    return null;
  }

  function detectManagerCols(rows) {
    const header = rows[0] || [];
    const norm = s => String(s ?? '').toLowerCase().trim()
      .normalize('NFD').replace(/[̀-ͯ]/g, '')
      .replace(/[\s_\-]+/g, '_');
    const find = (...needles) => {
      const idx = header.findIndex(h => needles.some(n => norm(h).includes(n)));
      return idx === -1 ? null : idx;
    };

    const cols = {
      unCol:            find('codigo_unidad', 'un_codigo', 'codigo_un'),
      unDescCol:        find('descripcion_unidad', 'descripcion_un', 'descripcion_de_unidad'),
      mesCol:           find('mes'),
      anoCol:           find('ano'),
      ufValCol:         find('uf'),
      exentoCol:        find('exento_detalle_uf', 'exento_uf'),
      afectoCol:        find('afecto_detalle_uf', 'afecto_uf'),
      conceptCol:       find('concepto1_codigo', 'concepto1_c', 'concepto_codigo'),
      conceptoDescCol:  find('concepto1_nombre', 'concepto1_desc', 'concepto1', 'cuenta'),
      glosaCol:         find('glosa_encabezado', 'glosa_enc', 'glosa'),
    };

    // Fallback a índices conocidos del Reporte Manager de ICEMM
    if (cols.unCol           === null) cols.unCol           = 1;
    if (cols.unDescCol       === null) cols.unDescCol       = 2;
    if (cols.mesCol          === null) cols.mesCol          = 5;
    if (cols.anoCol          === null) cols.anoCol          = 6;
    if (cols.ufValCol        === null) cols.ufValCol        = 8;
    if (cols.exentoCol       === null) cols.exentoCol       = 13;
    if (cols.afectoCol       === null) cols.afectoCol       = 15;
    if (cols.conceptCol      === null) cols.conceptCol      = 18;
    if (cols.conceptoDescCol === null) cols.conceptoDescCol = 19;
    // glosaCol sin fallback: si no se detecta, no se filtra por glosa

    const detected = Object.entries(cols)
      .map(([k, v]) => `${k}→col${v}(${String(header[v] ?? '').substring(0,18)})`);

    return { cols, detected };
  }

  function processManagerRows(rows) {
    // Handles both European format "1.234,56" and plain decimal "1234.56"
    const toNum = v => {
      let s = String(v ?? '').trim();
      if (!s) return 0;
      // European: period thousands separator + comma decimal → "1.234,56" or "1.234.567,89"
      if (/^-?\d{1,3}(\.\d{3})*,\d*$/.test(s)) {
        s = s.replace(/\./g, '').replace(',', '.');
      } else {
        // Plain comma decimal "1234,56" or already "1234.56"
        s = s.replace(',', '.');
      }
      return parseFloat(s.replace(/[^\d.\-]/g, '')) || 0;
    };
    const toInt = v => parseInt(String(v ?? '').trim(), 10) || 0;
    const toStr = v => String(v ?? '').trim();
    const unCodes = new Set(projects.map(p => p.unCode));
    const warnSet = new Set();
    const byMonth = {}; // "YYYY-MM" → { year, month, aggMap, rowCount }
    let totalRows = 0;
    let skippedCV = 0;

    const { cols, detected } = detectManagerCols(rows);

    // Sample raw values from first data row for diagnosis
    const firstDataRow = rows.slice(1).find(r => r && r.length > 5) || [];
    const sampleVals = [
      `exento_raw="${String(firstDataRow[cols.exentoCol] ?? '').substring(0,12)}"`,
      `→${toNum(firstDataRow[cols.exentoCol]).toFixed(4)}`,
      `afecto_raw="${String(firstDataRow[cols.afectoCol] ?? '').substring(0,12)}"`,
      `→${toNum(firstDataRow[cols.afectoCol]).toFixed(4)}`,
    ];

    rows.slice(1).forEach(row => {
      if (!row || row.length < 2) return;

      const mes  = toInt(row[cols.mesCol]);
      const año  = toInt(row[cols.anoCol]);
      if (!mes || !año || mes < 1 || mes > 12 || año < 2000 || año > 2100) return;

      // Excluir ajustes de "Costos de Venta" (reclasificaciones contables para balance)
      if (cols.glosaCol !== null) {
        const glosa = toStr(row[cols.glosaCol]).toLowerCase();
        if (glosa.includes('costo de venta') || glosa.includes('costos de venta')) {
          skippedCV++;
          return;
        }
      }

      const exento = toNum(row[cols.exentoCol]);
      const afecto = toNum(row[cols.afectoCol]);
      if (exento === 0 && afecto === 0) return;
      totalRows++;

      const unCode       = toStr(row[cols.unCol]);
      const unDesc       = toStr(row[cols.unDescCol]);
      const uf           = toNum(row[cols.ufValCol]);
      const concepto     = toStr(row[cols.conceptCol]);
      const conceptoDesc = toStr(row[cols.conceptoDescCol]);

      const cls = classifyManagerCode(concepto);

      const mk = `${año}-${String(mes).padStart(2,'0')}`;
      if (!byMonth[mk]) byMonth[mk] = { year: año, month: mes, aggMap: {}, rowCount: 0 };

      const aggKey = `${unCode}|${concepto}`;
      if (!byMonth[mk].aggMap[aggKey]) {
        byMonth[mk].aggMap[aggKey] = { unCode, unDesc, mes, año, ufSum: 0, ufCount: 0, exento: 0, afecto: 0, concepto, conceptoDesc };
      }
      const agg = byMonth[mk].aggMap[aggKey];
      agg.exento += exento;
      agg.afecto += afecto;
      if (uf > 0) { agg.ufSum += uf; agg.ufCount++; }
      byMonth[mk].rowCount++;
    });

    // Convertir aggMap a array de filas con total calculado
    Object.values(byMonth).forEach(bm => {
      bm.rows = Object.values(bm.aggMap).map(r => ({
        unCode:        r.unCode,
        unDesc:        r.unDesc,
        mes:           r.mes,
        año:           r.año,
        uf:            r.ufCount > 0 ? Math.round(r.ufSum / r.ufCount * 100) / 100 : 0,
        exento:        Math.round(r.exento * 10000) / 10000,
        afecto:        Math.round(r.afecto * 10000) / 10000,
        concepto:      r.concepto,
        conceptoDesc:  r.conceptoDesc,
        clasificacion: classifyManagerCode(r.concepto),
        total:         Math.round((r.exento + r.afecto) * 10000) / 10000,
      }));
      delete bm.aggMap;
    });

    // Validación de carga (antes warnSet quedaba vacío y nada se advertía):
    //  - UN desconocida: no es un proyecto registrado ni Oficina Central ('01').
    //    Sus costos NO se imputan a ningún proyecto aguas abajo (pérdida silenciosa).
    //  - código sin clasificación: queda en "Sin Clasificar", fuera del costo de obra.
    const knownUNs = new Set([...projects.map(p => p.unCode), '01']);
    const unknownUN = {}, sinClasif = {};
    Object.values(byMonth).forEach(bm => {
      bm.rows.forEach(r => {
        if (!knownUNs.has(r.unCode)) {
          if (!unknownUN[r.unCode]) unknownUN[r.unCode] = { unDesc: r.unDesc, uf: 0 };
          unknownUN[r.unCode].uf += r.total;
        }
        if (r.clasificacion === 'no_clasificado' && r.concepto && +r.concepto !== 0) {
          if (!sinClasif[r.concepto]) sinClasif[r.concepto] = { uf: 0, count: 0 };
          sinClasif[r.concepto].uf += r.total; sinClasif[r.concepto].count++;
        }
      });
    });
    Object.entries(unknownUN).forEach(([un, v]) =>
      warnSet.add(`UN ${un}${v.unDesc ? ' (' + v.unDesc + ')' : ''} no existe en proyectos registrados: ${v.uf.toFixed(2)} UF NO se imputarán a ningún proyecto.`));
    Object.entries(sinClasif).forEach(([c, v]) =>
      warnSet.add(`Código ${c} sin clasificación (${v.count} mov., ${v.uf.toFixed(2)} UF): queda en "Sin Clasificar", fuera del costo de obra.`));

    return { byMonth, warnings: [...warnSet], totalRows, skippedCV, detected, sampleVals };
  }

  function handleManagerFile(e) {
    const file = e.target.files[0]; if (!file) return; e.target.value = '';
    setManagerLoading(true); setManagerStage(null);
    readFile(file, (err, rows) => {
      if (err) { setManagerStage({ error: 'Error: ' + err }); }
      else { setManagerStage({ ...processManagerRows(rows), filename: file.name }); }
      setManagerLoading(false);
    });
  }

  function confirmManagerLoad() {
    if (!managerStage?.byMonth) return;
    // Aviso de meses ya cargados (antes se sobrescribían en silencio, contra la spec)
    const yaCargados = Object.values(managerStage.byMonth)
      .filter(({ year, month }) => !!storage.get(`budget-control:actuals:${year}:${String(month).padStart(2,'0')}`))
      .map(({ year, month }) => `${String(month).padStart(2,'0')}/${year}`);
    if (yaCargados.length && !confirm(`Estos meses YA tienen datos cargados y serán SOBRESCRITOS:\n  ${yaCargados.join(', ')}\n\n¿Continuar y reemplazarlos?`)) return;
    const now = new Date();
    const entries = [];
    let saveFailed = null;
    Object.entries(managerStage.byMonth).forEach(([, { year, month, rows, rowCount }]) => {
      const key = `budget-control:actuals:${year}:${String(month).padStart(2,'0')}`;
      const okWrite = storage.set(key, { year, month, rows, loadedAt: now.toISOString(), filename: managerStage.filename });
      if (!okWrite) { saveFailed = `${String(month).padStart(2,'0')}/${year}`; return; }
      entries.push({ type:'manager', year, month, filename: managerStage.filename,
        loadedAt: now.toLocaleString('es-CL'), rowCount });
    });
    if (saveFailed) {
      reportCriticalSaveFailure(`datos del Reporte Manager (${saveFailed})`);
      return; // no marcar como guardado ni actualizar historial
    }
    setHistory(prev => {
      let h = [...prev];
      entries.forEach(entry => {
        h = [entry, ...h.filter(x => !(x.type==='manager' && x.year===entry.year && x.month===entry.month))];
      });
      return h;
    });
    setManagerStage(prev => ({ ...prev, saved: true }));
  }

  // ── Helpers de parseo chileno ────────────────────────────────────────────────
  const normHdr = s => String(s ?? '').toLowerCase().trim()
    .normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/\s+/g, '_');

  function toNumCL(v) {
    if (typeof v === 'number') return isFinite(v) ? v : 0;
    const s = String(v ?? '').trim().replace(/\s/g, '');
    if (!s || s === '-') return 0;
    if (s.includes(',')) return parseFloat(s.replace(/\./g, '').replace(',', '.')) || 0;
    if (/^-?\d{1,3}(\.\d{3})+$/.test(s)) return parseFloat(s.replace(/\./g, '')) || 0;
    return parseFloat(s) || 0;
  }

  // ── Mayor EMM — extrae todos los ingresos (cuentas 5-x) por UN y mes, en UF
  // Convierte cada movimiento CLP → UF usando el valor UF del día exacto de la transacción.
  function extractIngresos(rows, ufTbl) {
    // Localizar fila header real (metadatos en filas 1-7, header en fila ~9)
    let headerIdx = -1;
    for (let i = 0; i < Math.min(rows.length, 15); i++) {
      const row = rows[i] || [];
      if (row.some(c => { const n = normHdr(String(c ?? '')); return n.includes('haber') || n.includes('debe') || n === 'cuenta_contable'; })) {
        headerIdx = i; break;
      }
    }
    if (headerIdx === -1) return null;

    const header = rows[headerIdx];
    const findCol = (...needles) => header.findIndex(h => needles.some(n => normHdr(String(h ?? '')).includes(n)));
    const ctaCol    = (() => { const i = findCol('cuenta_contable', 'cuenta'); return i >= 0 ? i : 0; })();
    const nombreCol = findCol('nombre_cuenta', 'nombre');
    const fechaCol  = findCol('fecha');
    const haberCol  = findCol('haber', 'credito');
    const debeCol   = findCol('debe', 'debito');
    const ccCol     = findCol('centro_de_costo', 'centro');

    const parseUN = cc => {
      const m = String(cc ?? '').trim().match(/^(\d+)\s*-\s*(.+)$/);
      if (!m) return { code: 'SCC', desc: 'Sin Centro de Costo' };
      return { code: `UN${m[1].padStart(2,'0')}`, desc: m[2].trim() };
    };
    const parseDate = v => {
      if (typeof v === 'number') {
        const d = new Date((v - 25569) * 86400 * 1000);
        return { day: d.getUTCDate(), month: d.getUTCMonth() + 1, year: d.getUTCFullYear() };
      }
      const m = String(v ?? '').trim().match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})$/);
      return m ? { day: parseInt(m[1]), month: parseInt(m[2]), year: parseInt(m[3]) } : null;
    };

    // Busca el valor UF del día exacto; si no existe retrocede al día anterior más cercano del mismo mes
    const getUF = (year, month, day) => {
      const md = ufTbl?.[year]?.[month];
      if (!md) return null;
      for (let d = day; d >= 1; d--) {
        if (md[d] != null) return md[d];
      }
      // Si no hay días anteriores, buscar hacia adelante
      for (let d = day + 1; d <= 31; d++) {
        if (md[d] != null) return md[d];
      }
      return null;
    };

    const byUN = {};
    let grandTotalCLP = 0;
    let grandTotalUF  = 0;
    const missingUF = new Set(); // fechas sin UF cargado

    rows.slice(headerIdx + 1).forEach(row => {
      if (!row || !row.length) return;
      const cta = String(row[ctaCol] ?? '').trim().replace(/\s/g, '');
      if (!/^5-/.test(cta)) return;

      const nombre = String(row[nombreCol >= 0 ? nombreCol : 1] ?? '').trim();
      const haber  = toNumCL(haberCol >= 0 ? row[haberCol] : 0);
      const debe   = toNumCL(debeCol  >= 0 ? row[debeCol]  : 0);
      const netCLP = haber - debe;
      if (netCLP === 0) return;

      const dp = fechaCol >= 0 ? parseDate(row[fechaCol]) : null;
      const ufVal = dp ? getUF(dp.year, dp.month, dp.day) : null;

      let netUF;
      if (ufVal) {
        netUF = netCLP / ufVal;
      } else {
        // Sin UF para esa fecha: no se puede convertir, excluir del total UF
        if (dp) missingUF.add(`${dp.day}/${dp.month}/${dp.year}`);
        netUF = 0;
      }

      const { code: unCode, desc: unDesc } = parseUN(ccCol >= 0 ? row[ccCol] : '');
      grandTotalCLP += netCLP;
      grandTotalUF  += netUF;

      if (!byUN[unCode]) byUN[unCode] = { unCode, unDesc, byAccount: {}, totalCLP: 0, totalUF: 0 };
      byUN[unCode].totalCLP += netCLP;
      byUN[unCode].totalUF  += netUF;
      if (!byUN[unCode].byAccount[cta]) byUN[unCode].byAccount[cta] = { cuenta: cta, nombre, byMonthCLP: {}, byMonthUF: {}, totalCLP: 0, totalUF: 0 };
      byUN[unCode].byAccount[cta].totalCLP += netCLP;
      byUN[unCode].byAccount[cta].totalUF  += netUF;
      if (dp) {
        const key = `${dp.year}-${String(dp.month).padStart(2,'0')}`;
        byUN[unCode].byAccount[cta].byMonthCLP[key] = (byUN[unCode].byAccount[cta].byMonthCLP[key] || 0) + netCLP;
        byUN[unCode].byAccount[cta].byMonthUF[key]  = (byUN[unCode].byAccount[cta].byMonthUF[key]  || 0) + netUF;
      }
    });

    if (grandTotalCLP === 0) return null;

    const monthSet = new Set();
    Object.values(byUN).forEach(un => Object.values(un.byAccount).forEach(acc => Object.keys(acc.byMonthCLP).forEach(k => monthSet.add(k))));
    const months = [...monthSet].sort();
    const warnings = missingUF.size > 0
      ? [`Sin valor UF para: ${[...missingUF].join(', ')} — esos movimientos se excluyeron del total UF.`]
      : [];

  // ── Balance Contable — sube el balance elaborado por el contador ─────────────
  function processBalanceRows(rows, filename) {
    // Los archivos del contador suelen tener filas de metadata (empresa, RUT, fecha, título)
    // y a veces una fila de encabezado de grupo (ej: "ACTIVO | PASIVO | PÉRDIDAS") antes del
    // encabezado real de columnas. Usar la fila con MÁS coincidencias, no la primera con >= 2.
    const HEADER_NEEDLES = ['debito','debe','credito','haber','activo','pasivo','deudor','acreedor','perdida','ganancia','cuenta'];
    let headerIdx = 0;
    let maxHits = 0;
    for (let i = 0; i < Math.min(rows.length, 20); i++) {
      const row = rows[i] || [];
      const hits = row.filter(c => {
        const n = normHdr(String(c ?? ''));
        return HEADER_NEEDLES.some(needle => n.includes(needle));
      }).length;
      if (hits > maxHits) { maxHits = hits; headerIdx = i; }
    }

    const header = rows[headerIdx] || [];
    const findCol = (...needles) => {
      const i = header.findIndex(h => needles.some(n => normHdr(String(h ?? '')).includes(n)));
      return i >= 0 ? i : null;
    };
    const ctaCol      = (() => {
      const i = header.findIndex(h => { const n = normHdr(String(h ?? '')); return n === 'cuenta' || (n.includes('cuenta') && !n.includes('contable')); });
      return i >= 0 ? i : 0;
    })();
    const nombreCol   = findCol('cuenta_contable', 'contable', 'nombre', 'descripcion') ?? 1;
    const debCol      = findCol('debito', 'debe')      ?? 2;
    const credCol     = findCol('credito', 'haber')    ?? 3;
    const deudorCol   = findCol('deudor');
    const acreedorCol = findCol('acreedor');
    const activoCol   = findCol('activo');
    const pasivoCol   = findCol('pasivo');
    const perdidasCol = findCol('perdidas', 'perdida');
    const ganancCol   = findCol('ganancias', 'ganancia');

    // Exponer columnas y filas raw para diagnóstico en la UI
    const colsFound = { headerIdx, maxHits, activoCol, pasivoCol, perdidasCol, ganancCol, deudorCol, acreedorCol };
    const rawFirstRows = rows.slice(0, Math.min(headerIdx + 3, rows.length));

    const accounts = [];
    rows.slice(headerIdx + 1).forEach(row => {
      if (!row || row.length < 2) return;
      const cta = String(row[ctaCol] ?? '').trim();
      if (!cta) return;
      const ctaN = normHdr(cta);
      if (['total', 'utilidad', 'perdida', 'suma'].some(w => ctaN.includes(w))) return;
      const nombre    = String(row[nombreCol] ?? '').trim();
      const debito    = toNumCL(row[debCol]);
      const credito   = toNumCL(row[credCol]);
      const deudor    = deudorCol   !== null ? toNumCL(row[deudorCol])   : Math.max(0, debito - credito);
      const acreedor  = acreedorCol !== null ? toNumCL(row[acreedorCol]) : Math.max(0, credito - debito);
      const activo    = activoCol   !== null ? toNumCL(row[activoCol])   : 0;
      const pasivo    = pasivoCol   !== null ? toNumCL(row[pasivoCol])   : 0;
      const perdidas  = perdidasCol !== null ? toNumCL(row[perdidasCol]) : 0;
      const ganancias = ganancCol   !== null ? toNumCL(row[ganancCol])   : 0;
      if (debito === 0 && credito === 0 && deudor === 0 && acreedor === 0 &&
          activo === 0 && pasivo === 0 && perdidas === 0 && ganancias === 0) return;
      accounts.push({ cuenta: cta, nombre, debito, credito, deudor, acreedor, activo, pasivo, perdidas, ganancias });
    });

    const totals = accounts.reduce((t, a) => ({
      debito: t.debito + a.debito,     credito: t.credito + a.credito,
      deudor: t.deudor + a.deudor,     acreedor: t.acreedor + a.acreedor,
      activo: t.activo + a.activo,     pasivo: t.pasivo + a.pasivo,
      perdidas: t.perdidas + a.perdidas, ganancias: t.ganancias + a.ganancias,
    }), { debito:0, credito:0, deudor:0, acreedor:0, activo:0, pasivo:0, perdidas:0, ganancias:0 });

    const utilNet = totals.ganancias - totals.perdidas;
    const utilRow = {
      activo: utilNet < 0 ? -utilNet : 0, pasivo: utilNet > 0 ? utilNet : 0,
      perdidas: utilNet > 0 ? utilNet : 0, ganancias: utilNet < 0 ? -utilNet : 0,
    };
    const sumasIguales = {
      debito: totals.debito, credito: totals.credito,
      deudor: totals.deudor, acreedor: totals.acreedor,
      activo: totals.activo + utilRow.activo,       pasivo: totals.pasivo + utilRow.pasivo,
      perdidas: totals.perdidas + utilRow.perdidas, ganancias: totals.ganancias + utilRow.ganancias,
    };
    return { accounts, totals, utilRow, sumasIguales, colsFound, rawFirstRows, filename, rowCount: rows.length - 1 - headerIdx };
  }

  // ── Carga matriz UF (formato SII: filas=días, cols=meses, sep=";", nums chilenos) ──
  function handleUFFile(e) {
    const file = e.target.files[0]; if (!file) return; e.target.value = '';
    setUfUploadMsg(null);

    // Extraer año del nombre del archivo (ej: "UF 2025.csv" → 2025)
    const yearMatch = file.name.match(/\b(20\d{2})\b/);
    const fileYear  = yearMatch ? +yearMatch[1] : null;

    const reader = new FileReader();
    reader.onload = ev => {
      try {
        const isExcel = /\.xlsx?$/i.test(file.name);
        let rows;
        if (isExcel) {
          const wb = XLSX.read(ev.target.result, { type: 'array' });
          rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header: 1, raw: false, defval: '' });
        } else {
          const text = ev.target.result.replace(/^﻿/, '');
          rows = text.split(/\r?\n/).filter(l => l.trim()).map(l => l.split(/[;\t]/));
        }

        const toUF = v => {
          const s = String(v ?? '').trim();
          if (!s) return null;
          const n = s.includes(',')
            ? parseFloat(s.replace(/\./g, '').replace(',', '.'))
            : parseFloat(s);
          return isNaN(n) || n <= 0 ? null : n;
        };

        // Fila 0: Día | Ene | Feb | … | Dic
        const header = (rows[0] || []).map(h => String(h ?? '').trim());
        const monthCols = [];
        header.forEach((h, ci) => {
          const mi = MONTH_ABR.findIndex(m => m.toLowerCase() === h.toLowerCase());
          if (mi !== -1) monthCols.push({ col: ci, month: mi + 1 });
        });

        if (monthCols.length === 0) {
          setUfUploadMsg({ ok: false, text: 'No se encontraron columnas de meses (Ene, Feb…) en la cabecera.' });
          return;
        }

        const year = fileYear || activeYear;
        const daily = {};
        monthCols.forEach(({ month }) => { daily[month] = {}; });

        rows.slice(1).forEach(row => {
          const day = parseInt(String(row[0] ?? '').trim());
          if (!day || day < 1 || day > 31) return;
          monthCols.forEach(({ col, month }) => {
            const val = toUF(row[col]);
            if (val !== null) daily[month][day] = val;
          });
        });

        setUfTable(prev => ({ ...prev, [year]: daily }));

        const daysLoaded = Object.values(daily).reduce((s, m) => s + Object.keys(m).length, 0);
        const note = !fileYear ? ' (año tomado del año activo)' : '';
        setUfUploadMsg({ ok: true, text: `✓ ${daysLoaded} valores diarios UF cargados para ${year}${note}` });
        setTimeout(() => setUfUploadMsg(null), 5000);

      } catch(err) {
        setUfUploadMsg({ ok: false, text: 'Error al procesar archivo: ' + err.message });
      }
    };
    if (/\.xlsx?$/i.test(file.name)) {
      reader.readAsArrayBuffer(file);
    } else {
      reader.readAsText(file, 'UTF-8');
    }
  }

  // ── Filas clasificadas del staging (vista previa) ───────────────────────────
  const allStageRows = useMemo(() => {

  // Pivot: 3 niveles — UN → clasificacion → concepto
  const stagePivot = useMemo(() => {
    if (!managerStage?.byMonth) return null;
    const months = Object.values(managerStage.byMonth)
      .map(bm => ({ year: bm.year, month: bm.month, key: `${bm.year}-${String(bm.month).padStart(2,'0')}` }))
      .sort((a, b) => a.key.localeCompare(b.key));

    const byUN = {};
    allStageRows.forEach(r => {
      const mk = `${r.año}-${String(r.mes).padStart(2,'0')}`;
      // nivel 1: unidad de negocio
      if (!byUN[r.unCode]) byUN[r.unCode] = { unCode: r.unCode, unDesc: r.unDesc, months: {}, byClasif: {} };
      byUN[r.unCode].months[mk] = (byUN[r.unCode].months[mk] || 0) + r.total;
      // nivel 2: clasificación
      const cls = r.clasificacion;
      if (!byUN[r.unCode].byClasif[cls]) byUN[r.unCode].byClasif[cls] = { clasificacion: cls, months: {}, byCta: {} };
      byUN[r.unCode].byClasif[cls].months[mk] = (byUN[r.unCode].byClasif[cls].months[mk] || 0) + r.total;
      // nivel 3: cuenta
      const ctaKey = r.concepto;
      if (!byUN[r.unCode].byClasif[cls].byCta[ctaKey])
        byUN[r.unCode].byClasif[cls].byCta[ctaKey] = { concepto: r.concepto, desc: r.conceptoDesc || '', months: {} };
      byUN[r.unCode].byClasif[cls].byCta[ctaKey].months[mk] =
        (byUN[r.unCode].byClasif[cls].byCta[ctaKey].months[mk] || 0) + r.total;
    });

    const units = Object.values(byUN)
      .sort((a, b) => String(a.unCode).localeCompare(String(b.unCode), undefined, { numeric: true }));
    return { months, units };
  }, [managerStage, allStageRows]);

// ─── GRÁFICO DE CURVAS ────────────────────────────────────────────────────────
function toCumulative(values) {
  let acc = 0;
  return values.map(v => (acc += (+v || 0)));
}

function CurveChart({ series, months, controlIdx = -1, shift = 0, unit = 'UF', title = '' }) {
  const [hovIdx, setHovIdx] = React.useState(null);
  const [hidden, setHidden] = React.useState(() => new Set());
  const N = months.length;
  if (!N || !series.length || !series[0].values.length) return null;

  const toggleSeries = label => setHidden(prev => {
    const next = new Set(prev);
    if (next.has(label)) next.delete(label); else next.add(label);
    return next;
  });
  const visibleSeries = series.filter(s => !hidden.has(s.label));

  const W = 700, H = 340;
  const pad = { t: 12, r: 16, b: 34, l: 54 };
  const cW = W - pad.l - pad.r, cH = H - pad.t - pad.b;

  // Escala sobre TODAS las series (incluso ocultas) para que el eje Y no salte al toggle
  const allVals = series.flatMap(s => s.values).filter(v => isFinite(v) && v >= 0);
  const rawMax = Math.max(...allVals, 0.001);
  const mag = Math.pow(10, Math.floor(Math.log10(rawMax)));
  const niceMax = Math.ceil(rawMax / mag / 2) * 2 * mag;

  const xPos = i => pad.l + (N <= 1 ? cW / 2 : (i / (N - 1)) * cW);
  const yPos = v => pad.t + cH * (1 - Math.max(0, Math.min(1, v / niceMax)));

  const makeLine = vals => vals.map((v, i) =>
    `${i === 0 ? 'M' : 'L'}${xPos(i).toFixed(1)},${yPos(v).toFixed(1)}`).join('');
  const makeArea = vals => [
    `M${xPos(0).toFixed(1)},${(pad.t + cH).toFixed(1)}`,
    ...vals.map((v, i) => `L${xPos(i).toFixed(1)},${yPos(v).toFixed(1)}`),
    `L${xPos(N - 1).toFixed(1)},${(pad.t + cH).toFixed(1)}Z`
  ].join('');

  const fV = v => {
    const a = Math.abs(+v || 0);
    if (a === 0) return '0';
    if (a >= 10000) return `${(v / 1000).toFixed(0)}k`;
    if (a >= 1000)  return `${(v / 1000).toFixed(1)}k`;
    return (+v || 0).toFixed(0);
  };

  const nTicks = 8;
  const skipX = N > 36 ? 6 : N > 24 ? 3 : N > 14 ? 2 : 1;
  const strip = cW / Math.max(N, 1);

  return (
    <div style={{ background: '#f8fafc', borderRadius: 10, border: '1px solid #e2e8f0', padding: '10px 4px 6px', marginTop: 12 }}>
      {title && (
        <div style={{ fontSize: 10, fontWeight: 700, color: '#475569', letterSpacing: '0.05em', textTransform: 'uppercase', paddingLeft: pad.l, marginBottom: 4 }}>
          {title}
        </div>
      )}
      <div style={{ display: 'flex', alignItems: 'center', flexWrap: 'wrap', gap: 12, marginBottom: 6, paddingLeft: pad.l, paddingRight: pad.r }}>
        <div style={{ display: 'flex', gap: 14, flexWrap: 'wrap' }}>
          {series.map(s => {
            const isHidden = hidden.has(s.label);
            return (
              <div key={s.label} onClick={() => toggleSeries(s.label)}
                title={isHidden ? 'Clic para mostrar' : 'Clic para ocultar'}
                style={{ display: 'flex', alignItems: 'center', gap: 5, fontSize: 10,
                  color: isHidden ? '#94a3b8' : '#64748b', cursor: 'pointer',
                  userSelect: 'none', opacity: isHidden ? 0.4 : 1,
                  textDecoration: isHidden ? 'line-through' : 'none',
                  transition: 'opacity 0.15s' }}>
                <svg width="22" height="8">
                  <line x1="0" y1="4" x2="22" y2="4"
                    stroke={isHidden ? '#cbd5e1' : s.color} strokeWidth="2.2"
                    strokeDasharray={s.dashed ? '5,2.5' : undefined} />
                  <circle cx="11" cy="4" r="2.5" fill={isHidden ? '#cbd5e1' : s.color} />
                </svg>
                {s.label}
              </div>
            );
          })}
        </div>
        {shift !== 0 && (
          <span style={{ fontSize: 10, color: shift > 0 ? '#d97706' : '#6366f1', fontWeight: 600 }}>
            {shift > 0 ? `▲ +${shift}%` : `▼ ${shift}%`} ritmo curva
          </span>
        )}
        <span style={{ fontSize: 9, color: '#cbd5e1', marginLeft: 'auto' }}>{unit}</span>
      </div>
      <svg viewBox={`0 0 ${W} ${H}`} style={{ width: '100%', maxHeight: H, display: 'block', cursor: 'crosshair' }}
        onMouseLeave={() => setHovIdx(null)}>
        {/* Y grid */}
        {Array.from({ length: nTicks + 1 }, (_, i) => {
          const v = niceMax * i / nTicks;
          const y = yPos(v);
          return (
            <g key={i}>
              <line x1={pad.l} y1={y} x2={W - pad.r} y2={y}
                stroke={i === 0 ? '#94a3b8' : '#e2e8f0'} strokeWidth={i === 0 ? 0.8 : 0.5} />
              <text x={pad.l - 4} y={y + 3} textAnchor="end" fontSize="8" fill="#94a3b8">{fV(v)}</text>
            </g>
          );
        })}
        {/* Shaded past region */}
        {controlIdx >= 0 && controlIdx < N && (
          <rect x={pad.l} y={pad.t}
            width={xPos(controlIdx) - pad.l + strip / 2}
            height={cH} fill="#e2e8f0" fillOpacity="0.55" />
        )}
        {/* Areas — solo series visibles */}
        {visibleSeries.map(s => (
          <path key={`a-${s.label}`} d={makeArea(s.values)} fill={s.color} fillOpacity="0.09" />
        ))}
        {/* Lines — solo series visibles */}
        {visibleSeries.map(s => (
          <path key={`l-${s.label}`} d={makeLine(s.values)} fill="none"
            stroke={s.color} strokeWidth="1.9" strokeLinejoin="round"
            strokeDasharray={s.dashed ? '7,3.5' : undefined} />
        ))}
        {/* Control month marker */}
        {controlIdx >= 0 && controlIdx < N && (
          <line x1={xPos(controlIdx)} y1={pad.t} x2={xPos(controlIdx)} y2={pad.t + cH}
            stroke="#64748b" strokeWidth="1" strokeDasharray="3,2" />
        )}
        {/* X axis */}
        <line x1={pad.l} y1={pad.t + cH} x2={W - pad.r} y2={pad.t + cH} stroke="#cbd5e1" strokeWidth="0.8" />
        {/* X labels */}
        {months.map((lbl, i) => {
          if (i % skipX !== 0 && i !== N - 1) return null;
          return <text key={i} x={xPos(i)} y={pad.t + cH + 11} textAnchor="middle" fontSize="7.5" fill="#94a3b8">{lbl}</text>;
        })}
        {/* Hover strips */}
        {Array.from({ length: N }, (_, i) => (
          <rect key={i} x={xPos(i) - strip / 2} y={pad.t} width={strip} height={cH}
            fill="transparent" onMouseEnter={() => setHovIdx(i)} />
        ))}
        {/* Hover overlay — solo series visibles */}
        {hovIdx !== null && hovIdx < N && visibleSeries.length > 0 && (() => {
          const hx = xPos(hovIdx);
          const bW = 90, bH = 14 + visibleSeries.length * 13;
          const bX = hx > W * 0.68 ? hx - bW - 8 : hx + 8;
          const bY = Math.max(pad.t + 2, pad.t + cH / 2 - bH / 2);
          return (
            <g>
              <line x1={hx} y1={pad.t} x2={hx} y2={pad.t + cH} stroke="#64748b" strokeWidth="0.8" />
              {visibleSeries.map(s => (
                <circle key={s.label} cx={hx} cy={yPos(s.values[hovIdx] ?? 0)}
                  r="3.5" fill={s.color} stroke="white" strokeWidth="1.5" />
              ))}
              <rect x={bX} y={bY} width={bW} height={bH} rx="4"
                fill="white" stroke="#e2e8f0" strokeWidth="1"
                style={{ filter: 'drop-shadow(0 1px 4px rgba(0,0,0,0.12))' }} />
              <text x={bX + 6} y={bY + 11} fontSize="8" fill="#475569" fontWeight="600">{months[hovIdx]}</text>
              {visibleSeries.map((s, si) => (
                <text key={s.label} x={bX + 6} y={bY + 23 + si * 13} fontSize="8" fill={s.color}>
                  {s.label.slice(0, 5)}: {fV(s.values[hovIdx] ?? 0)}{unit}
                </text>
              ))}
            </g>
          );
        })()}
      </svg>
    </div>
  );
}

// ─── SISTEMA DE CIERRE MENSUAL ────────────────────────────────────────────────

const cierreKey       = (yr, mes) => `budget-control:cierre:${yr}:${String(mes).padStart(2,'0')}`;
const listaCierresKey = yr        => `budget-control:lista-cierres:${yr}`;
const ultimoCierreKey = yr        => `budget-control:ultimo-cierre:${yr}`;

function getCierresList(year) {
  try { return storage.get(listaCierresKey(year)) || []; } catch { return []; }
}

// Lee el snapshot de un cierre y devuelve el sub-objeto del módulo indicado
function getCierreModulo(year, mes, modulo) {
  try {
    const snap = storage.get(cierreKey(year, mes));
    return snap?.modulos?.[modulo] || null;
  } catch { return null; }
}

// ── Selector de período: Actual + meses cerrados ──────────────────────────────
function PeriodSelectorBar({ year, periodoVisto, onChange }) {
  const lista = useMemo(() => getCierresList(year), [year, periodoVisto]);
  if (!lista.length && periodoVisto === 'actual') return null;
  return (
    <div className="flex flex-wrap items-center gap-2 mb-3">
      <span className="text-[10px] text-gray-400 font-bold uppercase tracking-wide whitespace-nowrap">Ver período:</span>
      <div className="flex flex-wrap gap-1.5">

// ── Serializadores de snapshot por módulo ────────────────────────────────────
// PATRÓN (Fase 3 — snapshots fantasma): cada módulo de SOLO-CÁLCULO (sin estado
// vivo persistido propio) expone un serializador puro que captura EXACTAMENTE lo
// que renderiza hoy. El módulo persiste ese objeto de forma continua en su clave
// `budget-control:{modulo}-snapshot:{year}` vía un useEffect (igual que
// Proyecciones persiste proj-snapshot). Al cerrar el mes, buildGlobalSnapshot
// copia esa clave a `modulos.{modulo}` del cierre, congelándola. El módulo lee el
// congelado con getCierreModulo(year, mes, modulo) cuando el período visto no es
// 'actual'. Replicar este mismo trío (serializar → persistir vivo → leer del
// cierre) para scenarios/check/scorecard/obras.
//
// Dashboard: congela KPIs, datos de gráficos, análisis EBITDA, resumen,
// cronograma y el controlMonth del cierre. controlMonth se guarda explícito para
// que la vista de lectura muestre el mes de corte de ESE cierre, no el actual.
function buildDashboardSnapshot({ year, controlMonth, kpis, chartData, summaryRows, ebitdaAnalysis, projectTimeline }) {
  return {
    year,
    controlMonth,
    kpis,
    chartData,
    summaryRows,
    ebitdaAnalysis,
    projectTimeline,
    ts: Date.now(),
  };
}

// Escenarios: congela la tabla de escenarios EXACTAMENTE como se renderiza (cada
// fila ya trae label + métricas calculadas por computeScenario), el controlMonth
// del momento y el set de proyectos activos (ids/nombres) que entraron al cálculo.
// La vista de lectura sólo necesita `scenarios` y `controlMonth`; activeProjects
// se guarda para trazabilidad de qué portafolio se evaluó.
function buildScenariosSnapshot({ year, controlMonth, scenarios, activeProjects }) {
  return {
    year,
    controlMonth,
    scenarios,
    activeProjects: (activeProjects || []).map(p => ({ id: p.id, name: p.name, unCode: p.unCode })),
    ts: Date.now(),
  };
}

// Check Contable: congela las dos tablas (gestión vs contabilidad) tal cual se
// muestran. clsRows/balRows ya vienen filtradas y con labels; los escalares del
// banner de cuadratura (totalManagement, balPerdidasUF, balGananciasUF, diff,
// cuadra) y balanceMeta (filename/rowCount/UF) se congelan derivados. La lógica
// de exclusión de Costos de Venta y la conversión CLP→UF NO se tocan: el snapshot
// sólo fotografía el resultado ya calculado por los useMemo vivos.
function buildCheckSnapshot({ year, controlMonth, clsRows, balRows, totalManagement, balPerdidasUF, balGananciasUF, balanceUF, diff, cuadra, balanceMeta }) {
  return {
    year,
    controlMonth,
    clsRows,
    balRows,
    totalManagement,
    balPerdidasUF,
    balGananciasUF,
    balanceUF,
    diff,
    cuadra,
    balanceMeta,
    ts: Date.now(),
  };
}

// Scorecard: congela, por proyecto activo, el objeto `scorecard` completo (los 6
// indicadores con score + KPIs) tal como buildScorecard lo arma hoy. El Económico
// y el Plazo se calculan de fuentes vivas (Proyecciones / curvas S), de modo que
// sin snapshot la vista de período cerrado mostraría datos vivos: por eso se
// fotografía aquí el resultado por proyecto. La selección de tab/proyecto se
// resuelve en la vista a partir de byProject[id].
function buildScorecardSnapshot({ year, byProject, activeProjects }) {
  return {
    year,
    byProject,
    activeProjects: (activeProjects || []).map(p => ({ id: p.id, name: p.name, unCode: p.unCode, status: p.status, contractType: p.contractType })),
    ts: Date.now(),
  };
}

// ── buildGlobalSnapshot: captura el estado completo de todos los módulos ──────
function buildGlobalSnapshot(year, controlMonth) {
  return {
    year,
    mes: controlMonth,
    mesLabel: `${MONTH_ABR[controlMonth-1]} ${year}`,
    fechaCierre: Date.now(),
    modulos: {
      projection: storage.get(`budget-control:proj-snapshot:${year}`)        || null,
      cashflow:   storage.get(`budget-control:cashflow:${year}`)              || null,
      check:      storage.get(`budget-control:check-snapshot:${year}`)        || null,
      scenarios:  storage.get(`budget-control:scenarios-snapshot:${year}`)    || null,
      dashboard:  storage.get(`budget-control:dashboard-snapshot:${year}`)    || null,
      scorecard:  storage.get(`budget-control:scorecard-snapshot:${year}`)    || null,
      // report se completa desde el llamador (tiene acceso a los datos calculados)
    }
  };
}

// ─── PROYECCIÓN EDITABLE ──────────────────────────────────────────────────────

function ProjectionModule({ projects, activeYear }) {
  const year = activeYear;
  const fNum = n => (+n || 0).toLocaleString('es-CL', { minimumFractionDigits: 2, maximumFractionDigits: 2 });

  const activeProjects = useMemo(() =>
    projects.filter(p => p.startDate && p.endDate), [projects]);

  // Tab: 'resumen' | project id | 'oc' | 'ingresos'
  const [selTab, setSelTab] = useState('resumen');
  const [editKey, setEditKey] = useState(null);
  const [editValue, setEditValue] = useState('');
  const [refreshKey, setRefreshKey] = useState(0);

  const [overrides, setOverrides] = useState(() => {
    try { return storage.get(`budget-control:overrides:${year}`) || {}; } catch { return {}; }
  });

  const [projCompletion, setProjCompletion] = useState(() => {
    try { return storage.get(`budget-control:proj-completion:${year}`) || {}; } catch { return {}; }
  });

  const [pcEditKey, setPcEditKey] = useState(null);
  const [pcEditVal, setPcEditVal] = useState('');
  const [expandedYears, setExpandedYears] = useState({});
  const toggleYear = fy => setExpandedYears(prev => ({ ...prev, [fy]: !prev[fy] }));
  const ocUploadRef = React.useRef(null);

  // ── Período visualizado (cierre mensual) ────────────────────────────────────
  const [periodoVistoPM, setPeriodoVistoPM] = useState('actual');
  React.useEffect(() => { setPeriodoVistoPM('actual'); }, [activeYear]);

  // ── Informes Guardados ───────────────────────────────────────────────────────
  const [savedReportsPM, setSavedReportsPM] = useState(() => {
    try { return storage.get(`budget-control:saved-reports:${activeYear}`) || []; } catch { return []; }
  });
  const [compareReportPM, setCompareReportPM] = useState(null);

  // Todos los años que abarcan los proyectos activos
  const allProjectYears = useMemo(() => {
    const ys = new Set();
    activeProjects.forEach(p => {
      const sy = parseInt((p.startDate || '').slice(0, 4));
      const ey = parseInt((p.endDate   || '').slice(0, 4));
      if (sy && ey) for (let y = sy; y <= ey; y++) ys.add(y);
    });
    return [...ys].sort((a, b) => a - b);
  }, [activeProjects]);

  React.useEffect(() => {
    let ov;
    try { ov = storage.get(`budget-control:overrides:${year}`) || {}; } catch { ov = {}; }
    // Anticipos: NO se siembran valores demo. overrides.anticipos arranca vacío y se puebla
    // únicamente con lo que el usuario ingrese manualmente (que ya quedó persistido en storage).
    // Se respeta cualquier anticipo editado previamente porque solo se lee, no se sobreescribe.
    setOverrides(ov);
    try { setProjCompletion(storage.get(`budget-control:proj-completion:${year}`) || {}); } catch { setProjCompletion({}); }
    try { setSavedReportsPM(storage.get(`budget-control:saved-reports:${year}`) || []); } catch { setSavedReportsPM([]); }
    setEditKey(null);
    setPcEditKey(null);
    setCompareReportPM(null);
  }, [year]);

  // Recargar lista de informes guardados cuando cambia refreshKey
  React.useEffect(() => {
    try { setSavedReportsPM(storage.get(`budget-control:saved-reports:${year}`) || []); } catch {}
  }, [year, refreshKey]);

  // Last month with loaded actuals
  const controlMonth = useMemo(() => {
    for (let m = 12; m >= 1; m--) {
      try {
        const d = storage.get(`budget-control:actuals:${year}:${String(m).padStart(2, '0')}`);
        if (d?.rows?.length > 0) return m;
      } catch {}
    }
    return 0;
  }, [year, refreshKey]);

  // All actuals for the year indexed by month
  const actualsForYear = useMemo(() => {
    const r = {};
    for (let m = 1; m <= 12; m++) {
      try {
        const d = storage.get(`budget-control:actuals:${year}:${String(m).padStart(2, '0')}`);
        if (d?.rows) r[m] = d.rows;
      } catch {}
    }
    return r;
  }, [year, refreshKey]);

  // Presupuesto OC por categoría y mes: { [catId]: [v_ene, v_feb, ...v_dic] }
  const ocBudgetByCat = useMemo(() => {
    try {
      const saved = storage.get(`budget-control:budget:${year}`);
      return saved?.oficinaCentral || {};
    } catch { return {}; }
  }, [year]);

  // Mayor EMM — datos de ingresos (estructura: { byUN: { UN01: { byAccount: { '5-2-01-002': { byMonthUF, byMonthCLP } } } } })
  const mayorData = useMemo(() => {
    try {
      const d = storage.get('budget-control:mayor:latest');
      return (d?.ingresos?.byUN && d?.ingresos?.totalCLP != null) ? d.ingresos : null;
    } catch { return null; }
  }, [refreshKey]);

  // ── helpers ──────────────────────────────────────────────────────────────────

  function getReal(unCode, cat, month) {
    return (actualsForYear[month] || [])
      .filter(r => r.unCode === unCode && r.clasificacion === cat)
      .reduce((s, r) => s + r.total, 0);
  }

  function getOCReal(concepto, month) {
    return (actualsForYear[month] || [])
      .filter(r => r.clasificacion === 'oficina_central' && r.concepto === concepto)
      .reduce((s, r) => s + r.total, 0);
  }

  // ── Ingresos en UF desde Mayor EMM ───────────────────────────────────────────
  const INTERES_CTA = '5-2-01-002';

  // Ingresos totales en UF de una UN para un mes (todas las cuentas). fy = año fiscal (por defecto el año activo)
  const getMayorRealUF = (unCode, m, fy = year) => {
    if (!mayorData?.byUN?.[unCode]) return null;
    const mk = `${fy}-${String(m).padStart(2,'0')}`;
    return Object.values(mayorData.byUN[unCode].byAccount)
      .reduce((s, acc) => s + (acc.byMonthUF?.[mk] || 0), 0);
  };

  // Ingresos UN01 en UF excluyendo intereses (→ Otros Ingresos / Asesorías)
  const getMayorAsesoriasUF = m => {
    if (!mayorData?.byUN?.UN01) return null;
    const mk = `${year}-${String(m).padStart(2,'0')}`;
    return Object.entries(mayorData.byUN.UN01.byAccount)
      .filter(([cta]) => cta !== INTERES_CTA)
      .reduce((s, [, acc]) => s + (acc.byMonthUF?.[mk] || 0), 0);
  };

  // Intereses ganados: cuenta 5-2-01-002 de UN01, en UF
  const getMayorInteresUF = m => {
    const acc = mayorData?.byUN?.UN01?.byAccount?.[INTERES_CTA];
    if (!acc) return null;
    const mk = `${year}-${String(m).padStart(2,'0')}`;
    return acc.byMonthUF?.[mk] ?? 0;
  };

  // Devuelve el proyecto con startDate/endDate/durationMonths ajustados según proyección a término
  function getEffectiveProject(project) {
    const sched = projCompletion?.[project.id];
    if (!sched?.realStart && !sched?.projEnd) return project;
    const effStart = sched.realStart || project.startDate;
    const effEnd   = sched.projEnd   || project.endDate;
    const n = monthsBetween(effStart, effEnd);
    if (n <= 0) return project;
    return { ...project, startDate: effStart, endDate: effEnd, durationMonths: n };
  }

  function saveProjCompletion(path, value) {
    setProjCompletion(prev => {
      const next = JSON.parse(JSON.stringify(prev));
      let cur = next;
      path.slice(0, -1).forEach(k => { if (!cur[k]) cur[k] = {}; cur = cur[k]; });
      cur[path[path.length - 1]] = value;
      try { storage.set(`budget-control:proj-completion:${year}`, next); } catch {}
      return next;
    });
    setPcEditKey(null);
  }

  // Projection cells: { 1..12 → { v, s } }  s = 'real'|'projected'|'override'
  function buildCells(project, cat) {
    const ov = overrides?.[project.id]?.[cat] || {};
    const effProject = getEffectiveProject(project);
    const [endYear, endMonth] = (effProject.endDate || `${year}-12`).split('-').map(Number);
    const N_new = Math.max(1, monthsBetween(effProject.startDate, effProject.endDate));
    const scaledCurve = reescalarCurva(project.costCurve || [], N_new);

    let sumReal = 0;
    for (let m = 1; m <= controlMonth; m++) sumReal += getReal(project.unCode, cat, m);
    let sumFutureOv = 0;
    for (let m = controlMonth + 1; m <= 12; m++) {
      if (ov[m] !== undefined) sumFutureOv += +ov[m];
    }
    const projTotal = projCompletion?.[project.id]?.cats?.[cat] != null
      ? +projCompletion[project.id].cats[cat]
      : (+project.budgetByCategory?.[cat] || 0);
    const saldo = Math.max(0, projTotal - sumReal - sumFutureOv);

    // Enumerar TODOS los meses futuros del proyecto (multi-año) para normalizar la curva
    const futureMths = [];
    for (let fy = year; fy <= endYear; fy++) {
      const sm = fy === year ? controlMonth + 1 : 1;
      const em = fy === endYear ? endMonth : 12;
      for (let m = sm; m <= em; m++) {
        if (fy === year && ov[m] !== undefined) continue;
        const idx = projectMonthIdx(effProject, fy, m - 1);
        const w = (idx >= 0 && idx < scaledCurve.length) ? scaledCurve[idx] : 0;
        futureMths.push({ fy, m, w });
      }
    }
    const totalW = futureMths.reduce((s, x) => s + x.w, 0);

    const cells = {};
    for (let m = 1; m <= 12; m++) {
      if (m <= controlMonth) {
        cells[m] = { v: getReal(project.unCode, cat, m), s: 'real' };
      } else if (ov[m] !== undefined) {
        cells[m] = { v: +ov[m], s: 'override' };
      } else {
        const fm = futureMths.find(x => x.fy === year && x.m === m);
        const proj = fm ? (totalW > 0 ? saldo * fm.w / totalW : 0) : 0;
        cells[m] = { v: proj, s: 'projected' };
      }
    }
    return cells;
  }

  function buildMultiYearCells(project, cat) {
    const ov = overrides?.[project.id]?.[cat] || {};
    const effProject = getEffectiveProject(project);
    const [startYear] = (effProject.startDate || `${year}-01`).split('-').map(Number);
    const [endYear, endMonth] = (effProject.endDate || `${year}-12`).split('-').map(Number);
    const firstYear = Math.min(startYear, year);
    const N_new = Math.max(1, monthsBetween(effProject.startDate, effProject.endDate));
    const costoShift = projCompletion?.[project.id]?.curvaShift?.costos || 0;
    const scaledCurve = applyShift(reescalarCurva(project.costCurve || [], N_new), costoShift);

    // Actuals de años anteriores al año activo, leídos directo desde storage
    const priorActuals = {};
    for (let fy = firstYear; fy < year; fy++) {
      priorActuals[fy] = {};
      for (let m = 1; m <= 12; m++) {
        try {
          const d = storage.get(`budget-control:actuals:${fy}:${String(m).padStart(2,'0')}`);
          priorActuals[fy][m] = (d?.rows || [])
            .filter(r => r.unCode === project.unCode && r.clasificacion === cat)
            .reduce((s, r) => s + r.total, 0);
        } catch { priorActuals[fy][m] = 0; }
      }
    }

    // sumReal incluye todos los años pasados completos + meses reales del año activo
    let sumReal = 0;
    for (let fy = firstYear; fy < year; fy++) {
      for (let m = 1; m <= 12; m++) sumReal += priorActuals[fy][m] || 0;
    }
    for (let m = 1; m <= controlMonth; m++) sumReal += getReal(project.unCode, cat, m);

    let sumFutureOv = 0;
    for (let m = controlMonth + 1; m <= 12; m++) {
      if (ov[m] !== undefined) sumFutureOv += +ov[m];
    }
    const projTotal = projCompletion?.[project.id]?.cats?.[cat] != null
      ? +projCompletion[project.id].cats[cat]
      : (+project.budgetByCategory?.[cat] || 0);
    const saldo = Math.max(0, projTotal - sumReal - sumFutureOv);

    const futureMths = [];
    for (let fy = year; fy <= endYear; fy++) {
      const sm = fy === year ? controlMonth + 1 : 1;
      const em = fy === endYear ? endMonth : 12;
      for (let m = sm; m <= em; m++) {
        if (fy === year && ov[m] !== undefined) continue;
        const idx = projectMonthIdx(effProject, fy, m - 1);
        const w = (idx >= 0 && idx < scaledCurve.length) ? scaledCurve[idx] : 0;
        futureMths.push({ fy, m, w });
      }
    }
    const totalW = futureMths.reduce((s, x) => s + x.w, 0);

    const result = {};

    // Años anteriores al activo: todos reales, solo lectura
    for (let fy = firstYear; fy < year; fy++) {
      result[fy] = {};
      for (let m = 1; m <= 12; m++) {
        const inProj = projectMonthIdx(effProject, fy, m - 1) !== -1;
        result[fy][m] = inProj
          ? { v: priorActuals[fy][m] || 0, s: 'real' }
          : { v: 0, s: 'outside' };
      }
    }

    // Año activo
    result[year] = {};
    for (let m = 1; m <= 12; m++) {
      // Histórico (≤ corte): el costo REAL del Reporte Manager manda siempre, aunque
      // las fechas del proyecto digan "fuera" (una obra puede gastar antes de su
      // fecha de inicio planificada — ej. Olá mano de obra abr = 60,55).
      if (m <= controlMonth) {
        result[year][m] = { v: getReal(project.unCode, cat, m), s: 'real' };
        continue;
      }
      const inProj = projectMonthIdx(effProject, year, m - 1) !== -1;
      if (!inProj) { result[year][m] = { v: 0, s: 'outside' }; continue; }
      if (ov[m] !== undefined) {
        result[year][m] = { v: +ov[m], s: 'override' };
      } else {
        const fm = futureMths.find(x => x.fy === year && x.m === m);
        result[year][m] = { v: fm ? (totalW > 0 ? saldo * fm.w / totalW : 0) : 0, s: 'projected' };
      }
    }

    // Años futuros
    for (let fy = year + 1; fy <= endYear; fy++) {
      result[fy] = {};
      const em = fy === endYear ? endMonth : 12;
      for (let m = 1; m <= em; m++) {
        const inProj = projectMonthIdx(effProject, fy, m - 1) !== -1;
        if (!inProj) { result[fy][m] = { v: 0, s: 'outside' }; continue; }
        const fm = futureMths.find(x => x.fy === fy && x.m === m);
        result[fy][m] = { v: fm ? (totalW > 0 ? saldo * fm.w / totalW : 0) : 0, s: 'future' };
      }
    }

    return { byYear: result, projTotal, firstYear, endYear, endMonth };
  }

  function buildOCCells(concepto, catId) {
    const ovKey = concepto || catId;
    const ov = overrides?.oc?.[ovKey] || {};
    const cells = {};
    for (let m = 1; m <= 12; m++) {
      if (m <= controlMonth) {
        cells[m] = { v: concepto ? getOCReal(concepto, m) : 0, s: 'real' };
      } else if (ov[m] !== undefined) {
        cells[m] = { v: +ov[m], s: 'override' };
      } else {
        // Meses futuros: valor del presupuesto de esa categoría OC
        cells[m] = { v: ocBudgetByCat[catId]?.[m - 1] || 0, s: 'projected' };
      }
    }
    return cells;
  }

  function buildMultiYearIngresosCells(project) {
    const ov = overrides?.ingresos?.[project.id] || {};
    const effProject = getEffectiveProject(project);
    const [startYear] = (effProject.startDate || `${year}-01`).split('-').map(Number);
    const [endYear, endMonth] = (effProject.endDate || `${year}-12`).split('-').map(Number);
    const firstYear = Math.min(startYear, year);
    const N_new = Math.max(1, monthsBetween(effProject.startDate, effProject.endDate));

    // Curva de ingresos escalada al nuevo plazo (con ajuste de ritmo si hay shift)
    const baseCurve = project.contractType === 'suma_alzada'
      ? (project.revenueCurve || project.costCurve || [])
      : (project.costCurve || []);
    const ingShift = projCompletion?.[project.id]?.curvaShift?.ingresos || 0;
    const scaledCurve = applyShift(reescalarCurva(baseCurve, N_new), ingShift);

    // Total proyectado a término: idéntico a "Total Contrato Vigente" de Proyecciones a Término
    const extra       = +projCompletion?.[project.id]?.extraWorks || 0;
    const tvOverride  = projCompletion?.[project.id]?.overrideContract?.totalContratoVentas;
    let projTotal;
    if (tvOverride != null) {
      // Override manual (proyecto reemplazo o admin_delegada con proyección ajustada)
      projTotal = +tvOverride + extra;
    } else if (project.contractType === 'suma_alzada') {
      projTotal = (+project.contract.originalAmount || 0) + extra;
    } else {
      projTotal = (+project.contract.totalBudgetedCost || 0)
        + ((+project.contract.monthlyFee || 0) + (+project.contract.monthlyGG || 0)) * N_new
        + extra;
    }

    // Monto base para distribuir en curva (sin obras extraordinarias, que se facturan aparte)
    const curveBase = tvOverride != null
      ? +tvOverride
      : project.contractType === 'suma_alzada'
        ? (+project.contract.originalAmount || 0)
        : null; // admin_delegada usa cálculo mensual directo

    // Helper para calcular ingreso auto de un mes basado en curva original
    const autoFromOrigCurve = (effP, fy, m) => {
      const idx = projectMonthIdx(effP, fy, m - 1);
      if (idx === -1) return 0;
      if (project.contractType === 'suma_alzada') {
        return (curveBase ?? (+project.contract.originalAmount || 0)) * (project.revenueCurve?.[idx] || 0) / 100;
      }
      return (+project.contract.totalBudgetedCost || 0) * (project.costCurve?.[idx] || 0) / 100
        + (+project.contract.monthlyFee || 0) + (+project.contract.monthlyGG || 0);
    };

    // Ingreso real en UF del Mayor para este proyecto (UN = 'UN02', 'UN03', etc.)
    const proyUN = `UN${project.unCode.padStart(2, '0')}`;
    // fy opcional: permite leer datos del Mayor de años anteriores
    const getProyMayorUF = (m, fy = year) => getMayorRealUF(proyUN, m, fy);

    // Años anteriores: Mayor EMM en UF si existe, curva original como fallback
    const priorActuals = {};
    for (let fy = firstYear; fy < year; fy++) {
      priorActuals[fy] = {};
      for (let m = 1; m <= 12; m++) {
        const inProj = projectMonthIdx(effProject, fy, m - 1) !== -1;
        if (inProj) {
          const mayorUF = getProyMayorUF(m, fy);
          priorActuals[fy][m] = mayorUF !== null ? mayorUF : autoFromOrigCurve(effProject, fy, m);
        } else {
          priorActuals[fy][m] = 0;
        }
      }
    }

    // sumReal: años anteriores completos + meses pasados del año activo
    let sumReal = 0;
    for (let fy = firstYear; fy < year; fy++) {
      for (let m = 1; m <= 12; m++) sumReal += priorActuals[fy][m] || 0;
    }
    for (let m = 1; m <= controlMonth; m++) {
      const curOv = ov[m];
      if (curOv !== undefined) {
        sumReal += +curOv;
      } else {
        const mayorUF = getProyMayorUF(m);
        sumReal += mayorUF !== null ? mayorUF : autoFromOrigCurve(effProject, year, m);
      }
    }

    let sumFutOv = 0;
    for (let m = controlMonth + 1; m <= 12; m++) {
      if (ov[m] !== undefined) sumFutOv += +ov[m];
    }
    const saldo = Math.max(0, projTotal - sumReal - sumFutOv);

    // Meses futuros para normalización (multi-año)
    const futureMths = [];
    for (let fy = year; fy <= endYear; fy++) {
      const sm = fy === year ? controlMonth + 1 : 1;
      const em = fy === endYear ? endMonth : 12;
      for (let m = sm; m <= em; m++) {
        if (fy === year && ov[m] !== undefined) continue;
        const idx = projectMonthIdx(effProject, fy, m - 1);
        const w = (idx >= 0 && idx < scaledCurve.length) ? scaledCurve[idx] : 0;
        futureMths.push({ fy, m, w });
      }
    }
    const totalW = futureMths.reduce((s, x) => s + x.w, 0);

    const result = {};

    // Años anteriores (solo lectura)
    for (let fy = firstYear; fy < year; fy++) {
      result[fy] = {};
      for (let m = 1; m <= 12; m++) {
        const inProj = projectMonthIdx(effProject, fy, m - 1) !== -1;
        result[fy][m] = inProj ? { v: priorActuals[fy][m] || 0, s: 'real' } : { v: 0, s: 'outside' };
      }
    }

    // Año activo
    result[year] = {};
    for (let m = 1; m <= 12; m++) {
      // Histórico (≤ corte): el ingreso real del Mayor manda siempre (si lo hay),
      // aunque las fechas del proyecto digan "fuera".
      if (m <= controlMonth) {
        if (ov[m] !== undefined) {
          result[year][m] = { v: +ov[m], s: 'override' };
        } else {
          const mayorUF = getProyMayorUF(m);
          const v = mayorUF !== null ? mayorUF : autoFromOrigCurve(effProject, year, m);
          result[year][m] = { v, s: 'real' };
        }
        continue;
      }
      const inProj = projectMonthIdx(effProject, year, m - 1) !== -1;
      if (!inProj) { result[year][m] = { v: 0, s: 'outside' }; continue; }
      if (ov[m] !== undefined) {
        result[year][m] = { v: +ov[m], s: 'override' };
      } else {
        const fm = futureMths.find(x => x.fy === year && x.m === m);
        result[year][m] = { v: fm ? (totalW > 0 ? saldo * fm.w / totalW : 0) : 0, s: 'projected' };
      }
    }

    // Años futuros
    for (let fy = year + 1; fy <= endYear; fy++) {
      result[fy] = {};
      const em = fy === endYear ? endMonth : 12;
      for (let m = 1; m <= em; m++) {
        const inProj = projectMonthIdx(effProject, fy, m - 1) !== -1;
        if (!inProj) { result[fy][m] = { v: 0, s: 'outside' }; continue; }
        const fm = futureMths.find(x => x.fy === fy && x.m === m);
        result[fy][m] = { v: fm ? (totalW > 0 ? saldo * fm.w / totalW : 0) : 0, s: 'future' };
      }
    }

    return { byYear: result, projTotal, firstYear, endYear, endMonth };
  }

  // ── override persistence ──────────────────────────────────────────────────────

  function saveOv(path, value) {
    setOverrides(prev => {
      const next = JSON.parse(JSON.stringify(prev));
      let cur = next;
      path.slice(0, -1).forEach(k => { if (!cur[k]) cur[k] = {}; cur = cur[k]; });
      cur[path[path.length - 1]] = value;
      try {
        if (!storage.set(`budget-control:overrides:${year}`, next)) {
          reportCriticalSaveFailure(`proyección/override de ${year}`);
          return prev; // no avanzar el estado si no se persistió
        }
      } catch { reportCriticalSaveFailure(`proyección/override de ${year}`); return prev; }
      return next;
    });
    setEditKey(null);
  }

  function clearOv(path) {
    setOverrides(prev => {
      const next = JSON.parse(JSON.stringify(prev));
      let cur = next;
      let ok = true;
      for (const k of path.slice(0, -1)) { if (!cur[k]) { ok = false; break; } cur = cur[k]; }
      if (ok) delete cur[path[path.length - 1]];
      try { storage.set(`budget-control:overrides:${year}`, next); } catch {}
      return next;
    });
  }

  function renderCell(cell, ck, ovPath) {

          {v !== 0 ? fNum(v) : <span className="text-gray-300">—</span>}
        </td>
      );
    }
    if (editKey === ck) {
      const parseOv = val => parseFloat(String(val).replace(/\./g, '').replace(',', '.')) || 0;
      return (
        <td key={ck} className="p-0 border-r border-amber-300" style={{minWidth:70}}>
          <input autoFocus
            className="w-full h-full px-2 py-1.5 text-xs text-right bg-amber-100 border-2 border-amber-400 focus:outline-none"
            value={editValue}
            onChange={e => setEditValue(e.target.value)}
            onFocus={e => e.target.select()}
            onBlur={() => saveOv(ovPath, parseOv(editValue))}
            onKeyDown={e => {
              if (e.key === 'Enter') saveOv(ovPath, parseOv(editValue));
              if (e.key === 'Escape') setEditKey(null);
            }}
          />
        </td>
      );
    }
    const bg = s === 'override' ? 'bg-amber-50' : 'bg-white';
    return (
      <td key={ck}
        className={`px-2 py-1.5 text-right text-xs ${bg} cursor-pointer hover:bg-amber-50 transition-colors group border-r border-gray-50`}
        style={{minWidth:70}}
        onClick={() => { setEditValue(v !== 0 ? String(v).replace('.', ',') : ''); setEditKey(ck); }}
      >
        <div className="flex items-center justify-end gap-0.5">
          {s === 'override' && (
            <button onClick={e => { e.stopPropagation(); clearOv(ovPath); }}
              className="text-[9px] text-amber-500 hover:text-amber-700 opacity-0 group-hover:opacity-100 leading-none"
              title="Restaurar calculado">↺</button>
          )}
          <span className={v === 0 ? 'text-gray-300' : 'text-gray-800'}>
            {v !== 0 ? fNum(v) : '—'}
          </span>
        </div>
      </td>
    );
  }

  const TH_MONTHS = MONTH_ABR.map((m, i) => (

                    <input type="range" min="-20" max="20" step="0.5" value={costoShiftCur} readOnly

                      className="w-32 h-1 accent-indigo-400 cursor-pointer" />

                      className="w-5 h-5 flex items-center justify-center rounded bg-white/10 text-gray-300 hover:bg-white/20 text-xs font-bold">+</button>

  function downloadOCTemplate() {
    const futureMonths = Array.from({ length: 12 }, (_, i) => i + 1).filter(m => m > controlMonth);
    if (!futureMonths.length) {
      alert('No hay meses futuros para proyectar en el año activo.');
      return;
    }
    const headers = ['Codigo', 'Concepto OC', ...futureMonths.map(m => `${MONTH_ABR[m - 1]}-${String(year).slice(2)}`)];
    const rows = OC_PLAN.map(({ concepto, catId }) => {
      const cat   = OC_CATS.find(c => c.id === catId);
      const cells = buildOCCells(concepto, catId);
      const ovKey = concepto || catId;
      return [ovKey, cat?.label || catId, ...futureMonths.map(m => cells[m]?.v || 0)];
    });
    const ws  = window.XLSX.utils.aoa_to_sheet([headers, ...rows]);
    ws['!cols'] = [{ wch: 15 }, { wch: 45 }, ...futureMonths.map(() => ({ wch: 12 }))];
    const wb  = window.XLSX.utils.book_new();
    window.XLSX.utils.book_append_sheet(wb, ws, `OC ${year}`);
    window.XLSX.writeFile(wb, `Template_OC_${year}.xlsx`);
  }

  function uploadOCTemplate(file) {
    if (!file) return;
    const reader = new FileReader();
    reader.onload = e => {
      try {
        const wb   = window.XLSX.read(e.target.result, { type: 'binary' });
        const ws   = wb.Sheets[wb.SheetNames[0]];
        const data = window.XLSX.utils.sheet_to_json(ws, { header: 1 });
        if (!data.length) { alert('El archivo está vacío.'); return; }
        const headerRow = data[0];
        const monthAbrMap = { 'Ene':1,'Feb':2,'Mar':3,'Abr':4,'May':5,'Jun':6,'Jul':7,'Ago':8,'Sep':9,'Oct':10,'Nov':11,'Dic':12 };
        // Parse month columns from header (index 2+)
        const monthCols = headerRow.slice(2).map((h, i) => {
          const parts = String(h).split('-');
          return { colIdx: i + 2, month: monthAbrMap[parts[0]] || null };
        });
        const newOverrides = JSON.parse(JSON.stringify(overrides || {}));
        if (!newOverrides.oc) newOverrides.oc = {};
        let imported = 0;
        for (let ri = 1; ri < data.length; ri++) {
          const row = data[ri];
          if (!row || !row[0]) continue;
          const ovKey    = String(row[0]).trim();
          const planEntry = OC_PLAN.find(p => (p.concepto || p.catId) === ovKey);
          if (!planEntry) continue;
          if (!newOverrides.oc[ovKey]) newOverrides.oc[ovKey] = {};
          monthCols.forEach(({ colIdx, month }) => {
            if (!month || month <= controlMonth) return;
            const raw = row[colIdx];
            if (raw === null || raw === undefined || raw === '') {
              delete newOverrides.oc[ovKey][month];
              return;
            }
            const n = parseFloat(String(raw).replace(/[$\s]/g, '').replace(',', '.'));
            if (!isNaN(n)) { newOverrides.oc[ovKey][month] = n; imported++; }
          });
        }
        storage.set(`budget-control:overrides:${year}`, newOverrides);
        setOverrides(newOverrides);
        setRefreshKey(k => k + 1);
        alert(`Proyecciones OC importadas: ${imported} celdas actualizadas.`);
      } catch (err) {
        alert('Error al leer el archivo: ' + err.message);
      }
    };
    reader.readAsBinaryString(file);
  }

  function renderIngresosTable() {
    const allIng = activeProjects.map(p => ({ project: p, data: buildMultiYearIngresosCells(p) }));

    // Rango de años unificado para todos los proyectos
    const globalFirstYear = Math.min(...allIng.map(({ data }) => data.firstYear));
    const globalEndYear   = Math.max(...allIng.map(({ data }) => data.endYear));
    const globalEndMonth  = Math.max(...allIng
      .filter(({ data }) => data.endYear === globalEndYear)
      .map(({ data }) => data.endMonth));

    const yearCols = [];
    for (let fy = globalFirstYear; fy <= globalEndYear; fy++) {
      const em = fy === globalEndYear ? globalEndMonth : 12;
      yearCols.push({ fy, months: Array.from({ length: em }, (_, i) => i + 1) });
    }

    const cellStyle = s => {
      if (s === 'outside') return 'px-2 py-1.5 text-right text-xs text-gray-200 border-r border-gray-50 bg-gray-50/40';
      if (s === 'real')    return 'px-2 py-1.5 text-right text-xs text-gray-500 border-r border-gray-50 bg-gray-100 select-none';
      if (s === 'future')  return 'px-2 py-1.5 text-right text-xs text-indigo-600 border-r border-indigo-50 bg-indigo-50/30';
      return 'px-2 py-1.5 text-right text-xs text-gray-700 border-r border-gray-50 bg-white';
    };

    // Datos para gráfico ingresos: presupuesto original vs proyectado con shift (suma proyectos, ciclo global)
    const ingFlatM = [];
    yearCols.forEach(({ fy, months }) => months.forEach(m => ingFlatM.push({ fy, m })));
    const ingLabels  = ingFlatM.map(({ fy, m }) => `${MONTH_ABR[m-1]}-${String(fy).slice(2)}`);
    const ingCtrlIdx = ingFlatM.findIndex(({ fy, m }) => fy === year && m === controlMonth);

      allIng.reduce((s, { project: p }) => {
        const effP = getEffectiveProject(p);
        const idx  = projectMonthIdx(effP, fy, m - 1);

        if (p.contractType === 'suma_alzada')

        return s + (+p.contract.totalBudgetedCost || 0) * (p.costCurve?.[idx] || 0) / 100
          + (+p.contract.monthlyFee || 0) + (+p.contract.monthlyGG || 0);
      }, 0)
    );
    const ingProj = ingFlatM.map(({ fy, m }) =>
      allIng.reduce((s, { data }) => s + (data.byYear[fy]?.[m]?.v || 0), 0)
    );

    return (

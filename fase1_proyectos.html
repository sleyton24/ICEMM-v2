// ─── FLUJO DE CAJA ────────────────────────────────────────────────────────────

function ECell({ val, onChange, colorCls = 'text-amber-800', placeholder = '0' }) {
  const [local, setLocal] = useState(val != null && val !== 0 ? String(val) : '');
  useEffect(() => {
    setLocal(val != null && val !== 0 ? String(val) : '');
  }, [val]);
  return (
    <td className="px-1 py-0.5 border-t border-gray-100 bg-amber-50">
      <input
        className={`w-full text-right text-[11px] font-mono bg-transparent outline-none ${colorCls}`}
        value={local}
        placeholder={placeholder}
        onChange={e => setLocal(e.target.value)}
        onBlur={() => {
          const n = parseFloat(local.replace(',', '.'));
          onChange(isNaN(n) ? '' : n);
          setLocal(isNaN(n) ? '' : String(n));
        }}
      />
    </td>
  );
}

function VCell({ val, onChange }) {
  const [local, setLocal] = useState(val != null && val !== 0 ? String(val) : '');
  useEffect(() => {
    setLocal(val != null && val !== 0 ? String(val) : '');
  }, [val]);
  return (
    <td className="px-1 py-0.5 border-t border-gray-100 bg-purple-50">
      <input
        className="w-full text-right text-[11px] font-mono bg-transparent outline-none text-purple-800"
        value={local}
        placeholder="0"
        onChange={e => setLocal(e.target.value)}
        onBlur={() => {
          const n = parseFloat(local.replace(',', '.'));
          onChange(isNaN(n) ? '' : n);
          setLocal(isNaN(n) ? '' : String(n));
        }}
      />
    </td>
  );
}

function CashFlowModule({ projects, activeYear }) {
  const year = activeYear;

  const fN = n => {
    const v = +n || 0;
    if (Math.abs(v) < 0.005) return '—';
    return v.toLocaleString('es-CL', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  };

  // ── CF persisted data ────────────────────────────────────────────────────────
  const initCfData = () => ({
    cajaInicialEnero: 0,
    saldoIVADicAnterior: 0,  // saldo neto IVA dic año anterior: negativo=crédito, positivo=deuda
    pctIVACostos: 0.77,       // % costos de obra con IVA recuperable (default 77%)
    pctIVAOC: 0.05,           // % Of. Central con IVA recuperable (default 5%)
    cxp: Object.fromEntries(Array.from({length:12}, (_,i) => [i+1, 0])),
    cxc: Object.fromEntries(Array.from({length:12}, (_,i) => [i+1, 0])),
    aportes: Object.fromEntries(Array.from({length:12}, (_,i) => [i+1, 0])),
    devoluciones: Object.fromEntries(Array.from({length:12}, (_,i) => [i+1, 0])),
    impuestoRenta: 0,
  });

  const [refreshKey, setRefreshKey] = useState(0);
  const [collapsed, setCollapsed] = useState(() => new Set());
  const toggle = k => setCollapsed(p => { const n = new Set(p); n.has(k) ? n.delete(k) : n.add(k); return n; });
  const isCol = k => collapsed.has(k);
  const [cfData, setCfData] = useState(() =>
    storage.get(`budget-control:cashflow:${year}`) || initCfData()
  );

  // ── Período visualizado (cierre mensual) ────────────────────────────────────
  const [periodoVistoFC, setPeriodoVistoFC] = useState('actual');
  React.useEffect(() => { setPeriodoVistoFC('actual'); }, [year]);

  // ── Informes Guardados (comparación — se mantiene para comparar snapshots) ───
  const [savedReportsCF, setSavedReportsCF] = useState(() => {
    try { return storage.get(`budget-control:saved-reports:${year}`) || []; } catch { return []; }
  });
  const [compareReportCF, setCompareReportCF] = useState(null);

  useEffect(() => {
    let d = storage.get(`budget-control:cashflow:${year}`) || initCfData();
    // Backward compat: añadir campos nuevos si faltan en datos guardados anteriores
    if (d.saldoIVADicAnterior === undefined) d = { ...d, saldoIVADicAnterior: 0 };
    if (d.pctIVACostos       === undefined) d = { ...d, pctIVACostos: 0.77 };
    if (d.pctIVAOC           === undefined) d = { ...d, pctIVAOC: 0.05 };
    // Pre-población de valores históricos 2026 si los campos aún están en cero
    if (year === 2026) {
      const cxcVirgen = [1,2,3,4].every(m => !(+d.cxc?.[m]));
      const cxpVirgen = [1,2,3,4].every(m => !(+d.cxp?.[m]));
      if (cxcVirgen) d = { ...d, cxc: { ...d.cxc, 1: -84, 2: -16975, 3: 11300, 4: -7003 } };
      if (cxpVirgen) d = { ...d, cxp: { ...d.cxp, 1: -24,  2:   152, 3:   -88, 4:  1302 } };
      if (!d.saldoIVADicAnterior) d = { ...d, saldoIVADicAnterior: -84 };
    }
    setCfData(d);

    // Anticipos: NO se siembran valores demo. Los anticipos provienen exclusivamente de lo que
    // el usuario haya ingresado manualmente (persistido en budget-control:overrides:{year}) o de
    // datos reales. No se inyectan montos hardcodeados, por lo que cualquier edición previa se respeta.

    try { setSavedReportsCF(storage.get(`budget-control:saved-reports:${year}`) || []); } catch { setSavedReportsCF([]); }
    setCompareReportCF(null);
  }, [year]);

  // Recargar lista de informes guardados cuando cambia refreshKey
  useEffect(() => {
    try { setSavedReportsCF(storage.get(`budget-control:saved-reports:${year}`) || []); } catch {}
  }, [year, refreshKey]);

  useEffect(() => {
    if (!storage.set(`budget-control:cashflow:${year}`, cfData)) {
      reportCriticalSaveFailure(`flujo de caja de ${year}`);
    }
  }, [cfData, year]);

  // ── Data from storage ────────────────────────────────────────────────────────
  const controlMonth = useMemo(() => {
    for (let m = 12; m >= 1; m--) {
      try {
        const d = storage.get(`budget-control:actuals:${year}:${String(m).padStart(2,'0')}`);
        if (d?.rows?.length > 0) return m;
      } catch {}
    }
    return 0;
  }, [year, refreshKey]);

  const actualsForYear = useMemo(() => {
    const r = {};
    for (let m = 1; m <= 12; m++) {
      try {
        const d = storage.get(`budget-control:actuals:${year}:${String(m).padStart(2,'0')}`);
        if (d?.rows) r[m] = d.rows;
      } catch {}
    }
    return r;
  }, [year, refreshKey]);

  const projSnapshot   = useMemo(() => { try { return storage.get(`budget-control:proj-snapshot:${year}`) || null; } catch { return null; } }, [year, refreshKey]);
  const mayorData      = useMemo(() => { try { const d = storage.get('budget-control:mayor:latest'); return d?.ingresos?.byUN ? d.ingresos : null; } catch { return null; } }, [refreshKey]);
  const ocBudgetByCat  = useMemo(() => { try { return storage.get(`budget-control:budget:${year}`)?.oficinaCentral || {}; } catch { return {}; } }, [year]);
  const otherIncBudget = useMemo(() => { try { return storage.get(`budget-control:budget:${year}`)?.otherIncome || {}; } catch { return {}; } }, [year]);
  const overrides      = useMemo(() => { try { return storage.get(`budget-control:overrides:${year}`) || {}; } catch { return {}; } }, [year, refreshKey]);
  const projCompletion = useMemo(() => { try { return storage.get(`budget-control:proj-completion:${year}`) || {}; } catch { return {}; } }, [year, refreshKey]);
  const activeProjects = useMemo(() => projects.filter(p => p.startDate && p.endDate), [projects]);

  // ── Caja Inicial del año desde la contabilidad (Balance Contable) ──────────────
  const balanceData = useMemo(() => { try { return storage.get('budget-control:balance:latest'); } catch { return null; } }, [refreshKey]);
  const ufTableCF   = useMemo(() => { try { return storage.get('budget-control:uf-table') || {}; } catch { return {}; } }, [refreshKey]);
  // Suma de cuentas Caja/Banco/Disponible (CLP) del Balance, convertida a UF al
  // valor de la UF de la fecha del balance. Es la caja con que parte el año.
  const cajaInicialBalance = useMemo(() => {
    if (!balanceData?.accounts?.length) return null;
    const esCaja = a => /caja|banco|disponible|efectivo/.test(String(a.nombre || a.cuenta || '').toLowerCase());
    const sumCLP = balanceData.accounts.filter(esCaja).reduce((s, a) => s + (+a.deudor || 0) - (+a.acreedor || 0), 0);
    if (Math.abs(sumCLP) < 0.5) return null;
    const balYear  = balanceData.year  || (year - 1);
    const balMonth = balanceData.month || 12;
    const md = ufTableCF[balYear]?.[balMonth];
    let uf = null;
    if (md) for (let d = 31; d >= 1; d--) { if (md[d] != null) { uf = +md[d]; break; } }
    if (!uf) return null;
    return sumCLP / uf;
  }, [balanceData, ufTableCF, year]);
  // Caja inicial efectiva: override manual > Balance Contable > cierre Flujo año anterior
  const cajaInicialEfectiva = useMemo(() => {
    if (+cfData.cajaInicialEnero) return +cfData.cajaInicialEnero;
    if (cajaInicialBalance != null) return cajaInicialBalance;
    try { return storage.get(`budget-control:cashflow:${year-1}`)?.cajaFinalDic || 0; } catch { return 0; }
  }, [cfData.cajaInicialEnero, cajaInicialBalance, year]);

  // ── Data helpers (mirror ReportModule) ──────────────────────────────────────
  const getReal = (unCode, cat, m) =>
    (actualsForYear[m] || []).filter(r => r.unCode === unCode && r.clasificacion === cat).reduce((s,r) => s + r.total, 0);
  const getOCReal = (concepto, m) =>
    (actualsForYear[m] || []).filter(r => r.clasificacion === 'oficina_central' && r.concepto === concepto).reduce((s,r) => s + r.total, 0);
  const getMayorRealUF = (unCode, m) => {
    if (!mayorData?.byUN?.[unCode]) return null;
    const mk = `${year}-${String(m).padStart(2,'0')}`;
    return Object.values(mayorData.byUN[unCode].byAccount).reduce((s,acc) => s + (acc.byMonthUF?.[mk] || 0), 0);
  };
  const INTERES_CTA = '5-2-01-002';
  const getMayorAsesoriasUF = m => {
    if (!mayorData?.byUN?.UN01) return null;
    const mk = `${year}-${String(m).padStart(2,'0')}`;
    return Object.entries(mayorData.byUN.UN01.byAccount).filter(([c]) => c !== INTERES_CTA).reduce((s,[,acc]) => s + (acc.byMonthUF?.[mk] || 0), 0);
  };
  const getMayorInteresUF = m => {
    const acc = mayorData?.byUN?.UN01?.byAccount?.[INTERES_CTA];
    if (!acc) return null;
    const mk = `${year}-${String(m).padStart(2,'0')}`;
    return acc.byMonthUF?.[mk] ?? 0;
  };
  function getEffProjCF(project) {
    const sched = projCompletion?.[project.id];
    if (!sched?.realStart && !sched?.projEnd) return project;
    const effStart = sched.realStart || project.startDate;
    const effEnd   = sched.projEnd   || project.endDate;
    const n = monthsBetween(effStart, effEnd);
    return n > 0 ? { ...project, startDate: effStart, endDate: effEnd, durationMonths: n } : project;
  }

  // Ingreso por EdP/Rendiciones del proyecto p en mes m
  // Histórico (m ≤ controlMonth): Libro Mayor (cuentas 5-x por UN) — fuente real
  // Proyección (m > controlMonth): Módulo Proyecciones (proj-snapshot) — fuente proyectada
  // Mayor en UF para un año específico (el getMayorRealUF base usa solo el año activo)
  function mayorUFat(unCode, mm, fy) {
    if (!mayorData?.byUN?.[unCode]) return null;
    const mk = `${fy}-${String(mm).padStart(2, '0')}`;
    return Object.values(mayorData.byUN[unCode].byAccount).reduce((s, acc) => s + (acc.byMonthUF?.[mk] || 0), 0);
  }

  // Ingreso proyectado del proyecto para los 12 meses del año activo, calculado con
  // EXACTAMENTE el mismo algoritmo del módulo Proyecciones (buildMultiYearIngresosCells):
  // real del Mayor hasta el corte (o curva original si la obra no está en el Mayor) +
  // saldo distribuido por la curva escalada CON shift. NO usa el snapshot → siempre
  // calza con lo que muestra Proyecciones, sin depender de copias intermedias.
  function cfIngresoCells(project) {
    const ov = overrides?.ingresos?.[project.id] || {};
    const effProject = getEffProjCF(project);
    const [startYear] = (effProject.startDate || `${year}-01`).split('-').map(Number);
    const [endYear, endMonth] = (effProject.endDate || `${year}-12`).split('-').map(Number);
    const firstYear = Math.min(startYear, year);
    const N_new = Math.max(1, monthsBetween(effProject.startDate, effProject.endDate));
    const baseCurve = project.contractType === 'suma_alzada'
      ? (project.revenueCurve || project.costCurve || [])
      : (project.costCurve || []);
    const ingShift = projCompletion?.[project.id]?.curvaShift?.ingresos || 0;
    const scaledCurve = applyShift(reescalarCurva(baseCurve, N_new), ingShift);
    const extra = +projCompletion?.[project.id]?.extraWorks || 0;
    const tvOverride = projCompletion?.[project.id]?.overrideContract?.totalContratoVentas;
    let projTotal;
    if (tvOverride != null) projTotal = +tvOverride + extra;
    else if (project.contractType === 'suma_alzada') projTotal = (+project.contract.originalAmount || 0) + extra;
    else projTotal = (+project.contract.totalBudgetedCost || 0)
      + ((+project.contract.monthlyFee || 0) + (+project.contract.monthlyGG || 0)) * N_new + extra;
    const curveBase = tvOverride != null ? +tvOverride
      : project.contractType === 'suma_alzada' ? (+project.contract.originalAmount || 0) : null;
    const autoFromOrigCurve = (effP, fy, mm) => {
      const idx = projectMonthIdx(effP, fy, mm - 1);
      if (idx === -1) return 0;
      if (project.contractType === 'suma_alzada') {
        return (curveBase ?? (+project.contract.originalAmount || 0)) * (project.revenueCurve?.[idx] || 0) / 100;
      }
      return (+project.contract.totalBudgetedCost || 0) * (project.costCurve?.[idx] || 0) / 100
        + (+project.contract.monthlyFee || 0) + (+project.contract.monthlyGG || 0);
    };
    const proyUN = `UN${project.unCode.padStart(2, '0')}`;
    const mayUF = (mm, fy = year) => mayorUFat(proyUN, mm, fy);
    let sumReal = 0;
    for (let fy = firstYear; fy < year; fy++) {
      for (let mm = 1; mm <= 12; mm++) {
        if (projectMonthIdx(effProject, fy, mm - 1) !== -1) {
          const v = mayUF(mm, fy);
          sumReal += v !== null ? v : autoFromOrigCurve(effProject, fy, mm);
        }
      }
    }
    for (let mm = 1; mm <= controlMonth; mm++) {
      if (ov[mm] !== undefined) sumReal += +ov[mm];
      else { const v = mayUF(mm); sumReal += v !== null ? v : autoFromOrigCurve(effProject, year, mm); }
    }
    let sumFutOv = 0;
    for (let mm = controlMonth + 1; mm <= 12; mm++) if (ov[mm] !== undefined) sumFutOv += +ov[mm];
    const saldo = Math.max(0, projTotal - sumReal - sumFutOv);
    const futureMths = [];
    for (let fy = year; fy <= endYear; fy++) {
      const sm = fy === year ? controlMonth + 1 : 1;
      const em = fy === endYear ? endMonth : 12;
      for (let mm = sm; mm <= em; mm++) {
        if (fy === year && ov[mm] !== undefined) continue;
        const idx = projectMonthIdx(effProject, fy, mm - 1);
        const w = (idx >= 0 && idx < scaledCurve.length) ? scaledCurve[idx] : 0;
        futureMths.push({ fy, m: mm, w });
      }
    }
    const totalW = futureMths.reduce((s, x) => s + x.w, 0);
    const cells = {};
    for (let mm = 1; mm <= 12; mm++) {
      if (mm <= controlMonth) {
        if (ov[mm] !== undefined) cells[mm] = +ov[mm];
        else { const v = mayUF(mm); cells[mm] = v !== null ? v : autoFromOrigCurve(effProject, year, mm); }
        continue;
      }
      if (projectMonthIdx(effProject, year, mm - 1) === -1) { cells[mm] = 0; continue; }
      if (ov[mm] !== undefined) cells[mm] = +ov[mm];
      else { const fm = futureMths.find(x => x.fy === year && x.m === mm); cells[mm] = fm ? (totalW > 0 ? saldo * fm.w / totalW : 0) : 0; }
    }
    return cells;
  }

  const ingCellsByProj = useMemo(() => {
    const o = {};
    activeProjects.forEach(p => { o[p.id] = cfIngresoCells(p); });
    return o;
  }, [activeProjects, overrides, projCompletion, mayorData, controlMonth, year]);

  function getIngresoProy(project, m) {
    return (ingCellsByProj[project.id] || cfIngresoCells(project))[m] ?? 0;
  }

  // Costo total del proyecto p en mes m (suma 8 clasificaciones)
  // Histórico: Reporte Manager (actuals); Proyección: Módulo Proyecciones (proj-snapshot)
  function getCostoProy(project, m) {
    const CATS_COSTO = PROJ_CATS.filter(c => c.id !== 'no_clasificado');
    if (m <= controlMonth) {
      // Costos reales del Reporte Manager hasta el corte (0 donde la obra aún no
      // tiene costo). NO reemplazar por proyección: una obra iniciada pero sin
      // facturar (ausente del Mayor) igual tiene costos reales (ej. Olá abr 60,55).
      return CATS_COSTO.reduce((s, c) => s + getReal(project.unCode, c.id, m), 0);
    }
    // Proyecciones: si hay snap para este proyecto, es la fuente autoritativa
    if (projSnapshot?.costos?.[project.id] !== undefined) {
      return CATS_COSTO.reduce((s, c) => s + (projSnapshot.costos[project.id][c.id]?.[m] ?? 0), 0);
    }
    // Sin projSnapshot: estimar con la curva de costos CON shift (igual meses que
    // Proyecciones). Usa el total proyectado por categoría (override de proj-completion
    // o presupuesto) distribuido por la curva escalada+desplazada.
    const effProject = getEffProjCF(project);
    const idx = projectMonthIdx(effProject, year, m-1);
    if (idx === -1) return 0;
    const N_new = Math.max(1, monthsBetween(effProject.startDate, effProject.endDate));
    const costoShift = projCompletion?.[project.id]?.curvaShift?.costos || 0;
    const scaled = applyShift(reescalarCurva(project.costCurve || [], N_new), costoShift);
    const catTotal = c => projCompletion?.[project.id]?.cats?.[c] != null
      ? +projCompletion[project.id].cats[c]
      : (+project.budgetByCategory?.[c] || 0);
    return CATS_COSTO.reduce((s, c) => s + catTotal(c.id) * (scaled[idx] || 0), 0);
  }

  // Costo Oficina Central total en mes m
  // Histórico: Reporte Manager; Proyección: Módulo Proyecciones (proj-snapshot)
  function getOCProy(m) {
    if (m <= controlMonth) {
      return OC_PLAN.reduce((s, oc) => s + (oc.concepto ? getOCReal(oc.concepto, m) : 0), 0);
    }
    return OC_CATS.reduce((s, c) => {
      const ov = overrides?.oc?.[c.id]?.[m];
      if (ov !== undefined) return s + +ov;
      // Proyecciones: si snap existe, usarlo (0 si no hay dato ese mes)
      if (projSnapshot) return s + (projSnapshot.oc?.[c.id]?.[m] ?? 0);
      // Sin projSnapshot: usar presupuesto
      return s + (ocBudgetByCat[c.id]?.[m-1] || 0);
    }, 0);
  }

  // Asesorías y otros ingresos del mes m
  // Histórico: Mayor (UN01); Proyección: Módulo Proyecciones (proj-snapshot)
  function getOtrosIngProy(m) {
    const ov = overrides?.otrosIngresos?.[m];
    if (m <= controlMonth) {
      if (ov !== undefined) return +ov;
      // Mayor: si está cargado, es la fuente autoritativa para asesorías
      if (mayorData) return (getMayorAsesoriasUF(m) ?? 0) + (getMayorInteresUF(m) ?? 0);
      return 0;
    }
    if (ov !== undefined) return +ov;
    // Proyecciones: si hay snap, usarlo
    if (projSnapshot) return projSnapshot.otrosIngresos?.[m] ?? 0;
    // Sin projSnapshot: usar presupuesto
    return otherIncBudget?.asesorias?.[m-1] || 0;
  }

  // Anticipo: todos los meses, overrides primero (fuente viva), snapshot como fallback.
  // El Mayor ICEMM registra solo EdP (5-x ingresos por obra reconocidos).
  // Los anticipos recibidos son caja separada → se ingresan en Módulo Proyecciones
  // y se muestran en la fila "Anticipos" del CF para todos los meses (históricos y futuros).
  function getAnticipoProy(project, m) {
    // Anticipo recibido (manual desde Proyecciones): override vivo o snapshot
    const fromOv   = +(overrides?.anticipos?.[project.id]?.[m] ?? 0);
    const recibido = fromOv !== 0 ? fromOv : +(projSnapshot?.anticipos?.[project.id]?.[m] ?? 0);
    // Devolución del anticipo: −anticipoPct% del EdP BRUTO, proporcional al avance del
    // estado de pago. Solo obras Suma Alzada con anticipo (Administración no tiene anticipo).
    let devolucion = 0;
    if (project.contractType === 'suma_alzada') {
      const antPct = +project.contract.advancePercent || 0;
      if (antPct > 0) {
        const ret      = +project.contract.retentionPercent || 0;
        const edpNeto  = getIngresoProy(project, m);            // EdP neto de retención
        const edpBruto = ret < 100 ? edpNeto / (1 - ret / 100) : edpNeto;
        devolucion = -(antPct / 100) * edpBruto;
      }
    }
    return recibido + devolucion;
  }

  // ── Compute monthly CF matrix ─────────────────────────────────────────────────
  const cfRows = useMemo(() => {
    const rows = {};
    // Pass 1: base rows (secuencial — EdP de proyectos AD = costo mes anterior en proyección)
    for (let m = 1; m <= 12; m++) {
      const anticipos = {};
      const edp = {};
      const costos = {};
      const prev = m > 1 ? rows[m-1] : null;
      activeProjects.forEach(p => {
        anticipos[p.id] = getAnticipoProy(p, m);
        costos[p.id]    = -getCostoProy(p, m);
        // TODOS los proyectos (Suma Alzada y Admin Delegada) usan el ingreso del módulo
        // Proyecciones (cfIngresoCells). Antes Admin Delegada usaba una fórmula propia
        // (rendiciones = costo mes anterior + fee + GG) que no calzaba con Proyecciones.
        edp[p.id] = getIngresoProy(p, m);
      });
      const totalAnticipos  = Object.values(anticipos).reduce((s,v) => s+v, 0);
      const totalEdp        = Object.values(edp).reduce((s,v) => s+v, 0);
      const otrosIng        = getOtrosIngProy(m);
      const totalIngresosOp = totalAnticipos + totalEdp + otrosIng;   // Línea 8
      const ivaDebito       = totalIngresosOp * 0.19;                 // Línea 9: base = ingresos operacionales completos (incl. anticipos)
      const totalIngresos   = totalIngresosOp + ivaDebito;
      const totalCostos     = Object.values(costos).reduce((s,v) => s+v, 0);
      const oc              = -getOCProy(m);
      const totalEgresos    = totalCostos + oc;
      rows[m] = { anticipos, edp, costos, totalAnticipos, totalEdp, otrosIng, totalIngresosOp, ivaDebito, totalIngresos, totalCostos, oc, totalEgresos };
    }
    // Pass 2: tributos con IVA acumulado correcto, CxC default (secuencial)
    const adProjs = activeProjects.filter(p => p.contractType === 'admin_delegada');
    const pCostos = +(cfData.pctIVACostos ?? 0.77);
    const pOC     = +(cfData.pctIVAOC     ?? 0.05);
    let saldoIVAPrev = +(cfData.saldoIVADicAnterior || 0);
    for (let m = 1; m <= 12; m++) {
      const row  = rows[m];
      const prev = m > 1 ? rows[m-1] : null;
      // IVA Crédito: porcentaje configurable por el usuario
      const ivaCredito = -(pCostos * 0.19 * Math.abs(row.totalCostos) + pOC * 0.19 * Math.abs(row.oc));
      // IVA Acumulado: si saldo anterior > 0 (ya pagado al SII), reiniciar; si ≤ 0, arrastrar excedente
      const ivaCredAcum = saldoIVAPrev > 0 ? ivaCredito : saldoIVAPrev + ivaCredito;
      const saldoContador = ivaCredAcum + row.ivaDebito;
      // Pago IVA este mes = saldo positivo del mes anterior (se declara y paga al SII con 1 mes de rezago)
      const ivaNeto = Math.max(0, saldoIVAPrev);
      // PPM: 1% del total ingresos operacionales del mes anterior (base bruta, incluye anticipos)
      const ppm = prev ? prev.totalIngresosOp * 0.01 : 0;
      const impRenta = m === 4 ? Math.abs(+(cfData.impuestoRenta || 0)) : 0;
      const totalTributos = -(ivaNeto + ppm + impRenta);
      // CxC default para meses de proyección: desfase de 1 mes en cobro (excluye AD que cobra al contado)
      let cxcDefault = 0;
      if (m > controlMonth && prev) {
        const adPrev = adProjs.reduce((s,p) => s + (prev.edp[p.id]||0) + (prev.anticipos[p.id]||0), 0);
        const adCur  = adProjs.reduce((s,p) => s + (row.edp[p.id]||0) + (row.anticipos[p.id]||0), 0);
        cxcDefault = (prev.totalIngresosOp - adPrev - (row.totalIngresosOp - adCur)) * 1.19;
      }
      const cxp = +(cfData.cxp?.[m] || 0);
      const cxcRaw = cfData.cxc?.[m];
      const cxc = (cxcRaw !== null && cxcRaw !== undefined && +cxcRaw !== 0) ? +cxcRaw : cxcDefault;
      const aportes      = +(cfData.aportes?.[m] || 0);
      const devoluciones = -(Math.abs(+(cfData.devoluciones?.[m] || 0)));
      const totalCxPCxC  = cxp + cxc;
      const totalInv     = aportes + devoluciones;
      // FC del Mes: ivaCredito es egreso real de caja (IVA pagado a proveedores)
      const fcMes = row.totalIngresos + row.totalEgresos + ivaCredito + totalTributos + totalCxPCxC + totalInv;
      // saldoContador = saldo neto IVA al cierre del mes (negativo=crédito a favor, positivo=deuda al SII).
      // Se guarda en la fila para poder arrastrar el saldo de diciembre al año siguiente (ver effect de persistencia).
      rows[m] = { ...row, ivaCredito, ivaNeto, ppm, impRenta, totalTributos, cxp, cxc, cxcDefault, aportes, devoluciones, totalCxPCxC, totalInv, fcMes, saldoContador };
      saldoIVAPrev = saldoContador;
    }
    // Pass 3: caja acumulada (parte desde la caja inicial efectiva: manual / Balance / año anterior)
    let cajaAnt = cajaInicialEfectiva;
    for (let m = 1; m <= 12; m++) {
      const cajaInicial = cajaAnt;
      const cajaFinal   = cajaInicial + rows[m].fcMes;
      rows[m] = { ...rows[m], cajaInicial, cajaFinal };
      cajaAnt = cajaFinal;
    }
    return rows;
  }, [activeProjects, year, controlMonth, actualsForYear, projSnapshot,
      mayorData, ocBudgetByCat, otherIncBudget, overrides, projCompletion, cfData, cajaInicialEfectiva]);

  // Persist computed caja data for Dashboard and "Crear Año Siguiente"
  useEffect(() => {
    const dec = cfRows[12];
    if (!dec || dec.cajaFinal === undefined) return;
    const cajaMensual = Object.fromEntries(
      Object.entries(cfRows).map(([m, r]) => [m, r.cajaFinal])
    );
    // Saldo neto IVA al cierre de diciembre. Convención de signo (igual que saldoIVADicAnterior):
    // negativo = crédito a favor (excedente que se arrastra), positivo = deuda al SII.
    // Se persiste para que "Crear Año Siguiente" lo use como saldoIVADicAnterior del año entrante.
    const saldoIVADicFinal = dec?.saldoContador || 0;
    const prev = storage.get(`budget-control:cashflow:${year}`) || {};
    if (prev.cajaFinalDic !== dec?.cajaFinal || prev.saldoIVADicFinal !== saldoIVADicFinal) {
      storage.set(`budget-control:cashflow:${year}`, {
        ...prev, cajaFinalDic: dec?.cajaFinal || 0, cajaMensual, saldoIVADicFinal
      });
    }
  }, [cfRows, year]);

  // ── CF update helpers ─────────────────────────────────────────────────────────
  const updateCfField   = (field, val) => setCfData(p => ({ ...p, [field]: val }));
  const updateCfMonthly = (field, m, val) =>
    setCfData(p => ({ ...p, [field]: { ...p[field], [m]: val === '' ? 0 : +val } }));

  // ── Totals ────────────────────────────────────────────────────────────────────
  // Caja del año anterior mostrada en la columna 2025 = caja inicial efectiva del año
  const cajaAnioAnterior = cajaInicialEfectiva;

  const t12 = key => { let s = 0; for (let m=1; m<=12; m++) s += cfRows[m]?.[key] || 0; return s; };
  const tProj = (projId, key) => { let s = 0; for (let m=1; m<=12; m++) s += cfRows[m]?.[key]?.[projId] || 0; return s; };

  // ── Render helpers ────────────────────────────────────────────────────────────
  const TH  = "text-[9px] font-bold uppercase tracking-wide text-gray-300 text-right px-2 py-1.5 whitespace-nowrap";
  const TD  = "text-[11px] font-mono text-right px-2 py-1 border-t border-gray-100";
  const LBL = "text-[11px] font-medium px-3 py-1 border-t border-gray-100 whitespace-nowrap sticky left-0";
  const actBg = m => m <= controlMonth ? 'bg-slate-50' : 'bg-white';
  const nc  = v => Math.abs(v) < 0.005 ? 'text-gray-300' : v > 0 ? 'text-emerald-700' : 'text-red-600';
  const dash = v => Math.abs(v) >= 0.005 ? fN(v) : <span className="text-gray-300">—</span>;

  // Celda de número de sólo lectura
  const RCell = ({ m, v }) => (
    <td className={`${TD} ${actBg(m)} ${nc(v)}`}>{dash(v)}</td>
  );
  // Fila de encabezado de sección con toggle
  const SectionHdr = ({ label, color, skey }) => (
    <tr style={{background: color}}>
      <td colSpan={15} style={{padding:0}}>
        <button onClick={() => toggle(skey)}
          className="w-full text-left px-3 py-1.5 flex items-center gap-2 hover:brightness-110 transition-all">
          <span className="text-[11px] opacity-70 w-3 inline-block">{isCol(skey) ? '▶' : '▼'}</span>
          <span className="text-[10px] font-bold uppercase tracking-wider text-white">{label}</span>
          {isCol(skey) && <span className="ml-auto text-[9px] text-white/60 font-normal italic">sólo totales</span>}
        </button>
      </td>
    </tr>
  );
  // Sub-encabezado de grupo
  const SubHdr = ({ label, colorCls = 'bg-emerald-50 text-emerald-700' }) => (
    <tr className={colorCls}>
      <td colSpan={15} className="px-3 py-0.5 text-[9px] font-semibold uppercase tracking-wide">{label}</td>
    </tr>
  );

  // ── Informes Guardados — save / delete ───────────────────────────────────────

  function saveCFSnapshot(label, cutoffDate) {
    const cashflow = { fcMes: {}, cajaFinal: {}, cajaInicialEnero: cfData.cajaInicialEnero };
    for (let m = 1; m <= 12; m++) {
      cashflow.fcMes[m]     = cfRows[m]?.fcMes     || 0;
      cashflow.cajaFinal[m] = cfRows[m]?.cajaFinal || 0;
    }
    const id = `rpt-${Date.now()}`;
    const entry = { id, label, cutoffDate, controlMonth, savedAt: new Date().toISOString(), cashflow };
    const prev = storage.get(`budget-control:saved-reports:${year}`) || [];
    const updated = [entry, ...prev];
    storage.set(`budget-control:saved-reports:${year}`, updated);
    setSavedReportsCF(updated);
  }

  function deleteCFReport(id) {
    const prev = storage.get(`budget-control:saved-reports:${year}`) || [];
    const updated = prev.filter(r => r.id !== id);
    storage.set(`budget-control:saved-reports:${year}`, updated);
    setSavedReportsCF(updated);
    if (compareReportCF?.id === id) setCompareReportCF(null);
  }

  // ── Gráfico SVG Caja Final ────────────────────────────────────────────────────
  const cajaValues = Array.from({length:12}, (_,i) => cfRows[i+1]?.cajaFinal || 0);
  const savedCajaValues = compareReportCF?.cashflow
    ? Array.from({length:12}, (_,i) => compareReportCF.cashflow.cajaFinal?.[i+1] || 0)
    : null;
  const allValues = savedCajaValues ? [...cajaValues, ...savedCajaValues] : cajaValues;
  const minV = Math.min(0, ...allValues);
  const maxV = Math.max(0.001, ...allValues);
  const range = maxV - minV || 1;
  const W=760, H=150, PX=48, PY=16;
  const iW = W - PX*2, iH = H - PY*2 - 12;
  const toX = i => PX + (i / 11) * iW;
  const toY = v => PY + (1 - (v - minV) / range) * iH;
  const zeroY = toY(0);
  const linePoints = cajaValues.map((v,i) => `${toX(i)},${toY(v)}`).join(' ');
  const savedLinePoints = savedCajaValues ? savedCajaValues.map((v,i) => `${toX(i)},${toY(v)}`).join(' ') : null;

  // ── Render ────────────────────────────────────────────────────────────────────
  // Mostrar sección anticipos si algún proyecto tiene valores en cualquier mes
  const hasAnticipoRows = activeProjects.some(p => {
    const ovA   = overrides?.anticipos?.[p.id]    || {};
    const snapA = projSnapshot?.anticipos?.[p.id] || {};
    return Object.values(ovA).some(v => +v !== 0) || Object.values(snapA).some(v => +v !== 0);
  });

  return (
    <div className="space-y-5">
      {/* Header */}
      <div className="flex items-center justify-between">
        <div>
          <h2 className="text-xl font-bold text-gray-800">Flujo de Caja</h2>
          <p className="text-xs text-gray-400 mt-0.5">Año {year} · Control hasta: <span className="font-medium text-gray-600">{controlMonth > 0 ? MONTH_ABR[controlMonth-1] : 'Sin datos cargados'}</span></p>
          <div className="flex flex-wrap items-center gap-2 mt-1.5">
            {/* Badge Mayor ICEMM */}
            {(() => {
              const uns = mayorData ? Object.keys(mayorData.byUN || {}).sort().join(', ') : null;
              const proyUNs = activeProjects.map(p => `UN${p.unCode.padStart(2,'0')}`);
              const missing = proyUNs.filter(u => mayorData && !mayorData.byUN?.[u]);
              return (
                <span title={uns ? `UNs en Mayor: ${uns}${missing.length ? `\n⚠ Sin datos: ${missing.join(', ')}` : ''}` : 'Mayor ICEMM no cargado'}
                  className={`text-[10px] px-2 py-0.5 rounded-full font-medium cursor-help
                    ${!mayorData ? 'bg-amber-50 text-amber-700 border border-amber-200'
                    : missing.length ? 'bg-orange-50 text-orange-700 border border-orange-200'
                    : 'bg-emerald-50 text-emerald-700 border border-emerald-200'}`}>
                  {!mayorData ? '⚠ Mayor no cargado'
                   : missing.length ? `⚠ Mayor: sin ${missing.join(', ')}`
                   : '✓ Mayor cargado'}
                </span>
              );
            })()}
            {/* Badge Reporte Manager */}
            {(() => {
              const hasManager = controlMonth > 0;
              const meses = hasManager
                ? Array.from({length: controlMonth}, (_,i) => MONTH_ABR[i]).join('-')
                : null;
              return (
                <span title={hasManager ? `Reporte Manager cargado: ${meses} ${year}` : 'Reporte Manager no cargado'}
                  className={`text-[10px] px-2 py-0.5 rounded-full font-medium cursor-help
                    ${hasManager ? 'bg-emerald-50 text-emerald-700 border border-emerald-200'
                    : 'bg-amber-50 text-amber-700 border border-amber-200'}`}>
                  {hasManager ? `✓ Manager ${meses} ${year}` : '⚠ Manager no cargado'}
                </span>
              );
            })()}
            {/* Badge Proyecciones */}
            <span className={`text-[10px] px-2 py-0.5 rounded-full font-medium
              ${projSnapshot ? 'bg-emerald-50 text-emerald-700 border border-emerald-200' : 'bg-amber-50 text-amber-700 border border-amber-200'}`}>
              {projSnapshot ? '✓ Proyección guardada' : '⚠ Proyección no guardada'}
            </span>
          </div>
        </div>
        <button onClick={() => setRefreshKey(k=>k+1)}
          className="text-xs px-3 py-1.5 rounded-lg bg-gray-100 hover:bg-gray-200 text-gray-600 transition-colors">
          ↻ Actualizar
        </button>
      </div>

      {/* ── Selector de período cerrado ── */}
      <PeriodSelectorBar year={year} periodoVisto={periodoVistoFC} onChange={setPeriodoVistoFC} />

      {/* ── Vista lectura: informe cerrado ── */}
      {periodoVistoFC !== 'actual' && (() => {
        const snap = getCierreModulo(year, periodoVistoFC, 'cashflow');
        const cajaMensual = snap?.cajaMensual || {};
        const meses = Array.from({length:12},(_,i)=>i+1);
        return (
          <>
            <SnapshotReadonlyBanner year={year} mes={periodoVistoFC} />
            <div className="bg-white rounded-xl border border-gray-100 shadow-sm overflow-hidden">
              <table className="text-xs w-full">
                <thead><tr style={{background:'#1C3460'}}>
                  <th className="text-left px-4 py-2 text-gray-300 font-semibold w-40">Mes</th>
                  {meses.map(m=><th key={m} className="text-right px-2 py-2 text-gray-300 font-semibold">{MONTH_ABR[m-1]}</th>)}
                  <th className="text-right px-2 py-2 text-gray-300 font-semibold">Dic</th>
                </tr></thead>
                <tbody>
                  <tr className="border-b border-gray-100">
                    <td className="px-4 py-2 font-semibold text-gray-700">Caja Final</td>
                    {meses.map(m => {
                      const v = cajaMensual[m] ?? 0;
                      return <td key={m} className={`px-2 py-2 text-right font-mono ${Math.abs(v)<0.005?'text-gray-300':v>0?'text-emerald-700':'text-red-600'}`}>
                        {Math.abs(v)<0.005?'—':v.toLocaleString('es-CL',{minimumFractionDigits:1,maximumFractionDigits:1})}
                      </td>;
                    })}
                    <td className={`px-2 py-2 text-right font-mono font-bold ${(snap?.cajaFinalDic||0)>0?'text-emerald-700':'text-red-600'}`}>
                      {Math.abs(snap?.cajaFinalDic||0)<0.005?'—':(snap?.cajaFinalDic||0).toLocaleString('es-CL',{minimumFractionDigits:1,maximumFractionDigits:1})}
                    </td>
                  </tr>
                </tbody>
              </table>
            </div>
          </>
        );
      })()}

      {/* Controles manuales globales + tabla completa — solo en modo actual */}
      {periodoVistoFC === 'actual' && (<>
      {/* Controles manuales globales */}
      <div className="bg-white rounded-xl p-4 shadow-sm border border-gray-100 flex flex-wrap items-center gap-x-5 gap-y-3">
        <div className="flex items-center gap-2">
          <label className="text-xs font-semibold text-gray-600 whitespace-nowrap">Caja Inicial Enero:</label>
          <input type="number" step="0.01"
            className="w-28 border border-gray-200 rounded-lg px-2 py-1.5 text-xs font-mono text-right focus:outline-none focus:border-blue-400"
            value={cfData.cajaInicialEnero || ''}
            placeholder={cajaInicialBalance != null ? cajaInicialBalance.toLocaleString('es-CL',{maximumFractionDigits:1}) : '0.00'}
            onChange={e => updateCfField('cajaInicialEnero', e.target.value==='' ? 0 : +e.target.value)} />
          <span className="text-[10px] text-gray-400">UF</span>
          {cajaInicialBalance != null && (
            <span className="flex items-center gap-1.5 text-[10px] text-emerald-700 bg-emerald-50 border border-emerald-200 rounded-lg px-2 py-1 whitespace-nowrap">
              Balance: {cajaInicialBalance.toLocaleString('es-CL',{minimumFractionDigits:1,maximumFractionDigits:1})} UF
              {(+cfData.cajaInicialEnero) !== 0 && (
                <button onClick={() => updateCfField('cajaInicialEnero', 0)}
                  className="ml-0.5 text-emerald-600 hover:text-emerald-800 font-bold underline">usar</button>
              )}
            </span>
          )}
        </div>
        <div className="w-px h-5 bg-gray-200" />
        <div className="flex items-center gap-2">
          <label className="text-xs font-semibold text-gray-600 whitespace-nowrap">Saldo IVA Dic {year-1}:</label>
          <input type="number" step="0.01"
            className="w-28 border border-gray-200 rounded-lg px-2 py-1.5 text-xs font-mono text-right focus:outline-none focus:border-blue-400"
            value={cfData.saldoIVADicAnterior || ''} placeholder="0.00"
            onChange={e => updateCfField('saldoIVADicAnterior', e.target.value==='' ? 0 : +e.target.value)} />
          <span className="text-[10px] text-gray-400 whitespace-nowrap">UF (–=crédito)</span>
        </div>
        <div className="w-px h-5 bg-gray-200" />
        <div className="flex items-center gap-2">
          <label className="text-xs font-semibold text-gray-600 whitespace-nowrap">% IVA costos obra:</label>
          <input type="number" step="1" min="0" max="100"
            className="w-16 border border-gray-200 rounded-lg px-2 py-1.5 text-xs font-mono text-right focus:outline-none focus:border-blue-400"
            value={cfData.pctIVACostos != null ? Math.round(cfData.pctIVACostos * 100) : 77} placeholder="77"
            onChange={e => updateCfField('pctIVACostos', e.target.value==='' ? 0.77 : +e.target.value / 100)} />
          <span className="text-[10px] text-gray-400">%</span>
        </div>
        <div className="w-px h-5 bg-gray-200" />
        <div className="flex items-center gap-2">
          <label className="text-xs font-semibold text-gray-600 whitespace-nowrap">% IVA Of. Central:</label>
          <input type="number" step="1" min="0" max="100"
            className="w-16 border border-gray-200 rounded-lg px-2 py-1.5 text-xs font-mono text-right focus:outline-none focus:border-blue-400"
            value={cfData.pctIVAOC != null ? Math.round(cfData.pctIVAOC * 100) : 5} placeholder="5"
            onChange={e => updateCfField('pctIVAOC', e.target.value==='' ? 0.05 : +e.target.value / 100)} />
          <span className="text-[10px] text-gray-400">%</span>
        </div>
        <div className="w-px h-5 bg-gray-200" />
        <div className="flex items-center gap-2">
          <label className="text-xs font-semibold text-gray-600 whitespace-nowrap">Imp. Renta (Abril):</label>
          <input type="number" step="0.01"
            className="w-28 border border-amber-200 rounded-lg px-2 py-1.5 text-xs font-mono text-right focus:outline-none focus:border-amber-400 bg-amber-50"
            value={cfData.impuestoRenta || ''} placeholder="0.00"
            onChange={e => updateCfField('impuestoRenta', e.target.value==='' ? 0 : +e.target.value)} />
          <span className="text-[10px] text-gray-400">UF</span>
        </div>
        <div className="ml-auto flex items-center gap-3 text-[10px] text-gray-400">
          <span className="flex items-center gap-1.5"><span className="w-3 h-3 rounded bg-slate-100 border border-gray-200 inline-block"></span>Real</span>
          <span className="flex items-center gap-1.5"><span className="w-3 h-3 rounded bg-white border border-gray-200 inline-block"></span>Proyectado</span>
          <span className="flex items-center gap-1.5"><span className="w-3 h-3 rounded bg-amber-50 border border-amber-200 inline-block"></span>Manual</span>
        </div>
      </div>

      {/* Tabla principal */}
      <TopScroll wrapClass="bg-white rounded-xl shadow-sm border border-gray-100">
        <table className="w-full text-xs border-collapse" style={{minWidth:1000}}>
          <thead>
            <tr className="bg-[#1C3460]">
              <th className="text-left text-[10px] font-bold text-gray-200 px-3 py-2 sticky left-0 bg-[#1C3460] z-10 min-w-[210px]">Concepto</th>
              <th className={`${TH} min-w-[80px] text-yellow-100 border-r border-white/10`}>Dic {year-1}</th>
              {MONTH_ABR.map((lbl,i) => (
                <th key={i} className={`${TH} min-w-[70px] ${i+1<=controlMonth?'text-blue-300':''}`}>{lbl}</th>
              ))}
              <th className={`${TH} min-w-[80px] text-yellow-200`}>Total</th>
            </tr>
          </thead>
          <tbody>

            {/* ── INGRESOS ─────────────────────────────────────────────────── */}
            <SectionHdr label="Ingresos" color="#065f46" skey="ing" />

            {!isCol('ing') && (<>
              {/* Anticipos */}
              {hasAnticipoRows && (<>
                <SubHdr label="Anticipos Recibidos / Devoluciones" colorCls="bg-emerald-50 text-emerald-800" />
                {activeProjects.map(p => {
                  const ovA   = overrides?.anticipos?.[p.id]    || {};
                  const snapA = projSnapshot?.anticipos?.[p.id] || {};
                  const hasAny = Object.values(ovA).some(v => +v !== 0) || Object.values(snapA).some(v => +v !== 0);
                  if (!hasAny) return null;
                  return (
                    <tr key={`ant-${p.id}`} className="hover:bg-gray-50">
                      <td className={`${LBL} pl-5 text-gray-500 bg-white`}>{projCompletion?.[p.id]?.replacementName || p.name}</td>
                      <td className={`${TD} text-gray-300`}>—</td>
                      {Array.from({length:12},(_,i)=>i+1).map(m => <RCell key={m} m={m} v={cfRows[m]?.anticipos?.[p.id]||0} />)}
                      <td className={`${TD} font-semibold ${nc(tProj(p.id,'anticipos'))}`}>{dash(tProj(p.id,'anticipos'))}</td>
                    </tr>
                  );
                })}
              </>)}

              {/* EdP / Rendiciones */}
              <SubHdr label="Estados de Pago / Rendiciones" colorCls="bg-emerald-50 text-emerald-800" />
              {activeProjects.map(p => (
                <tr key={`edp-${p.id}`} className="hover:bg-gray-50">
                  <td className={`${LBL} pl-5 text-gray-500 bg-white`}>
                    {projCompletion?.[p.id]?.replacementName || p.name}
                    {projCompletion?.[p.id]?.replacementName && <span className="text-[9px] text-amber-500 ml-1">(reemplaza {p.name})</span>}
                    {' '}<span className="text-[9px] text-gray-400 ml-1">{p.contractType==='suma_alzada'?'SA':'AD'}</span>
                  </td>
                  <td className={`${TD} text-gray-300`}>—</td>
                  {Array.from({length:12},(_,i)=>i+1).map(m => <RCell key={m} m={m} v={cfRows[m]?.edp?.[p.id]||0} />)}
                  <td className={`${TD} font-semibold ${nc(tProj(p.id,'edp'))}`}>{dash(tProj(p.id,'edp'))}</td>
                </tr>
              ))}

              {/* Asesorías */}
              <tr className="hover:bg-gray-50">
                <td className={`${LBL} pl-5 text-gray-500 bg-white`}>Asesorías / Otros Ingresos</td>
                <td className={`${TD} text-gray-300`}>—</td>
                {Array.from({length:12},(_,i)=>i+1).map(m => <RCell key={m} m={m} v={cfRows[m]?.otrosIng||0} />)}
                <td className={`${TD} font-semibold ${nc(t12('otrosIng'))}`}>{dash(t12('otrosIng'))}</td>
              </tr>

              {/* IVA Débito */}
              <tr className="hover:bg-gray-50">
                <td className={`${LBL} pl-5 text-gray-500 bg-white`}>IVA Débito (19% s/ingresos)</td>
                <td className={`${TD} text-gray-300`}>—</td>
                {Array.from({length:12},(_,i)=>i+1).map(m => <RCell key={m} m={m} v={cfRows[m]?.ivaDebito||0} />)}
                <td className={`${TD} font-semibold ${nc(t12('ivaDebito'))}`}>{dash(t12('ivaDebito'))}</td>
              </tr>
            </>)}

            {(() => { const v = t12('totalIngresos'); return <tr style={{background:'#065f46'}}><td className="px-3 py-1.5 text-[11px] font-bold text-white sticky left-0 whitespace-nowrap" style={{background:'#065f46'}}>Total Ingresos</td><td className="px-2 py-1.5 text-white/30 text-right text-[11px]">—</td>{Array.from({length:12},(_,i)=>i+1).map(m=>{const vv=cfRows[m]?.totalIngresos||0;return <td key={m} className="text-[11px] font-bold font-mono text-right px-2 py-1.5 text-white">{Math.abs(vv)>=0.005?fN(vv):'—'}</td>;})}<td className="text-[11px] font-bold font-mono text-right px-2 py-1.5 text-white">{Math.abs(v)>=0.005?fN(v):'—'}</td></tr>; })()}

            {/* ── EGRESOS ──────────────────────────────────────────────────── */}
            <SectionHdr label="Egresos" color="#7f1d1d" skey="egr" />

            {!isCol('egr') && (<>
              {activeProjects.map(p => (
                <tr key={`cst-${p.id}`} className="hover:bg-gray-50">
                  <td className={`${LBL} pl-5 text-gray-500 bg-white`}>Costos Obra – {projCompletion?.[p.id]?.replacementName || p.name}</td>
                  <td className={`${TD} text-gray-300`}>—</td>
                  {Array.from({length:12},(_,i)=>i+1).map(m => {
                    const v = cfRows[m]?.costos?.[p.id]||0;
                    return <td key={m} className={`${TD} ${actBg(m)} ${v < -0.005?'text-red-600':'text-gray-300'}`}>{dash(v)}</td>;
                  })}

            `M ${toX(0)},${Math.min(toY(Math.max(cajaValues[0],0)), zeroY)}`,

            <circle key={i} cx={toX(i)} cy={toY(v)} r={4} fill="white" stroke={v<0?'#ef4444':'#1d4ed8'} strokeWidth="2"/>

            const lbl = Math.abs(v) >= 100 ? `${(v/1000).toFixed(0)}k` : Math.abs(v) >= 0.005 ? fN(v) : '0';

// ─── SVG CHARTS ──────────────────────────────────────────────────────────────

function SvgCompareLines({ data }) {
  const [hover, setHover] = useState(null);
  if (!data || !data.length) return null;
  const W = 480, H = 204, mt = 26, mr = 6, mb = 26, ml = 44;
  const pw = W - ml - mr, ph = H - mt - mb;
  const vals = data.flatMap(d => [d.ppto, d.real, d.proy].filter(v => v != null && isFinite(+v)).map(Number));
  const rawMin = Math.min(0, ...vals), rawMax = Math.max(0, ...vals);
  const pad = (rawMax - rawMin) * 0.08 || 1;
  const yMin = rawMin - pad, yMax = rawMax + pad, yRange = yMax - yMin;
  const sy = v => mt + ph * (1 - (v - yMin) / yRange);
  const sx = i => ml + (data.length > 1 ? i * pw / (data.length - 1) : pw / 2);
  const y0 = sy(0);
  const rawStep = yRange / 4;
  const mag = Math.pow(10, Math.floor(Math.log10(Math.abs(rawStep) || 1)));
  const niceStep = Math.ceil(rawStep / mag) * mag || 1;
  const ticks = [];
  for (let t = Math.ceil(yMin / niceStep) * niceStep; t <= yMax + 1e-9; t += niceStep) ticks.push(t);
  const fmt = v => Math.abs(v) >= 1000 ? `${(v/1000).toFixed(1)}k` : v.toFixed(0);
  const fmt1 = v => (+v || 0).toLocaleString('es-CL', { minimumFractionDigits: 1, maximumFractionDigits: 1 });
  const SERIES = [
    { key: 'ppto', color: '#94a3b8', label: 'Ppto',       dash: '5,3', width: 1.5 },
    { key: 'real', color: '#1d4ed8', label: 'Real',       dash: '',    width: 2.5 },
    { key: 'proy', color: '#10b981', label: 'Proyectado', dash: '',    width: 2.5 },
  ];
  const ptsFor = key => data.map((d, i) => {
    const v = d[key];
    return (v == null || isNaN(+v)) ? null : `${sx(i).toFixed(1)},${sy(+v).toFixed(1)}`;
  }).filter(Boolean).join(' ');
  const spacing = data.length > 1 ? pw / (data.length - 1) : pw;
  const tipW = 152, tipH = 66;
  const tipX = hover != null ? Math.min(Math.max(sx(hover) - tipW / 2, 2), W - tipW - 2) : 0;
  return (
    <svg viewBox={`0 0 ${W} ${H}`} width="100%" height={H} style={{ cursor: 'crosshair' }}
      onMouseLeave={() => setHover(null)}>
      {/* Leyenda (arriba, separada de los meses) */}
      {SERIES.map(({ color, label, dash }, i) => (
        <g key={'l'+i} transform={`translate(${ml + i * 92}, 11)`}>
          <line x1={0} y1={0} x2={14} y2={0} stroke={color} strokeWidth="2.5" strokeDasharray={dash || undefined} />
          <text x={18} y={3} fontSize="8" fill="#6b7280">{label}</text>
        </g>
      ))}
      {ticks.map((t, i) => {
        const y = sy(t);
        return <g key={i}>
          <line x1={ml} x2={W-mr} y1={y} y2={y} stroke="#f0f0f0" strokeWidth="0.8" />
          <text x={ml-4} y={y+3} textAnchor="end" fontSize="8" fill="#9ca3af">{fmt(t)}</text>
        </g>;
      })}
      <line x1={ml} x2={W-mr} y1={y0} y2={y0} stroke="#d1d5db" strokeWidth="1" />
      {SERIES.map(({ key, color, dash, width }, si) => {
        const pts = ptsFor(key);
        return pts ? <polyline key={si} points={pts} fill="none" stroke={color} strokeWidth={width}
          strokeDasharray={dash || undefined} strokeLinejoin="round" strokeLinecap="round" /> : null;
      })}
      {SERIES.map(({ key, color }, si) => (
        <g key={'m'+si}>
          {data.map((d, i) => {
            const v = d[key];
            return (v == null || isNaN(+v)) ? null : <circle key={i} cx={sx(i)} cy={sy(+v)} r="2.2" fill={color} />;
          })}
        </g>
      ))}
      {data.map((d, mi) => (
        <text key={mi} x={sx(mi)} y={H - 8} textAnchor="middle" fontSize="8" fill="#9ca3af">{d.mes}</text>
      ))}
      {/* Zonas sensibles al mouse + tooltip */}
      {data.map((d, i) => (
        <rect key={'h'+i} x={sx(i) - spacing / 2} y={mt} width={spacing} height={ph}
          fill="transparent" onMouseEnter={() => setHover(i)} />
      ))}
      {hover != null && (
        <g pointerEvents="none">
          <line x1={sx(hover)} y1={mt} x2={sx(hover)} y2={mt + ph} stroke="#64748b" strokeWidth="1" />
          {SERIES.map(({ key, color }, si) => {
            const v = data[hover]?.[key];
            return (v == null || isNaN(+v)) ? null : <circle key={si} cx={sx(hover)} cy={sy(+v)} r="3.2" fill={color} stroke="#fff" strokeWidth="1" />;
          })}
          <g transform={`translate(${tipX}, ${mt + 2})`}>
            <rect width={tipW} height={tipH} rx="6" fill="#1f2937" opacity="0.96" />
            <text x="10" y="16" fontSize="10" fontWeight="700" fill="#ffffff">{data[hover].mes} · EBITDA</text>
            {SERIES.map(({ key, color, label }, si) => {
              const v = data[hover]?.[key];
              return (
                <g key={'t'+si} transform={`translate(0, ${33 + si * 14})`}>
                  <circle cx="13" cy="-3" r="3" fill={color} />
                  <text x="22" y="0" fontSize="9" fill="#cbd5e1">{label}: <tspan fill="#ffffff" fontWeight="700">{(v == null || isNaN(+v)) ? '—' : fmt1(v) + ' UF'}</tspan></text>
                </g>
              );
            })}
          </g>
        </g>
      )}
    </svg>
  );
}

function SvgLineChart({ data }) {
  const [hover, setHover] = useState(null);
  if (!data || !data.length) return null;
  const W = 480, H = 190, mt = 6, mr = 6, mb = 26, ml = 44;
  const pw = W - ml - mr, ph = H - mt - mb;
  const vals = data.map(d => d.caja).filter(v => v != null && isFinite(v));
  if (!vals.length) return <div style={{height:H,display:'flex',alignItems:'center',justifyContent:'center',fontSize:11,color:'#9ca3af'}}>Sin datos de caja</div>;
  const rawMin = Math.min(0, ...vals), rawMax = Math.max(0, ...vals);
  const pad = (rawMax - rawMin) * 0.1 || 100;
  const yMin = rawMin - pad, yMax = rawMax + pad, yRange = yMax - yMin;
  const sy = v => mt + ph * (1 - (v - yMin) / yRange);
  const sx = i => ml + (data.length > 1 ? i * pw / (data.length - 1) : pw / 2);
  const y0 = sy(0);
  const rawStep = yRange / 4;
  const mag = Math.pow(10, Math.floor(Math.log10(Math.abs(rawStep) || 1)));
  const niceStep = Math.ceil(rawStep / mag) * mag || 1;
  const ticks = [];
  for (let t = Math.ceil(yMin / niceStep) * niceStep; t <= yMax + 1e-9; t += niceStep) ticks.push(t);
  const fmt = v => Math.abs(v) >= 1000 ? `${(v/1000).toFixed(1)}k` : v.toFixed(0);
  const pathD = data.reduce((acc, d, i) => {
    if (d.caja == null) return acc;
    return acc + `${acc ? 'L' : 'M'}${sx(i).toFixed(1)},${sy(d.caja).toFixed(1)} `;
  }, '');
  const spacing = data.length > 1 ? pw / (data.length - 1) : pw;
  const fmt1 = v => (+v || 0).toLocaleString('es-CL', { minimumFractionDigits: 1, maximumFractionDigits: 1 });
  const tipW = 132, tipH = 38;
  const tipX = hover != null ? Math.min(Math.max(sx(hover) - tipW / 2, 2), W - tipW - 2) : 0;
  const hv = hover != null ? data[hover]?.caja : null;
  return (
    <svg viewBox={`0 0 ${W} ${H}`} width="100%" height={H} style={{ cursor: 'crosshair' }}
      onMouseLeave={() => setHover(null)}>
      {ticks.map((t, i) => {
        const y = sy(t);
        return <g key={i}>
          <line x1={ml} x2={W-mr} y1={y} y2={y} stroke="#f0f0f0" strokeWidth="0.8" />
          <text x={ml-4} y={y+3} textAnchor="end" fontSize="8" fill="#9ca3af">{fmt(t)}</text>
        </g>;
      })}
      <line x1={ml} x2={W-mr} y1={y0} y2={y0} stroke="#ef4444" strokeWidth="1" strokeDasharray="4,3" />
      <path d={pathD} fill="none" stroke="#C8102E" strokeWidth="2.5" strokeLinejoin="round" strokeLinecap="round" />
      {data.map((d, i) => (
        <g key={i}>
          {d.caja != null && <circle cx={sx(i)} cy={sy(d.caja)} r="3" fill="#C8102E" />}
          <text x={sx(i)} y={H - 6} textAnchor="middle" fontSize="8" fill="#9ca3af">{d.mes}</text>
        </g>
      ))}
      {/* Zonas sensibles al mouse + tooltip */}
      {data.map((d, i) => (
        <rect key={'h'+i} x={sx(i) - spacing / 2} y={mt} width={spacing} height={ph}
          fill="transparent" onMouseEnter={() => setHover(i)} />
      ))}
      {hover != null && (
        <g pointerEvents="none">
          <line x1={sx(hover)} y1={mt} x2={sx(hover)} y2={mt + ph} stroke="#94a3b8" strokeWidth="1" />
          {hv != null && isFinite(hv) && <circle cx={sx(hover)} cy={sy(hv)} r="3.5" fill="#C8102E" stroke="#fff" strokeWidth="1.2" />}
          <g transform={`translate(${tipX}, ${mt + 2})`}>
            <rect width={tipW} height={tipH} rx="6" fill="#1f2937" opacity="0.96" />
            <text x="10" y="15" fontSize="10" fontWeight="700" fill="#ffffff">{data[hover].mes}</text>
            <text x="10" y="29" fontSize="9" fill="#cbd5e1">Caja: <tspan fill="#ffffff" fontWeight="700">{(hv == null || !isFinite(hv)) ? '—' : fmt1(hv) + ' UF'}</tspan></text>
          </g>
        </g>
      )}
    </svg>
  );
}

// ─── DASHBOARD ───────────────────────────────────────────────────────────────

function DashboardModule({ projects, activeYear }) {
  const year = activeYear;
  const fN = n => {
    const v = +n || 0;
    if (Math.abs(v) < 0.005) return '—';
    return v.toLocaleString('es-CL', { minimumFractionDigits: 1, maximumFractionDigits: 1 });
  };
  const fPct = p => p == null ? '—' : p.toFixed(1) + '%';

  const [refreshKey, setRefreshKey] = useState(0);
  const [periodoVistoDB, setPeriodoVistoDB] = useState('actual');
  React.useEffect(() => { setPeriodoVistoDB('actual'); }, [year]);
  const activeProjects = useMemo(() => projects.filter(p => p.startDate && p.endDate), [projects]);

  const controlMonth = useMemo(() => {
    for (let m = 12; m >= 1; m--) {
      try {
        const d = storage.get(`budget-control:actuals:${year}:${String(m).padStart(2,'0')}`);
        if (d?.rows?.length > 0) return m;
      } catch {}
    }
    return 0;
  }, [year, refreshKey]);

  const actualsForYear = useMemo(() => {
    const r = {};
    for (let m = 1; m <= 12; m++) {
      try {
        const d = storage.get(`budget-control:actuals:${year}:${String(m).padStart(2,'0')}`);
        if (d?.rows) r[m] = d.rows;
      } catch {}
    }
    return r;
  }, [year, refreshKey]);

  const mayorData = useMemo(() => {
    try {
      const d = storage.get('budget-control:mayor:latest');
      return (d?.ingresos?.byUN && d?.ingresos?.totalCLP != null) ? d.ingresos : null;
    } catch { return null; }
  }, [refreshKey]);

  const projSnapshot = useMemo(() => {
    try { return storage.get(`budget-control:proj-snapshot:${year}`) || null; } catch { return null; }
  }, [year, refreshKey]);

  const ocBudgetByCat = useMemo(() => {
    try { return storage.get(`budget-control:budget:${year}`)?.oficinaCentral || {}; } catch { return {}; }
  }, [year, refreshKey]);

  const otherIncomeBudget = useMemo(() => {
    try { return storage.get(`budget-control:budget:${year}`)?.otherIncome || {}; } catch { return {}; }
  }, [year, refreshKey]);

  const overrides = useMemo(() => {
    try { return storage.get(`budget-control:overrides:${year}`) || {}; } catch { return {}; }
  }, [year, refreshKey]);

  const cfData = useMemo(() => {
    try { return storage.get(`budget-control:cashflow:${year}`) || {}; } catch { return {}; }
  }, [year, refreshKey]);

  const INTERES_CTA = '5-2-01-002';
  const CATS_COSTO = PROJ_CATS.filter(c => c.id !== 'no_clasificado');

  const getReal = (unCode, cat, m) =>
    (actualsForYear[m] || []).filter(r => r.unCode === unCode && r.clasificacion === cat).reduce((s,r) => s+r.total, 0);
  const getOCReal = (concepto, m) =>
    (actualsForYear[m] || []).filter(r => r.clasificacion === 'oficina_central' && r.concepto === concepto).reduce((s,r) => s+r.total, 0);
  const getMayorRealUF = (unCode, m) => {
    if (!mayorData?.byUN?.[unCode]) return null;
    const mk = `${year}-${String(m).padStart(2,'0')}`;
    return Object.values(mayorData.byUN[unCode].byAccount).reduce((s, acc) => s + (acc.byMonthUF?.[mk] || 0), 0);
  };

  const monthly = useMemo(() => {
    const result = {};
    for (let m = 1; m <= 12; m++) {
      const isHist = m <= controlMonth;
      const mk = `${year}-${String(m).padStart(2,'0')}`;
      let ingReal=0, ingPpto=0, ingProy=0, cosReal=0, cosPpto=0, cosProy=0, ocReal=0, ocPpto=0, ocProy=0;

      activeProjects.forEach(p => {
        const proyUN = `UN${p.unCode.padStart(2,'0')}`;
        const ret = (+p.contract.retentionPercent || 0) / 100;
        const idx = projectMonthIdx(p, year, m-1);
        const pptoBase = idx === -1 ? 0
          : (p.contractType === 'suma_alzada'
            ? (+p.contract.originalAmount||0) * (p.revenueCurve?.[idx]||0)/100 * (1-ret)
            : (+p.contract.totalBudgetedCost||0) * (p.costCurve?.[idx]||0)/100 + (+p.contract.monthlyFee||0) + (+p.contract.monthlyGG||0));
        ingPpto += pptoBase;
        if (isHist) {
          const ov = overrides?.ingresos?.[p.id]?.[m];
          const mayorUF = getMayorRealUF(proyUN, m);
          const v = ov !== undefined ? +ov : (mayorUF !== null ? mayorUF : 0);
          ingReal += v; ingProy += v;
        } else {
          const ov = overrides?.ingresos?.[p.id]?.[m];
          const snapV = projSnapshot?.ingresos?.[p.id]?.[m];
          ingProy += ov !== undefined ? +ov : (snapV !== undefined ? +snapV : 0);
        }
        CATS_COSTO.forEach(c => {
          const pidx = projectMonthIdx(p, year, m-1);
          const ppto = pidx === -1 ? 0 : (+p.budgetByCategory?.[c.id]||0) * (p.costCurve?.[pidx]||0)/100;
          cosPpto += ppto;
          if (isHist) { const v = getReal(p.unCode, c.id, m); cosReal += v; cosProy += v; }
          else { const snapV = projSnapshot?.costos?.[p.id]?.[c.id]?.[m]; cosProy += snapV !== undefined ? +snapV : 0; }
        });
      });

      const asesorUF = mayorData?.byUN?.UN01
        ? Object.entries(mayorData.byUN.UN01.byAccount).filter(([cta]) => cta !== INTERES_CTA)
            .reduce((s,[,acc]) => s + (acc.byMonthUF?.[mk]||0), 0) : 0;
      const interUF = mayorData?.byUN?.UN01?.byAccount?.[INTERES_CTA]?.byMonthUF?.[mk] || 0;
      ingPpto += otherIncomeBudget?.asesorias?.[m-1] || 0;
      if (isHist) {
        const ov = overrides?.otrosIngresos?.[m];
        const v = ov !== undefined ? +ov : (asesorUF + interUF);
        ingReal += v; ingProy += v;
      } else {
        const ov = overrides?.otrosIngresos?.[m];
        const snapV = projSnapshot?.otrosIngresos?.[m];
        ingProy += ov !== undefined ? +ov : (snapV !== undefined ? +snapV : 0);
      }

      OC_PLAN.forEach(({ concepto, catId }) => {
        const ppto = ocBudgetByCat[catId]?.[m-1] || 0;
        ocPpto += ppto;
        if (isHist) { const v = concepto ? getOCReal(concepto, m) : 0; ocReal += v; ocProy += v; }
        else {
          const ov = overrides?.oc?.[concepto||catId]?.[m];
          const snapV = projSnapshot?.oc?.[catId]?.[m];
          ocProy += ov !== undefined ? +ov : (snapV !== undefined ? +snapV : ppto);
        }
      });

      result[m] = { ingReal, ingPpto, ingProy, cosReal, cosPpto, cosProy, ocReal, ocPpto, ocProy };
    }
    return result;
  }, [activeProjects, year, controlMonth, actualsForYear, projSnapshot, mayorData,
      ocBudgetByCat, otherIncomeBudget, overrides]);

  // Caja: SIEMPRE proviene del módulo Flujo de Caja (fuente canónica que persiste
  // budget-control:cashflow:{year}.cajaMensual con la fórmula completa: IVA
  // configurable, anticipos, CxC/CxP, inversionistas). Si aún no se calculó (no se
  // abrió Flujo de Caja para este año) devolvemos null y la UI muestra "—", en vez
  // de inventar una cifra con otra fórmula que divergía del módulo Flujo de Caja.
  const cajaMensual = useMemo(() => {
    const saved = cfData.cajaMensual;
    if (saved && Object.keys(saved).length === 12) return saved;
    return null;
  }, [cfData]);

  const kpis = useMemo(() => {
    let ingFY=0, cosFY=0, ocFY=0, pptoIng=0, pptoCos=0, pptoOC=0;
    for (let m = 1; m <= 12; m++) {
      const row = monthly[m] || {};
      const isHist = m <= controlMonth;
      ingFY += isHist ? row.ingReal : row.ingProy;
      cosFY += isHist ? row.cosReal : row.cosProy;
      ocFY  += isHist ? row.ocReal  : row.ocProy;
      pptoIng += row.ingPpto||0; pptoCos += row.cosPpto||0; pptoOC += row.ocPpto||0;
    }
    const ebitdaFY = ingFY - cosFY - ocFY;
    const margenOp = ingFY > 0.01 ? ebitdaFY / ingFY * 100 : null;
    const desvVsPpto = ebitdaFY - (pptoIng - pptoCos - pptoOC);
    return { ebitdaFY, ingFY, margenOp, desvVsPpto, cajaFinAnio: cajaMensual ? (cajaMensual[12] || 0) : null, controlMonth };
  }, [monthly, controlMonth, cajaMensual]);

  const chartData = useMemo(() => {
    let accPpto = 0, accRP = 0; // EBITDA acumulado: presupuesto y real+proyectado
    return Array.from({length:12}, (_,i) => {
      const m = i+1;
      const row = monthly[m] || {};
      const isHist = m <= controlMonth;
      const ing = isHist ? row.ingReal : row.ingProy;
      const cos = isHist ? row.cosReal : row.cosProy;
      const oc  = isHist ? row.ocReal  : row.ocProy;
      const ebMes  = (ing || 0) - (cos || 0) - (oc || 0);
      const ebPpto = (row.ingPpto || 0) - (row.cosPpto || 0) - (row.ocPpto || 0);
      accRP   += ebMes;
      accPpto += ebPpto;
      return {
        mes:  MONTH_ABR[i],
        // Acumulado mes a mes. Real (azul) histórico; Proyectado (verde) futuro +
        // mes de control para conectar; Presupuesto acumulado todo el año.
        real: isHist ? +accRP.toFixed(2) : null,
        ppto: +accPpto.toFixed(2),
        proy: (!isHist || m === controlMonth) ? +accRP.toFixed(2) : null,
        caja: cajaMensual ? +(cajaMensual[m] || 0).toFixed(2) : null,
      };
    });
  }, [monthly, controlMonth, cajaMensual]);

  const summaryRows = useMemo(() => {
    let ytdIng=0, ytdCos=0, ytdOC=0, fyIng=0, fyCos=0, fyOC=0, pptoIng=0, pptoCos=0, pptoOC=0;
    for (let m = 1; m <= 12; m++) {
      const row = monthly[m] || {};
      const isHist = m <= controlMonth;
      if (isHist) { ytdIng += row.ingReal; ytdCos += row.cosReal; ytdOC += row.ocReal; }
      fyIng += isHist ? row.ingReal : row.ingProy;
      fyCos += isHist ? row.cosReal : row.cosProy;
      fyOC  += isHist ? row.ocReal  : row.ocProy;
      pptoIng += row.ingPpto||0; pptoCos += row.cosPpto||0; pptoOC += row.ocPpto||0;
    }
    const ytdRes = ytdIng - ytdCos; const fyRes = fyIng - fyCos; const pptoRes = pptoIng - pptoCos;
    const ytdEB  = ytdRes - ytdOC;  const fyEB  = fyRes - fyOC;  const pptoEB  = pptoRes - pptoOC;
    return [
      { label: 'Ingresos Operacionales', ytd: ytdIng,  fy: fyIng,  ppto: pptoIng  },
      { label: 'Costos de Obra',         ytd: -ytdCos, fy: -fyCos, ppto: -pptoCos },
      { label: 'Resultado Operacional',  ytd: ytdRes,  fy: fyRes,  ppto: pptoRes,  bold: true },
      { label: 'Of. Central',            ytd: -ytdOC,  fy: -fyOC,  ppto: -pptoOC  },
      { label: 'EBITDA',                 ytd: ytdEB,   fy: fyEB,   ppto: pptoEB,   bold: true, hi: true },
    ];
  }, [monthly, controlMonth]);

  // Análisis EBITDA: descompone la diferencia Real+Proy vs Presupuesto en sus
  // causas (Ingresos, Costos de Obra, Oficina Central) para lectura del directorio.
  const ebitdaAnalysis = useMemo(() => {
    let fyIng=0, fyCos=0, fyOC=0, pIng=0, pCos=0, pOC=0;
    for (let m = 1; m <= 12; m++) {
      const row = monthly[m] || {};
      const isHist = m <= controlMonth;
      fyIng += isHist ? (row.ingReal||0) : (row.ingProy||0);
      fyCos += isHist ? (row.cosReal||0) : (row.cosProy||0);
      fyOC  += isHist ? (row.ocReal||0)  : (row.ocProy||0);
      pIng += row.ingPpto||0; pCos += row.cosPpto||0; pOC += row.ocPpto||0;
    }
    const ebFY = fyIng - fyCos - fyOC;
    const ebPpto = pIng - pCos - pOC;
    const totalVar = ebFY - ebPpto;
    const drivers = [
      { id:'ing', value: fyIng - pIng,
        pos:'Mayores ingresos que lo presupuestado', neg:'Menores ingresos que lo presupuestado' },
      { id:'cos', value: -(fyCos - pCos),
        pos:'Menores costos de obra (ahorro vs presupuesto)', neg:'Mayores costos de obra que lo presupuestado' },
      { id:'oc',  value: -(fyOC - pOC),
        pos:'Menor gasto de Oficina Central', neg:'Mayor gasto de Oficina Central' },
    ];
    const thr = Math.max(0.5, Math.abs(totalVar) * 0.05);
    const sorted = drivers.filter(d => Math.abs(d.value) > thr).sort((a,b) => Math.abs(b.value) - Math.abs(a.value));
    const pct = Math.abs(ebPpto) > 0.01 ? totalVar / Math.abs(ebPpto) * 100 : null;
    return { ebFY, ebPpto, totalVar, drivers: sorted.slice(0, 2), pct, hasData: fyIng !== 0 || pIng !== 0 };
  }, [monthly, controlMonth]);

  const projectTimeline = useMemo(() => activeProjects.map(p => {
    const [sy, sm] = (p.startDate || `${year}-01`).split('-').map(Number);
    const [ey, em] = (p.endDate   || `${year}-12`).split('-').map(Number);
    const startM = sy < year ? 1 : (sy === year ? sm : 13);
    const endM   = ey > year ? 12 : (ey === year ? em : 0);
    if (startM > 12 || endM < 1 || startM > endM) return null;
    // Avance físico real desde la curva S de Control de Obras (último control)
    const der = plazoScoreFromCurvas(getPlazoCurvas(year, p.id));
    const avance = der?.avanceReal != null ? Math.max(0, Math.min(100, der.avanceReal)) : null;
    return { id: p.id, name: p.name, startM, endM, avance };
  }).filter(Boolean), [activeProjects, year, refreshKey]);

  const noData = controlMonth === 0 && !projSnapshot;

  // ── Persistencia viva del snapshot del Dashboard ────────────────────────────
  // Mantiene `budget-control:dashboard-snapshot:{year}` al día con lo que se
  // renderiza ahora. buildGlobalSnapshot lo copia al cierre (modulos.dashboard),
  // congelándolo. No escribimos snapshots vacíos para no pisar uno significativo
  // previo. (Mismo patrón que el useEffect que persiste proj-snapshot.)
  React.useEffect(() => {
    if (noData) return;
    try {
      storage.set(`budget-control:dashboard-snapshot:${year}`,
        buildDashboardSnapshot({ year, controlMonth, kpis, chartData, summaryRows, ebitdaAnalysis, projectTimeline }));
    } catch {}
  }, [year, controlMonth, kpis, chartData, summaryRows, ebitdaAnalysis, projectTimeline, noData]);

  // ── Resolución de fuente: vivo (actual) vs congelado (período cerrado) ───────
  // En período cerrado leemos EXACTAMENTE lo que se congeló al cerrar ese mes
  // (getCierreModulo → modulos.dashboard). El cuerpo del render usa estas
  // variables `view*`, de modo que un mismo JSX sirve para ambos modos.
  const isClosedView = periodoVistoDB !== 'actual';
  const frozen = isClosedView ? getCierreModulo(year, periodoVistoDB, 'dashboard') : null;
  // Cierres anteriores a Fase 3 no tienen dashboard congelado → frozen === null
  // y mostramos "sin datos guardados" en vez de datos vivos.
  const frozenMissing = isClosedView && !frozen;
  const viewKpis           = isClosedView ? (frozen?.kpis           || {})  : kpis;
  const viewChartData      = isClosedView ? (frozen?.chartData      || [])  : chartData;
  const viewSummaryRows    = isClosedView ? (frozen?.summaryRows    || [])  : summaryRows;
  const viewEbitdaAnalysis = isClosedView ? (frozen?.ebitdaAnalysis || { hasData: false }) : ebitdaAnalysis;
  const viewTimeline       = isClosedView ? (frozen?.projectTimeline || []) : projectTimeline;
  const viewControlMonth   = isClosedView ? (frozen?.controlMonth ?? periodoVistoDB) : controlMonth;

  return (
    <div className="space-y-4">
      <div className="flex items-center justify-between">
        <div>
          <h1 className="text-base font-bold text-gray-800 uppercase tracking-wide">Dashboard Ejecutivo {year}</h1>
          <p className="text-[11px] text-gray-500 mt-0.5">
            {isClosedView
              ? (frozenMissing
                  ? `Período cerrado ${MONTH_ABR[periodoVistoDB-1]} ${year} · sin snapshot`
                  : `Congelado al cierre · datos reales hasta ${MONTH_ABR[viewControlMonth-1]} ${year}`)
              : controlMonth > 0
                ? `Datos reales hasta ${MONTH_ABR[controlMonth-1]} ${year} · Proyección hasta Dic ${year}`
                : projSnapshot ? `Sin datos reales · Proyección guardada`
                : `Sin datos para ${year}`}
          </p>
        </div>
        {!isClosedView && (
          <button onClick={() => setRefreshKey(k => k+1)}
            className="text-[11px] text-gray-500 border border-gray-200 rounded-lg px-3 py-1.5 hover:bg-gray-50">
            ↻ Actualizar
          </button>
        )}
      </div>

      <PeriodSelectorBar year={year} periodoVisto={periodoVistoDB} onChange={setPeriodoVistoDB} />
      {isClosedView && <SnapshotReadonlyBanner year={year} mes={periodoVistoDB} />}

      {noData && periodoVistoDB === 'actual' && (
        <div className="bg-amber-50 border border-amber-200 rounded-xl px-4 py-3 text-sm text-amber-700">
          Sin datos para {year}. Carga datos en <strong>Carga Datos Contabilidad</strong> y guarda una proyección en <strong>Proyecciones</strong>.
        </div>
      )}

      {frozenMissing && (
        <div className="bg-gray-50 rounded-xl border border-gray-200 p-8 text-center text-gray-400 text-sm">
          No hay datos de dashboard guardados para {MONTH_ABR[periodoVistoDB-1]} {year}.
          <div className="text-[11px] mt-1 text-gray-400">
            Este informe se cerró antes de que el Dashboard congelara sus datos. Volvé a cerrar el mes desde Reporte Manager para guardarlos.
          </div>
        </div>
      )}

      {!frozenMissing && (<>
      <div className="grid grid-cols-5 gap-3">
        {[
          { label: 'EBITDA Proyectado FY', value: fN(viewKpis.ebitdaFY) + ' UF',  color: viewKpis.ebitdaFY >= 0 ? 'text-emerald-600' : 'text-red-600', sub: 'Full Year ' + year },
          { label: 'Margen EBITDA',        value: fPct(viewKpis.margenOp),          color: (viewKpis.margenOp ?? 0) >= 0 ? 'text-blue-600' : 'text-red-600', sub: 'sobre Ingresos FY' },

            <div className="px-4 py-2.5 border-b border-gray-100 flex items-center justify-between">

              <span className="text-[9px] text-gray-400">Real + Proyectado vs Presupuesto · {year}</span>
            </div>
            <div className="p-4">
              <p className="text-[13px] text-gray-700 leading-relaxed">
                El <strong>EBITDA proyectado del año</strong> es de <strong className="font-mono">{fmt(a.ebFY)} UF</strong>,{' '}
                <strong className={fav ? 'text-emerald-600' : 'text-red-600'}>
                  {fmt(Math.abs(a.totalVar))} UF {fav ? 'por sobre' : 'bajo'} el presupuesto
                </strong>
                {a.pct != null && <span className="text-gray-400"> ({a.pct >= 0 ? '+' : ''}{a.pct.toFixed(1)}%)</span>}
                {' '}(presupuesto: <span className="font-mono">{fmt(a.ebPpto)} UF</span>).

              {a.drivers.length > 0 ? (

                    {a.drivers.length === 1 ? 'Razón principal' : 'Razones principales'}
                  </div>
                  {a.drivers.map(d => {
                    const favD = d.value >= 0;
                    return (

                        <span className={`mt-0.5 text-[11px] ${favD ? 'text-emerald-500' : 'text-red-500'}`}>{favD ? '▲' : '▼'}</span>
                        <div className="flex-1">
                          <span className="text-[12px] text-gray-700">{favD ? d.pos : d.neg}</span>
                          <span className={`ml-2 text-[12px] font-mono font-bold ${favD ? 'text-emerald-600' : 'text-red-600'}`}>

                          </span>
                        </div>
                      </div>
                    );
                  })}
                </div>
              ) : (
                <p className="mt-2 text-[12px] text-gray-400">El EBITDA proyectado está en línea con el presupuesto, sin desviaciones relevantes.</p>
              )}
              <p className="mt-3 text-[9px] text-gray-300">Análisis automático: descompone la brecha de EBITDA en ingresos, costos de obra y oficina central.</p>
            </div>
          </div>
        );
      })()}

      <div className="grid grid-cols-3 gap-4">
        <div className="col-span-2 bg-white rounded-xl border border-gray-100 shadow-sm overflow-hidden">
          <div className="px-4 py-2.5 border-b border-gray-100">
            <h3 className="text-[10px] font-bold text-gray-500 uppercase tracking-wider">Resumen Financiero</h3>
          </div>
          <table className="w-full text-[11px]">
            <thead>
              <tr className="bg-gray-50">
                <th className="text-left px-4 py-2 font-semibold text-gray-500 text-[10px] uppercase">Concepto</th>
                <th className="text-right px-3 py-2 font-semibold text-gray-500 text-[10px] uppercase">YTD Real</th>
                <th className="text-right px-3 py-2 font-semibold text-gray-500 text-[10px] uppercase">FY Proyectado</th>
                <th className="text-right px-3 py-2 font-semibold text-gray-500 text-[10px] uppercase">FY Presupuesto</th>
                <th className="text-right px-3 py-2 font-semibold text-gray-500 text-[10px] uppercase">Δ Ppto</th>
              </tr>
            </thead>
            <tbody>
              {viewSummaryRows.map((row, i) => (
                <tr key={i} className={`border-t border-gray-50 ${row.hi ? 'bg-emerald-50' : row.bold ? 'bg-gray-50/60' : 'hover:bg-gray-50'}`}>
                  <td className={`px-4 py-2 ${row.bold ? 'font-semibold text-gray-700' : 'text-gray-500'}`}>{row.label}</td>
                  <td className={`px-3 py-2 text-right font-mono whitespace-nowrap ${row.bold?'font-semibold':''} ${row.ytd < -0.005 ? 'text-red-600' : 'text-gray-700'}`}>{fN(row.ytd)}</td>
                  <td className={`px-3 py-2 text-right font-mono whitespace-nowrap ${row.bold?'font-semibold':''} ${row.fy < -0.005 ? 'text-red-600' : 'text-gray-700'}`}>{fN(row.fy)}</td>
                  <td className="px-3 py-2 text-right font-mono whitespace-nowrap text-gray-400">{fN(row.ppto)}</td>
                  <td className={`px-3 py-2 text-right font-mono whitespace-nowrap ${row.bold?'font-semibold':''} ${(row.fy-row.ppto)>=0?'text-emerald-600':'text-amber-600'}`}>{fN(row.fy-row.ppto)}</td>
                </tr>

        </div>

        <div className="bg-white rounded-xl border border-gray-100 shadow-sm overflow-hidden">
          <div className="px-4 py-2.5 border-b border-gray-100 flex items-center justify-between">
            <h3 className="text-[10px] font-bold text-gray-500 uppercase tracking-wider">Cronograma {year}</h3>
            {viewTimeline.some(p => p.avance != null) && (
              <span className="flex items-center gap-1.5 text-[9px] text-gray-400">
                <span style={{ width: 14, height: 8, background: 'rgba(239,68,68,0.40)', borderRight: '2px solid rgba(220,38,38,0.85)', display: 'inline-block', borderRadius: 2 }} />

            <div className="flex ml-16">
              {MONTH_ABR.map((lbl,i) => (
                <div key={i} style={{width:`${100/12}%`}} className="text-center text-[9px] text-gray-400">{lbl}</div>
              ))}
            </div>
            {viewTimeline.length === 0 ? (
              <p className="text-xs text-gray-400 text-center py-4">Sin proyectos activos</p>
            ) : viewTimeline.map(p => (
              <div key={p.id} className="flex items-center gap-1">
                <div className="w-16 text-[9px] text-gray-600 truncate flex-shrink-0" title={p.name}>{p.name}</div>
                <div className="flex-1 h-5 relative bg-gray-100 rounded overflow-hidden">
                  <div className="absolute h-full rounded text-[9px] text-white flex items-center px-1 overflow-hidden"
                    style={{
                      left:`${(p.startM-1)/12*100}%`,
                      width:`${(p.endM-p.startM+1)/12*100}%`,
                      background:'linear-gradient(90deg,#1d4ed8,#3b82f6)',

                    }}>
                    {p.endM - p.startM >= 2 ? p.name : ''}
                  </div>
                  {p.avance != null && p.avance > 0 && (
                    <div className="absolute h-full pointer-events-none flex items-center justify-end px-1"
                      title={`Avance físico: ${p.avance.toLocaleString('es-CL',{maximumFractionDigits:1})}%`}
                      style={{
                        left:`${(p.startM-1)/12*100}%`,
                        width:`${(p.endM-p.startM+1)/12 * p.avance}%`,

                        borderRight:'2px solid rgba(220,38,38,0.85)'
                      }}>
                      <span className="text-[8px] font-bold text-white" style={{textShadow:'0 0 2px rgba(0,0,0,0.5)'}}>
                        {p.avance >= 12 ? `${p.avance.toLocaleString('es-CL',{maximumFractionDigits:0})}%` : ''}
                      </span>

                  )}

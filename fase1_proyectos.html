// Gráfico SVG curva S: avance programado vs controlado (con tooltip al pasar el mouse)
function PlazoSCurveChart({ months, programada, controlada }) {
  const [hover, setHover] = useState(null);
  const n = months.length;
  if (!n) return null;
  const W = 900, H = 320, padL = 44, padR = 16, padT = 14, padB = 48;
  const plotW = W - padL - padR, plotH = H - padT - padB;
  const x = i => padL + (n <= 1 ? plotW / 2 : i * (plotW / (n - 1)));
  const y = v => padT + plotH * (1 - Math.max(0, Math.min(100, v)) / 100);
  const valAt = (arr, i) => { const v = arr?.[i]; return (v == null || v === '' || isNaN(+v)) ? null : +v; };
  const ptsFrom = arr => months.map((_, i) => {
    const v = valAt(arr, i);
    return v == null ? null : `${x(i).toFixed(1)},${y(v).toFixed(1)}`;
  }).filter(Boolean).join(' ');
  const progPts = ptsFrom(programada);
  const ctrlPts = ptsFrom(controlada);
  const labelStep = Math.max(1, Math.ceil(n / 14));
  const derived = plazoScoreFromCurvas({ meses: months, programada, controlada });
  const spacing = n > 1 ? plotW / (n - 1) : plotW;

  const hProg = hover != null ? valAt(programada, hover) : null;
  const hCtrl = hover != null ? valAt(controlada, hover) : null;
  const tipW = 168, tipH = 60;
  const tipX = hover != null ? Math.min(Math.max(x(hover) + 12, 4), W - tipW - 4) : 0;

  return (
    <svg viewBox={`0 0 ${W} ${H}`} width="100%" style={{ height: 320, cursor: 'crosshair' }}
      onMouseLeave={() => setHover(null)}>
      {[0, 20, 40, 60, 80, 100].map(g => (
        <g key={g}>
          <line x1={padL} y1={y(g)} x2={W - padR} y2={y(g)} stroke="#e5e7eb" strokeWidth="1" />
          <text x={padL - 6} y={y(g) + 3} textAnchor="end" fontSize="9" fill="#9ca3af">{g}%</text>
        </g>
      ))}
      {months.map((mk, i) => (i % labelStep === 0 || i === n - 1) ? (
        <text key={i} x={x(i)} y={H - padB + 14} textAnchor="end" fontSize="8" fill="#9ca3af"
          transform={`rotate(-45 ${x(i)} ${H - padB + 14})`}>{monthKeyLabel(mk)}</text>
      ) : null)}
      {derived && (
        <line x1={x(derived.idx)} y1={padT} x2={x(derived.idx)} y2={H - padB} stroke="#94a3b8" strokeWidth="1" strokeDasharray="4,3" />
      )}
      {progPts && <polyline points={progPts} fill="none" stroke="#2563eb" strokeWidth="2.5" strokeLinejoin="round" />}
      {ctrlPts && <polyline points={ctrlPts} fill="none" stroke="#D01030" strokeWidth="2.5" strokeLinejoin="round" />}
      {derived && <circle cx={x(derived.idx)} cy={y(derived.avancePlan)} r="3.5" fill="#2563eb" />}
      {derived && <circle cx={x(derived.idx)} cy={y(derived.avanceReal)} r="3.5" fill="#D01030" />}
      {/* Etiquetas % mensuales — firma sutil, gris oscuro, 1 decimal */}
      {months.map((mk, i) => {
        const v = valAt(programada, i);
        return v == null ? null : <text key={'p' + i} x={x(i)} y={y(v) - 5} textAnchor="middle" fontSize="7" fill="#374151">{fmtCL1(v)}</text>;
      })}
      {months.map((mk, i) => {
        const v = valAt(controlada, i);
        return v == null ? null : <text key={'c' + i} x={x(i)} y={y(v) + 10} textAnchor="middle" fontSize="7" fill="#374151">{fmtCL1(v)}</text>;
      })}
      {/* Zonas sensibles al mouse (una por mes) */}
      {months.map((mk, i) => (
        <rect key={'hit' + i} x={x(i) - spacing / 2} y={padT} width={spacing} height={plotH}
          fill="transparent" onMouseEnter={() => setHover(i)} />
      ))}
      {/* Guía vertical + ventanita con los datos del mes */}
      {hover != null && (
        <g pointerEvents="none">
          <line x1={x(hover)} y1={padT} x2={x(hover)} y2={H - padB} stroke="#64748b" strokeWidth="1" />
          {hProg != null && <circle cx={x(hover)} cy={y(hProg)} r="4" fill="#2563eb" stroke="#fff" strokeWidth="1.2" />}
          {hCtrl != null && <circle cx={x(hover)} cy={y(hCtrl)} r="4" fill="#D01030" stroke="#fff" strokeWidth="1.2" />}
          <g transform={`translate(${tipX}, 6)`}>
            <rect width={tipW} height={tipH} rx="6" fill="#1f2937" opacity="0.96" />
            <text x="10" y="18" fontSize="10.5" fontWeight="700" fill="#ffffff">{monthKeyLabel(months[hover])}</text>
            <circle cx="13" cy="33" r="3.5" fill="#3b82f6" />
            <text x="22" y="36" fontSize="9.5" fill="#cbd5e1">Programado: <tspan fill="#ffffff" fontWeight="700">{hProg != null ? fmtCL1(hProg) + '%' : '—'}</tspan></text>
            <circle cx="13" cy="49" r="3.5" fill="#ef4444" />
            <text x="22" y="52" fontSize="9.5" fill="#cbd5e1">Real controlado: <tspan fill="#ffffff" fontWeight="700">{hCtrl != null ? fmtCL1(hCtrl) + '%' : '—'}</tspan></text>
          </g>
        </g>
      )}
    </svg>
  );
}

// Panel de carga + gráfico de la curva S de avance (área Plazo)
function PlazoCurvaPanel({ project, year, onChange }) {
  const months = useMemo(() => projectScheduleMonths(project, year), [project, year]);
  const [curvas, setCurvas] = useState(() => getPlazoCurvas(year, project.id));
  useEffect(() => { setCurvas(getPlazoCurvas(year, project.id)); }, [project, year]);

  const reload = () => { setCurvas(getPlazoCurvas(year, project.id)); onChange && onChange(); };
  const parsePct = (raw) => {
    const s = String(raw ?? '').replace(',', '.').replace(/[^\d.\-]/g, '');
    if (s === '' || s === '-' || s === '.') return '';
    const nn = parseFloat(s);
    return isNaN(nn) ? '' : nn;
  };

  function downloadTemplate() {
    if (!months.length) { alert('Este proyecto no tiene rango de plazo proyectado definido en Proyecciones (inicio/término).'); return; }
    const header = ['Mes', 'Avance Programado (%)', 'Avance Controlado (%)'];
    const rows = months.map((mk, i) => [mk, curvas?.programada?.[i] ?? '', curvas?.controlada?.[i] ?? '']);
    const ws = XLSX.utils.aoa_to_sheet([header, ...rows]);
    ws['!cols'] = [{ wch: 12 }, { wch: 22 }, { wch: 22 }];
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'Curva Avance');
    const safe = String(project.name || 'proyecto').replace(/[^\w\- ]/g, '').slice(0, 30).trim();
    XLSX.writeFile(wb, `Curva_Avance_${safe}_${year}.xlsx`);
  }

  function handleUpload(e) {
    const file = e.target.files?.[0];
    if (!file) return;
    e.target.value = '';
    if (!months.length) { alert('Define primero el rango de plazo del proyecto en Proyecciones.'); return; }
    const reader = new FileReader();
    reader.onload = ev => {
      try {
        const wb = XLSX.read(ev.target.result, { type: 'array' });
        const ws = wb.Sheets[wb.SheetNames[0]];
        const data = XLSX.utils.sheet_to_json(ws, { header: 1, raw: false, defval: '' });
        const rows = data.slice(1); // saltar encabezado
        // Normaliza la celda "Mes" a 'YYYY-MM' (tolera que Excel la convierta a fecha)
        const normMonthKey = (raw) => {
          const s = String(raw ?? '').trim();
          let m = s.match(/^(\d{4})[-/](\d{1,2})(?![\d])/);
          if (m) return `${m[1]}-${String(+m[2]).padStart(2, '0')}`;
          m = s.match(/^(\d{4})-(\d{2})-\d{2}/);
          if (m) return `${m[1]}-${m[2]}`;
          return null;
        };
        const byMonth = {};
        rows.forEach(row => {
          const mk = normMonthKey(row[0]);
          if (mk) byMonth[mk] = { prog: parsePct(row[1]), ctrl: parsePct(row[2]) };
        });
        const matched = months.filter(mk => byMonth[mk] !== undefined).length;
        let programada, controlada;
        if (matched >= Math.min(3, months.length)) {
          // Coincidencia por mes (robusto ante reordenamiento)
          programada = months.map(mk => byMonth[mk]?.prog ?? '');
          controlada = months.map(mk => byMonth[mk]?.ctrl ?? '');
        } else {
          // Fallback: por orden de filas del template
          programada = months.map((_, i) => rows[i] ? parsePct(rows[i][1]) : '');
          controlada = months.map((_, i) => rows[i] ? parsePct(rows[i][2]) : '');
        }
        const anyVal = programada.some(v => v !== '') || controlada.some(v => v !== '');
        if (!anyVal) { alert('El archivo no contiene valores de avance. Completa las columnas Programado/Controlado y vuelve a subir.'); return; }
        savePlazoCurvas(year, project.id, { meses: months, programada, controlada });
        reload();
      } catch (err) {
        alert('Error al leer el archivo: ' + err.message);
      }
    };
    reader.readAsArrayBuffer(file);
  }

  function clearCurvas() {
    if (!confirm('¿Borrar las curvas de avance de este proyecto?')) return;
    savePlazoCurvas(year, project.id, null);
    reload();
  }

  const derived = curvas ? plazoScoreFromCurvas(curvas) : null;
  const hasCurvas = !!(curvas && ((curvas.programada || []).some(v => v !== '' && v != null) || (curvas.controlada || []).some(v => v !== '' && v != null)));

  return (
    <div className="bg-white rounded-2xl border border-gray-100 shadow-sm overflow-hidden">
      <div className="flex flex-wrap items-center gap-2 px-4 pt-3 pb-2 border-b border-gray-100">
        <span className="text-lg">📅</span>
        <span className="text-[13px] font-bold text-gray-700">Plazo — Curva S de Avance Físico</span>
        <span className="text-[10px] text-gray-400">{months.length} meses · programado vs controlado</span>
        <div className="ml-auto flex items-center gap-2">
          <Btn variant="ghost" size="sm" onClick={downloadTemplate}>⬇ Template</Btn>
          <label className="text-[11px] font-semibold px-3 py-1.5 rounded-lg bg-[#1C3460] text-white hover:bg-[#2d4f7f] cursor-pointer transition-colors">
            ⬆ Subir curvas
            <input type="file" accept=".xlsx,.xls,.csv" className="hidden" onChange={handleUpload} />
          </label>
          {hasCurvas && <Btn variant="ghost" size="sm" onClick={clearCurvas}>🗑</Btn>}
        </div>
      </div>
      <div className="p-4">
        {!months.length ? (
          <div className="text-[12px] text-gray-400 py-8 text-center">
            Define el inicio y término del proyecto (módulo Proyecciones) para habilitar la curva de avance.
          </div>
        ) : !hasCurvas ? (
          <div className="text-[12px] text-gray-400 py-8 text-center">
            Aún no hay curvas cargadas. Descarga el template, completa <strong>Avance Programado</strong> y <strong>Avance Controlado</strong> (curva S acumulada, %), y súbelo.
          </div>
        ) : (
          <>
            <div className="flex flex-wrap items-center gap-4 mb-2">
              <span className="flex items-center gap-1.5 text-[11px] text-gray-600"><span style={{ width: 14, height: 3, background: '#2563eb', display: 'inline-block', borderRadius: 2 }} /> Programado</span>
              <span className="flex items-center gap-1.5 text-[11px] text-gray-600"><span style={{ width: 14, height: 3, background: '#D01030', display: 'inline-block', borderRadius: 2 }} /> Controlado (real)</span>
              {derived && (
                <span className="ml-auto text-[11px] font-semibold flex flex-wrap items-center gap-x-3 gap-y-1">
                  <span className="text-gray-500">Al control ({derived.monthKey ? monthKeyLabel(derived.monthKey) : '—'}):</span>
                  <span className="text-blue-700">Prog {fmtCL1(derived.avancePlan)}%</span>
                  <span className="text-[#D01030]">Real {fmtCL1(derived.avanceReal)}%</span>
                  <span className={`px-1.5 py-0.5 rounded ${derived.avanceReal >= derived.avancePlan ? 'bg-blue-50 text-blue-600' : 'bg-red-50 text-red-500'}`}>
                    {derived.avanceReal - derived.avancePlan >= 0 ? '+' : ''}{fmtCL1(derived.avanceReal - derived.avancePlan)} pts
                  </span>
                </span>
              )}
            </div>
            <PlazoSCurveChart months={months} programada={curvas.programada} controlada={curvas.controlada} />
          </>
        )}
      </div>
    </div>
  );
}

function ControlObrasModule({ projects, activeYear }) {
  const year = activeYear;
  const pad = m => String(m).padStart(2, '0');
  const activeProjects = useMemo(() => projects.filter(p => p.startDate && p.endDate), [projects]);
  const [selTab, setSelTab] = useState(() => activeProjects[0]?.id || null);

  // Mes de control por defecto = último mes con reales; si no hay, mes actual
  const controlMonth = useMemo(() => {
    for (let m = 12; m >= 1; m--) {
      try { const d = storage.get(`budget-control:actuals:${year}:${pad(m)}`); if (d?.rows?.length > 0) return m; } catch {}
    }
    return (new Date().getFullYear() === year) ? (new Date().getMonth() + 1) : 12;
  }, [year]);
  const [mes, setMes] = useState(controlMonth);
  useEffect(() => { setMes(controlMonth); }, [controlMonth, year]);

  const projCompletion = useMemo(() => {
    try { return storage.get(`budget-control:proj-completion:${year}`) || {}; } catch { return {}; }
  }, [year]);

  // Estado de captura: { [projectId]: { [mm]: { area: {field:val} } } }
  const [data, setData] = useState(() => { try { return storage.get(`budget-control:control-obras:${year}`) || {}; } catch { return {}; } });
  useEffect(() => { try { setData(storage.get(`budget-control:control-obras:${year}`) || {}); } catch { setData({}); } }, [year]);
  const [dirty, setDirty] = useState(false);
  const [curvaRefresh, setCurvaRefresh] = useState(0);

  useEffect(() => {
    if (!selTab || !activeProjects.find(p => p.id === selTab)) setSelTab(activeProjects[0]?.id || null);
  }, [activeProjects]);

  const selProject = activeProjects.find(p => p.id === selTab) || activeProjects[0];
  const mm = pad(mes);
  // Mes ya cerrado (informe inmutable): no se editan indicadores retroactivamente.
  const isClosed = useMemo(() => getCierresList(year).includes(mes), [year, mes]);
  const curVals = (selProject && data?.[selProject.id]?.[mm]) || {};

  // Avance real/programado derivado de las curvas S (si están cargadas) → alimenta Plazo
  const plazoDerived = useMemo(
    () => selProject ? plazoScoreFromCurvas(getPlazoCurvas(year, selProject.id)) : null,
    [selProject, year, curvaRefresh]
  );

  const setField = (areaId, fieldKey, val) => {
    if (isClosed) return;
    setData(prev => {
      const next = JSON.parse(JSON.stringify(prev || {}));
      next[selProject.id] = next[selProject.id] || {};
      next[selProject.id][mm] = next[selProject.id][mm] || {};
      next[selProject.id][mm][areaId] = next[selProject.id][mm][areaId] || {};
      next[selProject.id][mm][areaId][fieldKey] = val;
      return next;
    });
    setDirty(true);
  };

  const save = () => { if (isClosed) return; storage.set(`budget-control:control-obras:${year}`, data); setDirty(false); };

  if (!activeProjects.length) {
    return (
      <div className="flex flex-col items-center justify-center h-64 gap-2 text-gray-400">
        <span className="text-4xl">🚧</span>
        <span className="text-sm font-medium">No hay proyectos configurados</span>
        <span className="text-xs">Cree proyectos en el módulo Proyectos para registrar indicadores</span>
      </div>
    );
  }

  // Score global previsto con lo ingresado + económico automático
  const previewSC = selProject ? buildScorecard(selProject, year, curVals) : {};
  const scores = SC_INDICADORES.map(i => previewSC[i.id]?.score).filter(s => s != null);
  const globalScore = scores.length ? Math.round(scores.reduce((a, b) => a + b, 0) / scores.length) : null;

  return (
    <div className="space-y-5">
      {/* Cabecera */}
      <div className="flex items-center gap-3 flex-wrap">
        <div className="w-1 h-8 rounded-full" style={{background:'#D01030'}} />
        <div>
          <h1 className="text-xl font-bold text-gray-900 leading-tight">Control de Obras</h1>
          <p className="text-xs text-gray-400 mt-0.5">Captura manual de indicadores de gestión por proyecto · {year}</p>
        </div>
        <div className="ml-auto flex items-center gap-3">
          <div className="flex items-center gap-2">
            <span className="text-[11px] text-gray-400 font-medium">Mes:</span>
            <select value={mes} onChange={e => setMes(+e.target.value)}
              className="border border-gray-200 rounded-lg px-3 py-1.5 text-sm outline-none focus:border-[#D01030] bg-white">
              {MONTH_ABR.map((m, i) => <option key={i} value={i + 1}>{m} {year}</option>)}
            </select>
          </div>
          <Btn variant={dirty && !isClosed ? 'primary' : 'ghost'} onClick={save} disabled={!dirty || isClosed}>
            {isClosed ? '🔒 Mes cerrado' : dirty ? '● Guardar Cambios' : '✓ Guardado'}
          </Btn>
        </div>
      </div>

      {isClosed && (
        <div className="flex items-center gap-2 bg-blue-50 border border-blue-200 rounded-xl px-4 py-2.5 text-[11px] text-blue-700">
          <span>🔒</span> {MONTH_ABR[mes-1]} {year} es un mes cerrado (informe inmutable). Los indicadores son de solo lectura; elegí un mes abierto para editar.
        </div>
      )}
      {/* Tabs de proyectos */}
      <div className="flex flex-wrap items-center gap-1 bg-white rounded-xl border border-gray-200 p-1 shadow-sm w-fit max-w-full">
        {activeProjects.map(p => {
          const name = projCompletion?.[p.id]?.replacementName || p.name;
          const isSel = p.id === selTab;
          const hasAny = OBRAS_AREAS.some(a => obrasAreaHasData(data?.[p.id]?.[mm]?.[a.id]));
          return (
            <button key={p.id} onClick={() => setSelTab(p.id)}
              className={`flex items-center px-3 py-1.5 rounded-lg text-xs font-semibold transition-all ${isSel
                ? 'bg-[#D01030] text-white shadow-sm'
                : 'text-gray-500 hover:text-gray-700 hover:bg-gray-50'}`}>
              <span className="font-mono text-[9px] mr-1 opacity-60">{p.unCode}</span>
              {name}
              {hasAny && <span className={`ml-1.5 w-1.5 h-1.5 rounded-full ${isSel ? 'bg-white' : 'bg-emerald-400'}`} />}
            </button>
          );
        })}
      </div>

      {selProject && (
        <>
          {/* Curva S de avance físico (área Plazo) */}
          <PlazoCurvaPanel project={selProject} year={year} onChange={() => setCurvaRefresh(k => k + 1)} />

          {/* Formularios de las 5 áreas manuales */}
          <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
            {OBRAS_AREAS.map(area => {
              let vals = curVals?.[area.id] || {};
              const usaCurva = area.id === 'plazo' && plazoDerived;
              const curvaMap = usaCurva ? { avanceReal: plazoDerived.avanceReal, avancePlan: plazoDerived.avancePlan } : {};
              if (usaCurva && plazoDerived.desfaseSemanas != null) curvaMap.desfaseSemanas = Math.round(plazoDerived.desfaseSemanas * 10) / 10;
              if (usaCurva) vals = { ...vals, ...curvaMap };
              const sc = scoreObrasArea(area.id, vals);
              const rag = ragSC(sc);
              return (
                <div key={area.id} className="bg-white rounded-2xl border border-gray-100 shadow-sm overflow-hidden">
                  <div className="flex items-center justify-between px-4 pt-3 pb-2" style={{borderBottom:`2px solid ${area.accent}30`}}>
                    <div className="flex items-center gap-2">
                      <span className="text-lg">{area.icon}</span>
                      <span className="text-[12px] font-bold text-gray-700">{area.title}</span>
                    </div>
                    <div className="flex items-center gap-2">
                      <span className="text-[10px] text-gray-400">Score</span>
                      <span className="text-[13px] font-bold font-mono" style={{color: sc != null ? RAG_SC[rag].dot : '#cbd5e1'}}>
                        {sc != null ? sc : '—'}
                      </span>
                    </div>
                  </div>
                  <div className="p-3 grid grid-cols-1 sm:grid-cols-2 gap-2" style={{background: area.lightBg}}>
                    {area.fields.map(f => {
                      const curvaVal = curvaMap[f.key];
                      const fromCurva = usaCurva && curvaVal != null;
                      if (fromCurva) {
                        const isDesf = f.key === 'desfaseSemanas';
                        const disp = f.type === 'pct'
                          ? `${fmtCL1(curvaVal)}%`
                          : isDesf
                            ? `${curvaVal > 0 ? '+' : ''}${fmtCL1(curvaVal)} sem`
                            : `${fmtCL1(curvaVal)}${f.unit ? ' ' + f.unit : ''}`;
                        const valColor = isDesf
                          ? (curvaVal < -0.05 ? '#dc2626' : curvaVal > 0.05 ? '#2563eb' : '#6b7280')
                          : '#1d4ed8';
                        return (
                          <div key={f.key} className="flex items-center justify-between gap-2 px-3 py-2 rounded-lg border border-blue-200 bg-blue-50/60">
                            <span className="text-[11px] text-gray-600">{f.label}</span>
                            <span className="text-[12px] font-mono font-semibold flex items-center gap-1" style={{ color: valColor }}>
                              {disp} <span className="text-[8px] text-blue-400 uppercase">curva</span>
                            </span>
                          </div>
                        );
                      }
                      return (
                        <ObrasField key={f.key} field={f}
                          value={vals?.[f.key]}
                          onChange={v => setField(area.id, f.key, v)} disabled={isClosed} />
                      );
                    })}
                  </div>
                </div>
              );
            })}
          </div>

          {/* Pie: score global previsto */}
          <div className="flex items-center justify-between bg-[#1C3460] rounded-2xl px-5 py-3 text-white">
            <div>
              <div className="text-[10px] uppercase tracking-widest font-bold opacity-70">Score Global Previsto · {selProject && (projCompletion?.[selProject.id]?.replacementName || selProject.name)}</div>
              <div className="text-[10px] opacity-50">Económico (automático) + 5 áreas manuales · se refleja en Panel de Control</div>
            </div>
            <div className="text-3xl font-extrabold font-mono">{globalScore != null ? globalScore : '—'}</div>
          </div>

          {dirty && (
            <div className="flex items-center gap-2 bg-amber-50 border border-amber-200 rounded-xl px-4 py-2.5 text-[11px] text-amber-700">
              <span>⚠</span> Tienes cambios sin guardar. Presiona <strong>Guardar Cambios</strong> para registrarlos.
            </div>
          )}
        </>
      )}
    </div>
  );
}

// ─── CONTROL DE COSTOS ─────────────────────────────────────────────────────────
// Vista interna (Estrategia A): presupuesto vs real acumulado al corte por proyecto
// × 8 categorías, con estados de control. Reusa los datos que el monolito ya tiene
// (actuals via getReal, budgetByCategory, classifyManagerCode). Lógica de variación
// y estados = port de ICEMM/informe_lq.py:294-318 (espejo de src/lib/controlCostos.js,
// testeado: 16 tests). NO conecta a PRESTO ni convierte UF.

// Variación y estado (idéntico a src/lib/controlCostos.js / informe_lq.py:294-318).
function ccVariacion(pptoUf, realUf) {
  const ppto = +pptoUf || 0, real = +realUf || 0;
  const variacionUf = real - ppto;
  const variacionPct = ppto !== 0 ? (variacionUf / ppto) * 100 : null;
  return { ppto, real, variacionUf, variacionPct };
}
function ccEstado(pptoUf, realUf) {
  const real = +realUf || 0;
  if (real === 0) return 'SIN EJECUCION';
  const { variacionPct } = ccVariacion(pptoUf, realUf);
  if (variacionPct === null) return 'SOLO REAL';
  if (variacionPct > 15) return 'CRITICO';
  if (variacionPct > 5)  return 'ALERTA';
  if (variacionPct >= -5) return 'EN CONTROL';
  return 'FAVORABLE';
}
const CC_ESTADO_STYLE = {
  'CRITICO':       'bg-red-100 text-red-700',
  'ALERTA':        'bg-orange-100 text-orange-700',
  'EN CONTROL':    'bg-emerald-100 text-emerald-700',
  'FAVORABLE':     'bg-blue-100 text-blue-700',
  'SIN EJECUCION': 'bg-gray-100 text-gray-500',
  'SOLO REAL':     'bg-amber-100 text-amber-700',
};

function ControlCostosModule({ projects, activeYear }) {
  const year = activeYear;
  const activeProjects = useMemo(() => projects.filter(p => p.startDate && p.endDate), [projects]);
  const [selId, setSelId] = useState(() => activeProjects[0]?.id || null);
  // Si cambia la lista de proyectos y el seleccionado ya no existe, reencuadrar al primero.
  useEffect(() => {
    if (!activeProjects.some(p => p.id === selId)) setSelId(activeProjects[0]?.id || null);
  }, [activeProjects, selId]);

  // URL de la app Control de Costos desplegada (Presto). Configurable y persistida.
  const [ccUrl, setCcUrl] = useState(() => {
    try { return storage.get('budget-control:cc-url') || 'http://187.127.29.98'; } catch { return 'http://187.127.29.98'; }
  });
  const editCcUrl = () => {
    const v = prompt('URL de la app Control de Costos (Presto):', ccUrl);
    if (v != null) { const u = v.trim(); storage.set('budget-control:cc-url', u); setCcUrl(u); }
  };
  // Vista por defecto = la app ICEMM embebida (conserva su propia carga de archivos
  // Excel: parseItemizado/parseRealERP → backend → Postgres). 'resumen' = vista del tablero.
  const [tab, setTab] = useState('app');

  // Mismo patrón de acceso a datos que ProjectionModule/CashFlowModule.
  const controlMonth = useMemo(() => {
    for (let m = 12; m >= 1; m--) {
      try { const d = storage.get(`budget-control:actuals:${year}:${String(m).padStart(2,'0')}`); if (d?.rows?.length > 0) return m; } catch {}
    }
    return 0;
  }, [year]);
  // Auto-cambiar a resumen si hay datos; si no, mostrar app ICEMM. (Debe ir DESPUÉS de
  // declarar controlMonth: el array de deps se evalúa en render, antes habría TDZ.)
  useEffect(() => {
    setTab(controlMonth > 0 ? 'resumen' : 'app');
  }, [controlMonth]);
  const actualsForYear = useMemo(() => {
    const r = {};
    for (let m = 1; m <= 12; m++) {
      try { const d = storage.get(`budget-control:actuals:${year}:${String(m).padStart(2,'0')}`); if (d?.rows) r[m] = d.rows; } catch {}
    }
    return r;
  }, [year]);
  const getReal = (unCode, cat, m) =>
    (actualsForYear[m] || []).filter(r => r.unCode === unCode && r.clasificacion === cat).reduce((s, r) => s + (+r.total || 0), 0);

  const proj = activeProjects.find(p => p.id === selId) || null;

  // Filas por las 8 categorías de costo: ppto total vs real acumulado al corte.
  const rows = useMemo(() => {
    if (!proj) return [];
    return COST_CATS.map(cat => {
      const ppto = +proj.budgetByCategory?.[cat.id] || 0;
      let real = 0;
      for (let m = 1; m <= controlMonth; m++) real += getReal(proj.unCode, cat.id, m);
      const v = ccVariacion(ppto, real);
      return { catId: cat.id, label: cat.label, ...v, estado: ccEstado(ppto, real) };
    });
  }, [proj, controlMonth, actualsForYear]);

  const kpis = useMemo(() => {
    const pptoTotal = rows.reduce((s, r) => s + r.ppto, 0);
    const realTotal = rows.reduce((s, r) => s + r.real, 0);
    const variacionUf = realTotal - pptoTotal;
    const variacionPct = pptoTotal !== 0 ? variacionUf / pptoTotal * 100 : null;
    const pctEjecucion = pptoTotal !== 0 ? realTotal / pptoTotal * 100 : null;
    return { pptoTotal, realTotal, variacionUf, variacionPct, pctEjecucion };
  }, [rows]);

  const topSobrecostos = useMemo(
    () => rows.filter(r => r.variacionUf > 0).sort((a, b) => b.variacionUf - a.variacionUf).slice(0, 5),
    [rows]
  );

  const pct = v => v == null ? '—' : `${v >= 0 ? '+' : ''}${v.toFixed(1)}%`;
  const varColor = v => v > 0.005 ? 'text-red-600' : v < -0.005 ? 'text-emerald-600' : 'text-gray-500';

  return (
    <div className="space-y-5">
      <div className="flex items-center justify-between gap-3 flex-wrap">
        <div className="flex items-center gap-3">
          <div className="w-1 h-8 rounded-full" style={{ background: '#D01030' }} />
          <div>
            <h1 className="text-xl font-bold text-gray-900 leading-tight">Control de Costos</h1>
            <p className="text-xs text-gray-400 mt-0.5">
              Presupuesto vs Real al corte · {controlMonth > 0 ? `${MONTH_ABR[controlMonth-1]} ${year}` : `sin datos cargados · ${year}`}
            </p>
          </div>
        </div>
        {tab === 'resumen' && activeProjects.length > 0 && (
          <select value={selId || ''} onChange={e => setSelId(e.target.value)}
            className="border border-gray-200 rounded-lg px-3 py-1.5 text-sm bg-white text-gray-700 focus:outline-none focus:ring-2 focus:ring-[#C8102E]/30">
            {activeProjects.map(p => <option key={p.id} value={p.id}>{p.name} (UN {p.unCode})</option>)}
          </select>
        )}
      </div>

      {/* Tabs: app ICEMM embebida (Presto, con su propia carga de archivos) vs resumen del tablero */}
      <div className="flex items-center gap-2 flex-wrap">
        <div className="flex bg-gray-100 rounded-lg p-0.5">
          <button onClick={() => setTab('app')}
            className={`px-3 py-1.5 text-xs font-semibold rounded-md transition-colors ${tab === 'app' ? 'bg-white text-gray-800 shadow-sm' : 'text-gray-500 hover:text-gray-700'}`}>App Presto</button>
          <button onClick={() => setTab('resumen')}
            className={`px-3 py-1.5 text-xs font-semibold rounded-md transition-colors ${tab === 'resumen' ? 'bg-white text-gray-800 shadow-sm' : 'text-gray-500 hover:text-gray-700'}`}>Resumen tablero</button>
        </div>
        <div className="flex-1" />
        <button onClick={() => window.open(ccUrl, '_blank', 'noopener,noreferrer')}
          className="px-3 py-1.5 text-xs font-semibold rounded-lg bg-white border border-gray-200 text-gray-600 hover:bg-gray-50">Abrir en pestaña ↗</button>
        <button onClick={editCcUrl} title={`URL: ${ccUrl}`}
          className="px-2.5 py-1.5 text-xs rounded-lg bg-white border border-gray-200 text-gray-500 hover:bg-gray-50">⚙</button>
      </div>

      {tab === 'app' && (
        <div className="bg-white rounded-2xl border border-gray-100 shadow-sm overflow-hidden">
          <iframe src={ccUrl} title="Control de Costos (Presto)" className="w-full block"
            style={{ height: '74vh', border: 0 }}
            sandbox="allow-same-origin allow-scripts allow-forms allow-downloads allow-popups allow-modals" />
          <div className="px-4 py-2 border-t border-gray-100 text-[11px] text-gray-400">
            App ICEMM embebida desde <span className="font-mono">{ccUrl}</span> — conserva su propia carga de
            archivos (Excel itemizado y gasto real ERP) y sus informes. Si el recuadro queda en blanco, el
            servidor de ICEMM bloquea el iframe (X-Frame-Options): usá "Abrir en pestaña ↗" o aplicá el ajuste de Nginx.
          </div>
        </div>
      )}

      {tab === 'resumen' && (!proj ? (
        <div className="flex flex-col items-center justify-center h-64 gap-2 bg-white rounded-2xl border border-gray-100 shadow-sm">
          <span className="text-4xl opacity-30">🧮</span>
          <span className="text-sm font-semibold text-gray-500">No hay proyectos activos</span>
          <span className="text-xs text-gray-400">Agregá un proyecto con fechas de inicio y término.</span>
        </div>
      ) : controlMonth === 0 ? (
        <div className="flex flex-col items-center justify-center h-64 gap-2 bg-white rounded-2xl border border-gray-100 shadow-sm">
          <span className="text-4xl opacity-30">📂</span>
          <span className="text-sm font-semibold text-gray-500">Sin costos reales cargados para {year}</span>
          <span className="text-xs text-gray-400 max-w-sm text-center">Cargá el Reporte Manager en "Carga Datos Contabilidad" para ver el control de costos.</span>
        </div>
      ) : (
        <>
          {/* KPIs */}
          <div className="grid grid-cols-2 md:grid-cols-5 gap-3">
            {[
              { label: 'Presupuesto', value: fUF(kpis.pptoTotal), color: 'text-gray-800' },
              { label: 'Real al corte', value: fUF(kpis.realTotal), color: 'text-gray-800' },
              { label: 'Variación UF', value: fUF(kpis.variacionUf), color: varColor(kpis.variacionUf) },
              { label: 'Variación %', value: pct(kpis.variacionPct), color: varColor(kpis.variacionUf) },
              { label: '% Ejecución', value: kpis.pctEjecucion == null ? '—' : `${kpis.pctEjecucion.toFixed(1)}%`, color: 'text-blue-600' },
            ].map((k, i) => (
              <div key={i} className="bg-white rounded-xl border border-gray-100 shadow-sm px-4 py-3">
                <p className="text-[10px] font-bold text-gray-400 uppercase tracking-widest">{k.label}</p>
                <p className={`text-lg font-bold font-mono mt-1 ${k.color}`}>{k.value}<span className="uf-label">{k.label.includes('%') ? '' : 'UF'}</span></p>
              </div>
            ))}
          </div>

          {/* Tabla de control por categoría */}
          <div className="bg-white rounded-2xl border border-gray-100 shadow-sm overflow-hidden">
            <div className="px-4 py-3 border-b border-gray-100"><h3 className="text-sm font-bold text-gray-700">Control por clasificación de costo</h3></div>
            <table className="w-full text-sm">
              <thead>
                <tr className="text-gray-500 border-b border-gray-100 bg-gray-50">
                  <th className="text-left px-4 py-2 font-medium">Clasificación</th>
                  <th className="text-right px-3 py-2 font-medium">Ppto UF</th>
                  <th className="text-right px-3 py-2 font-medium">Real UF</th>
                  <th className="text-right px-3 py-2 font-medium">Var UF</th>
                  <th className="text-right px-3 py-2 font-medium">Var %</th>
                  <th className="text-center px-3 py-2 font-medium">Estado</th>
                </tr>
              </thead>
              <tbody>
                {rows.map(r => (
                  <tr key={r.catId} className="border-b border-gray-50 hover:bg-gray-50">
                    <td className="px-4 py-1.5 text-gray-700">{r.label}</td>
                    <td className="px-3 py-1.5 text-right font-mono text-gray-600">{fUF(r.ppto)}</td>
                    <td className="px-3 py-1.5 text-right font-mono text-gray-800">{fUF(r.real)}</td>
                    <td className={`px-3 py-1.5 text-right font-mono ${varColor(r.variacionUf)}`}>{fUF(r.variacionUf)}</td>
                    <td className={`px-3 py-1.5 text-right font-mono ${varColor(r.variacionUf)}`}>{pct(r.variacionPct)}</td>
                    <td className="px-3 py-1.5 text-center">
                      <span className={`px-2 py-0.5 rounded-full text-[10px] font-semibold ${CC_ESTADO_STYLE[r.estado] || 'bg-gray-100 text-gray-500'}`}>{r.estado}</span>
                    </td>
                  </tr>
                ))}
              </tbody>
              <tfoot>
                <tr className="font-bold bg-gray-50 border-t border-gray-200">
                  <td className="px-4 py-2 text-gray-700">TOTAL</td>
                  <td className="px-3 py-2 text-right font-mono text-gray-700">{fUF(kpis.pptoTotal)}</td>
                  <td className="px-3 py-2 text-right font-mono text-gray-900">{fUF(kpis.realTotal)}</td>
                  <td className={`px-3 py-2 text-right font-mono ${varColor(kpis.variacionUf)}`}>{fUF(kpis.variacionUf)}</td>
                  <td className={`px-3 py-2 text-right font-mono ${varColor(kpis.variacionUf)}`}>{pct(kpis.variacionPct)}</td>
                  <td></td>
                </tr>
              </tfoot>
            </table>
          </div>

          {/* Top sobrecostos */}
          {topSobrecostos.length > 0 && (
            <div className="bg-white rounded-2xl border border-gray-100 shadow-sm p-4">
              <h3 className="text-sm font-bold text-gray-700 mb-2">Mayores sobrecostos</h3>
              <div className="space-y-1.5">
                {topSobrecostos.map(r => (
                  <div key={r.catId} className="flex items-center justify-between text-xs">
                    <span className="text-gray-600">{r.label}</span>
                    <span className="font-mono text-red-600">+{fUF(r.variacionUf)} UF ({pct(r.variacionPct)})</span>
                  </div>
                ))}
              </div>
            </div>
          )}

          <p className="text-[11px] text-gray-400">
            Real acumulado de Ene a {MONTH_ABR[controlMonth-1]} {year} (Reporte Manager). Presupuesto = total por clasificación del proyecto.
            Estados: CRÍTICO &gt;15%, ALERTA &gt;5%, EN CONTROL ±5%, FAVORABLE &lt;−5%.
          </p>
        </>
      ))}
    </div>
  );
}

// ─── APP ─────────────────────────────────────────────────────────────────────

function defaultViewFor(user) {
  if (!user) return 'dashboard';
  if (user.role === 'admin') return 'dashboard';
  const mods = user.modules || [];
  if (mods.includes('dashboard')) return 'dashboard';
  if (mods.includes('scorecard')) return 'scorecard';
  return mods[0] || 'dashboard';
}

// ─── ERROR BOUNDARY ─────────────────────────────────────────────────────────────
// Aísla fallos de render: un throw en un módulo ya NO deja la app en pantalla en
// blanco. Muestra un fallback con opción de respaldar datos, reintentar o recargar.
class ErrorBoundary extends React.Component {
  constructor(props) { super(props); this.state = { error: null }; }
  static getDerivedStateFromError(error) { return { error }; }
  componentDidCatch(error, info) { try { console.error('[ICEMM] Módulo falló:', error, info); } catch {} }
  render() {
    if (this.state.error) {
      return (
        <div className="max-w-2xl mx-auto mt-10 bg-white border border-red-200 rounded-xl p-6 shadow-sm">
          <div className="flex items-center gap-3 mb-3">
            <span className="text-2xl">⚠️</span>
            <h2 className="text-lg font-bold text-red-700">Este módulo tuvo un error</h2>
          </div>
          <p className="text-sm text-gray-600 mb-2">
            La aplicación sigue funcionando: podés cambiar de módulo en el menú lateral.
            Para no perder información, respaldá tus datos antes de continuar.
          </p>
          <pre className="text-[11px] bg-gray-50 border border-gray-100 rounded p-2 text-gray-500 overflow-auto max-h-32 mb-4">
            {String((this.state.error && this.state.error.message) || this.state.error)}
          </pre>
          <div className="flex gap-2">
            <button onClick={() => { exportAllData(); recordBackupNow(); }}
              className="px-3 py-1.5 text-xs font-semibold rounded-lg bg-blue-600 text-white hover:bg-blue-700">💾 Respaldar datos</button>
            <button onClick={() => this.setState({ error: null })}
              className="px-3 py-1.5 text-xs font-semibold rounded-lg bg-white border border-gray-200 text-gray-600 hover:bg-gray-50">Reintentar</button>
            <button onClick={() => location.reload()}
              className="px-3 py-1.5 text-xs font-semibold rounded-lg bg-white border border-gray-200 text-gray-600 hover:bg-gray-50">Recargar app</button>
          </div>
        </div>
      );
    }
    return this.props.children;
  }
}

// ─── BANNER DE ERROR DE ALMACENAMIENTO ──────────────────────────────────────────
// Escucha el evento 'icemm-storage-error' de storage.set y avisa al usuario cuando
// un guardado falla (cuota llena, etc.), en vez de tragarlo en silencio.
function StorageErrorBanner() {
  const [err, setErr] = useState(null);
  useEffect(() => {
    const h = ev => setErr(ev.detail || { quota: false, message: 'Error de almacenamiento' });
    window.addEventListener('icemm-storage-error', h);
    return () => window.removeEventListener('icemm-storage-error', h);
  }, []);
  if (!err) return null;
  const msg = err.corrupt
    ? ('⚠ Dato corrupto: ' + (err.message || '') + ' Revisá/restaurá un respaldo antes de seguir trabajando.')
    : err.quota
      ? '⚠ Almacenamiento lleno: los últimos cambios NO se guardaron. Respaldá tus datos (menú usuario → Respaldar datos) y liberá espacio.'
      : ('⚠ Error al guardar datos: ' + (err.message || ''));
  return (
    <div className="fixed top-0 inset-x-0 z-[100] bg-red-600 text-white px-4 py-2 text-xs sm:text-sm flex items-center justify-between shadow-lg">
      <span className="pr-3">{msg}</span>
      <button onClick={() => setErr(null)} className="ml-2 font-bold shrink-0 hover:opacity-80">✕</button>
    </div>
  );
}

function App() {
  const [view,       setView]       = useState('dashboard');
  const [activeYear, setActiveYear] = useState(2026);
  const [projects,   setProjects]   = useState([]);
  const [user,       setUser]       = useState(null);
  const [authReady,  setAuthReady]  = useState(false);

  // Restaurar sesión guardada al cargar
  useEffect(() => {
    try {
      const sess = storage.get('budget-control:session');
      if (sess?.userId) {
        const u = loadUsers().find(x => x.id === sess.userId && x.active);
        if (u) { setUser(u); setView(defaultViewFor(u)); }
      }
    } catch {}
    setAuthReady(true);
  }, []);

  const handleLogin = (u) => {
    setUser(u);
    storage.set('budget-control:session', { userId: u.id });
    setView(defaultViewFor(u));
  };
  const handleLogout = () => {
    storage.set('budget-control:session', null);
    setUser(null);
  };
  const onUsersChange = (list) => {
    // Si el usuario activo cambió sus propios permisos, refrescar
    const me = list.find(x => x.id === user?.id);
    if (me) setUser(me);
  };

  const isAdmin = user?.role === 'admin';
  const allowed = isAdmin ? new Set([...ALL_MODULE_IDS, 'users']) : new Set(user?.modules || []);
  const canView = (v) => allowed.has(v);

  // Si la vista actual no está permitida para el usuario, redirigir
  useEffect(() => {
    if (user && view !== 'users' && !canView(view)) setView(defaultViewFor(user));
  }, [user, view]);

  // Si la lectura inicial de projects falló por CORRUPCIÓN (no por ausencia),
  // cargamos los sample SÓLO en memoria para no dejar la app en blanco, pero
  // marcamos projectsCorrupt para que el useEffect de persistencia NO pise el
  // dato bueno-pero-ilegible que sigue en disco (lo arregla un restore manual).
  const [projectsCorrupt, setProjectsCorrupt] = useState(false);
  useEffect(() => {
    const saved = storage.get('budget-control:projects');
    if (storageWasCorrupt('budget-control:projects')) {
      setProjectsCorrupt(true);
      setProjects(makeSampleProjects()); // sólo para que la UI no quede vacía
      return;
    }
    setProjects(saved && saved.length > 0 ? saved : makeSampleProjects());
  }, []);

  useEffect(() => {
    // NO re-persistir mientras la clave esté marcada corrupta: pisaría el dato
    // bueno-pero-ilegible con los sample. El usuario debe restaurar un respaldo.
    if (projectsCorrupt || storageWasCorrupt('budget-control:projects')) return;
    if (projects.length > 0 && !storage.set('budget-control:projects', projects)) {
      reportCriticalSaveFailure('lista de proyectos');
    }
  }, [projects, projectsCorrupt]);

  // RESPALDO PERIÓDICO (1 vez al día por sesión): si pasó más de un día desde el
  // último respaldo registrado, dejar una copia interna al iniciar sesión. Sólo
  // una vez por carga de la app (didDailyBackup) para no respaldar en cada render.
  const didDailyBackup = useRef(false);
  useEffect(() => {
    if (!user || didDailyBackup.current) return;
    didDailyBackup.current = true;
    if (daysSinceLastBackup() >= 1) {
      if (writeBackupToStorage('diario')) recordBackupNow();
    }
  }, [user]);

  const createNextYear = useCallback(() => {
    const nextYear = activeYear + 1;
    const existingBudget = storage.get(`budget-control:budget:${nextYear}`);
    if (!existingBudget) {
      storage.set(`budget-control:budget:${nextYear}`, initBudget(nextYear));
    }
    const cfCurrent = storage.get(`budget-control:cashflow:${activeYear}`) || {};
    const cajaInicialEnero = cfCurrent.cajaFinalDic || 0;
    // Arrastre del saldo neto de IVA: el saldo de diciembre del año en curso pasa a ser el
    // saldo inicial del año siguiente. Convención de signo: negativo = crédito a favor, positivo = deuda.
    // Campo opcional (default 0) → backward-compatible con cashflows guardados que no lo tengan.
    const saldoIVADicAnterior = cfCurrent.saldoIVADicFinal || 0;
    const existingCF = storage.get(`budget-control:cashflow:${nextYear}`);
    if (!existingCF) {
      storage.set(`budget-control:cashflow:${nextYear}`, {
        cajaInicialEnero,
        saldoIVADicAnterior,
        cxp: Object.fromEntries(Array.from({length:12},(_,i)=>[i+1,0])),
        cxc: Object.fromEntries(Array.from({length:12},(_,i)=>[i+1,0])),
        aportes: Object.fromEntries(Array.from({length:12},(_,i)=>[i+1,0])),
        devoluciones: Object.fromEntries(Array.from({length:12},(_,i)=>[i+1,0])),
        impuestoRenta: 0,
      });
    }
    setActiveYear(nextYear);
  }, [activeYear]);

  // Esperar a resolver la sesión guardada antes de decidir login
  if (!authReady) {
    return <div className="flex h-screen items-center justify-center" style={{background:'#101014'}} />;
  }
  if (!user) {
    return <LoginScreen onLogin={handleLogin} />;
  }

  return (
    <div className="flex h-screen overflow-hidden" style={{background:'#F2F4F8'}}>
      <StorageErrorBanner />
      <Sidebar view={view} setView={setView} user={user} />
      <div className="flex-1 flex flex-col min-w-0">
        <Header activeYear={activeYear} setActiveYear={setActiveYear} view={view} onCreateNextYear={createNextYear}
          user={user} onLogout={handleLogout} onOpenUsers={() => setView('users')} />
        <main className="flex-1 overflow-y-auto p-6">
          <ErrorBoundary key={view}>
          {view === 'users' && isAdmin && <UsersModule currentUser={user} onUsersChange={onUsersChange} />}
          {canView(view) && view === 'projects'   && <ProjectManager projects={projects} setProjects={setProjects} />}
          {canView(view) && view === 'budget'     && <AnnualBudget year={activeYear} projects={projects} />}
          {canView(view) && view === 'data'       && <DataLoader projects={projects} activeYear={activeYear} />}
          {canView(view) && view === 'obras'      && <ControlObrasModule projects={projects} activeYear={activeYear} />}
          {canView(view) && view === 'projection' && <ProjectionModule projects={projects} activeYear={activeYear} />}
          {canView(view) && view === 'report'     && <ReportModule projects={projects} activeYear={activeYear} />}
          {canView(view) && view === 'cashflow'   && <CashFlowModule projects={projects} activeYear={activeYear} />}
          {canView(view) && view === 'dashboard'  && <DashboardModule projects={projects} activeYear={activeYear} />}
          {canView(view) && view === 'scorecard'  && <ScorecardModule projects={projects} activeYear={activeYear} />}
          {canView(view) && view === 'scenarios'  && <EscenariosModule projects={projects} activeYear={activeYear} />}
          {canView(view) && view === 'check'      && <CheckContableModule projects={projects} activeYear={activeYear} />}
          {canView(view) && view === 'costos'     && <ControlCostosModule projects={projects} activeYear={activeYear} />}
          {!['projects','budget','data','obras','projection','report','cashflow','dashboard','scorecard','scenarios','check','costos','users'].includes(view) && <Placeholder module={view} />}
          </ErrorBoundary>
        </main>
      </div>
    </div>
  );
}

migrateSchema();
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>

// ─── STORAGE ─────────────────────────────────────────────────────────────────

// Registro de claves cuya última lectura detectó corrupción (JSON inválido) y NO
// ausencia legítima. Los callers que escriben un fallback (p.ej. el useEffect de
// projects) consultan storageWasCorrupt(key) para NO pisar dato bueno-pero-ilegible.
const _corruptKeys = new Set();
function storageWasCorrupt(key) { return _corruptKeys.has(key); }
function clearStorageCorrupt(key) { _corruptKeys.delete(key); }

const storage = {
  // Devuelve el valor parseado, o null si la clave está AUSENTE.
  // Si la clave EXISTE pero su JSON es inválido (corrupción): conserva el raw en
  // <key>.corrupt, marca la clave como corrupta (storageWasCorrupt), avisa al
  // usuario por banner y devuelve null SIN destruir el dato corrupto. Los callers
  // críticos deben consultar storageWasCorrupt() antes de re-escribir un fallback.
  get(key) {
    let raw = null;
    try {
      raw = (window.storage && window.storage.getItem)
        ? window.storage.getItem(key)
        : localStorage.getItem(key);
    } catch { return null; }
    if (raw == null) { _corruptKeys.delete(key); return null; } // ausencia legítima
    try {
      const parsed = JSON.parse(raw);
      _corruptKeys.delete(key); // lectura sana → limpiar marca previa
      return parsed;
    } catch (e) {
      _corruptKeys.add(key);
      // Preservar el raw corrupto para diagnóstico/recuperación manual (no sobrescribe
      // el original; sólo deja una copia). No usar storage.set para evitar recursión.
      try {
        const ckey = key + '.corrupt';
        try { if (window.storage && window.storage.setItem) window.storage.setItem(ckey, raw); } catch {}
        try { localStorage.setItem(ckey, raw); } catch {}
      } catch {}
      console.error('[ICEMM] Dato corrupto en localStorage (JSON inválido):', key, e);
      notifyStorageCorrupt(key);
      return null;
    }
  },
  // Devuelve true si ALGUNA ruta de escritura tuvo éxito; false si TODAS fallaron
  // (p.ej. cuota llena). Backward-compatible: los callers que ignoran el retorno
  // siguen funcionando. notifyStorageError ya avisa al usuario por banner.
  set(key, value) {
    const raw = JSON.stringify(value);
    let ok = false;
    let lastErr = null;
    try { if (window.storage && window.storage.setItem) { window.storage.setItem(key, raw); ok = true; } } catch (e) { lastErr = e; }
    try { localStorage.setItem(key, raw); ok = true; } catch (e) { lastErr = e; }
    if (!ok && lastErr) notifyStorageError(lastErr); // sólo avisar si TODO falló
    return ok;
  },
};

// Aviso bloqueante de una escritura crítica que NO se pudo guardar. Lo usan los
// setters importantes (cierre de mes, actuals, proyecciones, cashflow, projects):
// si storage.set devuelve false, paran el flujo "como si hubieran guardado" y
// muestran este banner persistente además del alert.
function reportCriticalSaveFailure(what) {
  try {
    window.dispatchEvent(new CustomEvent('icemm-storage-error',
      { detail: { quota: true, critical: true,
        message: 'No se pudo guardar: ' + what + '. Tus cambios NO quedaron en disco.' } }));
  } catch {}
  try {
    alert('⚠ NO SE PUDO GUARDAR: ' + what + '.\n\n' +
      'El almacenamiento del navegador rechazó la escritura (probablemente está lleno).\n' +
      'Tus cambios NO quedaron guardados. Respaldá tus datos (menú usuario → Respaldar datos), ' +
      'liberá espacio y volvé a intentar.');
  } catch {}
}

// Aviso de errores de almacenamiento (cuota llena, etc.). Lanza un evento que
// <StorageErrorBanner> escucha; antes estos errores se tragaban en silencio.
let _lastStorageErrAt = 0;
function notifyStorageError(e) {
  const isQuota = !!e && (e.name === 'QuotaExceededError' || e.code === 22 ||
    e.code === 1014 || /quota|exceeded/i.test(e.message || ''));
  const now = Date.now();
  if (now - _lastStorageErrAt < 3000) return; // throttle para no spamear
  _lastStorageErrAt = now;
  try {
    window.dispatchEvent(new CustomEvent('icemm-storage-error',
      { detail: { quota: isQuota, message: (e && e.message) || String(e) } }));
  } catch {}
}

// Aviso de DATO CORRUPTO en lectura (JSON inválido en una clave existente). Lo
// dispara storage.get; <StorageErrorBanner> lo muestra. throttle independiente.
let _lastStorageCorruptAt = 0;
function notifyStorageCorrupt(key) {
  const now = Date.now();
  if (now - _lastStorageCorruptAt < 3000) return;
  _lastStorageCorruptAt = now;
  try {
    window.dispatchEvent(new CustomEvent('icemm-storage-error',
      { detail: { corrupt: true, key,
        message: 'Dato corrupto detectado (' + key + '). Se conservó una copia en ' + key + '.corrupt; ese dato NO se sobreescribió.' } }));
  } catch {}
}

// ─── RESPALDO / RESTAURACIÓN DE DATOS ───────────────────────────────────────────
const ICEMM_APP_ID = 'ICEMM-control-presupuestario';

// Lee TODAS las claves budget-control:* del navegador como { key: rawString }.
// Excluye las copias .corrupt y las propias claves de respaldo para no anidar
// respaldos. Fuente única de verdad para exportAllData / import / migrateSchema.
function collectAllData() {
  const data = {};
  let count = 0;
  for (let i = 0; i < localStorage.length; i++) {
    const k = localStorage.key(i);
    if (!k || k.indexOf('budget-control:') !== 0) continue;
    if (k.indexOf('budget-control:backup:') === 0) continue; // no respaldar respaldos
    if (/\.corrupt$/.test(k)) continue;                       // no respaldar copias corruptas
    data[k] = localStorage.getItem(k);
    count++;
  }
  return { data, count };
}

// Arma el payload de respaldo (mismo formato que el JSON exportable), incluyendo
// schemaVersion en _meta para que la importación pueda validarlo.
function buildBackupPayload() {
  const { data, count } = collectAllData();
  return {
    _meta: {
      app: ICEMM_APP_ID,
      schemaVersion: SCHEMA_VERSION,
      exportedAt: new Date().toISOString(),
      keys: count,
    },
    data,
  };
}

// Exporta TODAS las claves budget-control:* del navegador a un JSON descargable.
function exportAllData() {
  let payload, count;
  try {
    payload = buildBackupPayload();
    count = payload._meta.keys;
  } catch (e) { alert('No se pudo leer el almacenamiento: ' + ((e && e.message) || e)); return; }
  if (!count) { alert('No hay datos budget-control:* para respaldar en este navegador.'); return; }
  try {
    const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
    const url  = URL.createObjectURL(blob);
    const a    = document.createElement('a');
    const stamp = new Date().toISOString().slice(0, 19).replace(/[:T]/g, '-');
    a.href = url; a.download = `respaldo-icemm-${stamp}.json`;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 1500);
  } catch (e) { alert('No se pudo generar el respaldo: ' + ((e && e.message) || e)); }
}

// ── Respaldo INTERNO (a una clave de localStorage) ───────────────────────────
// Vuelca todas las claves budget-control:* a una clave de respaldo. Devuelve
// true sólo si el respaldo quedó escrito (lo usan import y migrateSchema, que
// abortan si el respaldo falla). suffix identifica el respaldo (p.ej. el motivo).
const BACKUP_PREFIX = 'budget-control:backup:';
function writeBackupToStorage(suffix) {
  try {
    const payload = buildBackupPayload();
    if (!payload._meta.keys) return false; // nada que respaldar
    const raw = JSON.stringify(payload);
    const key = BACKUP_PREFIX + suffix;
    let ok = false;
    try { if (window.storage && window.storage.setItem) { window.storage.setItem(key, raw); ok = true; } } catch {}
    try { localStorage.setItem(key, raw); ok = true; } catch {}
    return ok;
  } catch { return false; }
}

// Registro del ÚLTIMO respaldo realizado (fecha ISO). Se muestra en el menú de
// usuario; sirve para avisar si pasaron demasiados días sin respaldar.
const LAST_BACKUP_KEY = 'budget-control:last-backup';
const BACKUP_STALE_DAYS = 7; // avisar si pasaron más de N días sin respaldo
function recordBackupNow() {
  try { storage.set(LAST_BACKUP_KEY, { at: new Date().toISOString() }); } catch {}
}
function getLastBackupAt() {
  try { const v = storage.get(LAST_BACKUP_KEY); return v && v.at ? v.at : null; } catch { return null; }
}
function daysSinceLastBackup() {
  const at = getLastBackupAt();
  if (!at) return Infinity;
  const t = Date.parse(at);
  if (isNaN(t)) return Infinity;
  return (Date.now() - t) / 86400000;
}

// Abre un selector de archivo y restaura un respaldo JSON (SOBRESCRIBE el navegador actual).
function pickAndImportData() {
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = 'application/json,.json';
  input.onchange = ev => {
    const f = ev.target.files && ev.target.files[0];
    if (!f) return;
    const reader = new FileReader();
    reader.onload = e => {
      let parsed;
      try { parsed = JSON.parse(e.target.result); }
      catch (err) { alert('Archivo inválido (no es JSON): ' + ((err && err.message) || err)); return; }

      // 1) Validar _meta (app y schemaVersion) contra la versión actual.
      const meta = parsed && parsed._meta;
      if (meta && meta.app && meta.app !== ICEMM_APP_ID) {
        alert(`Este archivo no parece un respaldo de esta aplicación (app="${meta.app}").\nImportación cancelada.`);
        return;
      }
      let versionWarn = '';
      if (meta && meta.schemaVersion != null && +meta.schemaVersion !== SCHEMA_VERSION) {
        versionWarn = `\n\n⚠ El respaldo es de schema v${meta.schemaVersion} y esta app usa v${SCHEMA_VERSION}. ` +
          `Tras restaurar, la app intentará migrarlo, pero revisá los datos.`;
      }

      const data = parsed && parsed.data ? parsed.data : parsed;
      const keys = Object.keys(data || {}).filter(k => k.indexOf('budget-control:') === 0
        && k.indexOf(BACKUP_PREFIX) !== 0 && !/\.corrupt$/.test(k));
      if (!keys.length) { alert('El archivo no contiene datos budget-control:*'); return; }

      // 2) Preparar TODO en memoria y validar ANTES de escribir (todo-o-nada).
      const toWrite = [];
      for (const k of keys) {
        const v = data[k];
        const raw = typeof v === 'string' ? v : JSON.stringify(v);
        try { JSON.parse(raw); } // cada valor debe ser JSON válido
        catch (err) { alert(`El respaldo está dañado: la clave "${k}" no es JSON válido.\nImportación cancelada (no se modificó nada).`); return; }
        toWrite.push([k, raw]);
      }

      if (!confirm(`Vas a restaurar ${keys.length} claves de datos.\n\nEsto SOBRESCRIBE los datos actuales de este navegador.\nSe respaldarán automáticamente tus datos actuales antes de continuar.${versionWarn}\n\n¿Continuar?`)) return;

      // 3) Respaldar el estado ACTUAL antes de sobrescribir. Si falla, abortar.
      if (!writeBackupToStorage('pre-import')) {
        if (!confirm('No se pudo crear un respaldo automático de tus datos actuales (¿almacenamiento lleno?).\n\nSi continuás y algo sale mal, podrías perder los datos actuales.\n\n¿Continuar de todos modos?')) return;
      }

      // 4) Escribir todo-o-nada. Si una escritura falla, intentar revertir las ya
      //    hechas desde el respaldo recién creado, para no dejar el storage a medias.
      const written = [];
      let failedKey = null;
      for (const [k, raw] of toWrite) {
        let wrote = false;
        try { localStorage.setItem(k, raw); wrote = true; } catch (err) { notifyStorageError(err); }
        try { if (window.storage && window.storage.setItem) { window.storage.setItem(k, raw); wrote = true; } } catch {}
        if (!wrote) { failedKey = k; break; }
        written.push(k);
      }
      if (failedKey) {
        // Revertir lo escrito a partir del respaldo pre-import.
        try {
          const bk = storage.get(BACKUP_PREFIX + 'pre-import');
          const prevData = bk && bk.data ? bk.data : {};
          written.forEach(k => {
            const pv = prevData[k];
            try {
              if (pv == null) localStorage.removeItem(k);
              else localStorage.setItem(k, typeof pv === 'string' ? pv : JSON.stringify(pv));
            } catch {}
          });
        } catch {}
        alert(`No se pudo completar la importación (falló al escribir "${failedKey}", probablemente almacenamiento lleno).\n\nSe intentó revertir los cambios al estado previo. Liberá espacio y reintentá.`);
        return;
      }

      recordBackupNow();
      alert(`Restauradas ${keys.length} claves. La aplicación se recargará.`);
      location.reload();
    };
    reader.onerror = () => alert('No se pudo leer el archivo.');
    reader.readAsText(f, 'UTF-8');
  };
  input.click();
}

// ─── UTILIDADES ───────────────────────────────────────────────────────────────

const fUF = v =>
  v == null || v === '' || isNaN(+v)
    ? '–'
    : (+v).toLocaleString('es-CL', { minimumFractionDigits: 2, maximumFractionDigits: 2 });

function monthsBetween(start, end) {
  if (!start || !end) return 0;
  const [sy, sm] = start.split('-').map(Number);
  const [ey, em] = end.split('-').map(Number);
  const n = (ey - sy) * 12 + (em - sm) + 1;
  return n > 0 ? n : 0;
}

function getMonthLabels(startDate, n) {
  if (!startDate || !n) return [];
  const [year, month] = startDate.split('-').map(Number);
  return Array.from({ length: n }, (_, i) => {
    const d = new Date(year, month - 1 + i);
    return `${MONTH_ABR[d.getMonth()]}-${String(d.getFullYear()).slice(2)}`;
  });
}

function generateSCurve(n) {
  if (n <= 0) return [];
  const sCum = t => 3 * t * t - 2 * t * t * t;
  const raw = Array.from({ length: n }, (_, i) =>
    (sCum((i + 1) / n) - sCum(i / n)) * 100
  );
  return normalizeCurve(raw);
}

// Redondea todos los valores a 2 decimales y ajusta el último para que sumen 100.00
function normalizeCurve(curve) {
  if (!curve || curve.length === 0) return [];
  const r4 = v => Math.round((+v || 0) * 10000) / 10000;
  const rounded = curve.map(r4);
  const sum = rounded.reduce((a, b) => a + b, 0);
  const diff = r4(100 - sum);
  if (diff !== 0) rounded[rounded.length - 1] = r4(rounded[rounded.length - 1] + diff);
  return rounded;
}

// Re-escala una curva de costos a un nuevo número de meses conservando su forma mediante interpolación lineal.
// Retorna array de pesos normalizados (suma = 1.0) de longitud N_new.
function reescalarCurva(curve, N_new) {
  if (!curve || curve.length === 0 || N_new <= 0) {
    return Array(N_new).fill(N_new > 0 ? 1 / N_new : 0);
  }
  if (N_new === 1) return [1];
  const N_orig = curve.length;
  const scaled = [];
  for (let j = 0; j < N_new; j++) {
    const pos = j / (N_new - 1) * (N_orig - 1);
    const lo = Math.floor(pos);
    const hi = Math.min(lo + 1, N_orig - 1);
    const frac = pos - lo;
    scaled.push((+curve[lo] || 0) * (1 - frac) + (+curve[hi] || 0) * frac);
  }
  const total = scaled.reduce((s, v) => s + v, 0);
  return total > 0 ? scaled.map(v => v / total) : Array(N_new).fill(1 / N_new);
}

// Aplica un desplazamiento porcentual a la curva (shift ∈ [-3,3]).
// shift > 0: acelera (más ingresos/costos al inicio), shift < 0: frena (más al final).
// Conserva plazo total (mismo N) y monto total (misma suma).
// Fórmula: ajuste de campana sobre la curva acumulada: ΔC(t) = factor × 4t(1-t) × total
function applyShift(curve, shift) {
  if (!shift || shift === 0 || !curve || curve.length === 0) return curve;
  const N = curve.length;
  const total = curve.reduce((s, w) => s + w, 0);
  if (total <= 0) return curve;
  // Curva acumulada: N+1 puntos, de 0 a total
  const cumul = [0];
  for (let i = 0; i < N; i++) cumul.push(cumul[i] + curve[i]);
  // Desplazamiento tipo campana (máximo en t=0.5, cero en t=0 y t=1)
  const factor = shift / 100;
  const shifted = cumul.map((c, i) => {
    const t = i / N;
    return Math.max(0, Math.min(total, c + factor * 4 * t * (1 - t) * total));
  });
  // Garantizar monotonicidad y cierre exacto en total
  for (let i = 1; i <= N; i++) shifted[i] = Math.max(shifted[i], shifted[i - 1]);
  shifted[N] = total;
  // Derivar pesos mensuales
  return Array.from({ length: N }, (_, i) => shifted[i + 1] - shifted[i]);
}

// ─── LÓGICA PRESUPUESTO ───────────────────────────────────────────────────────

// Retorna el índice del mes del proyecto para un mes calendario dado.
// Retorna -1 si el proyecto no está activo ese mes.
function projectMonthIdx(project, year, calMonth) {
  if (!project.startDate) return -1;
  const [sy, sm] = project.startDate.split('-').map(Number);
  const idx = (year - sy) * 12 + calMonth - (sm - 1);
  if (idx < 0 || idx >= project.durationMonths) return -1;
  return idx;
}

// Ingreso neto mensual de un proyecto para un mes calendario (0=Ene)
function calcMonthlyRevenue(project, year, calMonth) {
  const idx = projectMonthIdx(project, year, calMonth);
  if (idx === -1) return 0;
  if (project.contractType === 'suma_alzada') {
    const curve = (project.revenueCurve && project.revenueCurve[idx]) || 0;
    const edp = (+project.contract.originalAmount || 0) * curve / 100;
    const ret = +project.contract.retentionPercent || 0;
    return edp * (1 - ret / 100);
  } else {
    // Admin Delegada: rendición (= costo mes) + GG + fee
    const curve = (project.costCurve && project.costCurve[idx]) || 0;
    const cost = (+project.contract.totalBudgetedCost || 0) * curve / 100;
    return cost + (+project.contract.monthlyGG || 0) + (+project.contract.monthlyFee || 0);
  }
}

// Costo mensual de una categoría de un proyecto para un mes calendario
function calcMonthlyProjectCost(project, catId, year, calMonth) {
  const idx = projectMonthIdx(project, year, calMonth);
  if (idx === -1) return 0;
  const curve = (project.costCurve && project.costCurve[idx]) || 0;
  return (+project.budgetByCategory[catId] || 0) * curve / 100;
}

// Inicializa un objeto de Oficina Central con 12 ceros por categoría
function initOCData() {
  return Object.fromEntries(OC_CATS.map(c => [c.id, Array(12).fill(0)]));
}

// Inicializa un objeto de otros ingresos con 12 ceros
function initOtherIncome() {
  return { asesorias: Array(12).fill(0) };
}

// Crea la estructura base del presupuesto para un año
function initBudget(year) {
  return {
    year,
    status: 'borrador',
    fixedDate: null,
    oficinaCentral: initOCData(),
    otherIncome: initOtherIncome(),
    snapshot: null, // se llena al fijar
  };
}

// Toma un snapshot completo de ingresos y costos del proyecto para el año
function snapshotProjects(projects, year) {
  const snap = {};
  for (const p of projects) {
    const monthlyRevenue = Array.from({ length: 12 }, (_, m) => calcMonthlyRevenue(p, year, m));
    const monthlyCosts = {};
    for (const cat of COST_CATS) {
      monthlyCosts[cat.id] = Array.from({ length: 12 }, (_, m) => calcMonthlyProjectCost(p, cat.id, year, m));
    }
    snap[p.id] = { monthlyRevenue, monthlyCosts };
  }
  return snap;
}

// Wrapper que pone una barra de scroll sincronizada ARRIBA de la tabla.
// wrapClass = clases visuales del contenedor externo (border, rounded, shadow, bg…)
// innerClass = clases adicionales para el div de scroll interno
// style      = estilos inline del div de scroll interno
function TopScroll({ children, wrapClass, innerClass, style }) {
  const topRef   = React.useRef(null);
  const innerRef = React.useRef(null);
  const lock     = React.useRef(false);
  React.useEffect(() => {
    const top   = topRef.current;
    const inner = innerRef.current;
    if (!top || !inner) return;
    const ph = top.firstElementChild;
    const sync = () => { if (ph) ph.style.width = inner.scrollWidth + 'px'; };
    sync();
    const onTop   = () => { if (!lock.current) { lock.current=true; inner.scrollLeft=top.scrollLeft;  lock.current=false; } };
    const onInner = () => { if (!lock.current) { lock.current=true; top.scrollLeft=inner.scrollLeft; lock.current=false; } };
    top.addEventListener  ('scroll', onTop,   { passive:true });
    inner.addEventListener('scroll', onInner, { passive:true });
    const ro = new ResizeObserver(sync);
    ro.observe(inner);
    if (inner.firstElementChild) ro.observe(inner.firstElementChild);
    return () => {
      top.removeEventListener  ('scroll', onTop);
      inner.removeEventListener('scroll', onInner);
      ro.disconnect();
    };
  }, []);
  return (
    <div className={wrapClass || ''}>
      <div ref={topRef} style={{overflowX:'scroll', overflowY:'hidden', height:13}}>
        <div style={{height:1}} />
      </div>
      <div ref={innerRef} className={`overflow-x-auto${innerClass ? ' '+innerClass : ''}`} style={style}>
        {children}
      </div>
    </div>
  );
}

function CurveEditor({ label, months, values, onChange }) {
  const total = values.reduce((a, b) => a + (+b || 0), 0);
  const isValid = Math.abs(total - 100) < 0.05;
  const fileRef = useRef(null);
  const [uploadMsg, setUploadMsg] = useState(null);

  function handleChange(i, v) {
    const next = [...values];
    next[i] = v === '' ? 0 : +v;
    onChange(next);
  }

  // Procesa un array 2D (filas × columnas) leído desde el archivo
  function processData(data) {
    const toNum = v => {
      if (typeof v === 'number') return v;           // raw: true ya devuelve número
      return parseFloat(String(v ?? '').replace(/[%\s]/g, '').replace(',', '.')) || 0;
    };

    let pcts = [];

    if (data.length === 1) {
      // Una sola fila: son los porcentajes
      pcts = data[0].map(toNum);
    } else if (data.length === 2) {
      // Dos filas: fila 1 = etiquetas de mes (ignoradas), fila 2 = porcentajes
      pcts = data[1].map(toNum);
    } else {
      // Múltiples filas, 2 columnas: col 1 = mes, col 2 = %
      // Saltar encabezado si la primera celda no es numérica
      const start = isNaN(toNum(data[0][data[0].length - 1])) && toNum(data[0][data[0].length - 1]) === 0
        && isNaN(parseFloat(String(data[0][data[0].length - 1]))) ? 1 : 0;
      pcts = data.slice(start).map(row => toNum(row[row.length - 1]));
    }

    // Detectar celdas de tipo porcentaje de Excel (raw: true devuelve 0.02171077 en vez de 2.171077)
    const rawSum = pcts.reduce((s, v) => s + (v || 0), 0);
    if (pcts.length > 0 && rawSum > 0 && rawSum < 5) {
      // Suma cercana a 1 → son decimales de porcentaje → convertir a %
      pcts = pcts.map(v => v * 100);
    }

    const normalized = normalizeCurve(pcts);
    onChange(normalized);

    if (pcts.length !== values.length) {
      setUploadMsg({
        ok: 'warn',
        text: `⚠ Curva cargada con ${pcts.length} períodos (el proyecto tiene ${values.length} meses) — normalizado a 100%.`,
      });
    } else {
      setUploadMsg({ ok: true, text: `✓ Cargados ${pcts.length} valores — normalizado a 100%` });
      setTimeout(() => setUploadMsg(null), 3000);
    }
  }

  function handleFileUpload(e) {
    const file = e.target.files[0];
    if (!file) return;
    e.target.value = '';
    setUploadMsg(null);

    const isExcel = /\.xlsx?$/i.test(file.name);

    if (isExcel) {
      const reader = new FileReader();
      reader.readAsArrayBuffer(file);
      reader.onload = ev => {
        try {
          const wb = XLSX.read(ev.target.result, { type: 'array' });
          const ws = wb.Sheets[wb.SheetNames[0]];
          const data = XLSX.utils.sheet_to_json(ws, { header: 1, raw: true })
            .filter(row => row.length > 0);
          processData(data);
        } catch (err) {
          setUploadMsg({ ok: false, text: 'Error al leer Excel: ' + err.message });
        }
      };
    } else {
      const reader = new FileReader();
      reader.readAsText(file, 'UTF-8');
      reader.onload = ev => {
        try {
          const lines = ev.target.result.split(/\r?\n/).filter(l => l.trim());
          const data = lines.map(l => l.split(/[,;\t]/));
          processData(data);
        } catch (err) {
          setUploadMsg({ ok: false, text: 'Error al leer archivo: ' + err.message });
        }
      };
    }
  }

  let acum = 0;

  return (
    <div className="mb-5">
      <div className="flex items-center justify-between mb-2">
        <span className="text-sm font-medium text-gray-700">{label}</span>
        <div className="flex items-center gap-2">
          <span className={`text-xs font-mono font-semibold ${isValid ? 'text-emerald-600' : 'text-red-500'}`}>
            Σ = {total.toFixed(2)}%{!isValid && ` (faltan ${(100 - total).toFixed(2)}%)`}
          </span>
          {/* Input oculto para el archivo */}
          <input
            ref={fileRef}
            type="file"
            accept=".csv,.txt,.xlsx,.xls"
            onChange={handleFileUpload}
            className="hidden"
          />
          <Btn size="sm" variant="ghost" onClick={() => fileRef.current?.click()}>
            📂 Cargar archivo
          </Btn>
          <Btn size="sm" variant="ghost" onClick={() => { onChange(generateSCurve(values.length)); setUploadMsg(null); }}>
            ↺ Curva S
          </Btn>
        </div>
      </div>

      {/* Mensaje de resultado de carga */}
      {uploadMsg && (
        <div className={`text-xs px-3 py-1.5 rounded-lg mb-2 ${
          uploadMsg.ok === true   ? 'bg-emerald-50 text-emerald-700' :
          uploadMsg.ok === 'warn' ? 'bg-amber-50 text-amber-700' :
                                    'bg-red-50 text-red-700'}`}>
          {uploadMsg.text}
        </div>
      )}

      {/* Hint de formato */}
      <div className="text-[11px] text-gray-400 mb-2">
        Formatos aceptados: CSV, TXT, XLSX — 2 filas (fila 1: meses, fila 2: % mensual)
        o 2 columnas (col 1: mes, col 2: %). Los valores se normalizan a 100%.
      </div>

      <TopScroll wrapClass="rounded-lg border border-gray-200">
        <table className="text-xs border-collapse" style={{width: 'max-content'}}>
          <thead>
            <tr className="bg-gray-50">
              <th className="sticky left-0 z-10 bg-gray-50 px-3 py-2 text-left font-medium text-gray-500
                border-r border-gray-200 whitespace-nowrap min-w-[90px]">
                Mes
              </th>
              {months.map((m, i) => (
                <th key={i} className="px-2 py-2 font-medium text-gray-500 text-center whitespace-nowrap
                  border-r border-gray-200" style={{minWidth: 62}}>
                  {m}
                </th>
              ))}
            </tr>
          </thead>
          <tbody>
            <tr className="bg-white">
              <td className="sticky left-0 z-10 bg-white px-3 py-1.5 font-medium text-gray-600
                border-r border-gray-200 whitespace-nowrap">
                % Mes
              </td>
              {values.map((v, i) => (
                <td key={i} className="border-r border-gray-200 p-0">
                  <input
                    type="number" value={v ?? 0}
                    onChange={e => handleChange(i, e.target.value)}
                    step="0.0001" min="0" max="100"
                    className="w-full px-1 py-1.5 text-center text-xs focus:outline-none
                      focus:bg-blue-50" style={{minWidth: 72}}
                  />
                </td>
              ))}
            </tr>
            <tr className="bg-gray-50">
              <td className="sticky left-0 z-10 bg-gray-50 px-3 py-1.5 font-medium text-gray-500
                border-r border-gray-200 whitespace-nowrap">
                Acumulado
              </td>
              {values.map((v, i) => {
                acum += +(v || 0);
                return (
                  <td key={i} className="px-2 py-1.5 text-center border-r border-gray-200
                    text-gray-400 font-mono">
                    {acum.toFixed(1)}%
                  </td>
                );
              })}
            </tr>
          </tbody>
        </table>
      </TopScroll>
    </div>
  );
}

function BudgetTable({ values, onChange, contractTotal }) {
  const [showProrateo, setShowProrateo] = useState(false);
  const [customPcts, setCustomPcts] = useState(() => ({ ...DEFAULT_COST_PCTS }));

  const total = COST_CATS.reduce((s, c) => s + (+values[c.id] || 0), 0);
  const pctSum = Math.round(COST_CATS.reduce((s, c) => s + (+customPcts[c.id] || 0), 0) * 100) / 100;
  const pctOk = Math.abs(pctSum - 100) <= 0.1;

  function applyProrateo() {
    const base = contractTotal;
    if (!base || base <= 0) return;
    const newValues = {};
    let assigned = 0;
    COST_CATS.forEach((cat, i) => {
      if (i < COST_CATS.length - 1) {
        const v = Math.round(base * (+customPcts[cat.id] || 0) / 100 * 100) / 100;
        newValues[cat.id] = v;
        assigned += v;
      } else {
        newValues[cat.id] = Math.round((base - assigned) * 100) / 100;
      }
    });
    onChange(newValues);
    setShowProrateo(false);
  }

  function setPct(id, val) {
    setCustomPcts(prev => ({ ...prev, [id]: val === '' ? '' : +val }));
  }

  return (
    <div>
      {/* Panel de prorrateo */}
      {showProrateo ? (
        <div className="mb-3 bg-blue-50 border border-blue-200 rounded-xl p-4">
          <div className="flex items-start justify-between gap-3">
            <div>
              <p className="text-xs font-semibold text-blue-800">Prorrateo por familia</p>
              <p className="text-xs text-blue-600 mt-0.5">
                Monto a distribuir: <strong>{fUF(contractTotal)} UF</strong>
                {' '}(Costo Directo + GG de Obra)
              </p>
              {!pctOk && (
                <p className="mt-1 text-xs text-red-500 font-medium">
                  Los % deben sumar 100% — actual: {pctSum.toFixed(2)}%
                </p>
              )}
              {pctOk && contractTotal > 0 && (
                <p className="mt-1 text-xs text-blue-500">
                  Vista previa: {COST_CATS.map(cat =>
                    `${cat.label} → ${fUF(contractTotal * (+customPcts[cat.id] || 0) / 100)}`
                  ).join(' · ')}
                </p>
              )}
            </div>
            <div className="flex gap-2 shrink-0">
              <Btn variant="primary" onClick={applyProrateo}
                disabled={!pctOk || contractTotal <= 0}>
                Aplicar
              </Btn>
              <Btn variant="ghost" onClick={() => setShowProrateo(false)}>Cancelar</Btn>
            </div>
          </div>
        </div>
      ) : (
        <div className="flex justify-end mb-2">
          <Btn size="sm" variant="ghost" onClick={() => setShowProrateo(true)}>
            📊 Prorratear por familia
          </Btn>
        </div>
      )}

      <div className="rounded-lg border border-gray-200 overflow-hidden">
        <table className="w-full text-sm">
          <thead>
            <tr className="bg-gray-50 border-b border-gray-200">
              <th className="px-4 py-2.5 text-left font-medium text-gray-500">Familia</th>
              <th className="px-4 py-2.5 text-center font-medium text-gray-400 w-24">% Estándar</th>
              <th className="px-4 py-2.5 text-right font-medium text-gray-500 w-48">Presupuesto (UF)</th>
            </tr>
          </thead>
          <tbody className="divide-y divide-gray-100">
            {COST_CATS.map(cat => (
              <tr key={cat.id} className="hover:bg-gray-50">
                <td className="px-4 py-1.5 text-gray-700">{cat.label}</td>
                <td className="p-0">
                  <input
                    type="number" value={customPcts[cat.id]}
                    onChange={e => setPct(cat.id, e.target.value)}
                    min="0" max="100" step="0.01"
                    className="w-full px-2 py-1.5 text-center text-xs font-mono text-blue-700
                      focus:outline-none focus:bg-blue-50 focus:text-blue-900"
                  />
                </td>
                <td className="p-0">
                  <input
                    type="number" value={values[cat.id] ?? ''}
                    onChange={e => onChange({ ...values, [cat.id]: e.target.value === '' ? '' : +e.target.value })}
                    min="0" step="0.01" placeholder="0.00"
                    className="w-full px-4 py-1.5 text-right text-sm focus:outline-none focus:bg-blue-50"
                  />
                </td>
              </tr>
            ))}
          </tbody>
          <tfoot>
            <tr className="border-t border-gray-200 bg-gray-50">
              <td className="px-4 py-1 text-xs text-gray-400">
                <button type="button" onClick={() => setCustomPcts({ ...DEFAULT_COST_PCTS })}
                  className="underline hover:text-gray-600">
                  Restablecer % por defecto
                </button>
              </td>
              <td className={`px-2 py-1 text-center text-xs font-mono font-semibold ${pctOk ? 'text-gray-400' : 'text-red-500'}`}>
                {pctSum.toFixed(2)}%
              </td>
              <td />
            </tr>
            <tr className="bg-blue-50 border-t-2 border-blue-200">
              <td className="px-4 py-2.5 font-semibold text-blue-800" colSpan={2}>Total Costos Directos</td>
              <td className="px-4 py-2.5 text-right font-bold text-blue-800 font-mono">{fUF(total)}<span className="uf-label text-blue-600">UF</span></td>
            </tr>
          </tfoot>
        </table>
      </div>
    </div>
  );
}

// ─── FORMULARIO PROYECTO ──────────────────────────────────────────────────────

function ProjectForm({ project, projects, onSave, onCancel }) {
  const isNew = !project;

  const [form, setForm] = useState(() => {
    if (project) return {
      ...project,
      costCurve:    normalizeCurve(project.costCurve),
      revenueCurve: normalizeCurve(project.revenueCurve),
    };
    return {
      id: `proj-${Date.now().toString().slice(-6)}`,
      name: '', unCode: '',
      contractType: 'suma_alzada', status: 'presupuestado',
      isOffBudget: false,
      startDate: '', endDate: '', durationMonths: 0,
      replacesProject: null,
      contract: { costDirectoGG: '', gastoGeneralOC: '', utilidadEstudiada: '', provisionPostVenta: '', originalAmount: 0, advancePercent: 10, retentionPercent: 5, extraordinaryWorks: [] },
      budgetByCategory: emptyBudget(),
      costCurve: [], revenueCurve: [],
    };
  });

  const months = useMemo(
    () => getMonthLabels(form.startDate, form.durationMonths),
    [form.startDate, form.durationMonths]
  );

  function set(key, value) { setForm(prev => ({ ...prev, [key]: value })); }
  function setC(key, value) { setForm(prev => ({ ...prev, contract: { ...prev.contract, [key]: value } })); }

  function handleDates(start, end) {
    const n = monthsBetween(start, end);
    setForm(prev => ({
      ...prev, startDate: start, endDate: end, durationMonths: n,
      costCurve:    n > 0 ? generateSCurve(n) : [],
      revenueCurve: n > 0 ? generateSCurve(n) : [],
    }));
  }

  function handleContractType(type) {
    const def = type === 'suma_alzada'
      ? { costDirectoGG: '', gastoGeneralOC: '', utilidadEstudiada: '', provisionPostVenta: '', originalAmount: 0, advancePercent: 10, retentionPercent: 5, extraordinaryWorks: [] }
      : { cashAdvance: '', monthlyGG: '', monthlyFee: '', totalBudgetedCost: '', provisionPostVenta: '' };
    setForm(prev => ({ ...prev, contractType: type, contract: def }));
  }

  // unCode es la CLAVE DE JOIN con ICEMM (unidadNegocioCodigo del Reporte Manager).
  // Debe ser único y normalizarse al formato canónico de 2 dígitos con cero a la izquierda.
  const normUnCode = v => String(v ?? '').trim().padStart(2, '0');
  // Saneo de montos: fuerza número finito >= 0 (descarta negativos y NaN).
  const sanitizeMonto = v => {
    const n = +v;
    return Number.isFinite(n) && n > 0 ? n : 0;
  };
  // Campos monetarios del contrato a sanear (según el tipo); los % de anticipo/retención
  // ya tienen min en el input y no se tocan acá.
  const CONTRACT_MONEY_FIELDS = [
    'costDirectoGG', 'gastoGeneralOC', 'utilidadEstudiada', 'provisionPostVenta',
    'totalBudgetedCost', 'monthlyGG', 'monthlyFee', 'cashAdvance', 'honorarioAdmin', 'fondoCaja',
  ];

  function handleSubmit(e) {
    e.preventDefault();

    // ── Validación unCode (clave de join con ICEMM): único y normalizado ──────────
    const canonicalUn = normUnCode(form.unCode);
    const collision = projects.some(p =>
      p.id !== form.id && normUnCode(p.unCode) === canonicalUn
    );
    if (collision) {
      alert(`El código de Unidad de Negocio "${canonicalUn}" ya está en uso por otro proyecto. Debe ser único (es la clave de cruce con ICEMM).`);
      return;
    }

    // ── Validación de fechas: fin no puede ser anterior al inicio ─────────────────
    if (form.startDate && form.endDate && form.endDate < form.startDate) {
      alert('La fecha de término no puede ser anterior a la fecha de inicio.');
      return;
    }

    if (form.durationMonths > 0) {
      const sc = form.costCurve.reduce((a, b) => a + (+b || 0), 0);
      const sr = form.revenueCurve.reduce((a, b) => a + (+b || 0), 0);
      if (Math.abs(sc - 100) > 0.1) { alert('La curva de costo debe sumar 100%'); return; }
      if (Math.abs(sr - 100) > 0.1) { alert('La curva de facturación debe sumar 100%'); return; }
    }

    // ── Saneo de montos negativos/NaN en contrato y presupuesto por categoría ─────
    const cleanContract = { ...form.contract };
    CONTRACT_MONEY_FIELDS.forEach(f => {
      if (cleanContract[f] !== undefined && cleanContract[f] !== '' && cleanContract[f] !== null) {
        cleanContract[f] = sanitizeMonto(cleanContract[f]);
      }
    });
    const cleanBudget = { ...form.budgetByCategory };
    Object.keys(cleanBudget).forEach(k => {
      if (cleanBudget[k] !== '' && cleanBudget[k] !== undefined && cleanBudget[k] !== null) {
        cleanBudget[k] = sanitizeMonto(cleanBudget[k]);
      }
    });

    const base = { ...form, unCode: canonicalUn, contract: cleanContract, budgetByCategory: cleanBudget };

    let savedForm = base;
    if (base.contractType === 'suma_alzada') {
      const total = (+base.contract.costDirectoGG || 0) + (+base.contract.gastoGeneralOC || 0)
        + (+base.contract.utilidadEstudiada || 0) + (+base.contract.provisionPostVenta || 0);
      savedForm = { ...base, contract: { ...base.contract, originalAmount: total } };
    } else {
      const total = (+base.contract.costDirectoGG || 0) + (+base.contract.gastoGeneralOC || 0)
        + (+base.contract.honorarioAdmin || 0) + (+base.contract.fondoCaja || 0);
      savedForm = { ...base, contract: { ...base.contract, originalAmount: total } };
    }
    onSave(savedForm);
  }

  const [billingOffset, setBillingOffset] = useState(0);

  function applyBillingOffset() {
    const off = Math.max(0, Math.round(billingOffset));
    if (off === 0) return;
    set('revenueCurve', [...Array(off).fill(0), ...form.revenueCurve]);
  }

  const costTotal = COST_CATS.reduce((s, c) => s + (+form.budgetByCategory[c.id] || 0), 0);
  const saTotal = (+form.contract.costDirectoGG || 0) + (+form.contract.gastoGeneralOC || 0)
    + (+form.contract.utilidadEstudiada || 0) + (+form.contract.provisionPostVenta || 0);
  const replaceable = projects.filter(p => p.id !== form.id);

  return (
    <form onSubmit={handleSubmit}>
      {/* Info general */}
      <SectionBox title="Información General">
        <div className="grid grid-cols-2 gap-3">
          <div className="col-span-2">
            <InputField label="Nombre del Proyecto" value={form.name}
              onChange={v => set('name', v)} required placeholder="ej: La Quebrada" />
          </div>
          <InputField label="Código Unidad de Negocio" value={form.unCode}
            onChange={v => set('unCode', v)} required placeholder="ej: 02" />
          <SelectField label="Tipo de Contrato" value={form.contractType}
            onChange={handleContractType} required options={[
              { value: 'suma_alzada',    label: 'Suma Alzada' },
              { value: 'admin_delegada', label: 'Administración Delegada' },
            ]} />
          <SelectField label="Estado" value={form.status} onChange={v => set('status', v)} options={[
            { value: 'presupuestado', label: 'Presupuestado' },
            { value: 'en_ejecucion',  label: 'En Ejecución' },
            { value: 'terminado',     label: 'Terminado' },
          ]} />
          <div className="col-span-2">
            <label className="flex items-start gap-3 cursor-pointer select-none p-3 rounded-lg border border-amber-200 bg-amber-50 hover:bg-amber-100 transition-colors">
              <input
                type="checkbox"
                checked={!!form.isOffBudget}
                onChange={e => set('isOffBudget', e.target.checked)}
                className="mt-0.5 w-4 h-4 accent-amber-500 flex-shrink-0"
              />
              <div>
                <span className="text-sm font-semibold text-amber-800">
                  Proyecto incorporado post-cierre de presupuesto anual
                </span>
                <p className="text-xs text-amber-600 mt-0.5">
                  No existía al momento del cierre del Ppto Anual. En el Informe de Gestión las columnas Ppto estarán vacías y la diferencia se calculará contra cero.
                </p>
              </div>
            </label>
          </div>
          <SelectField
            label="Reemplaza a (opcional)"
            value={form.replacesProject ?? ''}
            onChange={v => set('replacesProject', v || null)}
            options={[
              { value: '', label: '— Ninguno —' },
              ...replaceable.map(p => ({ value: p.id, label: `${p.name} (UN ${p.unCode})` })),
            ]}
          />
          <MonthField label="Fecha Inicio" value={form.startDate}
            onChange={v => handleDates(v, form.endDate)} required />
          <MonthField label="Fecha Término" value={form.endDate}
            onChange={v => handleDates(form.startDate, v)} required />
        </div>
        {form.durationMonths > 0 && (
          <p className="text-xs text-gray-400 mt-2">
            Duración: <strong className="text-gray-600">{form.durationMonths} meses</strong>
            {' '}— {form.startDate} → {form.endDate}
          </p>
        )}
      </SectionBox>

      {/* Contrato */}
      <SectionBox title={form.contractType === 'suma_alzada' ? 'Contrato – Suma Alzada' : 'Contrato – Administración Delegada'}>
        {form.contractType === 'suma_alzada' ? (
          <div className="space-y-3">
            <div className="border border-gray-200 rounded-lg overflow-hidden">
              <table className="w-full text-sm">
                <thead className="bg-gray-50">
                  <tr>
                    <th className="text-left px-3 py-2 text-gray-600 font-medium">Componente del Contrato</th>
                    <th className="text-right px-3 py-2 text-gray-600 font-medium w-44">Monto (UF)</th>
                  </tr>
                </thead>
                <tbody className="divide-y divide-gray-100">
                  {[
                    { key: 'costDirectoGG',      label: 'Costo Directo + GG de Obra' },
                    { key: 'gastoGeneralOC',     label: 'Gasto General Of. Central' },
                    { key: 'utilidadEstudiada',  label: 'Utilidad Estudiada' },
                    { key: 'provisionPostVenta', label: 'Provisión Post Venta' },
                  ].map(({ key, label }) => (
                    <tr key={key} className="bg-white">
                      <td className="px-3 py-2 text-gray-700">{label}</td>
                      <td className="px-3 py-2">
                        <input type="number" min="0" step="0.01"
                          className="w-full text-right border border-gray-200 rounded px-2 py-1 text-sm focus:outline-none focus:ring-1 focus:ring-blue-400"
                          value={form.contract[key]}
                          onChange={e => setC(key, e.target.value)}
                          placeholder="0.00" />
                      </td>
                    </tr>
                  ))}
                  <tr className="bg-blue-50">
                    <td className="px-3 py-2 font-semibold text-blue-800 uppercase tracking-wide text-xs">Total Contrato</td>
                    <td className="px-3 py-2 text-right font-bold text-blue-800">{fUF(saTotal)} UF</td>
                  </tr>
                </tbody>
              </table>
            </div>
            <div className="grid grid-cols-3 gap-3">
              <InputField label="% Anticipo" type="number" value={form.contract.advancePercent}
                onChange={v => setC('advancePercent', v)} min="0" max="50" step="0.1" />
              <InputField label="% Retención" type="number" value={form.contract.retentionPercent}
                onChange={v => setC('retentionPercent', v)} min="0" max="20" step="0.1" />
              <div className="flex items-center">
                {saTotal > 0 && (
                  <div className="bg-blue-50 rounded-lg px-3 py-2 text-xs text-blue-700 w-full">
                    Anticipo: <strong>{fUF(saTotal * (+form.contract.advancePercent || 0) / 100)} UF</strong>
                  </div>
                )}
              </div>
            </div>
          </div>
        ) : (
          <div className="border border-gray-200 rounded-lg overflow-hidden">
            <table className="w-full text-sm">
              <thead className="bg-gray-50">
                <tr>
                  <th className="text-left px-3 py-2 text-gray-600 font-medium">Componente del Contrato</th>
                  <th className="text-right px-3 py-2 text-gray-600 font-medium w-44">Monto (UF)</th>
                  <th className="text-right px-3 py-2 text-gray-400 font-normal w-40 text-xs">Cuota mensual</th>
                </tr>
              </thead>
              <tbody className="divide-y divide-gray-100">
                <tr className="bg-white">
                  <td className="px-3 py-2 text-gray-700">Costo Directo + GG de Obra</td>
                  <td className="px-3 py-2">
                    <input type="number" min="0" step="0.01" placeholder="0.00"
                      className="w-full text-right border border-gray-200 rounded px-2 py-1 text-sm focus:outline-none focus:ring-1 focus:ring-blue-400"
                      value={form.contract.totalBudgetedCost}
                      onChange={e => setC('totalBudgetedCost', e.target.value)} />
                  </td>
                  <td className="px-3 py-2 text-right text-xs text-gray-400">según curva</td>
                </tr>
                <tr className="bg-white">
                  <td className="px-3 py-2 text-gray-700">Gasto General Of. Central</td>
                  <td className="px-3 py-2">
                    <input type="number" min="0" step="0.01" placeholder="0.00"
                      className="w-full text-right border border-gray-200 rounded px-2 py-1 text-sm focus:outline-none focus:ring-1 focus:ring-blue-400"
                      value={form.contract.monthlyGG}
                      onChange={e => setC('monthlyGG', e.target.value)} />
                  </td>
                  <td className="px-3 py-2 text-right text-xs text-blue-600 font-mono">
                    {(+form.contract.monthlyGG || 0) > 0
                      ? `${fUF(+form.contract.monthlyGG)} UF/mes`
                      : <span className="text-gray-300">—</span>}
                  </td>
                </tr>
                <tr className="bg-white">
                  <td className="px-3 py-2 text-gray-700">Honorario de Administración</td>
                  <td className="px-3 py-2">
                    <input type="number" min="0" step="0.01" placeholder="0.00"
                      className="w-full text-right border border-gray-200 rounded px-2 py-1 text-sm focus:outline-none focus:ring-1 focus:ring-blue-400"
                      value={form.contract.monthlyFee}
                      onChange={e => setC('monthlyFee', e.target.value)} />
                  </td>
                  <td className="px-3 py-2 text-right text-xs text-blue-600 font-mono">
                    {(+form.contract.monthlyFee || 0) > 0
                      ? `${fUF(+form.contract.monthlyFee)} UF/mes`
                      : <span className="text-gray-300">—</span>}
                  </td>
                </tr>
                <tr className="bg-white">
                  <td className="px-3 py-2 text-gray-700">Fondo de Caja</td>
                  <td className="px-3 py-2">
                    <input type="number" min="0" step="0.01" placeholder="0.00"
                      className="w-full text-right border border-gray-200 rounded px-2 py-1 text-sm focus:outline-none focus:ring-1 focus:ring-blue-400"
                      value={form.contract.cashAdvance}
                      onChange={e => setC('cashAdvance', e.target.value)} />
                  </td>
                  <td className="px-3 py-2 text-right text-xs text-gray-300">—</td>
                </tr>
                {/* GG y Honorarios: calculados automáticamente de tasa mensual × duración */}
                <tr className="bg-gray-50/50">
                  <td className="px-3 py-2 text-gray-500 italic text-sm">GG Of. Central (total)</td>
                  <td className="px-3 py-2 text-right font-mono text-sm text-blue-700">
                    {fUF((+form.contract.monthlyGG || 0) * (form.durationMonths || 0))} UF
                  </td>
                  <td className="px-3 py-2 text-right text-xs text-blue-500">
                    {(+form.contract.monthlyGG || 0) > 0 && form.durationMonths > 0
                      ? `${fUF(+form.contract.monthlyGG)} × ${form.durationMonths}m`
                      : <span className="text-gray-300">—</span>}
                  </td>
                </tr>
                <tr className="bg-gray-50/50">
                  <td className="px-3 py-2 text-gray-500 italic text-sm">Honorarios (total)</td>
                  <td className="px-3 py-2 text-right font-mono text-sm text-blue-700">
                    {fUF((+form.contract.monthlyFee || 0) * (form.durationMonths || 0))} UF
                  </td>
                  <td className="px-3 py-2 text-right text-xs text-blue-500">
                    {(+form.contract.monthlyFee || 0) > 0 && form.durationMonths > 0
                      ? `${fUF(+form.contract.monthlyFee)} × ${form.durationMonths}m`
                      : <span className="text-gray-300">—</span>}
                  </td>
                </tr>
                <tr className="bg-gray-50/50">
                  <td className="px-3 py-2 text-gray-500 italic text-sm">Provisión Post Venta</td>
                  <td className="px-3 py-2">
                    <input type="number" min="0" step="0.01" placeholder="0.00"
                      className="w-full text-right border border-gray-200 rounded px-2 py-1 text-sm focus:outline-none focus:ring-1 focus:ring-blue-400"
                      value={form.contract.provisionPostVenta ?? ''}
                      onChange={e => setC('provisionPostVenta', e.target.value)} />
                  </td>
                  <td className="px-3 py-2 text-right text-xs text-gray-300">—</td>
                </tr>
              </tbody>
              <tfoot>
                <tr className="bg-gray-50 border-t border-gray-200">
                  <td className="px-3 py-2 text-xs text-gray-400">
                    Duración: <strong className="text-gray-600">{form.durationMonths || '—'} meses</strong>
                    {form.durationMonths > 0 && (
                      <span className="ml-2 text-gray-400">
                        (GG: {fUF((+form.contract.monthlyGG || 0) * form.durationMonths)} UF ·
                        Hon.: {fUF((+form.contract.monthlyFee || 0) * form.durationMonths)} UF total plazo)
                      </span>
                    )}
                  </td>
                  <td colSpan={2} />
                </tr>
                <tr className="bg-blue-50">
                  <td className="px-3 py-2 font-semibold text-blue-800 uppercase tracking-wide text-xs">Total Contrato</td>
                  <td className="px-3 py-2 text-right font-bold text-blue-800">
                    {fUF(
                      (+form.contract.totalBudgetedCost || 0) +
                      (+form.contract.monthlyGG   || 0) * (form.durationMonths || 0) +
                      (+form.contract.monthlyFee  || 0) * (form.durationMonths || 0)
                    )} UF
                  </td>
                  <td className="px-3 py-2 text-right text-xs text-blue-600">suma total plazo</td>
                </tr>
              </tfoot>
            </table>
          </div>
        )}
      </SectionBox>

      {/* Presupuesto */}
      <SectionBox title="Estructura de Costos por Familia (sin GG of. central, ni utilidad ni post venta)">
        <BudgetTable
          values={form.budgetByCategory}
          onChange={v => set('budgetByCategory', v)}
          contractTotal={
            form.contractType === 'suma_alzada'
              ? +form.contract.costDirectoGG || 0
              : +form.contract.totalBudgetedCost || 0
          }
        />
        {form.contractType === 'suma_alzada' && saTotal > 0 && (
          <p className="text-xs text-gray-400 mt-2">
            Margen estimado:{' '}
            <strong className={`${(saTotal - costTotal) >= 0 ? 'text-emerald-600' : 'text-red-500'}`}>
              {fUF(saTotal - costTotal)} UF
            </strong>
            {' '}({(((saTotal - costTotal) / saTotal) * 100).toFixed(1)}%)
          </p>
        )}
      </SectionBox>

      {/* Curvas */}
      {form.durationMonths > 0 && months.length > 0 && (
        <SectionBox title="Curvas de Distribución Temporal">
          <CurveEditor label="Curva de Costo" months={months}
            values={form.costCurve} onChange={v => set('costCurve', v)} />

          {/* Desfase de facturación */}
          <div className="flex items-center gap-3 my-3 px-3 py-2.5 bg-amber-50 border border-amber-200 rounded-lg">
            <span className="text-xs font-medium text-amber-800 shrink-0">
              Desfase inicio facturación:
            </span>
            <div className="flex items-center gap-1.5">
              <button type="button"
                onClick={() => setBillingOffset(v => Math.max(0, v - 1))}
                className="w-6 h-6 rounded border border-amber-300 text-amber-700 hover:bg-amber-100 text-sm leading-none flex items-center justify-center">−</button>
              <input type="number" min="0" max={form.durationMonths - 1} step="1"
                value={billingOffset}
                onChange={e => setBillingOffset(Math.max(0, Math.min(+e.target.value || 0, form.durationMonths - 1)))}
                className="w-12 border border-amber-300 rounded px-1 py-0.5 text-xs text-center bg-white focus:outline-none focus:ring-1 focus:ring-amber-400" />
              <button type="button"
                onClick={() => setBillingOffset(v => Math.min(v + 1, form.durationMonths - 1))}
                className="w-6 h-6 rounded border border-amber-300 text-amber-700 hover:bg-amber-100 text-sm leading-none flex items-center justify-center">+</button>
              <span className="text-xs text-amber-600">meses</span>
            </div>
            <Btn size="sm" variant="ghost" onClick={applyBillingOffset}
              disabled={billingOffset <= 0}>
              → Aplicar desfase
            </Btn>
            {billingOffset > 0 && (
              <span className="text-xs text-amber-600 ml-auto">
                +{billingOffset} mes{billingOffset > 1 ? 'es' : ''} al inicio · la curva quedará con {(form.revenueCurve.length || form.durationMonths) + billingOffset} períodos
              </span>
            )}
          </div>

          <CurveEditor label="Curva de Facturación" months={months}
            values={form.revenueCurve} onChange={v => set('revenueCurve', v)} />
        </SectionBox>
      )}

      {/* Acciones */}
      <div className="flex justify-end gap-2 pt-4 border-t border-gray-100 mt-2">
        <Btn variant="ghost" onClick={onCancel}>Cancelar</Btn>
        <Btn type="submit" variant="primary">
          {isNew ? '+ Agregar Proyecto' : '✓ Guardar Cambios'}
        </Btn>
      </div>
    </form>
  );
}

// ─── GESTIÓN DE PROYECTOS ─────────────────────────────────────────────────────

function ProjectManager({ projects, setProjects }) {
  const [showForm,   setShowForm]   = useState(false);
  const [editTarget, setEditTarget] = useState(null);
  const [confirmDel, setConfirmDel] = useState(null);

  function openNew()   { setEditTarget(null); setShowForm(true);  }
  function openEdit(p) { setEditTarget(p);    setShowForm(true);  }
  function closeForm() { setShowForm(false);  setEditTarget(null); }

  function handleSave(proj) {
    // Guarda de persistencia (defensa en profundidad respecto a ProjectForm.handleSubmit).
    // unCode es la CLAVE DE JOIN con ICEMM (unidadNegocioCodigo): normalizar y exigir unicidad.
    const normUnCode = v => String(v ?? '').trim().padStart(2, '0');
    const canonicalUn = normUnCode(proj.unCode);
    const collision = projects.some(p => p.id !== proj.id && normUnCode(p.unCode) === canonicalUn);
    if (collision) {
      alert(`El código de Unidad de Negocio "${canonicalUn}" ya está en uso por otro proyecto. Debe ser único (clave de cruce con ICEMM).`);
      return;
    }
    if (proj.startDate && proj.endDate && proj.endDate < proj.startDate) {
      alert('La fecha de término no puede ser anterior a la fecha de inicio.');
      return;
    }
    const safeProj = { ...proj, unCode: canonicalUn };
    setProjects(prev =>
      prev.find(p => p.id === safeProj.id)
        ? prev.map(p => p.id === safeProj.id ? safeProj : p)
        : [...prev, safeProj]
    );
    closeForm();
  }

  function handleDelete(id) {
    setProjects(prev => prev.filter(p => p.id !== id));
    setConfirmDel(null);
  }

  // Leer si el presupuesto anual está fijado (para proteger proyectos originales)
  const budgetLocked = useMemo(() => {
    try {
      const years = [];
      projects.forEach(p => {
        if (p.startDate) years.push(parseInt(p.startDate.slice(0, 4)));
      });
      const activeYear = years.length ? Math.min(...years) : new Date().getFullYear();
      const b = storage.get(`budget-control:budget:${activeYear}`);
      return b?.status === 'fijado';
    } catch { return false; }
  }, [projects]);

  function contractAmount(p) {
    if (p.contractType === 'suma_alzada') return +p.contract.originalAmount || 0;
    const n = p.durationMonths || 0;
    return (+p.contract.totalBudgetedCost || 0)
      + (+p.contract.monthlyGG  || 0) * n
      + (+p.contract.monthlyFee || 0) * n;
  }

  const enEjecucion     = projects.filter(p => p.status === 'en_ejecucion').length;
  const totalSA         = projects.filter(p => p.contractType === 'suma_alzada').reduce((s, p) => s + contractAmount(p), 0);
  const totalAD         = projects.filter(p => p.contractType === 'admin_delegada').reduce((s, p) => s + contractAmount(p), 0);
  const totalEjecucion  = projects.filter(p => p.status === 'en_ejecucion').reduce((s, p) => s + contractAmount(p), 0);
  const totalPresupuesto = projects.reduce((s, p) => s + contractAmount(p), 0);

  return (
    <div>
      {/* Encabezado */}
      <div className="flex items-center justify-between mb-6">
        <div className="flex items-center gap-3">
          <div className="w-1 h-8 bg-[#C8102E] rounded-full" />
          <div>
            <h1 className="text-xl font-bold text-gray-900 leading-tight">Gestión de Proyectos</h1>
            <p className="text-xs text-gray-400 font-medium">
              {projects.length} proyecto{projects.length !== 1 ? 's' : ''} registrado{projects.length !== 1 ? 's' : ''}
            </p>
          </div>
        </div>
        <Btn size="lg" onClick={openNew}>+ Agregar Proyecto</Btn>
      </div>

      {/* Tarjetas KPI */}
      <div className="grid grid-cols-5 gap-3 mb-5">
        {[
          { label: 'Proyectos en Ejecución',         value: enEjecucion,          unit: 'proyectos', accent: 'card-accent-green'  },
          { label: 'Total Contratos en Ejecución',   value: fUF(totalEjecucion),  unit: 'UF',        accent: 'card-accent-red'    },
          { label: 'Total Contratos en Presupuesto', value: fUF(totalPresupuesto),unit: 'UF',        accent: 'card-accent-blue'   },
          { label: 'Volumen Suma Alzada',            value: fUF(totalSA),         unit: 'UF',        accent: 'card-accent-orange' },
          { label: 'Volumen Adm. Delegada',          value: fUF(totalAD),         unit: 'UF',        accent: 'card-accent-orange' },
        ].map(s => (
          <div key={s.label} className={`bg-white rounded-xl p-4 shadow-sm border border-gray-200 ${s.accent}`}>
            <p className="text-[10px] font-bold text-gray-400 uppercase tracking-widest mb-2">{s.label}</p>
            <p className="text-xl font-bold text-gray-900 mono">
              {s.value} <span className="text-sm font-semibold text-gray-400">{s.unit}</span>
            </p>
          </div>
        ))}
      </div>

      {/* Tabla */}
      <div className="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
        <TopScroll>
          <table className="w-full">
            <thead>
              <tr className="border-b border-gray-200" style={{background:'#f8f9fb'}}>
                {['UN', 'Proyecto', 'Tipo', 'Estado', 'Monto / Costo (UF)', 'Inicio', 'Término', 'Meses', ''].map(h => (
                  <th key={h} className="px-4 py-2.5 text-left text-[10px] font-bold text-gray-400 uppercase tracking-widest whitespace-nowrap">
                    {h}
                  </th>
                ))}
              </tr>
            </thead>
            <tbody className="divide-y divide-gray-100">
              {projects.length === 0 && (
                <tr>
                  <td colSpan={9} className="px-4 py-16 text-center">
                    <div className="text-4xl mb-2">🏗️</div>
                    <p className="text-gray-400 text-sm">No hay proyectos registrados.</p>
                    <button onClick={openNew} className="text-blue-600 text-sm mt-1 hover:underline">
                      Agrega el primero
                    </button>
                  </td>
                </tr>
              )}
              {projects.map(p => (
                <tr key={p.id} className="hover:bg-gray-50 transition-colors">
                  <td className="px-4 py-3">
                    <span className="bg-gray-100 px-2 py-0.5 rounded text-xs font-mono text-gray-500">
                      UN {p.unCode}
                    </span>
                  </td>
                  <td className="px-4 py-3">
                    <div className="flex items-center gap-2">
                      <span className="font-semibold text-gray-800 text-sm">{p.name}</span>
                      {p.isOffBudget && (
                        <span className="inline-block text-[9px] font-bold uppercase tracking-wide px-1.5 py-0.5 rounded bg-amber-100 text-amber-700 border border-amber-300 whitespace-nowrap">
                          Fuera de Ppto
                        </span>
                      )}
                    </div>
                    {p.replacesProject && (
                      <div className="text-xs text-gray-400 mt-0.5">
                        Reemplaza: {projects.find(x => x.id === p.replacesProject)?.name || '–'}
                      </div>
                    )}
                  </td>
                  <td className="px-4 py-3"><TypeBadge type={p.contractType} /></td>
                  <td className="px-4 py-3"><StatusBadge status={p.status} /></td>
                  <td className="px-4 py-3 text-right font-mono text-sm text-gray-700 whitespace-nowrap">
                    {fUF(contractAmount(p))}
                  </td>
                  <td className="px-4 py-3 text-sm text-gray-500 whitespace-nowrap">{p.startDate}</td>
                  <td className="px-4 py-3 text-sm text-gray-500 whitespace-nowrap">{p.endDate}</td>
                  <td className="px-4 py-3 text-center text-sm text-gray-500">{p.durationMonths}</td>
                  <td className="px-4 py-3">
                    <div className="flex items-center gap-1.5">
                      <Btn size="sm" variant="ghost" onClick={() => openEdit(p)}>✏️ Editar</Btn>
                      {(!budgetLocked || p.isOffBudget) ? (
                        <Btn size="sm" variant="danger" onClick={() => setConfirmDel(p.id)}>🗑</Btn>
                      ) : (
                        <span title="Presupuesto anual fijado — este proyecto no puede eliminarse"
                          className="inline-flex items-center gap-1 px-2 py-1 rounded text-[11px] text-gray-300 bg-gray-100 border border-gray-200 cursor-not-allowed select-none">
                          🔒 Fijado
                        </span>
                      )}
                    </div>
                  </td>
                </tr>
              ))}
            </tbody>
          </table>
        </TopScroll>
      </div>

      {/* Modal formulario */}
      <Modal open={showForm} onClose={closeForm}
        title={editTarget ? `Editar: ${editTarget.name}` : 'Nuevo Proyecto'} wide>
        <ProjectForm project={editTarget} projects={projects}
          onSave={handleSave} onCancel={closeForm} />
      </Modal>

      {/* Modal confirmar eliminación */}
      {(() => {
        const delProj = projects.find(p => p.id === confirmDel);
        return (
          <Modal open={!!confirmDel} onClose={() => setConfirmDel(null)} title="Eliminar Proyecto">
            <p className="text-gray-600 text-sm mb-3">
              ¿Confirmas eliminar <strong>{delProj?.name}</strong>?
              Esta acción no se puede deshacer.
            </p>
            {delProj?.isOffBudget && (
              <div className="rounded-lg bg-amber-50 border border-amber-200 px-3 py-2 text-xs text-amber-700 mb-4">
                Proyecto incorporado post-cierre de presupuesto. Al eliminarlo desaparecerá de Proyecciones, Informe de Gestión y Flujo de Caja.
              </div>
            )}
            <div className="flex justify-end gap-2">
              <Btn variant="ghost" onClick={() => setConfirmDel(null)}>Cancelar</Btn>
              <Btn variant="danger" onClick={() => handleDelete(confirmDel)}>Sí, eliminar</Btn>
            </div>
          </Modal>
        );
      })()}
    </div>
  );
}

// ─── PRESUPUESTO ANUAL ────────────────────────────────────────────────────────

function AnnualBudget({ year, projects }) {
  const [budget, setBudget] = useState(null);
  const [confirm, setConfirm] = useState(false);
  const [collapsedProjects, setCollapsedProjects] = useState(() => new Set());
  const [ocCollapsed, setOcCollapsed] = useState(false);
  const [ingSecCollapsed, setIngSecCollapsed] = useState(false);
  const [cosSecCollapsed, setCosSecCollapsed] = useState(false);
  const [ocSecCollapsed,  setOcSecCollapsed]  = useState(false);
  const [resSecCollapsed, setResSecCollapsed] = useState(false);
  const ocTemplateRef = React.useRef(null);

  // Cargar o inicializar presupuesto al cambiar de año
  useEffect(() => {
    const saved = storage.get(`budget-control:budget:${year}`);
    setBudget(saved || initBudget(year));
  }, [year]);

  // Persistir (solo si borrador)
  useEffect(() => {
    if (budget && budget.status === 'borrador') {
      storage.set(`budget-control:budget:${year}`, budget);
    }
  }, [budget, year]);

  if (!budget) return <div className="p-8 text-gray-400">Cargando…</div>;

  const locked = budget.status === 'fijado';

  // ── Datos de visualización ──────────────────────────────────────────────────
  // En borrador: calcular en tiempo real. En fijado: usar snapshot.
  function getRevenue(projId, m) {
    if (locked && budget.snapshot) return budget.snapshot[projId]?.monthlyRevenue[m] || 0;
    const p = projects.find(x => x.id === projId);
    return p ? calcMonthlyRevenue(p, year, m) : 0;
  }
  function getCost(projId, catId, m) {
    if (locked && budget.snapshot) return budget.snapshot[projId]?.monthlyCosts[catId]?.[m] || 0;
    const p = projects.find(x => x.id === projId);
    return p ? calcMonthlyProjectCost(p, catId, year, m) : 0;
  }
  function getOC(catId, m) {
    return budget.oficinaCentral[catId]?.[m] || 0;
  }
  function getOtherIncome(m) {
    return budget.otherIncome.asesorias?.[m] || 0;
  }

  // Proyectos activos en el año — excluye proyectos post-cierre (no estaban en el Ppto Anual)
  const activeProjects = projects.filter(p => {
    if (!p.startDate || !p.endDate) return false;
    if (p.isOffBudget) return false;
    const [sy, sm] = p.startDate.split('-').map(Number);
    const [ey, em] = p.endDate.split('-').map(Number);
    const yearStart = year * 12;
    const projStart = sy * 12 + (sm - 1);
    const projEnd   = ey * 12 + (em - 1);
    return projStart <= yearStart + 11 && projEnd >= yearStart;
  });

  // Ingreso neto mensual por proyecto usando el desglose explícito
  function calcNetRevenue(p, m) {
    const idx = projectMonthIdx(p, year, m);
    if (idx === -1) return 0;
    if (p.contractType === 'suma_alzada') {
      const curve = (p.revenueCurve && p.revenueCurve[idx]) || 0;
      const bruto = (+p.contract.originalAmount || 0) * curve / 100;
      const ret = (+p.contract.retentionPercent || 0) / 100;
      return bruto * (1 - ret);
    } else {
      const curve = (p.costCurve && p.costCurve[idx]) || 0;
      const rendicion = (+p.contract.totalBudgetedCost || 0) * curve / 100;
      return rendicion + (+p.contract.monthlyFee || 0) + (+p.contract.monthlyGG || 0);
    }
  }

  // Totales por mes
  const totalRevByMonth = Array.from({ length: 12 }, (_, m) =>
    activeProjects.reduce((s, p) => s + calcNetRevenue(p, m), 0) + getOtherIncome(m)
  );
  const totalCostByMonth = Array.from({ length: 12 }, (_, m) =>
    activeProjects.reduce((s, p) =>
      COST_CATS.reduce((s2, c) => s2 + getCost(p.id, c.id, m), s), 0)
  );
  const totalOCByMonth = Array.from({ length: 12 }, (_, m) =>
    OC_CATS.reduce((s, c) => s + getOC(c.id, m), 0)
  );
  const margenByMonth = Array.from({ length: 12 }, (_, m) =>
    totalRevByMonth[m] - totalCostByMonth[m]
  );
  const resultByMonth = Array.from({ length: 12 }, (_, m) =>
    totalRevByMonth[m] - totalCostByMonth[m] - totalOCByMonth[m]
  );

  const sumRow = arr => arr.reduce((a, b) => a + b, 0);

  // ── Edición de OC ───────────────────────────────────────────────────────────
  function setOCValue(catId, m, val) {
    if (locked) return;
    setBudget(prev => {
      const oc = { ...prev.oficinaCentral };
      oc[catId] = [...(oc[catId] || Array(12).fill(0))];
      oc[catId][m] = +val || 0;
      return { ...prev, oficinaCentral: oc };
    });
  }
  function setOtherIncomeValue(m, val) {
    if (locked) return;
    setBudget(prev => {
      const oi = { ...prev.otherIncome };
      oi.asesorias = [...(oi.asesorias || Array(12).fill(0))];
      oi.asesorias[m] = +val || 0;
      return { ...prev, otherIncome: oi };
    });
  }

  // ── Template Excel OC ────────────────────────────────────────────────────────
  function downloadOCTemplate() {
    const header = ['Concepto', ...MONTH_ABR];
    const rows = OC_CATS.map(cat => {
      const vals = budget.oficinaCentral[cat.id] || Array(12).fill(0);
      return [cat.label, ...vals];
    });
    const ws = XLSX.utils.aoa_to_sheet([header, ...rows]);
    // Column widths
    ws['!cols'] = [{ wch: 30 }, ...Array(12).fill({ wch: 12 })];
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'Oficina Central');
    XLSX.writeFile(wb, `template_OC_${year}.xlsx`);
  }

  function handleOCTemplateUpload(e) {
    if (locked) return;
    const file = e.target.files?.[0];
    if (!file) return;
    e.target.value = '';
    const reader = new FileReader();
    reader.onload = ev => {
      try {
        const wb = XLSX.read(ev.target.result, { type: 'array' });
        const ws = wb.Sheets[wb.SheetNames[0]];
        const data = XLSX.utils.sheet_to_json(ws, { header: 1, raw: false, defval: '' });
        // Row 0 = header, rows 1..16 = OC_CATS (matched by label)
        const labelToId = Object.fromEntries(OC_CATS.map(c => [c.label.toLowerCase().trim(), c.id]));
        const newOC = { ...budget.oficinaCentral };
        data.slice(1).forEach(row => {
          const lbl = String(row[0] || '').toLowerCase().trim();
          const catId = labelToId[lbl];
          if (!catId) return;
          const vals = Array(12).fill(0).map((_, i) => {
            const raw = String(row[i + 1] || '').replace(',', '.').replace(/[^\d.\-]/g, '');
            return parseFloat(raw) || 0;
          });
          newOC[catId] = vals;
        });
        setBudget(prev => ({ ...prev, oficinaCentral: newOC }));
      } catch (err) {
        alert('Error al leer el archivo: ' + err.message);
      }
    };
    reader.readAsArrayBuffer(file);
  }

  // ── Fijar presupuesto ────────────────────────────────────────────────────────
  function handleFijar() {
    const snap = snapshotProjects(projects, year);
    const fixed = {
      ...budget,
      status: 'fijado',
      fixedDate: new Date().toISOString().slice(0, 10),
      snapshot: snap,
    };
    setBudget(fixed);
    storage.set(`budget-control:budget:${year}`, fixed);
    setConfirm(false);
  }

  // ── Helpers UI ───────────────────────────────────────────────────────────────
  // Anchos de columna fijos — idénticos en todas las tablas para alineación perfecta al hacer scroll
  const W_LABEL = 230;
  const W_MONTH = 84;
  const W_TOTAL = 92;
  const TABLE_W = W_LABEL + 12 * W_MONTH + W_TOTAL;

  const cellNum = 'text-right text-xs font-mono whitespace-nowrap';
  const tdLbl   = 'px-3 py-1.5 text-xs text-gray-600 whitespace-nowrap sticky left-0 z-10 bg-white border-r border-gray-100 overflow-hidden text-ellipsis';
  const DARK_HDR = '#1C3460';
  const DARK_SUB = '#243048';
  const DARK_TOT = '#374151';

  function MonthCells({ values, color = 'text-gray-700', bold = false, showUFTotal = true }) {
    const total = sumRow(values);
    return (
      <>
        {values.map((v, m) => (
          <td key={m} className={`px-2 py-1.5 ${cellNum} ${bold ? 'font-semibold' : ''} ${color} border-r border-gray-100/60`}>
            {v !== 0 ? fUF(v) : <span className="text-gray-300">–</span>}
          </td>
        ))}
        <td className={`px-2 py-1.5 ${cellNum} font-bold ${color} border-l-2 border-gray-300/40`}>
          {fUF(total)}{showUFTotal && <span className="uf-label">UF</span>}
        </td>
      </>
    );
  }

  function EditableCells({ values, onChange }) {
    const total = sumRow(values);
    return (
      <>
        {values.map((v, m) => (
          <td key={m} className="p-0 border-r border-gray-100">
            <input
              type="number" value={v || ''}
              onChange={e => onChange(m, e.target.value)}
              min="0" step="0.01" placeholder="0"
              className="w-full px-1.5 py-1.5 text-right text-xs font-mono focus:outline-none focus:bg-blue-50"
              disabled={locked}
            />
          </td>
        ))}
        <td className={`px-2 py-1.5 ${cellNum} font-bold text-gray-800 border-l-2 border-gray-300/40`}>
          {fUF(total)}<span className="uf-label">UF</span>
        </td>
      </>
    );
  }

  // <colgroup> compartido — garantiza que todas las tablas usen exactamente los mismos anchos
  function Cols() {
    return (
      <colgroup>
        <col style={{width: W_LABEL}} />
        {MONTH_ABR.map((_, i) => <col key={i} style={{width: W_MONTH}} />)}
        <col style={{width: W_TOTAL}} />
      </colgroup>
    );
  }

  function TableHeader() {
    return (
      <thead>
        <tr style={{background:'#f1f3f6'}}>
          <th className="px-3 py-2 text-left text-[10px] font-bold text-gray-500 uppercase tracking-wider sticky left-0 z-20 border-r border-gray-200"
            style={{background:'#f1f3f6', width: W_LABEL}}>
            Concepto
          </th>
          {MONTH_ABR.map(m => (
            <th key={m} className="px-2 py-2 text-center text-[10px] font-bold text-gray-400 uppercase tracking-wider border-b border-gray-200 border-r border-gray-100"
              style={{width: W_MONTH}}>
              {m}
            </th>
          ))}
          <th className="px-2 py-2 text-center text-[10px] font-bold text-gray-500 uppercase tracking-wider bg-gray-200/60 border-l-2 border-gray-300"
            style={{width: W_TOTAL}}>
            Total
          </th>
        </tr>
      </thead>
    );
  }

  // Fila de cabecera de proyecto — click para colapsar/expandir
  function ProjRow({ proj, keyPrefix }) {
    const k = `${keyPrefix}:${proj.id}`;
    const collapsed = collapsedProjects.has(k);
    const toggle = () => setCollapsedProjects(prev => {
      const s = new Set(prev); s.has(k) ? s.delete(k) : s.add(k); return s;
    });
    const tipo = proj.contractType === 'suma_alzada' ? 'Suma Alzada' : 'Adm. Delegada';
    return (
      <tr className="cursor-pointer select-none" onClick={toggle} style={{background: DARK_TOT}}>
        <td colSpan={14} className="px-3 py-1.5 text-[10px] font-bold text-white uppercase tracking-widest sticky left-0 z-10">
          <span className="inline-block w-4 text-gray-400 mr-1">{collapsed ? '▶' : '▼'}</span>
          {proj.name} · UN {proj.unCode} · {tipo}
        </td>

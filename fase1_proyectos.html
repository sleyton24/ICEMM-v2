            ))}
          </div>
        </div>
      </div>
      </>)}
    </div>
  );
}

// ─── ESCENARIOS ───────────────────────────────────────────────────────────────

function EscenariosModule({ projects, activeYear }) {
  const year = activeYear;
  const fN = n => {
    const v = +n || 0;
    if (Math.abs(v) < 0.005) return '—';
    return v.toLocaleString('es-CL', { minimumFractionDigits: 1, maximumFractionDigits: 1 });
  };

  const [refreshKey, setRefreshKey] = useState(0);
  const [periodoVistoES, setPeriodoVistoES] = useState('actual');
  React.useEffect(() => { setPeriodoVistoES('actual'); }, [year]);
  const activeProjects = useMemo(() => projects.filter(p => p.startDate && p.endDate), [projects]);

  const controlMonth = useMemo(() => {
    for (let m = 12; m >= 1; m--) {
      try {
        const d = storage.get(`budget-control:actuals:${year}:${String(m).padStart(2,'0')}`);
        if (d?.rows?.length > 0) return m;
      } catch {}
    }
    return 0;
  }, [year, refreshKey]);

  const actualsForYear = useMemo(() => {
    const r = {};
    for (let m = 1; m <= 12; m++) {
      try {
        const d = storage.get(`budget-control:actuals:${year}:${String(m).padStart(2,'0')}`);
        if (d?.rows) r[m] = d.rows;
      } catch {}
    }
    return r;
  }, [year, refreshKey]);

  const mayorData = useMemo(() => {
    try {
      const d = storage.get('budget-control:mayor:latest');
      return (d?.ingresos?.byUN && d?.ingresos?.totalCLP != null) ? d.ingresos : null;
    } catch { return null; }
  }, [refreshKey]);

  const projSnapshot = useMemo(() => {
    try { return storage.get(`budget-control:proj-snapshot:${year}`) || null; } catch { return null; }
  }, [year, refreshKey]);

  const ocBudgetByCat = useMemo(() => {
    try { return storage.get(`budget-control:budget:${year}`)?.oficinaCentral || {}; } catch { return {}; }
  }, [year, refreshKey]);

  const overrides = useMemo(() => {
    try { return storage.get(`budget-control:overrides:${year}`) || {}; } catch { return {}; }
  }, [year, refreshKey]);

  const INTERES_CTA = '5-2-01-002';
  const CATS_COSTO = PROJ_CATS.filter(c => c.id !== 'no_clasificado');

  const computeScenario = useCallback((projSet) => {
    const getReal = (unCode, cat, m) =>
      (actualsForYear[m] || []).filter(r => r.unCode === unCode && r.clasificacion === cat).reduce((s,r) => s+r.total, 0);
    const getOCReal = (concepto, m) =>
      (actualsForYear[m] || []).filter(r => r.clasificacion === 'oficina_central' && r.concepto === concepto).reduce((s,r) => s+r.total, 0);
    const getMUF = (unCode, m) => {
      if (!mayorData?.byUN?.[unCode]) return null;
      const mk = `${year}-${String(m).padStart(2,'0')}`;
      return Object.values(mayorData.byUN[unCode].byAccount).reduce((s,acc) => s+(acc.byMonthUF?.[mk]||0), 0);
    };
    let ingFY=0, cosFY=0, ocFY=0;
    for (let m = 1; m <= 12; m++) {
      const isHist = m <= controlMonth;
      const mk = `${year}-${String(m).padStart(2,'0')}`;
      projSet.forEach(p => {
        const proyUN = `UN${p.unCode.padStart(2,'0')}`;
        if (isHist) {
          const ov = overrides?.ingresos?.[p.id]?.[m];
          const mUF = getMUF(proyUN, m);
          ingFY += ov !== undefined ? +ov : (mUF !== null ? mUF : 0);
        } else {
          const ov = overrides?.ingresos?.[p.id]?.[m];
          const snapV = projSnapshot?.ingresos?.[p.id]?.[m];
          ingFY += ov !== undefined ? +ov : (snapV !== undefined ? +snapV : 0);
        }
        CATS_COSTO.forEach(c => {
          if (isHist) cosFY += getReal(p.unCode, c.id, m);
          else { const snapV = projSnapshot?.costos?.[p.id]?.[c.id]?.[m]; cosFY += snapV !== undefined ? +snapV : 0; }
        });
      });
      const asesorUF = mayorData?.byUN?.UN01
        ? Object.entries(mayorData.byUN.UN01.byAccount).filter(([cta]) => cta !== INTERES_CTA)
            .reduce((s,[,acc]) => s+(acc.byMonthUF?.[mk]||0), 0) : 0;
      const interUF = mayorData?.byUN?.UN01?.byAccount?.[INTERES_CTA]?.byMonthUF?.[mk] || 0;
      if (isHist) {
        const ov = overrides?.otrosIngresos?.[m];
        ingFY += ov !== undefined ? +ov : (asesorUF + interUF);
      } else {
        const ov = overrides?.otrosIngresos?.[m];
        const snapV = projSnapshot?.otrosIngresos?.[m];
        ingFY += ov !== undefined ? +ov : (snapV !== undefined ? +snapV : 0);
      }
      OC_PLAN.forEach(({ concepto, catId }) => {
        const ppto = ocBudgetByCat[catId]?.[m-1] || 0;
        if (isHist) ocFY += concepto ? getOCReal(concepto, m) : 0;
        else {
          const ov = overrides?.oc?.[concepto||catId]?.[m];
          const snapV = projSnapshot?.oc?.[catId]?.[m];
          ocFY += ov !== undefined ? +ov : (snapV !== undefined ? +snapV : ppto);
        }
      });
    }
    const resFY = ingFY - cosFY;
    const ebitdaFY = resFY - ocFY;
    const margen = ingFY > 0.01 ? ebitdaFY / ingFY * 100 : null;
    return { ingFY, cosFY, ocFY, resFY, ebitdaFY, margen };
  }, [actualsForYear, mayorData, projSnapshot, ocBudgetByCat, overrides, controlMonth, year]);

  const scenarios = useMemo(() => {
    const base = { label: 'Base', isBase: true, ...computeScenario(activeProjects) };
    const sinCada = activeProjects.map(p => ({
      label: `Sin ${p.name.length > 13 ? p.name.slice(0,13)+'…' : p.name}`,
      ...computeScenario(activeProjects.filter(pp => pp.id !== p.id))
    }));
    return [base, ...sinCada];
  }, [activeProjects, computeScenario]);

  const metrics = [
    { key: 'ingFY',    label: 'Ingresos FY',       sign:  1              },
    { key: 'cosFY',    label: 'Costos Obra FY',     sign: -1              },
    { key: 'resFY',    label: 'Resultado Op. FY',   sign:  1, bold: true  },
    { key: 'ocFY',     label: 'Of. Central FY',     sign: -1              },
    { key: 'ebitdaFY', label: 'EBITDA FY',          sign:  1, bold: true, hi: true },
    { key: 'margen',   label: 'Margen EBITDA %',    sign:  1, pct: true   },
  ];

  // ── Persistencia viva del snapshot de Escenarios ────────────────────────────
  // Mantiene `budget-control:scenarios-snapshot:{year}` al día con la tabla que se
  // renderiza ahora. buildGlobalSnapshot lo copia al cierre (modulos.scenarios) al
  // cerrar el mes. No escribimos cuando no hay proyectos activos (snapshot vacío)
  // para no pisar uno significativo previo. (Mismo patrón que el Dashboard.)
  React.useEffect(() => {
    if (activeProjects.length === 0) return;
    try {
      storage.set(`budget-control:scenarios-snapshot:${year}`,
        buildScenariosSnapshot({ year, controlMonth, scenarios, activeProjects }));
    } catch {}
  }, [year, controlMonth, scenarios, activeProjects]);

  // ── Resolución de fuente: vivo (actual) vs congelado (período cerrado) ───────
  // En período cerrado leemos lo que se congeló al cerrar ese mes
  // (getCierreModulo → modulos.scenarios). Las variables `view*` alimentan el JSX,
  // de modo que un mismo render sirve para ambos modos.
  const isClosedView = periodoVistoES !== 'actual';
  const frozen = isClosedView ? getCierreModulo(year, periodoVistoES, 'scenarios') : null;
  // Cierres anteriores a Fase 3 no tienen scenarios congelado → frozen === null.
  const frozenMissing = isClosedView && !frozen;
  const viewScenarios    = isClosedView ? (frozen?.scenarios || []) : scenarios;
  const viewControlMonth = isClosedView ? (frozen?.controlMonth ?? periodoVistoES) : controlMonth;

  return (
    <div className="space-y-4">
      <div className="flex items-center justify-between">
        <div>
          <h1 className="text-base font-bold text-gray-800 uppercase tracking-wide">Escenarios {year}</h1>
          <p className="text-[11px] text-gray-500 mt-0.5">Impacto en EBITDA al retirar cada proyecto del portafolio</p>
        </div>
        {!isClosedView && (
          <button onClick={() => setRefreshKey(k => k+1)}
            className="text-[11px] text-gray-500 border border-gray-200 rounded-lg px-3 py-1.5 hover:bg-gray-50">
            ↻ Actualizar
          </button>
        )}
      </div>

      <PeriodSelectorBar year={year} periodoVisto={periodoVistoES} onChange={setPeriodoVistoES} />
      {isClosedView && <SnapshotReadonlyBanner year={year} mes={periodoVistoES} />}

      {frozenMissing ? (
        <div className="bg-gray-50 rounded-xl border border-gray-200 p-8 text-center text-gray-400 text-sm">
          No hay datos de escenarios guardados para {MONTH_ABR[periodoVistoES-1]} {year}.
          <div className="text-[11px] mt-1 text-gray-400">
            Este informe se cerró antes de que Escenarios congelara sus datos. Volvé a cerrar el mes desde Reporte Manager para guardarlos.
          </div>
        </div>
      ) : viewScenarios.length === 0 ? (
        <div className="bg-amber-50 border border-amber-200 rounded-xl px-4 py-3 text-sm text-amber-700">
          Sin proyectos activos para {year}.
        </div>
      ) : (
        <React.Fragment>
          <div className="bg-white rounded-xl border border-gray-100 shadow-sm overflow-hidden">
            <TopScroll>
              <table className="text-[11px]" style={{minWidth:`${200+viewScenarios.length*140}px`}}>
                <thead>
                  <tr>
                    <th className="sticky left-0 z-10 bg-[#1C3460] text-white px-4 py-2.5 text-left text-[10px] font-semibold uppercase tracking-wider w-44">
                      Concepto
                    </th>
                    {viewScenarios.map((s, i) => (
                      <th key={i} className={`px-4 py-2.5 text-right text-[10px] font-semibold uppercase tracking-wider whitespace-nowrap ${s.isBase ? 'bg-blue-700 text-white' : 'bg-[#1C3460] text-gray-200'}`}>
                        {s.label}
                      </th>
                    ))}
                  </tr>
                </thead>
                <tbody>
                  {metrics.map((metric, mi) => (
                    <tr key={mi} className={`border-t border-gray-100 ${metric.hi ? 'bg-emerald-50' : metric.bold ? 'bg-gray-50' : 'hover:bg-gray-50'}`}>
                      <td className={`sticky left-0 z-10 px-4 py-2 bg-white border-r border-gray-100 ${metric.bold ? 'font-semibold text-gray-700' : 'text-gray-500'}`}>
                        {metric.label}
                      </td>
                      {viewScenarios.map((s, i) => {
                        const rawVal = s[metric.key];
                        const val = metric.pct ? rawVal : (rawVal || 0) * metric.sign;
                        const baseVal = metric.pct
                          ? viewScenarios[0][metric.key]
                          : (viewScenarios[0][metric.key] || 0) * metric.sign;
                        const diff = i > 0 ? val - baseVal : null;
                        return (
                          <td key={i} className={`px-4 py-2 text-right font-mono whitespace-nowrap ${metric.bold?'font-semibold':''} ${!metric.pct && val < -0.005 ? 'text-red-600' : 'text-gray-700'} ${s.isBase ? 'bg-blue-50' : ''}`}>
                            {metric.pct
                              ? (rawVal == null ? '—' : rawVal.toFixed(1)+'%')
                              : fN(val)}
                            {diff !== null && Math.abs(diff) >= 0.005 && (
                              <span className={`ml-1.5 text-[10px] font-normal ${diff>=0 ? 'text-emerald-600' : 'text-red-500'}`}>
                                ({diff>=0?'+':''}{metric.pct?diff.toFixed(1)+'%':fN(diff)})
                              </span>
                            )}
                          </td>
                        );
                      })}
                    </tr>
                  ))}
                </tbody>
              </table>
            </TopScroll>
            <div className="px-4 py-2 text-[10px] text-gray-400 border-t border-gray-100">
              Δ: diferencia vs escenario Base ·{' '}
              {viewControlMonth > 0
                ? `Real hasta ${MONTH_ABR[viewControlMonth-1]} ${year}, proyectado desde ${MONTH_ABR[viewControlMonth]} ${year}`
                : `Solo proyección (sin datos reales)`}
            </div>
          </div>
        </React.Fragment>
      )}
    </div>
  );
}

// ─── CHECK CONTABLE ───────────────────────────────────────────────────────────

function CheckContableModule({ projects, activeYear }) {
  const year = activeYear;
  const fN = n => {
    const v = +n || 0;
    if (Math.abs(v) < 0.005) return '—';
    return v.toLocaleString('es-CL', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  };
  const fCLP = n => Math.round(+n || 0).toLocaleString('es-CL');

  const [refreshKey, setRefreshKey] = useState(0);
  const [periodoVistoCC, setPeriodoVistoCC] = useState('actual');
  React.useEffect(() => { setPeriodoVistoCC('actual'); }, [year]);

  const controlMonth = useMemo(() => {
    for (let m = 12; m >= 1; m--) {
      try {
        const d = storage.get(`budget-control:actuals:${year}:${String(m).padStart(2,'0')}`);
        if (d?.rows?.length > 0) return m;
      } catch {}
    }
    return 0;
  }, [year, refreshKey]);

  const actualsForYear = useMemo(() => {
    const r = {};
    for (let m = 1; m <= 12; m++) {
      try {
        const d = storage.get(`budget-control:actuals:${year}:${String(m).padStart(2,'0')}`);
        if (d?.rows) r[m] = d.rows;
      } catch {}
    }
    return r;
  }, [year, refreshKey]);

  const balanceData = useMemo(() => {
    try { return storage.get('budget-control:balance:latest'); } catch { return null; }
  }, [refreshKey]);

  const ufTable = useMemo(() => {
    try { return storage.get('budget-control:uf-table') || {}; } catch { return {}; }
  }, [refreshKey]);

  const managementCosts = useMemo(() => {
    const byClass = {};
    for (let m = 1; m <= controlMonth; m++) {
      (actualsForYear[m] || []).forEach(row => {
        const cls = row.clasificacion || 'no_clasificado';
        byClass[cls] = (byClass[cls] || 0) + (row.total || 0);
      });
    }
    return byClass;
  }, [actualsForYear, controlMonth]);

  const totalManagement = Object.values(managementCosts).reduce((s,v) => s+v, 0);

  const balanceUF = useMemo(() => {
    if (!balanceData) return null;
    const balYear  = balanceData.year  || year;
    const balMonth = balanceData.month || 1;
    const md = ufTable[balYear]?.[balMonth];
    if (!md) return null;
    for (let d = 31; d >= 1; d--) { if (md[d] != null) return md[d]; }
    return null;
  }, [balanceData, ufTable, year]);

  const balPerdidasUF  = balanceData && balanceUF ? (balanceData.sumasIguales?.perdidas  || 0) / balanceUF : null;
  const balGananciasUF = balanceData && balanceUF ? (balanceData.sumasIguales?.ganancias || 0) / balanceUF : null;
  const diff    = balPerdidasUF !== null ? Math.abs(totalManagement - balPerdidasUF) : null;
  const cuadra  = diff !== null && diff < 1;

  const CLASS_LBL = {
    materiales:          'Materiales',
    mano_de_obra:        'Mano de Obra',
    subcontratos:        'Subcontratos',
    gastos_generales:    'Gastos Generales',
    equipos_maquinarias: 'Equipos y Maq.',
    edificaciones_comerciales: 'Edificaciones Comerciales',
    post_venta:          'Post Venta',
    otros:               'Otros',
    oficina_central:     'Oficina Central',
    no_clasificado:      '⚠ Sin Clasificar',
  };

  const clsRows = Object.entries(CLASS_LBL)
    .map(([cls, label]) => ({ cls, label, value: managementCosts[cls] || 0 }))
    .filter(r => r.value >= 0.005);

  const balRows = [
    { label: 'Débito Total',          key: 'debito'    },
    { label: 'Crédito Total',         key: 'credito'   },
    { label: 'Deudor',                key: 'deudor'    },
    { label: 'Acreedor',              key: 'acreedor'  },
    { label: 'Activo',                key: 'activo'    },
    { label: 'Pasivo',                key: 'pasivo'    },
    { label: 'Pérdidas (Gastos)',      key: 'perdidas',  bold: true },
    { label: 'Ganancias (Ingresos)',   key: 'ganancias', bold: true },
  ].filter(r => (balanceData?.sumasIguales?.[r.key] || 0) >= 1)
   // Enriquecemos cada fila con su CLP y su UF YA convertida, para que la vista de
   // período cerrado renderice sin recomputar la conversión CLP→UF.
   .map(r => {
     const clp = balanceData?.sumasIguales?.[r.key] || 0;
     return { ...r, clp, uf: balanceUF ? clp / balanceUF : null };
   });

  // Metadatos del balance que el pie de la tabla de contabilidad muestra.
  const balanceMeta = balanceData ? {
    filename: balanceData.filename,
    rowCount: balanceData.rowCount,
    accountsLen: balanceData.accounts?.length || 0,
  } : null;

  // ── Persistencia viva del snapshot del Check Contable ───────────────────────
  // Mantiene `budget-control:check-snapshot:{year}` al día con las dos tablas
  // renderizadas. buildGlobalSnapshot lo copia al cierre (modulos.check). No
  // escribimos cuando no hay datos de gestión ni balance, para no pisar uno previo.
  React.useEffect(() => {
    if (controlMonth === 0 && !balanceData) return;
    try {
      storage.set(`budget-control:check-snapshot:${year}`,
        buildCheckSnapshot({ year, controlMonth, clsRows, balRows, totalManagement,
          balPerdidasUF, balGananciasUF, balanceUF, diff, cuadra, balanceMeta }));
    } catch {}
  }, [year, controlMonth, clsRows, balRows, totalManagement, balPerdidasUF, balGananciasUF, balanceUF, diff, cuadra, balanceMeta]);

  // ── Resolución de fuente: vivo (actual) vs congelado (período cerrado) ───────
  const isClosedView = periodoVistoCC !== 'actual';
  const frozen = isClosedView ? getCierreModulo(year, periodoVistoCC, 'check') : null;
  const frozenMissing = isClosedView && !frozen;
  const viewClsRows         = isClosedView ? (frozen?.clsRows || [])         : clsRows;
  const viewBalRows         = isClosedView ? (frozen?.balRows || [])         : balRows;
  const viewControlMonth    = isClosedView ? (frozen?.controlMonth ?? 0)     : controlMonth;
  const viewTotalManagement = isClosedView ? (frozen?.totalManagement ?? 0)  : totalManagement;
  const viewBalPerdidasUF   = isClosedView ? (frozen?.balPerdidasUF ?? null) : balPerdidasUF;
  const viewBalanceUF       = isClosedView ? (frozen?.balanceUF ?? null)     : balanceUF;
  const viewDiff            = isClosedView ? (frozen?.diff ?? null)          : diff;
  const viewCuadra          = isClosedView ? !!frozen?.cuadra                : cuadra;
  const viewBalanceMeta     = isClosedView ? (frozen?.balanceMeta ?? null)   : balanceMeta;
  // En vivo la tabla de contabilidad aparece si hay balanceData; en lectura, si el
  // snapshot congeló filas de balance (balRows) o metadatos del balance.
  const viewHasBalance      = isClosedView ? ((viewBalRows.length > 0) || !!viewBalanceMeta) : !!balanceData;

  return (
    <div className="space-y-4">
      <div className="flex items-center justify-between">
        <div>
          <h1 className="text-base font-bold text-gray-800 uppercase tracking-wide">Check Contable {year}</h1>
          <p className="text-[11px] text-gray-500 mt-0.5">
            Cuadratura gestión (Reporte Manager) vs contabilidad (Balance Contable)
            {viewControlMonth > 0 ? ` · YTD ${MONTH_ABR[viewControlMonth-1]} ${year}` : ''}
          </p>
        </div>
        {!isClosedView && (
          <button onClick={() => setRefreshKey(k => k+1)}
            className="text-[11px] text-gray-500 border border-gray-200 rounded-lg px-3 py-1.5 hover:bg-gray-50">
            ↻ Actualizar
          </button>
        )}
      </div>

      <PeriodSelectorBar year={year} periodoVisto={periodoVistoCC} onChange={setPeriodoVistoCC} />
      {isClosedView && <SnapshotReadonlyBanner year={year} mes={periodoVistoCC} />}

      {frozenMissing ? (
        <div className="bg-gray-50 rounded-xl border border-gray-200 p-8 text-center text-gray-400 text-sm">
          No hay datos de check contable guardados para {MONTH_ABR[periodoVistoCC-1]} {year}.
          <div className="text-[11px] mt-1 text-gray-400">
            Este informe se cerró antes de que el Check Contable congelara sus datos. Volvé a cerrar el mes desde Reporte Manager para guardarlos.
          </div>
        </div>
      ) : (<>
      {viewDiff !== null && (
        <div className={`flex items-center gap-3 px-4 py-3 rounded-xl border ${viewCuadra ? 'bg-emerald-50 border-emerald-200' : 'bg-red-50 border-red-200'}`}>
          <span className="text-2xl">{viewCuadra ? '✅' : '⚠️'}</span>
          <div>
            <p className={`font-semibold text-sm ${viewCuadra ? 'text-emerald-700' : 'text-red-700'}`}>
              {viewCuadra ? 'Cuadratura OK — diferencia menor a 1 UF' : `Diferencia de ${viewDiff.toFixed(2)} UF — revisar`}
            </p>
            <p className={`text-xs mt-0.5 ${viewCuadra ? 'text-emerald-600' : 'text-red-600'}`}>
              Gestión: {fN(viewTotalManagement)} UF · Balance Pérdidas: {fN(viewBalPerdidasUF)} UF · Diferencia: {viewDiff.toFixed(2)} UF
            </p>
          </div>
        </div>
      )}

      <div className="grid grid-cols-2 gap-4">
        <div className="bg-white rounded-xl border border-gray-100 shadow-sm overflow-hidden">
          <div className="px-4 py-2.5 border-b border-gray-100 flex items-center justify-between">
            <h3 className="text-[10px] font-bold text-gray-500 uppercase tracking-wider">Gestión — Reporte Manager</h3>
            {viewControlMonth > 0 && <span className="text-[10px] text-gray-400">YTD {MONTH_ABR[viewControlMonth-1]} {year}</span>}
          </div>
          {viewControlMonth === 0 ? (
            <div className="px-4 py-8 text-center text-xs text-gray-400">Sin datos Reporte Manager para {year}</div>
          ) : (
            <table className="w-full text-[11px]">
              <thead>
                <tr className="bg-gray-50">
                  <th className="text-left px-4 py-2 font-semibold text-gray-500 text-[10px]">Clasificación</th>
                  <th className="text-right px-4 py-2 font-semibold text-gray-500 text-[10px]">Total UF</th>
                </tr>
              </thead>
              <tbody>
                {viewClsRows.map(r => (
                  <tr key={r.cls} className="border-t border-gray-50 hover:bg-gray-50">
                    <td className="px-4 py-1.5 text-gray-600">{r.label}</td>
                    <td className="px-4 py-1.5 text-right font-mono text-gray-700">{fN(r.value)}</td>
                  </tr>
                ))}
                <tr className="border-t-2 border-gray-200 bg-gray-50">
                  <td className="px-4 py-2 font-semibold text-gray-700">Total Gastos YTD</td>
                  <td className="px-4 py-2 text-right font-mono font-semibold text-gray-800">{fN(viewTotalManagement)}</td>
                </tr>
              </tbody>
            </table>
          )}
        </div>

        <div className="bg-white rounded-xl border border-gray-100 shadow-sm overflow-hidden">
          <div className="px-4 py-2.5 border-b border-gray-100 flex items-center justify-between">
            <h3 className="text-[10px] font-bold text-gray-500 uppercase tracking-wider">Contabilidad — Balance</h3>
            {viewBalanceMeta?.filename && <span className="text-[10px] text-gray-400 truncate max-w-40">{viewBalanceMeta.filename}</span>}
          </div>
          {!viewHasBalance ? (
            <div className="px-4 py-8 text-center text-xs text-gray-400">
              Balance no cargado. Ve a <strong>Carga Datos Contabilidad</strong> para cargarlo.
            </div>
          ) : (
            <React.Fragment>
              <table className="w-full text-[11px]">
                <thead>
                  <tr className="bg-gray-50">
                    <th className="text-left px-4 py-2 font-semibold text-gray-500 text-[10px]">Concepto</th>
                    <th className="text-right px-3 py-2 font-semibold text-gray-500 text-[10px]">CLP</th>
                    <th className="text-right px-3 py-2 font-semibold text-gray-500 text-[10px]">UF</th>
                  </tr>
                </thead>
                <tbody>
                  {viewBalRows.map((r, i) => (
                    <tr key={i} className={`border-t border-gray-50 ${r.bold ? 'bg-blue-50' : 'hover:bg-gray-50'}`}>
                      <td className={`px-4 py-1.5 ${r.bold ? 'font-semibold text-blue-700' : 'text-gray-600'}`}>{r.label}</td>
                      <td className="px-3 py-1.5 text-right font-mono text-[10px] text-gray-500">{fCLP(r.clp)}</td>
                      <td className={`px-3 py-1.5 text-right font-mono ${r.bold ? 'font-semibold text-blue-700' : 'text-gray-600'}`}>
                        {r.uf != null ? fN(r.uf) : '—'}
                      </td>
                    </tr>
                  ))}
                </tbody>
              </table>
              {!viewBalanceUF && (
                <div className="px-4 py-2 text-[10px] text-amber-600 bg-amber-50 border-t border-amber-100">
                  ⚠ Tabla UF no cargada para el período del balance — conversión no disponible.
                </div>
              )}
              <div className="px-4 py-2 text-[10px] text-gray-400 border-t border-gray-100">
                {viewBalanceMeta?.rowCount ?? 0} filas · {viewBalanceMeta?.accountsLen ?? 0} cuentas con movimientos
                {viewBalanceUF ? ` · UF período: ${viewBalanceUF.toLocaleString('es-CL',{minimumFractionDigits:2})} CLP` : ''}
              </div>
            </React.Fragment>
          )}
        </div>
      </div>
      </>)}
    </div>
  );
}

// ── Gauge circular SVG ────────────────────────────────────────────────────────
function ScoreGaugeMini({ score, color, size = 60 }) {
  const s = score != null ? Math.min(100, Math.max(0, score)) : 0;
  const r = size / 2 - 6;
  const circ = 2 * Math.PI * r;
  const offset = circ * (1 - s / 100);
  const cx = size / 2, cy = size / 2;
  return (
    <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`}>
      <circle cx={cx} cy={cy} r={r} fill="none" stroke="#f1f5f9" strokeWidth="6" />
      <circle cx={cx} cy={cy} r={r} fill="none" stroke={score != null ? color : '#e2e8f0'} strokeWidth="6"
        strokeDasharray={circ} strokeDashoffset={offset} strokeLinecap="round"
        transform={`rotate(-90 ${cx} ${cy})`} />
      {score != null
        ? <text x={cx} y={cy + 5} textAnchor="middle" fontSize="13" fontWeight="700" fill={color}>{score}</text>
        : <text x={cx} y={cy + 4} textAnchor="middle" fontSize="12" fill="#cbd5e1">—</text>}
    </svg>
  );
}

function ScoreGaugeLarge({ score, color, size = 100 }) {
  const s = score != null ? Math.min(100, Math.max(0, score)) : 0;
  const r = size / 2 - 10;
  const circ = 2 * Math.PI * r;
  const offset = circ * (1 - s / 100);
  const cx = size / 2, cy = size / 2;
  return (
    <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`}>
      <circle cx={cx} cy={cy} r={r} fill="none" stroke="#f1f5f9" strokeWidth="10" />
      <circle cx={cx} cy={cy} r={r} fill="none" stroke={score != null ? color : '#e2e8f0'} strokeWidth="10"
        strokeDasharray={circ} strokeDashoffset={offset} strokeLinecap="round"
        transform={`rotate(-90 ${cx} ${cy})`} />
      {score != null
        ? <text x={cx} y={cy + 7} textAnchor="middle" fontSize="22" fontWeight="800" fill={color}>{score}</text>
        : <text x={cx} y={cy + 6} textAnchor="middle" fontSize="18" fill="#cbd5e1">—</text>}
    </svg>
  );
}

}

// ── Módulo principal ──────────────────────────────────────────────────────────
function ScorecardModule({ projects, activeYear }) {
  const year = activeYear;
  const activeProjects = useMemo(() => projects.filter(p => p.startDate && p.endDate), [projects]);
  const [selTab, setSelTab] = useState(() => activeProjects[0]?.id || null);
  const [periodoVistoSC, setPeriodoVistoSC] = useState('actual');
  React.useEffect(() => { setPeriodoVistoSC('actual'); }, [year]);

  const projCompletion = useMemo(() => {
    try { return storage.get(`budget-control:proj-completion:${year}`) || {}; } catch { return {}; }
  }, [year]);

  // Garantizar tab válido si los proyectos cambian
  useEffect(() => {
    if (!selTab || !activeProjects.find(p => p.id === selTab)) {
      setSelTab(activeProjects[0]?.id || null);
    }
  }, [activeProjects]);

  const selProject = activeProjects.find(p => p.id === selTab) || activeProjects[0];

  // Scorecard VIVO por cada proyecto activo (incluye Económico/Plazo automáticos).
  // Se calcula para TODOS los proyectos para poder congelarlos en bloque al cerrar
  // el mes. La vista de período cerrado lee este mismo objeto desde el snapshot.
  const byProjectLive = useMemo(() => {
    const out = {};
    activeProjects.forEach(p => {
      const ov = getObrasVals(year, p.id, periodoVistoSC);
      out[p.id] = buildScorecard(p, year, ov);
    });
    return out;
  }, [activeProjects, year, periodoVistoSC]);

  // ── Persistencia viva del snapshot del Scorecard ────────────────────────────
  // Mantiene `budget-control:scorecard-snapshot:{year}` al día con el scorecard
  // por proyecto que se renderiza ahora. buildGlobalSnapshot lo copia al cierre
  // (modulos.scorecard). El gap que resuelve: el Económico y el Plazo se calculan
  // de fuentes vivas (Proyecciones / curvas S), así que sin este congelado un mes
  // cerrado mostraría esos dos indicadores con datos vivos bajo el banner de solo
  // lectura. Sólo persistimos en período 'actual' (no congelamos una vista de un
  // mes ya cerrado, y evitamos pisar el snapshot con datos de meses anteriores).
  // No escribimos si no hay proyectos activos, para no pisar uno significativo.
  React.useEffect(() => {
    if (periodoVistoSC !== 'actual' || activeProjects.length === 0) return;
    try {
      storage.set(`budget-control:scorecard-snapshot:${year}`,
        buildScorecardSnapshot({ year, byProject: byProjectLive, activeProjects }));
    } catch {}
  }, [year, periodoVistoSC, byProjectLive, activeProjects]);

  // ── Resolución de fuente: vivo (actual) vs congelado (período cerrado) ───────
  const isClosedView = periodoVistoSC !== 'actual';
  const frozen = isClosedView ? getCierreModulo(year, periodoVistoSC, 'scorecard') : null;
  const frozenMissing = isClosedView && !frozen;
  // Proyectos a mostrar en tabs: en lectura, los que existían al cierre.

// Hash simple (no criptográfico — herramienta local) para no guardar la clave en texto plano
function hashPass(s) {
  let h = 5381; const str = String(s ?? '');
  for (let i = 0; i < str.length; i++) h = ((h << 5) + h + str.charCodeAt(i)) >>> 0;
  return 'h' + h.toString(36);
}

function defaultUsers() {
  return [
    { id:'usr-admin', username:'esolar', name:'Esteban Solar', role:'admin',
      passHash: hashPass('icemm'), modules: [...ALL_MODULE_IDS], active: true },
  ];
}

function loadUsers() {
  try {
    const u = storage.get('budget-control:users');
    if (Array.isArray(u) && u.length) return u;
  } catch {}
  const seed = defaultUsers();
  storage.set('budget-control:users', seed);
  return seed;
}

const clamp100 = v => Math.max(0, Math.min(100, Math.round(v)));
const numOrNull = v => {
  if (v === '' || v == null) return null;
  if (typeof v === 'number') return isNaN(v) ? null : v;
  const n = parseFloat(String(v).replace(',', '.'));
  return isNaN(n) ? null : n;
};
// ¿El área tiene al menos un dato numérico/booleano ingresado?
function obrasAreaHasData(vals) {
  if (!vals) return false;
  return Object.entries(vals).some(([k, v]) => {
    if (v === '' || v == null) return false;
    if (typeof v === 'boolean') return true;
    return true;
  });
}

// Calcula el score (0–100) de un área manual a partir de sus valores ingresados
function scoreObrasArea(areaId, v) {
  if (!obrasAreaHasData(v)) return null;
  const n = k => numOrNull(v?.[k]);
  if (areaId === 'plazo') {
    const ar = n('avanceReal'), ap = n('avancePlan');
    if (ar == null || ap == null || ap <= 0) return null;
    return clamp100(ar / ap * 100);
  }
  if (areaId === 'calidad') {
    const base = n('protocolosAprob');
    if (base == null) return null;
    const penal = (n('obsItoAbiertas') || 0) * 2 + (n('ncrAbiertas') || 0) * 5;
    return clamp100(base - penal);
  }
  if (areaId === 'seguridad') {
    const tifr = n('tifr'), obs = n('obsSsoAbiertas'), acc = n('accidentesCTP');
    if (tifr == null && obs == null && acc == null && n('diasSinAcc') == null) return null;
    return clamp100(100 - (tifr || 0) * 8 - (obs || 0) * 3 - (acc || 0) * 20);
  }
  if (areaId === 'gestion') {
    const base = n('docsAprob');
    if (base == null) return null;
    const penal = (n('rfisPendientes') || 0) * 2 + (v?.informesAlDia === false ? 10 : 0);
    return clamp100(base - penal);
  }
  if (areaId === 'auditoria') {
    const p = n('puntaje');
    if (p == null) return null;
    return clamp100(p - (n('hallazgosAbiertos') || 0) * 0);
  }
  return null;
}

const fmtCL0 = n => (+n || 0).toLocaleString('es-CL', { maximumFractionDigits: 0 });
const fmtCL1 = n => (+n || 0).toLocaleString('es-CL', { minimumFractionDigits: 1, maximumFractionDigits: 1 });

// ─── RESULTADO ECONÓMICO desde la columna Proyección del módulo Proyecciones ────
// Replica EXACTAMENTE el cálculo por-proyecto de "Proyecciones a Término":
// venta proyectada (contrato vigente) − costo proyectado a término = margen proy,
// usando los overrides de proj-completion. Compara contra el presupuesto original.
function computeProjectEconProy(project, year) {
  let pc = {};
  try { pc = storage.get(`budget-control:proj-completion:${year}`) || {}; } catch {}
  const sched = pc?.[project.id];

  // Costo proyectado por categoría (override de proj-completion o presupuesto)
  const getPT = (cat) => sched?.cats?.[cat] != null ? +sched.cats[cat] : (+project.budgetByCategory?.[cat] || 0);
  const getPD = () => monthsBetween(project.startDate, project.endDate) || project.durationMonths || 0;
  const getED = () => {
    const es = sched?.realStart || project.startDate;
    const ee = sched?.projEnd   || project.endDate;
    return monthsBetween(es, ee) || project.durationMonths || 0;
  };
  // Contrato/venta presupuestado
  const getCPP = () => {
    if (project.contractType === 'suma_alzada') return +project.contract.originalAmount || 0;
    const n = getPD();
    return (+project.contract.totalBudgetedCost || 0) + (+project.contract.monthlyFee || 0) * n + (+project.contract.monthlyGG || 0) * n;
  };
  // Monto de obras extraordinarias proyectadas (fila "Obras Extraordinarias")
  const extra = +sched?.extraWorks || 0;
  // Contrato/venta proyectado a término (con obras extra y override)
  const getCPR = () => {
    const ov = sched?.overrideContract?.totalContratoVentas;
    if (ov != null) return +ov + extra;
    if (project.contractType === 'suma_alzada') return (+project.contract.originalAmount || 0) + extra;
    const n = getED();
    return (+project.contract.totalBudgetedCost || 0) + (+project.contract.monthlyFee || 0) * n + (+project.contract.monthlyGG || 0) * n + extra;
  };

  const costoPpto = PROJ_CATS.reduce((s, c) => s + (+project.budgetByCategory?.[c.id] || 0), 0);
  const costoProy = PROJ_CATS.reduce((s, c) => s + getPT(c.id), 0);
  const ventaPpto = getCPP();
  const ventaProy = getCPR();
  const resPpto = ventaPpto - costoPpto;
  const resProy = ventaProy - costoProy;
  const margenPctPpto = ventaPpto > 0.01 ? resPpto / ventaPpto * 100 : null;
  const margenPctProy = ventaProy > 0.01 ? resProy / ventaProy * 100 : null;
  // % obras extra sobre el presupuesto original (contrato original)
  const pctObrasExtra = ventaPpto > 0.01 ? extra / ventaPpto * 100 : null;
  const hasData = ventaProy > 0.01 || costoProy > 0.01;
  return { ventaPpto, ventaProy, costoPpto, costoProy, resPpto, resProy, margenPctPpto, margenPctProy, extra, pctObrasExtra, hasData };
}

// Indicador económico para el Scorecard (formato compatible con IndicadorCardSC)
function buildEconomicoIndicador(project, year) {
  const e = computeProjectEconProy(project, year);
  if (!e.hasData) return null;
  // Margen Proyectado a término vs Margen del Presupuesto Original
  let score;
  if (e.margenPctProy == null) score = null;
  else if (e.margenPctPpto != null && e.margenPctPpto > 0) score = clamp100(e.margenPctProy / e.margenPctPpto * 100);
  else score = e.margenPctProy >= 0 ? clamp100(80 + e.margenPctProy) : clamp100(60 + e.margenPctProy * 2);
  // Diferencia del Resultado Operacional (proyectado vs presupuesto) = Sobreutilidad / Pérdida
  const sobreutilidad = e.resProy - e.resPpto;
  return {
    score,
    kpiMain: e.margenPctProy != null ? `${fmtCL1(e.margenPctProy)}%` : '—',
    kpiLabel: 'Margen Proyectado',
    kpiTarget: e.margenPctPpto != null ? `${fmtCL1(e.margenPctPpto)}% Ppto orig.` : 'Ppto orig.',
    subItems: [
      { label:'Resultado Operacional (Mg Contribución)', value: `${fmtCL0(e.resProy)} UF`, alert: e.resProy < 0 },
      { label:'Sobreutilidad / Pérdida', value: `${sobreutilidad >= 0 ? '+' : ''}${fmtCL0(sobreutilidad)} UF`, alert: sobreutilidad < 0 },
      { label:'% Obras Extra', value: e.pctObrasExtra != null ? `${fmtCL1(e.pctObrasExtra)}%` : '—' },
    ],
  };
}

// ─── CURVA S DE AVANCE FÍSICO (área Plazo) ────────────────────────────────────
// Meses del proyecto en el rango de plazo PROYECTADO (módulo Proyecciones):
// de realStart (o inicio) a projEnd (o término). Devuelve ['YYYY-MM', ...].
function projectScheduleMonths(project, year) {
  let pc = {};
  try { pc = storage.get(`budget-control:proj-completion:${year}`) || {}; } catch {}
  const sched = pc?.[project.id];
  const start = sched?.realStart || project.startDate || '';
  const end   = sched?.projEnd   || project.endDate   || '';
  if (!start || !end) return [];
  const [sy, sm] = start.split('-').map(Number);
  const [ey, em] = end.split('-').map(Number);
  if (!sy || !sm || !ey || !em) return [];
  const out = [];
  let y = sy, m = sm, guard = 0;
  while ((y < ey || (y === ey && m <= em)) && guard < 600) {
    out.push(`${y}-${String(m).padStart(2, '0')}`);
    m++; if (m > 12) { m = 1; y++; }
    guard++;
  }
  return out;
}
function getPlazoCurvas(year, projId) {
  try { return (storage.get(`budget-control:plazo-curvas:${year}`) || {})[projId] || null; } catch { return null; }
}
function savePlazoCurvas(year, projId, curvas) {
  let all = {};
  try { all = storage.get(`budget-control:plazo-curvas:${year}`) || {}; } catch {}
  all[projId] = curvas;
  storage.set(`budget-control:plazo-curvas:${year}`, all);
}
// Punto de control = último mes con avance CONTROLADO cargado. Devuelve el avance
// real y el programado en ese punto, para alimentar el score de Plazo.
function plazoScoreFromCurvas(curvas) {
  if (!curvas || !Array.isArray(curvas.controlada)) return null;
  let idx = -1;
  for (let i = curvas.controlada.length - 1; i >= 0; i--) {
    const v = curvas.controlada[i];
    if (v != null && v !== '' && !isNaN(+v)) { idx = i; break; }
  }
  if (idx < 0) return null;
  const ctrl = +curvas.controlada[idx];
  const prog = curvas.programada?.[idx];
  if (prog == null || prog === '' || isNaN(+prog) || +prog <= 0) return null;
  // Desfase de programa (semanas): tiempo entre el mes de control y el mes en que
  // la curva PROGRAMADA alcanzó el % de avance real. Atraso (menor avance) < 0, adelanto > 0.
  const P = (curvas.programada || []).map(v => (v == null || v === '' || isNaN(+v)) ? null : +v);
  let jStar = null;
  for (let j = 0; j < P.length - 1; j++) {
    const a = P[j], b = P[j + 1];
    if (a == null || b == null) continue;
    if ((a <= ctrl && ctrl <= b) || (a >= ctrl && ctrl >= b)) {
      jStar = (b === a) ? j : j + (ctrl - a) / (b - a);
      break;
    }
  }
  if (jStar == null && P[0] != null && ctrl <= P[0]) jStar = 0;
  const desfaseSemanas = (jStar == null) ? null : (jStar - idx) * (52 / 12);
  return { avanceReal: ctrl, avancePlan: +prog, idx, monthKey: curvas.meses?.[idx] || null, desfaseSemanas };
}

// Ensambla los 6 indicadores del Scorecard: económico (automático) + 5 manuales
function buildScorecard(project, year, obrasVals) {
  const out = { economico: buildEconomicoIndicador(project, year) };
  const plazoDerived = plazoScoreFromCurvas(getPlazoCurvas(year, project.id));
  OBRAS_AREAS.forEach(area => {
    let vals = obrasVals?.[area.id];
    // Plazo: si hay curvas S cargadas, el avance real/planificado y el desfase salen de ellas
    if (area.id === 'plazo' && plazoDerived) {
      vals = { ...(vals || {}), avanceReal: plazoDerived.avanceReal, avancePlan: plazoDerived.avancePlan };
      if (plazoDerived.desfaseSemanas != null) vals.desfaseSemanas = Math.round(plazoDerived.desfaseSemanas * 10) / 10;
    }
    const score = scoreObrasArea(area.id, vals);
    if (score == null && !obrasAreaHasData(vals)) { out[area.id] = null; return; }
    const kpi = obrasAreaKpi(area.id, vals);
    out[area.id] = { score, ...kpi };
  });
  return out;
}

// Lee los valores manuales de Control de Obras para un proyecto.
// Si periodo='actual' usa el mes más reciente con datos; si es un nº de mes, ese mes.
function getObrasVals(year, projectId, periodo) {
  let data = {};
  try { data = storage.get(`budget-control:control-obras:${year}`) || {}; } catch {}
  const pad = m => String(m).padStart(2, '0');
  const byMonth = data?.[projectId] || {};
  if (periodo && periodo !== 'actual') {
    return byMonth[pad(periodo)] || null;
  }
  for (let m = 12; m >= 1; m--) { if (byMonth[pad(m)] && obrasAnyData(byMonth[pad(m)])) return byMonth[pad(m)]; }
  return null;
}
function obrasAnyData(monthObj) {
  return OBRAS_AREAS.some(a => obrasAreaHasData(monthObj?.[a.id]));
}

function UsersModule({ currentUser, onUsersChange }) {
  const [users, setUsers] = useState(() => loadUsers());
  const [editing, setEditing] = useState(null); // objeto user en edición o null
  const [isNew, setIsNew] = useState(false);

  const persist = (list) => { setUsers(list); saveUsers(list); onUsersChange && onUsersChange(list); };

  const startNew = () => {
    setIsNew(true);
    setEditing({ id:'usr-' + Date.now().toString(36), username:'', name:'', role:'jefe_obra',
      passHash:'', newPass:'', modules:[...(AUTH_ROLES.find(r=>r.id==='jefe_obra')?.modules||[])], active:true });
  };
  const startEdit = (u) => { setIsNew(false); setEditing({ ...u, newPass:'' }); };

  const applyRolePreset = (roleId) => {
    const preset = AUTH_ROLES.find(r => r.id === roleId);
    setEditing(prev => ({ ...prev, role: roleId, modules: preset ? [...preset.modules] : prev.modules }));
  };
  const toggleModule = (mid) => {
    setEditing(prev => {
      const has = prev.modules.includes(mid);
      return { ...prev, modules: has ? prev.modules.filter(x => x !== mid) : [...prev.modules, mid] };
    });
  };

  const save = () => {
    const e = editing;
    if (!e.username.trim() || !e.name.trim()) { alert('Usuario y nombre son obligatorios'); return; }
    const dup = users.find(u => u.username.toLowerCase() === e.username.trim().toLowerCase() && u.id !== e.id);
    if (dup) { alert('Ya existe un usuario con ese nombre de acceso'); return; }
    if (isNew && !e.newPass) { alert('Debe asignar una contraseña inicial'); return; }
    const rec = {
      id: e.id, username: e.username.trim(), name: e.name.trim(), role: e.role,
      modules: e.role === 'admin' ? [...ALL_MODULE_IDS] : e.modules,
      active: e.active,
      passHash: e.newPass ? hashPass(e.newPass) : e.passHash,
    };
    const list = isNew ? [...users, rec] : users.map(u => u.id === rec.id ? rec : u);
    persist(list);
    setEditing(null);
  };

  const removeUser = (u) => {
    if (u.id === currentUser.id) { alert('No puede eliminar su propia sesión activa'); return; }
    if (u.role === 'admin' && users.filter(x => x.role === 'admin').length <= 1) { alert('Debe existir al menos un administrador'); return; }
    if (!confirm(`¿Eliminar al usuario "${u.name}"?`)) return;
    persist(users.filter(x => x.id !== u.id));
  };

  const toggleActive = (u) => {
    if (u.id === currentUser.id) { alert('No puede desactivar su propia sesión'); return; }
    persist(users.map(x => x.id === u.id ? { ...x, active: !x.active } : x));
  };

  return (
    <div className="space-y-5">

        <div className="w-1 h-8 rounded-full" style={{background:'#D01030'}} />

        </div>
        <button onClick={startNew}
          className="ml-auto bg-[#D01030] text-white text-xs font-semibold rounded-lg px-4 py-2 hover:bg-[#b00d28] transition-colors">
          + Nuevo Usuario
        </button>

      <div className="bg-white rounded-2xl border border-gray-100 shadow-sm overflow-hidden">
        <TopScroll>

              <tr className="bg-[#1C3460] text-white text-[10px] uppercase tracking-wider">
                <th className="px-4 py-2.5 text-left">Usuario</th>
                <th className="px-4 py-2.5 text-left">Nombre</th>
                <th className="px-4 py-2.5 text-left">Rol</th>

                <th className="px-4 py-2.5 text-right">Acciones</th>
              </tr>
            </thead>
            <tbody>
              {users.map(u => (
                <tr key={u.id} className="border-t border-gray-100 hover:bg-gray-50">
                  <td className="px-4 py-2.5 font-mono text-gray-700">{u.username}</td>
                  <td className="px-4 py-2.5 text-gray-800 font-medium">{u.name}{u.id === currentUser.id && <span className="ml-1.5 text-[9px] text-[#D01030] font-bold">(tú)</span>}</td>
                  <td className="px-4 py-2.5 text-gray-600">{roleLabel(u.role)}</td>
                  <td className="px-4 py-2.5 text-center text-gray-500">{u.role === 'admin' ? 'Todos' : `${u.modules.length}`}</td>
                  <td className="px-4 py-2.5 text-center">
                    <button onClick={() => toggleActive(u)}
                      className={`text-[10px] font-bold px-2 py-0.5 rounded-full ${u.active ? 'bg-emerald-50 text-emerald-600' : 'bg-gray-100 text-gray-400'}`}>
                      {u.active ? '● Activo' : '○ Inactivo'}
                    </button>
                  </td>
                  <td className="px-4 py-2.5 text-right whitespace-nowrap">
                    <button onClick={() => startEdit(u)} className="text-[11px] text-blue-600 hover:underline mr-3">Editar</button>
                    <button onClick={() => removeUser(u)} className="text-[11px] text-red-500 hover:underline">Eliminar</button>
                  </td>
                </tr>
              ))}
            </tbody>
          </table>
        </TopScroll>
      </div>

      <Modal open={!!editing} onClose={() => setEditing(null)} title={isNew ? 'Nuevo Usuario' : 'Editar Usuario'} wide>

                <span className="text-[10px] font-bold text-gray-500 uppercase tracking-wider">Usuario (acceso)</span>

              </label>
              <label className="flex flex-col gap-1">
                <span className="text-[10px] font-bold text-gray-500 uppercase tracking-wider">Rol</span>
                <select value={editing.role} onChange={e => applyRolePreset(e.target.value)}
                  className="border border-gray-200 rounded-lg px-3 py-2 text-sm outline-none focus:border-[#D01030] bg-white">
                  {AUTH_ROLES.map(r => <option key={r.id} value={r.id}>{r.label}</option>)}
                </select>
              </label>
              <label className="flex flex-col gap-1">
                <span className="text-[10px] font-bold text-gray-500 uppercase tracking-wider">{isNew ? 'Contraseña' : 'Nueva Contraseña (opcional)'}</span>
                <input type="password" value={editing.newPass} onChange={e => setEditing(p => ({ ...p, newPass: e.target.value }))}
                  placeholder={isNew ? 'requerida' : 'dejar en blanco para mantener'}
                  className="border border-gray-200 rounded-lg px-3 py-2 text-sm outline-none focus:border-[#D01030]" />
              </label>
            </div>

            <div>
              <div className="flex items-center justify-between mb-2">
                <span className="text-[10px] font-bold text-gray-500 uppercase tracking-wider">Módulos habilitados</span>
                {editing.role === 'admin' && <span className="text-[10px] text-gray-400">El administrador accede a todos los módulos</span>}
              </div>
              <div className="grid grid-cols-2 sm:grid-cols-3 gap-2">
                {NAV_ITEMS.map(m => {
                  const on = editing.role === 'admin' || editing.modules.includes(m.id);
                  return (
                    <button key={m.id} type="button" disabled={editing.role === 'admin'}
                      onClick={() => toggleModule(m.id)}
                      className={`flex items-center gap-2 px-3 py-2 rounded-lg border text-[12px] text-left transition-all
                        ${on ? 'border-[#D01030]/40 bg-[#D01030]/5 text-gray-800' : 'border-gray-200 bg-white text-gray-400'}
                        ${editing.role === 'admin' ? 'opacity-70 cursor-not-allowed' : 'hover:border-gray-300'}`}>
                      <span>{m.icon}</span>
                      <span className="flex-1 truncate">{m.label}</span>
                      <span className={`text-[10px] font-bold ${on ? 'text-[#D01030]' : 'text-gray-300'}`}>{on ? '✓' : '○'}</span>
                    </button>
                  );
                })}
              </div>
            </div>

            <label className="flex items-center gap-2">
              <input type="checkbox" checked={editing.active} onChange={e => setEditing(p => ({ ...p, active: e.target.checked }))} />
              <span className="text-[12px] text-gray-600">Usuario activo (puede iniciar sesión)</span>

            <div className="flex justify-end gap-2 pt-2 border-t border-gray-100">

// Etiqueta corta de un mes 'YYYY-MM' → 'Ene 2026'
